aliases: [bazelisk]
name: bazel
flags:
  --workspace_rc: ' Whether or not to look for the workspace bazelrc file at $workspace/.bazelrc'
  --nohome_rc: ' Whether or not to look for the home bazelrc file at $HOME/.bazelrc'
  --bazelrc: |-
    <path> The location of the user .bazelrc file containing default values of Bazel options. /dev/null indicates that all further `--bazelrc`s will be ignored, which is useful to disable the search for a user rc file, e.g. in release builds.
    This option can also be specified multiple times.
    E.g. with `--bazelrc=x.rc --bazelrc=y.rc --bazelrc=/dev/null --bazelrc=z.rc`,
      1) x.rc and y.rc are read.
      2) z.rc is ignored due to the prior /dev/null.
    If unspecified, Bazel uses the first .bazelrc file it finds in the following two locations: the workspace directory, then the user's home directory.
    Note: command line options will always supersede any option in bazelrc.
  --system_rc: ' Whether or not to look for the system-wide bazelrc.'
  --noworkspace_rc: ' Whether or not to look for the workspace bazelrc file at $workspace/.bazelrc'
  --nosystem_rc: ' Whether or not to look for the system-wide bazelrc.'
  --home_rc: ' Whether or not to look for the home bazelrc file at $HOME/.bazelrc'
description: build system
commands:
- name: build
  flags:
    --noexecution_log_sort: ' Whether to sort the execution log, making it easier
      to compare logs across invocations. Set to false to avoid potentially significant
      CPU and memory usage at the end of the invocation, at the cost of producing
      the log in nondeterministic execution order. Only applies to the binary and
      JSON formats; the compact format is never sorted.'
    --incompatible_enforce_config_setting_visibility: ' If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.'
    --noexperimental_stats_summary: ' Enable a modernized summary of the build stats.'
    --check_tests_up_to_date: ' Don''t run tests, just check if they are up-to-date.  If
      all tests results are up-to-date, the testing completes successfully.  If any
      test needs to be built or executed, an error is reported and the testing fails.  This
      option implies --check_up_to_date behavior.'
    --noexperimental_merged_skyframe_analysis_execution: ' If this flag is set, the
      analysis and execution phases of Skyframe are merged.'
    --test_keep_going: ' When disabled, any non-passing test will cause the entire
      build to stop. By default all tests are run, even if some do not pass.'
    --experimental_skyfocus_dump_keys: ' For debugging Skyfocus. Dump the focused
      SkyKeys (roots, leafs, focused deps, focused rdeps).'
    --check_up_to_date: ' Don''t perform the build, just check if it is up-to-date.  If
      all targets are up-to-date, the build completes successfully.  If any step needs
      to be executed an error is reported and the build fails.'
    --nomaterialize_param_files: ' Writes intermediate parameter files to output tree
      even when using remote action execution. Useful when debugging actions. This
      is implied by --subcommands and --verbose_failures.'
    --version_window_for_dirty_node_gc: ' Nodes that have been dirty for more than
      this many versions will be deleted from the graph upon the next update. Values
      must be non-negative long integers, or -1 indicating the maximum possible window.'
    --test_summary: ' Specifies the desired format of the test summary. Valid values
      are ''short'' to print information only about tests executed, ''terse'', to
      print information only about unsuccessful tests that were run, ''detailed''
      to print detailed information about failed test cases, ''testcase'' to print
      summary in test case resolution, do not print detailed information about failed
      test cases and ''none'' to omit the summary.'
    --local_resources: ' Set the number of resources available to Bazel. Takes in
      an assignment to a float or HOST_RAM/HOST_CPUS, optionally followed by [-|*]<float>
      (eg. memory=HOST_RAM*.5 to use half the available RAM). Can be used multiple
      times to specify multiple types of resources. Bazel will limit concurrently
      running actions based on the available resources and the resources required.
      Tests can declare the amount of resources they need by using a tag of the "resources:<resource
      name>:<amount>" format. Overrides resources specified by --local_{cpu|ram|extra}_resources.'
    --rewind_lost_inputs: ' Whether to use action rewinding to recover from lost inputs.'
    --noexperimental_local_lockfree_output: ' When true, the local spawn runner doesn''t
      lock the output tree during dynamic execution. Instead, spawns are allowed to
      execute until they are explicitly interrupted by a faster remote action.'
    --build: ' Execute the build; this is the usual behaviour. Specifying --nobuild
      causes the build to stop before executing the build actions, returning zero
      iff the package loading and analysis phases completed successfully; this mode
      is useful for testing those phases.'
    --noincompatible_enforce_config_setting_visibility: ' If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.'
    --enforce_project_configs: ' If true, interactive builds may only pass the --scl_config
      build flag; they may not use any other build flags. --scl_config must be set
      to an officially suported project configuration. Supported configurations are
      defined in the target''s PROJECT.scl, which can be found by walking up the target''s
      packagge path. See b/324126745.'
    --aspects: ' Comma-separated list of aspects to be applied to top-level targets.
      In the list, if aspect some_aspect specifies required aspect providers via required_aspect_providers,
      some_aspect will run after every aspect that was mentioned before it in the
      aspects list whose advertised providers satisfy some_aspect required aspect
      providers. Moreover, some_aspect will run after all its required aspects specified
      by requires attribute. some_aspect will then have access to the values of those
      aspects'' providers. <bzl-file-label>%<aspect_name>, for example ''//tools:my_def.bzl%my_aspect'',
      where ''my_aspect'' is a top-level value from a file tools/my_def.bzl'
    --nobuild_tests_only: ' If specified, only *_test and test_suite rules will be
      built and other targets specified on the command line will be ignored. By default
      everything that was requested will be built.'
    --fetch: ' Allows the command to fetch external dependencies. If set to false,
      the command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.'
    --noexperimental_materialize_param_files_directly: ' If materializing param files,
      do so with direct writes to disk.'
    --show_result: |2-
       Show the results of the build.  For each target, state whether or not it was brought up-to-date, and if so, a list of output files that were built.  The printed files are convenient strings for copy+pasting to the shell, to execute them.
      This option requires an integer argument, which is the threshold number of targets above which result information is not printed. Thus zero causes suppression of the message and MAX_INT causes printing of the result to occur always. The default is one.
      If nothing was built for a target its results may be omitted to keep the output under the threshold.
    --noenforce_project_configs: ' If true, interactive builds may only pass the --scl_config
      build flag; they may not use any other build flags. --scl_config must be set
      to an officially suported project configuration. Supported configurations are
      defined in the target''s PROJECT.scl, which can be found by walking up the target''s
      packagge path. See b/324126745.'
    --execution_log_sort: ' Whether to sort the execution log, making it easier to
      compare logs across invocations. Set to false to avoid potentially significant
      CPU and memory usage at the end of the invocation, at the cost of producing
      the log in nondeterministic execution order. Only applies to the binary and
      JSON formats; the compact format is never sorted.'
    --output_tree_tracking: ' If set, tell the output service (if any) to track when
      files in the output tree have been modified externally (not by the build system).
      This should improve incremental build speed when an appropriate output service
      is enabled.'
    --noexperimental_enable_skyfocus: ' If true, enable the use of --experimental_working_set
      to reduce Bazel''s memory footprint for incremental builds. This feature is
      known as Skyfocus.'
    --test_strategy: ' Specifies which strategy to use when running tests.'
    --spawn_strategy: ' Specify how spawn actions are executed by default. Accepts
      a comma-separated list of strategies from highest to lowest priority. For each
      action Bazel picks the strategy with the highest priority that can execute the
      action. The default value is "remote,worker,sandboxed,local". See https://blog.bazel.build/2019/06/19/list-strategy.html
      for details.'
    --nodiscard_analysis_cache: ' Discard the analysis cache immediately after the
      analysis phase completes. Reduces memory usage by ~10%, but makes further incremental
      builds slower.'
    --experimental_skyfocus_dump_post_gc_stats: ' For debugging Skyfocus. If enabled,
      trigger manual GC before/after focusing to report heap sizes reductions. This
      will increase the Skyfocus latency.'
    --noexperimental_build_event_expand_filesets: ' If true, expand Filesets in the
      BEP when presenting output files.'
    --nokeep_going: ' Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.'
    --noexperimental_use_validation_aspect: ' Whether to run validation actions using
      aspect (for parallelism with tests).'
    --experimental_frontier_violation_verbose: ' If true, Bazel will print instructions
      for fixing Skycache violations'
    --nocheck_tests_up_to_date: ' Don''t run tests, just check if they are up-to-date.  If
      all tests results are up-to-date, the testing completes successfully.  If any
      test needs to be built or executed, an error is reported and the testing fails.  This
      option implies --check_up_to_date behavior.'
    --nobuild: ' Execute the build; this is the usual behaviour. Specifying --nobuild
      causes the build to stop before executing the build actions, returning zero
      iff the package loading and analysis phases completed successfully; this mode
      is useful for testing those phases.'
    --experimental_extra_action_top_level_only: ' Deprecated in favor of aspects.
      Only schedules extra_actions for top level targets.'
    --build_event_upload_max_retries: ' The maximum number of times Bazel should retry
      uploading a build event.'
    --test_timeout_filters: ' Specifies a comma-separated list of test timeouts. Each
      timeout can be optionally preceded with ''-'' to specify excluded timeouts.
      Only those test targets will be found that contain at least one included timeout
      and do not contain any excluded timeouts. This option affects --build_tests_only
      behavior and the test command.'
    --experimental_remote_analysis_cache_deadline: ' Deadline to use for remote analysis
      cache operations.'
    -s, --subcommands: ' Display the subcommands executed during a build. Related
      flags: --execution_log_json_file, --execution_log_binary_file (for logging subcommands
      to a file in a tool-friendly format).'
    --deleted_packages: |2-
       A comma-separated list of names of packages which the build system will consider non-existent, even if they are visible somewhere on the package path.
      Use this option when deleting a subpackage 'x/y' of an existing package 'x'.  For example, after deleting x/y/BUILD in your client, the build system may complain if it encounters a label '//x:y/z' if that is still provided by another package_path entry.  Specifying --deleted_packages x/y avoids this problem.
    --experimental_skyframe_error_handling_refactor: ' Used solely for the safe rollout
      of simplifying Skyframe error handling. This will beremoved once the rollout
      is complete (expected timeframe: 1 release)'
    --default_visibility: ' Default visibility for packages that don''t set it explicitly
      (''public'' or ''private'').'
    --nouse_action_cache: ' Whether to use the action cache'
    --experimental_stream_log_file_uploads: ' Stream log file uploads directly to
      the remote storage rather than writing them to disk.'
    --noexperimental_async_execution: ' If set to true, Bazel is allowed to run action
      in a virtual thread. The number of actions in flight is still capped with --jobs.'
    --nooutput_tree_tracking: ' If set, tell the output service (if any) to track
      when files in the output tree have been modified externally (not by the build
      system). This should improve incremental build speed when an appropriate output
      service is enabled.'
    --notest_keep_going: ' When disabled, any non-passing test will cause the entire
      build to stop. By default all tests are run, even if some do not pass.'
    --noallow_analysis_cache_discard: ' If discarding the analysis cache due to a
      change in the build system, setting this option to false will cause bazel to
      exit, rather than continuing with the build. This option has no effect when
      ''discard_analysis_cache'' is also set.'
    --strategy_regexp: ' Override which spawn strategy should be used to execute spawn
      actions that have descriptions matching a certain regex_filter. See --per_file_copt
      for details onregex_filter matching. The last regex_filter that matches the
      description is used. This option overrides other flags for specifying strategy.
      Example: --strategy_regexp=//foo.*\.cc,-//foo/bar=local means to run actions
      using local strategy if their descriptions match //foo.*.cc but not //foo/bar.
      Example: --strategy_regexp=''Compiling.*/bar=local  --strategy_regexp=Compiling=sandboxed
      will run ''Compiling //foo/bar/baz'' with the ''local'' strategy, but reversing
      the order would run it with ''sandboxed''. '
    --experimental_remote_analysis_cache_concurrency: ' Target concurrency for remote
      analysis caching RPCs.'
    --nofetch: ' Allows the command to fetch external dependencies. If set to false,
      the command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.'
    --experimental_stats_summary: ' Enable a modernized summary of the build stats.'
    --discard_analysis_cache: ' Discard the analysis cache immediately after the analysis
      phase completes. Reduces memory usage by ~10%, but makes further incremental
      builds slower.'
    --package_path: ' A colon-separated list of where to look for packages. Elements
      beginning with ''%workspace%'' are relative to the enclosing workspace. If omitted
      or empty, the default is the output of ''bazel info default-package-path''.'
    --compile_one_dependency: ' Compile a single dependency of the argument files.
      This is useful for syntax checking source files in IDEs, for example, by rebuilding
      a single target that depends on the source file to detect errors as early as
      possible in the edit/build/test cycle. This argument affects the way all non-flag
      arguments are interpreted; instead of being targets to build they are source
      filenames.  For each source filename an arbitrary target that depends on it
      will be built.'
    --experimental_use_semaphore_for_jobs: ' If set to true, additionally use semaphore
      to limit number of concurrent jobs.'
    --experimental_build_event_output_group_mode: ' Specify how an output group''s
      files will be represented in TargetComplete/AspectComplete BEP events. Values
      are an assignment of an output group name to one of ''NAMED_SET_OF_FILES_ONLY'',
      ''INLINE_ONLY'', or ''BOTH''. The default value is ''NAMED_SET_OF_FILES_ONLY''.
      If an output group is repeated, the final value to appear is used. The default
      value sets the mode for coverage artifacts to BOTH: --experimental_build_event_output_group_mode=baseline.lcov=both'
    --noexperimental_split_xml_generation: ' If this flag is set, and a test action
      does not generate a test.xml file, then Bazel uses a separate action to generate
      a dummy test.xml file containing the test log. Otherwise, Bazel generates a
      test.xml as part of the test action.'
    --verbose_failures: ' If a command fails, print out the full command line.'
    --legacy_globbing_threads: ' Number of threads to use for glob evaluation. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" means to use
      a reasonable value derived from the machine''s hardware profile (e.g. the number
      of processors).'
    --norun_validations: ' Whether to run validation actions as part of the build.
      See https://bazel.build/extending/rules#validation_actions'
    --noverbose_failures: ' If a command fails, print out the full command line.'
    --experimental_build_event_expand_filesets: ' If true, expand Filesets in the
      BEP when presenting output files.'
    --incompatible_config_setting_private_default_visibility: ' If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.'
    --noskip_incompatible_explicit_targets: ' Skip incompatible targets that are explicitly
      listed on the command line. By default, building such targets results in an
      error but they are silently skipped when this option is enabled. See: https://bazel.build/extending/platforms#skipping-incompatible-targets'
    --noexperimental_bep_target_summary: ' Whether to publish TargetSummary events.'
    --nocompile_one_dependency: ' Compile a single dependency of the argument files.
      This is useful for syntax checking source files in IDEs, for example, by rebuilding
      a single target that depends on the source file to detect errors as early as
      possible in the edit/build/test cycle. This argument affects the way all non-flag
      arguments are interpreted; instead of being targets to build they are source
      filenames.  For each source filename an arbitrary target that depends on it
      will be built.'
    --noexperimental_enable_critical_path_profiling: ' If set (the default), critical
      path profiling is enabled for the execution phase. This has a slight overhead
      in RAM and CPU, and may prevent Bazel from making certain aggressive RAM optimizations
      in some cases.'
    --experimental_oom_sensitive_skyfunctions_semaphore_size: ' Sets the size of the
      semaphore used to prevent SkyFunctions with large peak memory requirement from
      OOM-ing blaze. A value of 0 indicates that no semaphore should be used. Example
      value: "HOST_CPUS*0.5".'
    --experimental_convenience_symlinks: |2-
       This flag controls how the convenience symlinks (the symlinks that appear in the workspace after the build) will be managed. Possible values:
        normal (default): Each kind of convenience symlink will be created or deleted, as determined by the build.
        clean: All symlinks will be unconditionally deleted.
        ignore: Symlinks will not be created or cleaned up.
        log_only: Generate log messages as if 'normal' were passed, but don't actually perform any filesystem operations (useful for tools).
      Note that only symlinks whose names are generated by the current value of --symlink_prefix can be affected; if the prefix changes, any pre-existing symlinks will be left alone.
    --experimental_build_event_upload_retry_minimum_delay: ' Initial, minimum delay
      for exponential backoff retries when BEP upload fails. (exponent: 1.6)'
    --noanalyze: ' Execute the loading/analysis phase; this is the usual behaviour.
      Specifying --noanalyzecauses the build to stop before starting the loading/analysis
      phase, just doing target pattern parsing and returning zero iff that completed
      successfully; this mode is useful for testing.'
    --experimental_skyframe_memory_dump: ' Dump the memory use of individual nodes
      in the Skyframe graph after the build. This option takes a number of flags separated
      by commas: ''json'' (no-op, that''s the only format), ''notransient'' (don''t
      traverse transient fields), ''noconfig'' (ignore objects related to configurations),
      ''noprecomputed'' (ignore precomputed values) and ''noworkspacestatus'' (ignore
      objects related to the workspace status machinery)'
    --experimental_run_bep_event_include_residue: ' Whether to include the command-line
      residue in run build events which could contain the residue. By default, the
      residue is not included in run command build events that could contain the residue.'
    --experimental_max_directories_to_eagerly_visit_in_globbing: ' If non-negative,
      the first time a glob is evaluated in a package, the subdirectories of the package
      will be traversed in order to warm filesystem caches and compensate for lack
      of parallelism in globbing. At most this many directories will be visited.'
    --verbose_explanations: ' Increases the verbosity of the explanations issued if
      --explain is enabled. Has no effect if --explain is not enabled.'
    --materialize_param_files: ' Writes intermediate parameter files to output tree
      even when using remote action execution. Useful when debugging actions. This
      is implied by --subcommands and --verbose_failures.'
    --noexperimental_frontier_violation_verbose: ' If true, Bazel will print instructions
      for fixing Skycache violations'
    -j, --jobs: ' The number of concurrent jobs to run. Takes an integer, or a keyword
      ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed by an operation ([-|*]<float>)
      eg. "auto", "HOST_CPUS*.5". Values must be between 1 and 5000. Values above
      2500 may cause memory issues. "auto" calculates a reasonable default based on
      host resources.'
    --experimental_extra_action_filter: ' Deprecated in favor of aspects. Filters
      set of targets to schedule extra_actions for.'
    --experimental_split_xml_generation: ' If this flag is set, and a test action
      does not generate a test.xml file, then Bazel uses a separate action to generate
      a dummy test.xml file containing the test log. Otherwise, Bazel generates a
      test.xml as part of the test action.'
    --experimental_process_wrapper_graceful_sigterm: ' When true, make the process-wrapper
      propagate SIGTERMs (used by the dynamic scheduler to stop process trees) to
      the subprocesses themselves, giving them the grace period in --local_termination_grace_seconds
      before forcibly sending a SIGKILL.'
    --test_tag_filters: ' Specifies a comma-separated list of test tags. Each tag
      can be optionally preceded with ''-'' to specify excluded tags. Only those test
      targets will be found that contain at least one included tag and do not contain
      any excluded tags. This option affects --build_tests_only behavior and the test
      command.'
    --symlink_prefix: ' The prefix that is prepended to any of the convenience symlinks
      that are created after a build. If omitted, the default value is the name of
      the build tool followed by a hyphen. If ''/'' is passed, then no symlinks are
      created and no warning is emitted. Warning: the special functionality for ''/''
      will be deprecated soon; use --experimental_convenience_symlinks=ignore instead.'
    --experimental_remote_analysis_cache_max_batch_size: ' Batch size limit for remote
      analysis caching RPCs.'
    --output_groups: ' A list of comma-separated output group names, each of which
      optionally prefixed by a + or a -. A group prefixed by + is added to the default
      set of output groups, while a group prefixed by - is removed from the default
      set. If at least one group is not prefixed, the default set of output groups
      is omitted. For example, --output_groups=+foo,+bar builds the union of the default
      set, foo, and bar, while --output_groups=foo,bar overrides the default set such
      that only foo and bar are built.'
    --max_config_changes_to_show: ' When discarding the analysis cache due to a change
      in the build options, displays up to the given number of changed option names.
      If the number given is -1, all changed options will be displayed.'
    --experimental_enable_critical_path_profiling: ' If set (the default), critical
      path profiling is enabled for the execution phase. This has a slight overhead
      in RAM and CPU, and may prevent Bazel from making certain aggressive RAM optimizations
      in some cases.'
    --experimental_cpu_load_scheduling_window_size: ' The size of window during experimental
      scheduling of action based on CPU load. Make sense to define only when flag
      --experimental_cpu_load_scheduling is enabled.'
    --incompatible_skip_genfiles_symlink: ' If set to true, the genfiles symlink will
      not be created. For more information, see https://github.com/bazelbuild/bazel/issues/8651'
    --experimental_local_lockfree_output: ' When true, the local spawn runner doesn''t
      lock the output tree during dynamic execution. Instead, spawns are allowed to
      execute until they are explicitly interrupted by a faster remote action.'
    --noincompatible_config_setting_private_default_visibility: ' If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.'
    --show_loading_progress: ' If enabled, causes Bazel to print "Loading package:"
      messages.'
    --nobuild_manual_tests: ' Forces test targets tagged ''manual'' to be built. ''manual''
      tests are excluded from processing. This option forces them to be built (but
      not executed).'
    --test_lang_filters: ' Specifies a comma-separated list of test languages. Each
      language can be optionally preceded with ''-'' to specify excluded languages.
      Only those test targets will be found that are written in the specified languages.
      The name used for each language should be the same as the language prefix in
      the *_test rule, e.g. one of ''cc'', ''java'', ''py'', etc. This option affects
      --build_tests_only behavior and the test command.'
    --experimental_cpu_load_scheduling: ' Enables the experimental local execution
      scheduling based on CPU load, not estimation of actions one by one.  Experimental
      scheduling have showed the large benefit on a large local builds on a powerful
      machines with the large number of cores. Reccommended to use with --local_resources=cpu=HOST_CPUS'
    --test_output: ' Specifies desired output mode. Valid values are ''summary'' to
      output only test status summary, ''errors'' to also print test logs for failed
      tests, ''all'' to print logs for all tests and ''streamed'' to output logs for
      all tests in real time (this will force tests to be executed locally one at
      a time regardless of --test_strategy value).'
    --run_validations: ' Whether to run validation actions as part of the build. See
      https://bazel.build/extending/rules#validation_actions'
    --experimental_async_execution: ' If set to true, Bazel is allowed to run action
      in a virtual thread. The number of actions in flight is still capped with --jobs.'
    --execution_log_binary_file: ' Log the executed spawns into this file as length-delimited
      SpawnExec protos, according to src/main/protobuf/spawn.proto. Prefer --execution_log_compact_file,
      which is significantly smaller and cheaper to produce. Related flags: --execution_log_compact_file
      (compact format; mutually exclusive), --execution_log_json_file (text JSON format;
      mutually exclusive), --execution_log_sort (whether to sort the execution log),
      --subcommands (for displaying subcommands in terminal output).'
    --nocheck_up_to_date: ' Don''t perform the build, just check if it is up-to-date.  If
      all targets are up-to-date, the build completes successfully.  If any step needs
      to be executed an error is reported and the build fails.'
    --legacy_important_outputs: ' Use this to suppress generation of the legacy important_outputs
      field in the TargetComplete event. important_outputs are required for Bazel
      to ResultStore/BTX integration.'
    --cache_computed_file_digests: ' If greater than 0, configures Bazel to cache
      file digests in memory based on their metadata instead of recomputing the digests
      from disk every time they are needed. Setting this to 0 ensures correctness
      because not all file changes can be noted from file metadata. When not 0, the
      number indicates the size of the cache as the number of file digests to be cached.'
    --experimental_frontier_violation_check: ' Strategies to handle potential incorrectness
      from changes beyond the frontier (i.e. outside the working set)'
    --experimental_working_set: ' The working set for Skyfocus. Specify as comma-separated
      workspace root-relative paths. This is a stateful flag. Defining a working set
      persists it for subsequent invocations, until it is redefined with a new set.'
    --strategy: ' Specify how to distribute compilation of other spawn actions. Accepts
      a comma-separated list of strategies from highest to lowest priority. For each
      action Bazel picks the strategy with the highest priority that can execute the
      action. The default value is "remote,worker,sandboxed,local". This flag overrides
      the values set by --spawn_strategy (and --genrule_strategy if used with mnemonic
      Genrule). See https://blog.bazel.build/2019/06/19/list-strategy.html for details.'
    --experimental_bep_target_summary: ' Whether to publish TargetSummary events.'
    --build_tests_only: ' If specified, only *_test and test_suite rules will be built
      and other targets specified on the command line will be ignored. By default
      everything that was requested will be built.'
    --allow_analysis_cache_discard: ' If discarding the analysis cache due to a change
      in the build system, setting this option to false will cause bazel to exit,
      rather than continuing with the build. This option has no effect when ''discard_analysis_cache''
      is also set.'
    --local_cpu_resources: ' Explicitly set the total number of local CPU cores available
      to Bazel to spend on build actions executed locally. Takes an integer, or "HOST_CPUS",
      optionally followed by [-|*]<float> (eg. HOST_CPUS*.5 to use half the available
      CPU cores). By default, ("HOST_CPUS"), Bazel will query system configuration
      to estimate the number of CPU cores available.'
    --noshow_loading_progress: ' If enabled, causes Bazel to print "Loading package:"
      messages.'
    --noexperimental_cpu_load_scheduling: ' Enables the experimental local execution
      scheduling based on CPU load, not estimation of actions one by one.  Experimental
      scheduling have showed the large benefit on a large local builds on a powerful
      machines with the large number of cores. Reccommended to use with --local_resources=cpu=HOST_CPUS'
    --noexperimental_stream_log_file_uploads: ' Stream log file uploads directly to
      the remote storage rather than writing them to disk.'
    --noexperimental_check_output_files: ' Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don''t expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won''t have to check a previous run''s cache.'
    --noexperimental_skyframe_error_handling_refactor: ' Used solely for the safe
      rollout of simplifying Skyframe error handling. This will beremoved once the
      rollout is complete (expected timeframe: 1 release)'
    --allowed_local_actions_regex: ' A regex whitelist for action types which may
      be run locally. If unset, all actions are allowed to execute locally'
    --experimental_fsvc_threads: ' The number of threads that are used by the FileSystemValueChecker.'
    --serialized_frontier_profile: ' Dump a profile of serialized frontier bytes.
      Specifies the output path.'
    --noexperimental_build_event_fully_resolve_fileset_symlinks: ' Deprecated no-op.'
    --genrule_strategy: ' Specify how to execute genrules. This flag will be phased
      out. Instead, use --spawn_strategy=<value> to control all actions or --strategy=Genrule=<value>
      to control genrules only.'
    --experimental_skymeld_analysis_overlap_percentage: ' The value represents the
      % of the analysis phase which will be overlapped with the execution phase. A
      value of x means Skyframe will queue up execution tasks and wait until there''s
      x% of the top level target left to be analyzed before allowing them to launch.
      When the value is 0%, we''d wait for all analysis to finish before executing
      (no overlap). When it''s 100%, the phases are free to overlap as much as they
      can.'
    --aspects_parameters: ' Specifies the values of the command-line aspects parameters.
      Each parameter value is specified via <param_name>=<param_value>, for example
      ''my_param=my_val'' where ''my_param'' is a parameter of some aspect in --aspects
      list or required by an aspect in the list. This option can be used multiple
      times. However, it is not allowed to assign values to the same parameter more
      than once.'
    --progress_report_interval: ' The number of seconds to wait between reports on
      still running jobs. The default value 0 means the first report will be printed
      after 10 seconds, then 30 seconds and after that progress is reported once every
      minute. When --curses is enabled, progress is reported every second.'
    --test_size_filters: ' Specifies a comma-separated list of test sizes. Each size
      can be optionally preceded with ''-'' to specify excluded sizes. Only those
      test targets will be found that contain at least one included size and do not
      contain any excluded sizes. This option affects --build_tests_only behavior
      and the test command.'
    --noexperimental_convenience_symlinks_bep_event: ' This flag controls whether
      or not we will post the build eventConvenienceSymlinksIdentified to the BuildEventProtocol.
      If the value is true, the BuildEventProtocol will have an entry for convenienceSymlinksIdentified,
      listing all of the convenience symlinks created in your workspace. If false,
      then the convenienceSymlinksIdentified entry in the BuildEventProtocol will
      be empty.'
    --experimental_remote_analysis_cache: ' The URL for the remote analysis caching
      backend.'
    --noexperimental_skyfocus_dump_post_gc_stats: ' For debugging Skyfocus. If enabled,
      trigger manual GC before/after focusing to report heap sizes reductions. This
      will increase the Skyfocus latency.'
    --flaky_test_attempts: ' Each test will be retried up to the specified number
      of times in case of any test failure. Tests that required more than one attempt
      to pass are marked as ''FLAKY'' in the test summary. Normally the value specified
      is just an integer or the string ''default''. If an integer, then all tests
      will be run up to N times. If ''default'', then only a single test attempt will
      be made for regular tests and three for tests marked explicitly as flaky by
      their rule (flaky=1 attribute). Alternate syntax: regex_filter@flaky_test_attempts.
      Where flaky_test_attempts is as above and regex_filter stands for a list of
      include and exclude regular expression patterns (Also see --runs_per_test).
      Example: --flaky_test_attempts=//foo/.*,-//foo/bar/.*@3 deflakes all tests in
      //foo/ except those under foo/bar three times. This option can be passed multiple
      times. The most recently passed argument that matches takes precedence. If nothing
      matches, behavior is as if ''default'' above.'
    --experimental_local_retries_on_crash: ' Number of times to retry a local action
      when we detect that it crashed. This exists to workaround a bug in OSXFUSE which
      is tickled by the use of the dynamic scheduler and --experimental_local_lockfree_output
      due to constant process churn. The bug can be triggered by a cancelled process
      that ran *before* the process we are trying to run, introducing corruption in
      its file reads.'
    --local_ram_resources: ' Explicitly set the total amount of local host RAM (in
      MB) available to Bazel to spend on build actions executed locally. Takes an
      integer, or "HOST_RAM", optionally followed by [-|*]<float> (eg. HOST_RAM*.5
      to use half the available RAM). By default, ("HOST_RAM*.67"), Bazel will query
      system configuration to estimate the amount of RAM available and will use 67%
      of it.'
    --experimental_use_validation_aspect: ' Whether to run validation actions using
      aspect (for parallelism with tests).'
    -k, --keep_going: ' Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.'
    --noexperimental_run_bep_event_include_residue: ' Whether to include the command-line
      residue in run build events which could contain the residue. By default, the
      residue is not included in run command build events that could contain the residue.'
    --analyze: ' Execute the loading/analysis phase; this is the usual behaviour.
      Specifying --noanalyzecauses the build to stop before starting the loading/analysis
      phase, just doing target pattern parsing and returning zero iff that completed
      successfully; this mode is useful for testing.'
    --execution_log_json_file: ' Log the executed spawns into this file as newline-delimited
      JSON representations of SpawnExec protos, according to src/main/protobuf/spawn.proto.
      Prefer --execution_log_compact_file, which is significantly smaller and cheaper
      to produce. Related flags: --execution_log_compact_file (compact format; mutually
      exclusive), --execution_log_binary_file (binary protobuf format; mutually exclusive),
      --execution_log_sort (whether to sort the execution log), --subcommands (for
      displaying subcommands in terminal output).'
    --explain: ' Causes the build system to explain each executed step of the build.
      The explanation is written to the specified log file.'
    --skip_incompatible_explicit_targets: ' Skip incompatible targets that are explicitly
      listed on the command line. By default, building such targets results in an
      error but they are silently skipped when this option is enabled. See: https://bazel.build/extending/platforms#skipping-incompatible-targets'
    --experimental_convenience_symlinks_bep_event: ' This flag controls whether or
      not we will post the build eventConvenienceSymlinksIdentified to the BuildEventProtocol.
      If the value is true, the BuildEventProtocol will have an entry for convenienceSymlinksIdentified,
      listing all of the convenience symlinks created in your workspace. If false,
      then the convenienceSymlinksIdentified entry in the BuildEventProtocol will
      be empty.'
    --local_termination_grace_seconds: ' Time to wait between terminating a local
      process due to timeout and forcefully shutting it down.'
    --noexpand_test_suites: ' Expand test_suite targets into their constituent tests
      before analysis. When this flag is turned on (the default), negative target
      patterns will apply to the tests belonging to the test suite, otherwise they
      will not. Turning off this flag is useful when top-level aspects are applied
      at command line: then they can analyze test_suite targets.'
    --directory_creation_cache: ' Describes the cache used to store known regular
      directories as they''re created. Parent directories of output files are created
      on-demand during action execution.'
    --output_filter: ' Only shows warnings and action outputs for rules with a name
      matching the provided regular expression.'
    --nolegacy_important_outputs: ' Use this to suppress generation of the legacy
      important_outputs field in the TargetComplete event. important_outputs are required
      for Bazel to ResultStore/BTX integration.'
    --noexperimental_extra_action_top_level_only: ' Deprecated in favor of aspects.
      Only schedules extra_actions for top level targets.'
    --experimental_materialize_param_files_directly: ' If materializing param files,
      do so with direct writes to disk.'
    --noverbose_explanations: ' Increases the verbosity of the explanations issued
      if --explain is enabled. Has no effect if --explain is not enabled.'
    --experimental_check_output_files: ' Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don''t expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won''t have to check a previous run''s cache.'
    --use_action_cache: ' Whether to use the action cache'
    --noexperimental_skyframe_target_pattern_evaluator: ' Use the Skyframe-based target
      pattern evaluator; implies --experimental_interleave_loading_and_analysis.'
    --experimental_async_execution_max_concurrent_actions: ' The number of maximum
      concurrent actions to run with async execution'
    --experimental_build_event_upload_strategy: ' Selects how to upload artifacts
      referenced in the build event protocol. In Bazel the valid options include ''local''
      and ''remote''. The default value is ''local''.'
    --local_extra_resources: ' Set the number of extra resources available to Bazel.
      Takes in a string-float pair. Can be used multiple times to specify multiple
      types of extra resources. Bazel will limit concurrently running actions based
      on the available extra resources and the extra resources required. Tests can
      declare the amount of extra resources they need by using a tag of the "resources:<resoucename>:<amount>"
      format. Available CPU, RAM and resources cannot be set with this flag.'
    --loading_phase_threads: ' Number of parallel threads to use for the loading/analysis
      phase.Takes an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally
      followed by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" sets
      a reasonable default based on host resources. Must be at least 1.'
    --experimental_remote_cache_eviction_retries: ' The maximum number of attempts
      to retry if the build encountered a transient remote cache error that would
      otherwise fail the build. Applies for example when artifacts are evicted from
      the remote cache, or in certain cache failure conditions. A new invocation id
      will be generated for each attempt.'
    --experimental_remote_analysis_cache_mode: ' The transport direction for the remote
      analysis cache.'
    --expand_test_suites: ' Expand test_suite targets into their constituent tests
      before analysis. When this flag is turned on (the default), negative target
      patterns will apply to the tests belonging to the test suite, otherwise they
      will not. Turning off this flag is useful when top-level aspects are applied
      at command line: then they can analyze test_suite targets.'
    --experimental_skyframe_cpu_heavy_skykeys_thread_pool_size: ' If set to a positive
      value (e.g. "HOST_CPUS*1.5"), Skyframe will run the loading/analysis phase with
      2 separate thread pools: 1 with <value> threads (ideally close to HOST_CPUS)
      reserved for CPU-heavy SkyKeys, and 1 "standard" thread pool (whose size is
      controlled by --loading_phase_threads) for the rest.'
    --max_test_output_bytes: ' Specifies maximum per-test-log size that can be emitted
      when --test_output is ''errors'' or ''all''. Useful for avoiding overwhelming
      the output with excessively noisy test output. The test header is included in
      the log size. Negative values imply no limit. Output is all or nothing.'
    --experimental_merged_skyframe_analysis_execution: ' If this flag is set, the
      analysis and execution phases of Skyframe are merged.'
    --target_pattern_file: ' If set, build will read patterns from the file named
      here, rather than on the command line. It is an error to specify a file here
      as well as command-line patterns.'
    --noexperimental_process_wrapper_graceful_sigterm: ' When true, make the process-wrapper
      propagate SIGTERMs (used by the dynamic scheduler to stop process trees) to
      the subprocesses themselves, giving them the grace period in --local_termination_grace_seconds
      before forcibly sending a SIGKILL.'
    --experimental_skyframe_target_pattern_evaluator: ' Use the Skyframe-based target
      pattern evaluator; implies --experimental_interleave_loading_and_analysis.'
    --noincompatible_skip_genfiles_symlink: ' If set to true, the genfiles symlink
      will not be created. For more information, see https://github.com/bazelbuild/bazel/issues/8651'
    --experimental_enable_skyfocus: ' If true, enable the use of --experimental_working_set
      to reduce Bazel''s memory footprint for incremental builds. This feature is
      known as Skyfocus.'
    --build_manual_tests: ' Forces test targets tagged ''manual'' to be built. ''manual''
      tests are excluded from processing. This option forces them to be built (but
      not executed).'
    --experimental_aquery_dump_after_build_format: ' Writes the state of Skyframe
      (which includes previous invocations on this blaze instance as well) after a
      build. Output is streamed remotely unless local output is requested with --experimental_aquery_dump_after_build_output_file.  Does
      not honor aquery flags for --include_*, but uses the same defaults, except for
      --include_commandline=false. Possible output formats: proto|streamed_proto|textproto|jsonproto.
      Using this will disable Skymeld.'
    --build_tag_filters: ' Specifies a comma-separated list of tags. Each tag can
      be optionally preceded with ''-'' to specify excluded tags. Only those targets
      will be built that contain at least one included tag and do not contain any
      excluded tags. This option does not affect the set of tests executed with the
      ''test'' command; those are be governed by the test filtering options, for example
      ''--test_tag_filters'''
    --noexperimental_use_semaphore_for_jobs: ' If set to true, additionally use semaphore
      to limit number of concurrent jobs.'
    --experimental_aquery_dump_after_build_output_file: ' Specify the output file
      for the aquery dump after a build. Use in conjunction with --experimental_aquery_dump_after_build_format.
      The path provided is relative to Bazel''s output base, unless it''s an absolute
      path. Using this will disable Skymeld.'
    --local_test_jobs: ' The max number of local test jobs to run concurrently. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". 0 means local resources
      will limit the number of local test jobs to run concurrently instead. Setting
      this greater than the value for --jobs is ineffectual.'
    --norewind_lost_inputs: ' Whether to use action rewinding to recover from lost
      inputs.'
    --test_tmpdir: ' Specifies the base temporary directory for ''bazel test'' to
      use.'
    --experimental_build_event_fully_resolve_fileset_symlinks: ' Deprecated no-op.'
    --execution_log_compact_file: ' Log the executed spawns into this file as length-delimited
      ExecLogEntry protos, according to src/main/protobuf/spawn.proto. The entire
      file is zstd compressed. Related flags: --execution_log_binary_file (binary
      protobuf format; mutually exclusive), --execution_log_json_file (text JSON format;
      mutually exclusive), --subcommands (for displaying subcommands in terminal output).'
    --hide_aspect_results: ' Comma-separated list of aspect names to not display in
      results (see --show_result). Useful for keeping aspects added by wrappers which
      are typically not interesting to end users out of console output.'
  description: Builds the specified targets.
