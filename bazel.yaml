aliases: [bazelisk]
name: bazel
flags:
  --product_name: The name of the build system. It is used as part of the name of
    the generated directories (e.g. productName-bin for binaries) as well as for printing
    error messages and logging
  --server_jvm_out=: <path>The location to write the server's JVM's output. If unset
    then defaults to a location in output_base.
  --watchfs: If true, %{product} tries to use the operating system's file watch service
    for local changes instead of scanning every file for a change.
  --nowindows_enable_symlinks: If true, real symbolic links will be created on Windows
    instead of file copying. Requires Windows developer mode to be enabled and Windows
    10 version 1703 or greater.
  --block_for_lock: When --noblock_for_lock is passed, Bazel does not wait for a running
    command to complete, but instead exits immediately.
  --command_port: Port to start up the gRPC command server on. If 0, let the kernel
    choose.
  --windows_enable_symlinks: If true, real symbolic links will be created on Windows
    instead of file copying. Requires Windows developer mode to be enabled and Windows
    10 version 1703 or greater.
  --local_startup_timeout_secs: The maximum amount of time the client waits to connect
    to the server
  --nowrite_command_log: Whether or not to write the command.log file
  --noquiet: If true, no informational messages are emitted on the console, only errors.
    Changing this option will not cause the server to restart.
  --nopreemptible: If true, the command can be preempted if another command is started.
  --preemptible: If true, the command can be preempted if another command is started.
  --ignore_all_rc_files: Disables all rc files, regardless of the values of other
    rc-modifying flags, even if these flags come later in the list of startup options.
  --nowatchfs: If true, %{product} tries to use the operating system's file watch
    service for local changes instead of scanning every file for a change.
  --noworkspace_rc: Whether or not to look for the workspace bazelrc file at $workspace/.bazelrc
  --nounlimit_coredumps: Raises the soft coredump limit to the hard limit to make
    coredumps of the server (including the JVM) and the client possible under common
    conditions. Stick this flag in your bazelrc once and forget about it so that you
    get coredumps when you actually encounter a condition that triggers them.
  --server_javabase=: <jvm path>Path to the JVM used to execute Bazel itself.
  --lock_install_base: Whether the server should hold a lock on the install base while
    running, to prevent another server from attempting to garbage collect it.
  --autodetect_server_javabase: When --noautodetect_server_javabase is passed, Bazel
    does not fall back to the local JDK for running the bazel server and instead exits.
  --workspace_rc: Whether or not to look for the workspace bazelrc file at $workspace/.bazelrc
  --unix_digest_hash_attribute_name: The name of an extended attribute that can be
    placed on files to store a precomputed copy of the file's hash, corresponding
    with --digest_function. This option can be used to reduce disk I/O and CPU load
    caused by hash computation. This extended attribute is checked on all source files
    and output files, meaning that it causes a significant number of invocations of
    the getxattr() system call.
  --failure_detail_out=: <path>If set, specifies a location to write a failure_detail
    protobuf message if the server experiences a failure and cannot report it via
    gRPC, as normal. Otherwise, the location will be ${OUTPUT_BASE}/failure_detail.rawproto.
  --quiet: If true, no informational messages are emitted on the console, only errors.
    Changing this option will not cause the server to restart.
  --noidle_server_tasks: Run System.gc() when the server is idle
  --nosystem_rc: Whether or not to look for the system-wide bazelrc.
  --install_md5: This launcher option is intended for use only by tests.
  --host_jvm_args=: <jvm_arg>Flags to pass to the JVM executing Blaze.
  --noignore_all_rc_files: Disables all rc files, regardless of the values of other
    rc-modifying flags, even if these flags come later in the list of startup options.
  --noshutdown_on_low_sys_mem: If max_idle_secs is set and the build server has been
    idle for a while, shut down the server when the system is low on free RAM. Linux
    only.
  --idle_server_tasks: Run System.gc() when the server is idle
  --host_jvm_debug: Convenience option to add some additional JVM startup flags, which
    cause the JVM to wait during startup until you connect from a JDWP-compliant debugger
    (like Eclipse) to port 5005.
  --noclient_debug: If true, log debug information from the client to stderr. Changing
    this option will not cause the server to restart.
  --fatal_event_bus_exceptions: Whether or not to exit if an exception is thrown by
    an internal EventBus handler. No-op if --fatal_async_exceptions_exclusions is
    available; that flag's behavior is preferentially used.
  --noautodetect_server_javabase: When --noautodetect_server_javabase is passed, Bazel
    does not fall back to the local JDK for running the bazel server and instead exits.
  --option_sources: ''
  --batch_cpu_scheduling: Only on Linux; use 'batch' CPU scheduling for Blaze. This
    policy is useful for workloads that are non-interactive, but do not want to lower
    their nice value. See 'man 2 sched_setscheduler'. If false, then Bazel does not
    perform a system call.
  --system_rc: Whether or not to look for the system-wide bazelrc.
  --macos_qos_class: 'Sets the QoS service class of the %{product} server when running
    on macOS. This flag has no effect on all other platforms but is supported to ensure
    rc files can be shared among them without changes. Possible values are: user-interactive,
    user-initiated, default, utility, and background.'
  --unlimit_coredumps: Raises the soft coredump limit to the hard limit to make coredumps
    of the server (including the JVM) and the client possible under common conditions.
    Stick this flag in your bazelrc once and forget about it so that you get coredumps
    when you actually encounter a condition that triggers them.
  --default_system_javabase: The root of the user's local JDK install, to be used
    as the default target javabase and as a fall-back host_javabase. This is not the
    embedded JDK.
  --client_debug: If true, log debug information from the client to stderr. Changing
    this option will not cause the server to restart.
  --home_rc: Whether or not to look for the home bazelrc file at $HOME/.bazelrc
  --batch: If set, Bazel will be run as just a client process without a server, instead
    of in the standard client/server mode. This is deprecated and will be removed,
    please prefer shutting down the server explicitly if you wish to avoid lingering
    servers.
  --workspace_directory: The root of the workspace, that is, the directory that Bazel
    uses as the root of the build. This flag is only to be set by the bazel client.
  --max_idle_secs=: <integer>The number of seconds the build server will wait idling
    before shutting down. Zero means that the server will never shutdown. This is
    only read on server-startup, changing this option will not cause the server to
    restart.
  --nohome_rc: Whether or not to look for the home bazelrc file at $HOME/.bazelrc
  --install_base: This launcher option is intended for use only by tests.
  --write_command_log: Whether or not to write the command.log file
  --output_user_root=: <path>The user-specific directory beneath which all build outputs
    are written; by default, this is a function of $USER, but by specifying a constant,
    build outputs can be shared between collaborating users.
  --output_base=: '<path>If set, specifies the output location to which all build
    output will be written. Otherwise, the location will be ${OUTPUT_ROOT}/_blaze_${USER}/${MD5_OF_WORKSPACE_ROOT}.
    Note: If you specify a different option from one to the next Bazel invocation
    for this value, you''ll likely start up a new, additional Bazel server. Bazel
    starts exactly one server per specified output base. Typically there is one output
    base per workspace - however, with this option you may have multiple output bases
    per workspace and thereby run multiple builds for the same client on the same
    machine concurrently. See ''bazel help shutdown'' on how to shutdown a Bazel server.'
  --bazelrc=: |-
    <path>The location of the user .bazelrc file containing default values of Bazel options. /dev/null indicates that all further `--bazelrc`s will be ignored, which is useful to disable the search for a user rc file, e.g. in release builds.
    This option can also be specified multiple times.
    E.g. with `--bazelrc=x.rc --bazelrc=y.rc --bazelrc=/dev/null --bazelrc=z.rc`,
      1) x.rc and y.rc are read.
      2) z.rc is ignored due to the prior /dev/null.
    If unspecified, Bazel uses the first .bazelrc file it finds in the following two locations: the workspace directory, then the user's home directory.
    Note: command line options will always supersede any option in bazelrc.
  --experimental_cgroup_parent=: <path>The cgroup where to start the bazel server
    as an absolute path. The server process will be started in the specified cgroup
    for each supported controller. For example, if the value of this flag is /build/bazel
    and the cpu and memory controllers are mounted respectively on /sys/fs/cgroup/cpu
    and /sys/fs/cgroup/memory, the server will be started in the cgroups /sys/fs/cgroup/cpu/build/bazel
    and /sys/fs/cgroup/memory/build/bazel.It is not an error if the specified cgroup
    is not writable for one or more of the controllers. This options does not have
    any effect on platforms that do not support cgroups.
  --digest_function: The hash function to use when computing file digests.
  --nolock_install_base: Whether the server should hold a lock on the install base
    while running, to prevent another server from attempting to garbage collect it.
  --invocation_policy: A base64-encoded-binary-serialized or text-formated invocation_policy.InvocationPolicy
    proto. Unlike other options, it is an error to specify --invocation_policy multiple
    times.
  --nofatal_event_bus_exceptions: Whether or not to exit if an exception is thrown
    by an internal EventBus handler. No-op if --fatal_async_exceptions_exclusions
    is available; that flag's behavior is preferentially used.
  --nobatch_cpu_scheduling: Only on Linux; use 'batch' CPU scheduling for Blaze. This
    policy is useful for workloads that are non-interactive, but do not want to lower
    their nice value. See 'man 2 sched_setscheduler'. If false, then Bazel does not
    perform a system call.
  --connect_timeout_secs: The amount of time the client waits for each attempt to
    connect to the server
  --noblock_for_lock: When --noblock_for_lock is passed, Bazel does not wait for a
    running command to complete, but instead exits immediately.
  --shutdown_on_low_sys_mem: If max_idle_secs is set and the build server has been
    idle for a while, shut down the server when the system is low on free RAM. Linux
    only.
  --io_nice_level=: '{-1,0,1,2,3,4,5,6,7}Only on Linux; set a level from 0-7 for best-effort
    IO scheduling using the sys_ioprio_set system call. 0 is highest priority, 7 is
    lowest. The anticipatory scheduler may only honor up to priority 4. If set to
    a negative value, then Bazel does not perform a system call.'
  --nobatch: If set, Bazel will be run as just a client process without a server,
    instead of in the standard client/server mode. This is deprecated and will be
    removed, please prefer shutting down the server explicitly if you wish to avoid
    lingering servers.
description: build system
commands:
- name: aquery
  flags:
    --noexecution_log_sort: Whether to sort the execution log, making it easier to
      compare logs across invocations. Set to false to avoid potentially significant
      CPU and memory usage at the end of the invocation, at the cost of producing
      the log in nondeterministic execution order. Only applies to the binary and
      JSON formats; the compact format is never sorted.
    --incompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --noexperimental_stats_summary: Enable a modernized summary of the build stats.
    --check_tests_up_to_date: Don't run tests, just check if they are up-to-date.  If
      all tests results are up-to-date, the testing completes successfully.  If any
      test needs to be built or executed, an error is reported and the testing fails.  This
      option implies --check_up_to_date behavior.
    --noexperimental_merged_skyframe_analysis_execution: If this flag is set, the
      analysis and execution phases of Skyframe are merged.
    --test_keep_going: When disabled, any non-passing test will cause the entire build
      to stop. By default all tests are run, even if some do not pass.
    --experimental_skyfocus_dump_keys: For debugging Skyfocus. Dump the focused SkyKeys
      (roots, leafs, focused deps, focused rdeps).
    --check_up_to_date: Don't perform the build, just check if it is up-to-date.  If
      all targets are up-to-date, the build completes successfully.  If any step needs
      to be executed an error is reported and the build fails.
    --nomaterialize_param_files: Writes intermediate parameter files to output tree
      even when using remote action execution. Useful when debugging actions. This
      is implied by --subcommands and --verbose_failures.
    --version_window_for_dirty_node_gc: Nodes that have been dirty for more than this
      many versions will be deleted from the graph upon the next update. Values must
      be non-negative long integers, or -1 indicating the maximum possible window.
    --test_summary: Specifies the desired format of the test summary. Valid values
      are 'short' to print information only about tests executed, 'terse', to print
      information only about unsuccessful tests that were run, 'detailed' to print
      detailed information about failed test cases, 'testcase' to print summary in
      test case resolution, do not print detailed information about failed test cases
      and 'none' to omit the summary.
    --local_resources: Set the number of resources available to Bazel. Takes in an
      assignment to a float or HOST_RAM/HOST_CPUS, optionally followed by [-|*]<float>
      (eg. memory=HOST_RAM*.5 to use half the available RAM). Can be used multiple
      times to specify multiple types of resources. Bazel will limit concurrently
      running actions based on the available resources and the resources required.
      Tests can declare the amount of resources they need by using a tag of the "resources:<resource
      name>:<amount>" format. Overrides resources specified by --local_{cpu|ram|extra}_resources.
    --rewind_lost_inputs: Whether to use action rewinding to recover from lost inputs.
    --include_file_write_contents: 'Include the file contents for the FileWrite, SourceSymlinkManifest,
      and RepoMappingManifest actions (potentially large). '
    --noexperimental_local_lockfree_output: When true, the local spawn runner doesn't
      lock the output tree during dynamic execution. Instead, spawns are allowed to
      execute until they are explicitly interrupted by a faster remote action.
    --build: Execute the build; this is the usual behaviour. Specifying --nobuild
      causes the build to stop before executing the build actions, returning zero
      iff the package loading and analysis phases completed successfully; this mode
      is useful for testing those phases.
    --noincompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --enforce_project_configs: If true, interactive builds may only pass the --scl_config
      build flag; they may not use any other build flags. --scl_config must be set
      to an officially suported project configuration. Supported configurations are
      defined in the target's PROJECT.scl, which can be found by walking up the target's
      packagge path. See b/324126745.
    --include_pruned_inputs: Includes action inputs that were pruned during action
      execution. Only affects actions that discover inputs and have been executed
      in a previous invocation. Only takes effect if --include_artifacts is also set.
    --aspects: Comma-separated list of aspects to be applied to top-level targets.
      In the list, if aspect some_aspect specifies required aspect providers via required_aspect_providers,
      some_aspect will run after every aspect that was mentioned before it in the
      aspects list whose advertised providers satisfy some_aspect required aspect
      providers. Moreover, some_aspect will run after all its required aspects specified
      by requires attribute. some_aspect will then have access to the values of those
      aspects' providers. <bzl-file-label>%<aspect_name>, for example '//tools:my_def.bzl%my_aspect',
      where 'my_aspect' is a top-level value from a file tools/my_def.bzl
    --nobuild_tests_only: If specified, only *_test and test_suite rules will be built
      and other targets specified on the command line will be ignored. By default
      everything that was requested will be built.
    --fetch: Allows the command to fetch external dependencies. If set to false, the
      command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --noexperimental_materialize_param_files_directly: If materializing param files,
      do so with direct writes to disk.
    --show_result: |-
      Show the results of the build.  For each target, state whether or not it was brought up-to-date, and if so, a list of output files that were built.  The printed files are convenient strings for copy+pasting to the shell, to execute them.
      This option requires an integer argument, which is the threshold number of targets above which result information is not printed. Thus zero causes suppression of the message and MAX_INT causes printing of the result to occur always. The default is one.
      If nothing was built for a target its results may be omitted to keep the output under the threshold.
    --noenforce_project_configs: If true, interactive builds may only pass the --scl_config
      build flag; they may not use any other build flags. --scl_config must be set
      to an officially suported project configuration. Supported configurations are
      defined in the target's PROJECT.scl, which can be found by walking up the target's
      packagge path. See b/324126745.
    --execution_log_sort: Whether to sort the execution log, making it easier to compare
      logs across invocations. Set to false to avoid potentially significant CPU and
      memory usage at the end of the invocation, at the cost of producing the log
      in nondeterministic execution order. Only applies to the binary and JSON formats;
      the compact format is never sorted.
    --output_tree_tracking: If set, tell the output service (if any) to track when
      files in the output tree have been modified externally (not by the build system).
      This should improve incremental build speed when an appropriate output service
      is enabled.
    --noexperimental_enable_skyfocus: If true, enable the use of --experimental_working_set
      to reduce Bazel's memory footprint for incremental builds. This feature is known
      as Skyfocus.
    --noinclude_artifacts: Includes names of the action inputs and outputs in the
      output (potentially large).
    --test_strategy: Specifies which strategy to use when running tests.
    --spawn_strategy: Specify how spawn actions are executed by default. Accepts a
      comma-separated list of strategies from highest to lowest priority. For each
      action Bazel picks the strategy with the highest priority that can execute the
      action. The default value is "remote,worker,sandboxed,local". See https://blog.bazel.build/2019/06/19/list-strategy.html
      for details.
    --nodiscard_analysis_cache: Discard the analysis cache immediately after the analysis
      phase completes. Reduces memory usage by ~10%, but makes further incremental
      builds slower.
    --experimental_skyfocus_dump_post_gc_stats: For debugging Skyfocus. If enabled,
      trigger manual GC before/after focusing to report heap sizes reductions. This
      will increase the Skyfocus latency.
    --noexperimental_build_event_expand_filesets: If true, expand Filesets in the
      BEP when presenting output files.
    --nokeep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --noexperimental_use_validation_aspect: Whether to run validation actions using
      aspect (for parallelism with tests).
    --nocheck_tests_up_to_date: Don't run tests, just check if they are up-to-date.  If
      all tests results are up-to-date, the testing completes successfully.  If any
      test needs to be built or executed, an error is reported and the testing fails.  This
      option implies --check_up_to_date behavior.
    --nobuild: Execute the build; this is the usual behaviour. Specifying --nobuild
      causes the build to stop before executing the build actions, returning zero
      iff the package loading and analysis phases completed successfully; this mode
      is useful for testing those phases.
    --experimental_extra_action_top_level_only: Deprecated in favor of aspects. Only
      schedules extra_actions for top level targets.
    --build_event_upload_max_retries: The maximum number of times Bazel should retry
      uploading a build event.
    --test_timeout_filters: Specifies a comma-separated list of test timeouts. Each
      timeout can be optionally preceded with '-' to specify excluded timeouts. Only
      those test targets will be found that contain at least one included timeout
      and do not contain any excluded timeouts. This option affects --build_tests_only
      behavior and the test command.
    --experimental_remote_analysis_cache_deadline: Deadline to use for remote analysis
      cache operations.
    -s, --subcommands: 'Display the subcommands executed during a build. Related flags:
      --execution_log_json_file, --execution_log_binary_file (for logging subcommands
      to a file in a tool-friendly format).'
    --deleted_packages: |-
      A comma-separated list of names of packages which the build system will consider non-existent, even if they are visible somewhere on the package path.
      Use this option when deleting a subpackage 'x/y' of an existing package 'x'.  For example, after deleting x/y/BUILD in your client, the build system may complain if it encounters a label '//x:y/z' if that is still provided by another package_path entry.  Specifying --deleted_packages x/y avoids this problem.
    --noinclude_pruned_inputs: Includes action inputs that were pruned during action
      execution. Only affects actions that discover inputs and have been executed
      in a previous invocation. Only takes effect if --include_artifacts is also set.
    --default_visibility: Default visibility for packages that don't set it explicitly
      ('public' or 'private').
    --nouse_action_cache: Whether to use the action cache
    --experimental_stream_log_file_uploads: Stream log file uploads directly to the
      remote storage rather than writing them to disk.
    --noexperimental_async_execution: If set to true, Bazel is allowed to run action
      in a virtual thread. The number of actions in flight is still capped with --jobs.
    --nooutput_tree_tracking: If set, tell the output service (if any) to track when
      files in the output tree have been modified externally (not by the build system).
      This should improve incremental build speed when an appropriate output service
      is enabled.
    --notest_keep_going: When disabled, any non-passing test will cause the entire
      build to stop. By default all tests are run, even if some do not pass.
    --noallow_analysis_cache_discard: If discarding the analysis cache due to a change
      in the build system, setting this option to false will cause bazel to exit,
      rather than continuing with the build. This option has no effect when 'discard_analysis_cache'
      is also set.
    --strategy_regexp: 'Override which spawn strategy should be used to execute spawn
      actions that have descriptions matching a certain regex_filter. See --per_file_copt
      for details onregex_filter matching. The last regex_filter that matches the
      description is used. This option overrides other flags for specifying strategy.
      Example: --strategy_regexp=//foo.*\\.cc,-//foo/bar=local means to run actions
      using local strategy if their descriptions match //foo.*.cc but not //foo/bar.
      Example: --strategy_regexp=''Compiling.*/bar=local  --strategy_regexp=Compiling=sandboxed
      will run ''Compiling //foo/bar/baz'' with the ''local'' strategy, but reversing
      the order would run it with ''sandboxed''. '
    --experimental_remote_analysis_cache_concurrency: Target concurrency for remote
      analysis caching RPCs.
    --nofetch: Allows the command to fetch external dependencies. If set to false,
      the command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --experimental_stats_summary: Enable a modernized summary of the build stats.
    --discard_analysis_cache: Discard the analysis cache immediately after the analysis
      phase completes. Reduces memory usage by ~10%, but makes further incremental
      builds slower.
    --package_path: A colon-separated list of where to look for packages. Elements
      beginning with '%workspace%' are relative to the enclosing workspace. If omitted
      or empty, the default is the output of 'bazel info default-package-path'.
    --compile_one_dependency: Compile a single dependency of the argument files. This
      is useful for syntax checking source files in IDEs, for example, by rebuilding
      a single target that depends on the source file to detect errors as early as
      possible in the edit/build/test cycle. This argument affects the way all non-flag
      arguments are interpreted; instead of being targets to build they are source
      filenames.  For each source filename an arbitrary target that depends on it
      will be built.
    --experimental_use_semaphore_for_jobs: If set to true, additionally use semaphore
      to limit number of concurrent jobs.
    --noinclude_param_files: 'Include the content of the param files used in the command
      (potentially large). Note: Enabling this flag will automatically enable the
      --include_commandline flag.'
    --experimental_build_event_output_group_mode: 'Specify how an output group''s
      files will be represented in TargetComplete/AspectComplete BEP events. Values
      are an assignment of an output group name to one of ''NAMED_SET_OF_FILES_ONLY'',
      ''INLINE_ONLY'', or ''BOTH''. The default value is ''NAMED_SET_OF_FILES_ONLY''.
      If an output group is repeated, the final value to appear is used. The default
      value sets the mode for coverage artifacts to BOTH: --experimental_build_event_output_group_mode=baseline.lcov=both'
    --noexperimental_split_xml_generation: If this flag is set, and a test action
      does not generate a test.xml file, then Bazel uses a separate action to generate
      a dummy test.xml file containing the test log. Otherwise, Bazel generates a
      test.xml as part of the test action.
    --verbose_failures: If a command fails, print out the full command line.
    --legacy_globbing_threads: Number of threads to use for glob evaluation. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" means to use
      a reasonable value derived from the machine's hardware profile (e.g. the number
      of processors).
    --norun_validations: Whether to run validation actions as part of the build. See
      https://bazel.build/extending/rules#validation_actions
    --noverbose_failures: If a command fails, print out the full command line.
    --experimental_build_event_expand_filesets: If true, expand Filesets in the BEP
      when presenting output files.
    --incompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --noskip_incompatible_explicit_targets: 'Skip incompatible targets that are explicitly
      listed on the command line. By default, building such targets results in an
      error but they are silently skipped when this option is enabled. See: https://bazel.build/extending/platforms#skipping-incompatible-targets'
    --noexperimental_bep_target_summary: Whether to publish TargetSummary events.
    --nocompile_one_dependency: Compile a single dependency of the argument files.
      This is useful for syntax checking source files in IDEs, for example, by rebuilding
      a single target that depends on the source file to detect errors as early as
      possible in the edit/build/test cycle. This argument affects the way all non-flag
      arguments are interpreted; instead of being targets to build they are source
      filenames.  For each source filename an arbitrary target that depends on it
      will be built.
    --noexperimental_enable_critical_path_profiling: If set (the default), critical
      path profiling is enabled for the execution phase. This has a slight overhead
      in RAM and CPU, and may prevent Bazel from making certain aggressive RAM optimizations
      in some cases.
    --experimental_oom_sensitive_skyfunctions_semaphore_size: 'Sets the size of the
      semaphore used to prevent SkyFunctions with large peak memory requirement from
      OOM-ing blaze. A value of 0 indicates that no semaphore should be used. Example
      value: "HOST_CPUS*0.5".'
    --experimental_convenience_symlinks: |-
      This flag controls how the convenience symlinks (the symlinks that appear in the workspace after the build) will be managed. Possible values:
        normal (default): Each kind of convenience symlink will be created or deleted, as determined by the build.
        clean: All symlinks will be unconditionally deleted.
        ignore: Symlinks will not be created or cleaned up.
        log_only: Generate log messages as if 'normal' were passed, but don't actually perform any filesystem operations (useful for tools).
      Note that only symlinks whose names are generated by the current value of --symlink_prefix can be affected; if the prefix changes, any pre-existing symlinks will be left alone.
    --experimental_build_event_upload_retry_minimum_delay: 'Initial, minimum delay
      for exponential backoff retries when BEP upload fails. (exponent: 1.6)'
    --noanalyze: Execute the loading/analysis phase; this is the usual behaviour.
      Specifying --noanalyzecauses the build to stop before starting the loading/analysis
      phase, just doing target pattern parsing and returning zero iff that completed
      successfully; this mode is useful for testing.
    --experimental_skyframe_memory_dump: 'Dump the memory use of individual nodes
      in the Skyframe graph after the build. This option takes a number of flags separated
      by commas: ''json'' (no-op, that''s the only format), ''notransient'' (don''t
      traverse transient fields), ''noconfig'' (ignore objects related to configurations),
      ''noprecomputed'' (ignore precomputed values) and ''noworkspacestatus'' (ignore
      objects related to the workspace status machinery)'
    --experimental_run_bep_event_include_residue: Whether to include the command-line
      residue in run build events which could contain the residue. By default, the
      residue is not included in run command build events that could contain the residue.
    --experimental_max_directories_to_eagerly_visit_in_globbing: If non-negative,
      the first time a glob is evaluated in a package, the subdirectories of the package
      will be traversed in order to warm filesystem caches and compensate for lack
      of parallelism in globbing. At most this many directories will be visited.
    --verbose_explanations: Increases the verbosity of the explanations issued if
      --explain is enabled. Has no effect if --explain is not enabled.
    --materialize_param_files: Writes intermediate parameter files to output tree
      even when using remote action execution. Useful when debugging actions. This
      is implied by --subcommands and --verbose_failures.
    -j, --jobs: The number of concurrent jobs to run. Takes an integer, or a keyword
      ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed by an operation ([-|*]<float>)
      eg. "auto", "HOST_CPUS*.5". Values must be between 1 and 5000. Values above
      2500 may cause memory issues. "auto" calculates a reasonable default based on
      host resources.
    --experimental_extra_action_filter: Deprecated in favor of aspects. Filters set
      of targets to schedule extra_actions for.
    --experimental_split_xml_generation: If this flag is set, and a test action does
      not generate a test.xml file, then Bazel uses a separate action to generate
      a dummy test.xml file containing the test log. Otherwise, Bazel generates a
      test.xml as part of the test action.
    --experimental_process_wrapper_graceful_sigterm: When true, make the process-wrapper
      propagate SIGTERMs (used by the dynamic scheduler to stop process trees) to
      the subprocesses themselves, giving them the grace period in --local_termination_grace_seconds
      before forcibly sending a SIGKILL.
    --test_tag_filters: Specifies a comma-separated list of test tags. Each tag can
      be optionally preceded with '-' to specify excluded tags. Only those test targets
      will be found that contain at least one included tag and do not contain any
      excluded tags. This option affects --build_tests_only behavior and the test
      command.
    --symlink_prefix: 'The prefix that is prepended to any of the convenience symlinks
      that are created after a build. If omitted, the default value is the name of
      the build tool followed by a hyphen. If ''/'' is passed, then no symlinks are
      created and no warning is emitted. Warning: the special functionality for ''/''
      will be deprecated soon; use --experimental_convenience_symlinks=ignore instead.'
    --output_groups: A list of comma-separated output group names, each of which optionally
      prefixed by a + or a -. A group prefixed by + is added to the default set of
      output groups, while a group prefixed by - is removed from the default set.
      If at least one group is not prefixed, the default set of output groups is omitted.
      For example, --output_groups=+foo,+bar builds the union of the default set,
      foo, and bar, while --output_groups=foo,bar overrides the default set such that
      only foo and bar are built.
    --max_config_changes_to_show: When discarding the analysis cache due to a change
      in the build options, displays up to the given number of changed option names.
      If the number given is -1, all changed options will be displayed.
    --experimental_enable_critical_path_profiling: If set (the default), critical
      path profiling is enabled for the execution phase. This has a slight overhead
      in RAM and CPU, and may prevent Bazel from making certain aggressive RAM optimizations
      in some cases.
    --experimental_cpu_load_scheduling_window_size: The size of window during experimental
      scheduling of action based on CPU load. Make sense to define only when flag
      --experimental_cpu_load_scheduling is enabled.
    --incompatible_skip_genfiles_symlink: If set to true, the genfiles symlink will
      not be created. For more information, see https://github.com/bazelbuild/bazel/issues/8651
    --experimental_local_lockfree_output: When true, the local spawn runner doesn't
      lock the output tree during dynamic execution. Instead, spawns are allowed to
      execute until they are explicitly interrupted by a faster remote action.
    --noincompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --show_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --nobuild_manual_tests: Forces test targets tagged 'manual' to be built. 'manual'
      tests are excluded from processing. This option forces them to be built (but
      not executed).
    --test_lang_filters: Specifies a comma-separated list of test languages. Each
      language can be optionally preceded with '-' to specify excluded languages.
      Only those test targets will be found that are written in the specified languages.
      The name used for each language should be the same as the language prefix in
      the *_test rule, e.g. one of 'cc', 'java', 'py', etc. This option affects --build_tests_only
      behavior and the test command.
    --experimental_cpu_load_scheduling: Enables the experimental local execution scheduling
      based on CPU load, not estimation of actions one by one.  Experimental scheduling
      have showed the large benefit on a large local builds on a powerful machines
      with the large number of cores. Reccommended to use with --local_resources=cpu=HOST_CPUS
    --test_output: Specifies desired output mode. Valid values are 'summary' to output
      only test status summary, 'errors' to also print test logs for failed tests,
      'all' to print logs for all tests and 'streamed' to output logs for all tests
      in real time (this will force tests to be executed locally one at a time regardless
      of --test_strategy value).
    --run_validations: Whether to run validation actions as part of the build. See
      https://bazel.build/extending/rules#validation_actions
    --experimental_async_execution: If set to true, Bazel is allowed to run action
      in a virtual thread. The number of actions in flight is still capped with --jobs.
    --execution_log_binary_file: 'Log the executed spawns into this file as length-delimited
      SpawnExec protos, according to src/main/protobuf/spawn.proto. Prefer --execution_log_compact_file,
      which is significantly smaller and cheaper to produce. Related flags: --execution_log_compact_file
      (compact format; mutually exclusive), --execution_log_json_file (text JSON format;
      mutually exclusive), --execution_log_sort (whether to sort the execution log),
      --subcommands (for displaying subcommands in terminal output).'
    --nocheck_up_to_date: Don't perform the build, just check if it is up-to-date.  If
      all targets are up-to-date, the build completes successfully.  If any step needs
      to be executed an error is reported and the build fails.
    --legacy_important_outputs: Use this to suppress generation of the legacy important_outputs
      field in the TargetComplete event. important_outputs are required for Bazel
      to ResultStore/BTX integration.
    --cache_computed_file_digests: If greater than 0, configures Bazel to cache file
      digests in memory based on their metadata instead of recomputing the digests
      from disk every time they are needed. Setting this to 0 ensures correctness
      because not all file changes can be noted from file metadata. When not 0, the
      number indicates the size of the cache as the number of file digests to be cached.
    --include_commandline: Includes the content of the action command lines in the
      output (potentially large).
    --experimental_working_set: The working set for Skyfocus. Specify as comma-separated
      workspace root-relative paths. This is a stateful flag. Defining a working set
      persists it for subsequent invocations, until it is redefined with a new set.
    --strategy: Specify how to distribute compilation of other spawn actions. Accepts
      a comma-separated list of strategies from highest to lowest priority. For each
      action Bazel picks the strategy with the highest priority that can execute the
      action. The default value is "remote,worker,sandboxed,local". This flag overrides
      the values set by --spawn_strategy (and --genrule_strategy if used with mnemonic
      Genrule). See https://blog.bazel.build/2019/06/19/list-strategy.html for details.
    --experimental_bep_target_summary: Whether to publish TargetSummary events.
    --build_tests_only: If specified, only *_test and test_suite rules will be built
      and other targets specified on the command line will be ignored. By default
      everything that was requested will be built.
    --allow_analysis_cache_discard: If discarding the analysis cache due to a change
      in the build system, setting this option to false will cause bazel to exit,
      rather than continuing with the build. This option has no effect when 'discard_analysis_cache'
      is also set.
    --local_cpu_resources: Explicitly set the total number of local CPU cores available
      to Bazel to spend on build actions executed locally. Takes an integer, or "HOST_CPUS",
      optionally followed by [-|*]<float> (eg. HOST_CPUS*.5 to use half the available
      CPU cores). By default, ("HOST_CPUS"), Bazel will query system configuration
      to estimate the number of CPU cores available.
    --noshow_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --noexperimental_cpu_load_scheduling: Enables the experimental local execution
      scheduling based on CPU load, not estimation of actions one by one.  Experimental
      scheduling have showed the large benefit on a large local builds on a powerful
      machines with the large number of cores. Reccommended to use with --local_resources=cpu=HOST_CPUS
    --noexperimental_stream_log_file_uploads: Stream log file uploads directly to
      the remote storage rather than writing them to disk.
    --noexperimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --allowed_local_actions_regex: A regex whitelist for action types which may be
      run locally. If unset, all actions are allowed to execute locally
    --experimental_fsvc_threads: The number of threads that are used by the FileSystemValueChecker.
    --serialized_frontier_profile: Dump a profile of serialized frontier bytes. Specifies
      the output path.
    --noexperimental_build_event_fully_resolve_fileset_symlinks: If true, fully resolve
      relative Fileset symlinks in the BEP when presenting output files. Requires
      --experimental_build_event_expand_filesets.
    --genrule_strategy: Specify how to execute genrules. This flag will be phased
      out. Instead, use --spawn_strategy=<value> to control all actions or --strategy=Genrule=<value>
      to control genrules only.
    --experimental_skymeld_analysis_overlap_percentage: The value represents the %
      of the analysis phase which will be overlapped with the execution phase. A value
      of x means Skyframe will queue up execution tasks and wait until there's x%
      of the top level target left to be analyzed before allowing them to launch.
      When the value is 0%, we'd wait for all analysis to finish before executing
      (no overlap). When it's 100%, the phases are free to overlap as much as they
      can.
    --aspects_parameters: Specifies the values of the command-line aspects parameters.
      Each parameter value is specified via <param_name>=<param_value>, for example
      'my_param=my_val' where 'my_param' is a parameter of some aspect in --aspects
      list or required by an aspect in the list. This option can be used multiple
      times. However, it is not allowed to assign values to the same parameter more
      than once.
    --progress_report_interval: The number of seconds to wait between reports on still
      running jobs. The default value 0 means the first report will be printed after
      10 seconds, then 30 seconds and after that progress is reported once every minute.
      When --curses is enabled, progress is reported every second.
    --test_size_filters: Specifies a comma-separated list of test sizes. Each size
      can be optionally preceded with '-' to specify excluded sizes. Only those test
      targets will be found that contain at least one included size and do not contain
      any excluded sizes. This option affects --build_tests_only behavior and the
      test command.
    --noexperimental_convenience_symlinks_bep_event: This flag controls whether or
      not we will post the build eventConvenienceSymlinksIdentified to the BuildEventProtocol.
      If the value is true, the BuildEventProtocol will have an entry for convenienceSymlinksIdentified,
      listing all of the convenience symlinks created in your workspace. If false,
      then the convenienceSymlinksIdentified entry in the BuildEventProtocol will
      be empty.
    --skyframe_state: 'Without performing extra analysis, dump the current Action
      Graph from Skyframe. Note: Specifying a target with --skyframe_state is currently
      not supported. This flag is only available with --output=proto or --output=textproto.'
    --experimental_remote_analysis_cache: The URL for the remote analysis caching
      backend.
    --noexperimental_skyfocus_dump_post_gc_stats: For debugging Skyfocus. If enabled,
      trigger manual GC before/after focusing to report heap sizes reductions. This
      will increase the Skyfocus latency.
    --flaky_test_attempts: 'Each test will be retried up to the specified number of
      times in case of any test failure. Tests that required more than one attempt
      to pass are marked as ''FLAKY'' in the test summary. Normally the value specified
      is just an integer or the string ''default''. If an integer, then all tests
      will be run up to N times. If ''default'', then only a single test attempt will
      be made for regular tests and three for tests marked explicitly as flaky by
      their rule (flaky=1 attribute). Alternate syntax: regex_filter@flaky_test_attempts.
      Where flaky_test_attempts is as above and regex_filter stands for a list of
      include and exclude regular expression patterns (Also see --runs_per_test).
      Example: --flaky_test_attempts=//foo/.*,-//foo/bar/.*@3 deflakes all tests in
      //foo/ except those under foo/bar three times. This option can be passed multiple
      times. The most recently passed argument that matches takes precedence. If nothing
      matches, behavior is as if ''default'' above.'
    --experimental_local_retries_on_crash: Number of times to retry a local action
      when we detect that it crashed. This exists to workaround a bug in OSXFUSE which
      is tickled by the use of the dynamic scheduler and --experimental_local_lockfree_output
      due to constant process churn. The bug can be triggered by a cancelled process
      that ran *before* the process we are trying to run, introducing corruption in
      its file reads.
    --local_ram_resources: Explicitly set the total amount of local host RAM (in MB)
      available to Bazel to spend on build actions executed locally. Takes an integer,
      or "HOST_RAM", optionally followed by [-|*]<float> (eg. HOST_RAM*.5 to use half
      the available RAM). By default, ("HOST_RAM*.67"), Bazel will query system configuration
      to estimate the amount of RAM available and will use 67% of it.
    --experimental_use_validation_aspect: Whether to run validation actions using
      aspect (for parallelism with tests).
    -k, --keep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --noexperimental_run_bep_event_include_residue: Whether to include the command-line
      residue in run build events which could contain the residue. By default, the
      residue is not included in run command build events that could contain the residue.
    --analyze: Execute the loading/analysis phase; this is the usual behaviour. Specifying
      --noanalyzecauses the build to stop before starting the loading/analysis phase,
      just doing target pattern parsing and returning zero iff that completed successfully;
      this mode is useful for testing.
    --output: 'The format in which the aquery results should be printed. Allowed values
      for aquery are: text, textproto, proto, streamed_proto, jsonproto.'
    --execution_log_json_file: 'Log the executed spawns into this file as newline-delimited
      JSON representations of SpawnExec protos, according to src/main/protobuf/spawn.proto.
      Prefer --execution_log_compact_file, which is significantly smaller and cheaper
      to produce. Related flags: --execution_log_compact_file (compact format; mutually
      exclusive), --execution_log_binary_file (binary protobuf format; mutually exclusive),
      --execution_log_sort (whether to sort the execution log), --subcommands (for
      displaying subcommands in terminal output).'
    --noinclude_commandline: Includes the content of the action command lines in the
      output (potentially large).
    --explain: Causes the build system to explain each executed step of the build.
      The explanation is written to the specified log file.
    --skip_incompatible_explicit_targets: 'Skip incompatible targets that are explicitly
      listed on the command line. By default, building such targets results in an
      error but they are silently skipped when this option is enabled. See: https://bazel.build/extending/platforms#skipping-incompatible-targets'
    --include_param_files: 'Include the content of the param files used in the command
      (potentially large). Note: Enabling this flag will automatically enable the
      --include_commandline flag.'
    --experimental_convenience_symlinks_bep_event: This flag controls whether or not
      we will post the build eventConvenienceSymlinksIdentified to the BuildEventProtocol.
      If the value is true, the BuildEventProtocol will have an entry for convenienceSymlinksIdentified,
      listing all of the convenience symlinks created in your workspace. If false,
      then the convenienceSymlinksIdentified entry in the BuildEventProtocol will
      be empty.
    --local_termination_grace_seconds: Time to wait between terminating a local process
      due to timeout and forcefully shutting it down.
    --noexpand_test_suites: 'Expand test_suite targets into their constituent tests
      before analysis. When this flag is turned on (the default), negative target
      patterns will apply to the tests belonging to the test suite, otherwise they
      will not. Turning off this flag is useful when top-level aspects are applied
      at command line: then they can analyze test_suite targets.'
    --directory_creation_cache: Describes the cache used to store known regular directories
      as they're created. Parent directories of output files are created on-demand
      during action execution.
    --output_filter: Only shows warnings and action outputs for rules with a name
      matching the provided regular expression.
    --nolegacy_important_outputs: Use this to suppress generation of the legacy important_outputs
      field in the TargetComplete event. important_outputs are required for Bazel
      to ResultStore/BTX integration.
    --noexperimental_extra_action_top_level_only: Deprecated in favor of aspects.
      Only schedules extra_actions for top level targets.
    --experimental_materialize_param_files_directly: If materializing param files,
      do so with direct writes to disk.
    --noverbose_explanations: Increases the verbosity of the explanations issued if
      --explain is enabled. Has no effect if --explain is not enabled.
    --experimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --use_action_cache: Whether to use the action cache
    --noskyframe_state: 'Without performing extra analysis, dump the current Action
      Graph from Skyframe. Note: Specifying a target with --skyframe_state is currently
      not supported. This flag is only available with --output=proto or --output=textproto.'
    --noexperimental_skyframe_target_pattern_evaluator: Use the Skyframe-based target
      pattern evaluator; implies --experimental_interleave_loading_and_analysis.
    --experimental_build_event_upload_strategy: Selects how to upload artifacts referenced
      in the build event protocol.
    --local_extra_resources: Set the number of extra resources available to Bazel.
      Takes in a string-float pair. Can be used multiple times to specify multiple
      types of extra resources. Bazel will limit concurrently running actions based
      on the available extra resources and the extra resources required. Tests can
      declare the amount of extra resources they need by using a tag of the "resources:<resoucename>:<amount>"
      format. Available CPU, RAM and resources cannot be set with this flag.
    --loading_phase_threads: Number of parallel threads to use for the loading/analysis
      phase.Takes an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally
      followed by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" sets
      a reasonable default based on host resources. Must be at least 1.
    --experimental_remote_cache_eviction_retries: The maximum number of attempts to
      retry if the build encountered a transient remote cache error that would otherwise
      fail the build. Applies for example when artifacts are evicted from the remote
      cache, or in certain cache failure conditions. A non-zero value will implicitly
      set --incompatible_remote_use_new_exit_code_for_lost_inputs to true. A new invocation
      id will be generated for each attempt. If you generate invocation id and provide
      it to Bazel with --invocation_id, you should not use this flag. Instead, set
      flag --incompatible_remote_use_new_exit_code_for_lost_inputs and check for the
      exit code 39.
    --noinclude_file_write_contents: 'Include the file contents for the FileWrite,
      SourceSymlinkManifest, and RepoMappingManifest actions (potentially large). '
    --experimental_remote_analysis_cache_mode: The transport direction for the remote
      analysis cache.
    --expand_test_suites: 'Expand test_suite targets into their constituent tests
      before analysis. When this flag is turned on (the default), negative target
      patterns will apply to the tests belonging to the test suite, otherwise they
      will not. Turning off this flag is useful when top-level aspects are applied
      at command line: then they can analyze test_suite targets.'
    --experimental_skyframe_cpu_heavy_skykeys_thread_pool_size: 'If set to a positive
      value (e.g. "HOST_CPUS*1.5"), Skyframe will run the loading/analysis phase with
      2 separate thread pools: 1 with <value> threads (ideally close to HOST_CPUS)
      reserved for CPU-heavy SkyKeys, and 1 "standard" thread pool (whose size is
      controlled by --loading_phase_threads) for the rest.'
    --max_test_output_bytes: Specifies maximum per-test-log size that can be emitted
      when --test_output is 'errors' or 'all'. Useful for avoiding overwhelming the
      output with excessively noisy test output. The test header is included in the
      log size. Negative values imply no limit. Output is all or nothing.
    --experimental_merged_skyframe_analysis_execution: If this flag is set, the analysis
      and execution phases of Skyframe are merged.
    --target_pattern_file: If set, build will read patterns from the file named here,
      rather than on the command line. It is an error to specify a file here as well
      as command-line patterns.
    --noexperimental_process_wrapper_graceful_sigterm: When true, make the process-wrapper
      propagate SIGTERMs (used by the dynamic scheduler to stop process trees) to
      the subprocesses themselves, giving them the grace period in --local_termination_grace_seconds
      before forcibly sending a SIGKILL.
    --experimental_skyfocus_handling_strategy: Strategies for Skyfocus to handle changes
      outside of the working set.
    --incompatible_remote_use_new_exit_code_for_lost_inputs: If set to true, Bazel
      will use new exit code 39 instead of 34 if remote cacheerrors, including cache
      evictions, cause the build to fail.
    --experimental_skyframe_target_pattern_evaluator: Use the Skyframe-based target
      pattern evaluator; implies --experimental_interleave_loading_and_analysis.
    --noincompatible_skip_genfiles_symlink: If set to true, the genfiles symlink will
      not be created. For more information, see https://github.com/bazelbuild/bazel/issues/8651
    --experimental_enable_skyfocus: If true, enable the use of --experimental_working_set
      to reduce Bazel's memory footprint for incremental builds. This feature is known
      as Skyfocus.
    --build_manual_tests: Forces test targets tagged 'manual' to be built. 'manual'
      tests are excluded from processing. This option forces them to be built (but
      not executed).
    --experimental_aquery_dump_after_build_format: 'Writes the state of Skyframe (which
      includes previous invocations on this blaze instance as well) after a build.
      Output is streamed remotely unless local output is requested with --experimental_aquery_dump_after_build_output_file.  Does
      not honor aquery flags for --include_*, but uses the same defaults, except for
      --include_commandline=false. Possible output formats: proto|streamed_proto|textproto|jsonproto.
      Using this will disable Skymeld.'
    --build_tag_filters: Specifies a comma-separated list of tags. Each tag can be
      optionally preceded with '-' to specify excluded tags. Only those targets will
      be built that contain at least one included tag and do not contain any excluded
      tags. This option does not affect the set of tests executed with the 'test'
      command; those are be governed by the test filtering options, for example '--test_tag_filters'
    --noexperimental_use_semaphore_for_jobs: If set to true, additionally use semaphore
      to limit number of concurrent jobs.
    --include_artifacts: Includes names of the action inputs and outputs in the output
      (potentially large).
    --experimental_aquery_dump_after_build_output_file: Specify the output file for
      the aquery dump after a build. Use in conjunction with --experimental_aquery_dump_after_build_format.
      The path provided is relative to Bazel's output base, unless it's an absolute
      path. Using this will disable Skymeld.
    --local_test_jobs: The max number of local test jobs to run concurrently. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". 0 means local resources
      will limit the number of local test jobs to run concurrently instead. Setting
      this greater than the value for --jobs is ineffectual.
    --norewind_lost_inputs: Whether to use action rewinding to recover from lost inputs.
    --test_tmpdir: Specifies the base temporary directory for 'bazel test' to use.
    --experimental_build_event_fully_resolve_fileset_symlinks: If true, fully resolve
      relative Fileset symlinks in the BEP when presenting output files. Requires
      --experimental_build_event_expand_filesets.
    --noincompatible_remote_use_new_exit_code_for_lost_inputs: If set to true, Bazel
      will use new exit code 39 instead of 34 if remote cacheerrors, including cache
      evictions, cause the build to fail.
    --execution_log_compact_file: 'Log the executed spawns into this file as length-delimited
      ExecLogEntry protos, according to src/main/protobuf/spawn.proto. The entire
      file is zstd compressed. Related flags: --execution_log_binary_file (binary
      protobuf format; mutually exclusive), --execution_log_json_file (text JSON format;
      mutually exclusive), --subcommands (for displaying subcommands in terminal output).'
    --hide_aspect_results: Comma-separated list of aspect names to not display in
      results (see --show_result). Useful for keeping aspects added by wrappers which
      are typically not interesting to end users out of console output.
  description: Analyzes the given targets and queries the action graph.
- name: build
  flags:
    --noexecution_log_sort: Whether to sort the execution log, making it easier to
      compare logs across invocations. Set to false to avoid potentially significant
      CPU and memory usage at the end of the invocation, at the cost of producing
      the log in nondeterministic execution order. Only applies to the binary and
      JSON formats; the compact format is never sorted.
    --incompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --noexperimental_stats_summary: Enable a modernized summary of the build stats.
    --check_tests_up_to_date: Don't run tests, just check if they are up-to-date.  If
      all tests results are up-to-date, the testing completes successfully.  If any
      test needs to be built or executed, an error is reported and the testing fails.  This
      option implies --check_up_to_date behavior.
    --noexperimental_merged_skyframe_analysis_execution: If this flag is set, the
      analysis and execution phases of Skyframe are merged.
    --test_keep_going: When disabled, any non-passing test will cause the entire build
      to stop. By default all tests are run, even if some do not pass.
    --check_up_to_date: Don't perform the build, just check if it is up-to-date.  If
      all targets are up-to-date, the build completes successfully.  If any step needs
      to be executed an error is reported and the build fails.
    --experimental_skyfocus_dump_keys: For debugging Skyfocus. Dump the focused SkyKeys
      (roots, leafs, focused deps, focused rdeps).
    --nomaterialize_param_files: Writes intermediate parameter files to output tree
      even when using remote action execution. Useful when debugging actions. This
      is implied by --subcommands and --verbose_failures.
    --test_summary: Specifies the desired format of the test summary. Valid values
      are 'short' to print information only about tests executed, 'terse', to print
      information only about unsuccessful tests that were run, 'detailed' to print
      detailed information about failed test cases, 'testcase' to print summary in
      test case resolution, do not print detailed information about failed test cases
      and 'none' to omit the summary.
    --version_window_for_dirty_node_gc: Nodes that have been dirty for more than this
      many versions will be deleted from the graph upon the next update. Values must
      be non-negative long integers, or -1 indicating the maximum possible window.
    --rewind_lost_inputs: Whether to use action rewinding to recover from lost inputs.
    --local_resources: Set the number of resources available to Bazel. Takes in an
      assignment to a float or HOST_RAM/HOST_CPUS, optionally followed by [-|*]<float>
      (eg. memory=HOST_RAM*.5 to use half the available RAM). Can be used multiple
      times to specify multiple types of resources. Bazel will limit concurrently
      running actions based on the available resources and the resources required.
      Tests can declare the amount of resources they need by using a tag of the "resources:<resource
      name>:<amount>" format. Overrides resources specified by --local_{cpu|ram|extra}_resources.
    --build: Execute the build; this is the usual behaviour. Specifying --nobuild
      causes the build to stop before executing the build actions, returning zero
      iff the package loading and analysis phases completed successfully; this mode
      is useful for testing those phases.
    --noexperimental_local_lockfree_output: When true, the local spawn runner doesn't
      lock the output tree during dynamic execution. Instead, spawns are allowed to
      execute until they are explicitly interrupted by a faster remote action.
    --noincompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --enforce_project_configs: If true, interactive builds may only pass the --scl_config
      build flag; they may not use any other build flags. --scl_config must be set
      to an officially suported project configuration. Supported configurations are
      defined in the target's PROJECT.scl, which can be found by walking up the target's
      packagge path. See b/324126745.
    --aspects: Comma-separated list of aspects to be applied to top-level targets.
      In the list, if aspect some_aspect specifies required aspect providers via required_aspect_providers,
      some_aspect will run after every aspect that was mentioned before it in the
      aspects list whose advertised providers satisfy some_aspect required aspect
      providers. Moreover, some_aspect will run after all its required aspects specified
      by requires attribute. some_aspect will then have access to the values of those
      aspects' providers. <bzl-file-label>%<aspect_name>, for example '//tools:my_def.bzl%my_aspect',
      where 'my_aspect' is a top-level value from a file tools/my_def.bzl
    --show_result: |-
      Show the results of the build.  For each target, state whether or not it was brought up-to-date, and if so, a list of output files that were built.  The printed files are convenient strings for copy+pasting to the shell, to execute them.
      This option requires an integer argument, which is the threshold number of targets above which result information is not printed. Thus zero causes suppression of the message and MAX_INT causes printing of the result to occur always. The default is one.
      If nothing was built for a target its results may be omitted to keep the output under the threshold.
    --noexperimental_materialize_param_files_directly: If materializing param files,
      do so with direct writes to disk.
    --fetch: Allows the command to fetch external dependencies. If set to false, the
      command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --nobuild_tests_only: If specified, only *_test and test_suite rules will be built
      and other targets specified on the command line will be ignored. By default
      everything that was requested will be built.
    --noenforce_project_configs: If true, interactive builds may only pass the --scl_config
      build flag; they may not use any other build flags. --scl_config must be set
      to an officially suported project configuration. Supported configurations are
      defined in the target's PROJECT.scl, which can be found by walking up the target's
      packagge path. See b/324126745.
    --output_tree_tracking: If set, tell the output service (if any) to track when
      files in the output tree have been modified externally (not by the build system).
      This should improve incremental build speed when an appropriate output service
      is enabled.
    --execution_log_sort: Whether to sort the execution log, making it easier to compare
      logs across invocations. Set to false to avoid potentially significant CPU and
      memory usage at the end of the invocation, at the cost of producing the log
      in nondeterministic execution order. Only applies to the binary and JSON formats;
      the compact format is never sorted.
    --noexperimental_enable_skyfocus: If true, enable the use of --experimental_working_set
      to reduce Bazel's memory footprint for incremental builds. This feature is known
      as Skyfocus.
    --spawn_strategy: Specify how spawn actions are executed by default. Accepts a
      comma-separated list of strategies from highest to lowest priority. For each
      action Bazel picks the strategy with the highest priority that can execute the
      action. The default value is "remote,worker,sandboxed,local". See https://blog.bazel.build/2019/06/19/list-strategy.html
      for details.
    --test_strategy: Specifies which strategy to use when running tests.
    --nodiscard_analysis_cache: Discard the analysis cache immediately after the analysis
      phase completes. Reduces memory usage by ~10%, but makes further incremental
      builds slower.
    --experimental_skyfocus_dump_post_gc_stats: For debugging Skyfocus. If enabled,
      trigger manual GC before/after focusing to report heap sizes reductions. This
      will increase the Skyfocus latency.
    --noexperimental_build_event_expand_filesets: If true, expand Filesets in the
      BEP when presenting output files.
    --noexperimental_use_validation_aspect: Whether to run validation actions using
      aspect (for parallelism with tests).
    --nokeep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --nobuild: Execute the build; this is the usual behaviour. Specifying --nobuild
      causes the build to stop before executing the build actions, returning zero
      iff the package loading and analysis phases completed successfully; this mode
      is useful for testing those phases.
    --nocheck_tests_up_to_date: Don't run tests, just check if they are up-to-date.  If
      all tests results are up-to-date, the testing completes successfully.  If any
      test needs to be built or executed, an error is reported and the testing fails.  This
      option implies --check_up_to_date behavior.
    --experimental_extra_action_top_level_only: Deprecated in favor of aspects. Only
      schedules extra_actions for top level targets.
    --build_event_upload_max_retries: The maximum number of times Bazel should retry
      uploading a build event.
    --test_timeout_filters: Specifies a comma-separated list of test timeouts. Each
      timeout can be optionally preceded with '-' to specify excluded timeouts. Only
      those test targets will be found that contain at least one included timeout
      and do not contain any excluded timeouts. This option affects --build_tests_only
      behavior and the test command.
    --experimental_remote_analysis_cache_deadline: Deadline to use for remote analysis
      cache operations.
    -s, --subcommands: 'Display the subcommands executed during a build. Related flags:
      --execution_log_json_file, --execution_log_binary_file (for logging subcommands
      to a file in a tool-friendly format).'
    --deleted_packages: |-
      A comma-separated list of names of packages which the build system will consider non-existent, even if they are visible somewhere on the package path.
      Use this option when deleting a subpackage 'x/y' of an existing package 'x'.  For example, after deleting x/y/BUILD in your client, the build system may complain if it encounters a label '//x:y/z' if that is still provided by another package_path entry.  Specifying --deleted_packages x/y avoids this problem.
    --nouse_action_cache: Whether to use the action cache
    --default_visibility: Default visibility for packages that don't set it explicitly
      ('public' or 'private').
    --noexperimental_async_execution: If set to true, Bazel is allowed to run action
      in a virtual thread. The number of actions in flight is still capped with --jobs.
    --experimental_stream_log_file_uploads: Stream log file uploads directly to the
      remote storage rather than writing them to disk.
    --nooutput_tree_tracking: If set, tell the output service (if any) to track when
      files in the output tree have been modified externally (not by the build system).
      This should improve incremental build speed when an appropriate output service
      is enabled.
    --notest_keep_going: When disabled, any non-passing test will cause the entire
      build to stop. By default all tests are run, even if some do not pass.
    --noallow_analysis_cache_discard: If discarding the analysis cache due to a change
      in the build system, setting this option to false will cause bazel to exit,
      rather than continuing with the build. This option has no effect when 'discard_analysis_cache'
      is also set.
    --strategy_regexp: 'Override which spawn strategy should be used to execute spawn
      actions that have descriptions matching a certain regex_filter. See --per_file_copt
      for details onregex_filter matching. The last regex_filter that matches the
      description is used. This option overrides other flags for specifying strategy.
      Example: --strategy_regexp=//foo.*\\.cc,-//foo/bar=local means to run actions
      using local strategy if their descriptions match //foo.*.cc but not //foo/bar.
      Example: --strategy_regexp=''Compiling.*/bar=local  --strategy_regexp=Compiling=sandboxed
      will run ''Compiling //foo/bar/baz'' with the ''local'' strategy, but reversing
      the order would run it with ''sandboxed''. '
    --experimental_remote_analysis_cache_concurrency: Target concurrency for remote
      analysis caching RPCs.
    --nofetch: Allows the command to fetch external dependencies. If set to false,
      the command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --experimental_stats_summary: Enable a modernized summary of the build stats.
    --package_path: A colon-separated list of where to look for packages. Elements
      beginning with '%workspace%' are relative to the enclosing workspace. If omitted
      or empty, the default is the output of 'bazel info default-package-path'.
    --discard_analysis_cache: Discard the analysis cache immediately after the analysis
      phase completes. Reduces memory usage by ~10%, but makes further incremental
      builds slower.
    --compile_one_dependency: Compile a single dependency of the argument files. This
      is useful for syntax checking source files in IDEs, for example, by rebuilding
      a single target that depends on the source file to detect errors as early as
      possible in the edit/build/test cycle. This argument affects the way all non-flag
      arguments are interpreted; instead of being targets to build they are source
      filenames.  For each source filename an arbitrary target that depends on it
      will be built.
    --experimental_use_semaphore_for_jobs: If set to true, additionally use semaphore
      to limit number of concurrent jobs.
    --verbose_failures: If a command fails, print out the full command line.
    --noexperimental_split_xml_generation: If this flag is set, and a test action
      does not generate a test.xml file, then Bazel uses a separate action to generate
      a dummy test.xml file containing the test log. Otherwise, Bazel generates a
      test.xml as part of the test action.
    --experimental_build_event_output_group_mode: 'Specify how an output group''s
      files will be represented in TargetComplete/AspectComplete BEP events. Values
      are an assignment of an output group name to one of ''NAMED_SET_OF_FILES_ONLY'',
      ''INLINE_ONLY'', or ''BOTH''. The default value is ''NAMED_SET_OF_FILES_ONLY''.
      If an output group is repeated, the final value to appear is used. The default
      value sets the mode for coverage artifacts to BOTH: --experimental_build_event_output_group_mode=baseline.lcov=both'
    --legacy_globbing_threads: Number of threads to use for glob evaluation. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" means to use
      a reasonable value derived from the machine's hardware profile (e.g. the number
      of processors).
    --norun_validations: Whether to run validation actions as part of the build. See
      https://bazel.build/extending/rules#validation_actions
    --noverbose_failures: If a command fails, print out the full command line.
    --experimental_build_event_expand_filesets: If true, expand Filesets in the BEP
      when presenting output files.
    --incompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --noskip_incompatible_explicit_targets: 'Skip incompatible targets that are explicitly
      listed on the command line. By default, building such targets results in an
      error but they are silently skipped when this option is enabled. See: https://bazel.build/extending/platforms#skipping-incompatible-targets'
    --noexperimental_bep_target_summary: Whether to publish TargetSummary events.
    --nocompile_one_dependency: Compile a single dependency of the argument files.
      This is useful for syntax checking source files in IDEs, for example, by rebuilding
      a single target that depends on the source file to detect errors as early as
      possible in the edit/build/test cycle. This argument affects the way all non-flag
      arguments are interpreted; instead of being targets to build they are source
      filenames.  For each source filename an arbitrary target that depends on it
      will be built.
    --noexperimental_enable_critical_path_profiling: If set (the default), critical
      path profiling is enabled for the execution phase. This has a slight overhead
      in RAM and CPU, and may prevent Bazel from making certain aggressive RAM optimizations
      in some cases.
    --experimental_convenience_symlinks: |-
      This flag controls how the convenience symlinks (the symlinks that appear in the workspace after the build) will be managed. Possible values:
        normal (default): Each kind of convenience symlink will be created or deleted, as determined by the build.
        clean: All symlinks will be unconditionally deleted.
        ignore: Symlinks will not be created or cleaned up.
        log_only: Generate log messages as if 'normal' were passed, but don't actually perform any filesystem operations (useful for tools).
      Note that only symlinks whose names are generated by the current value of --symlink_prefix can be affected; if the prefix changes, any pre-existing symlinks will be left alone.
    --experimental_oom_sensitive_skyfunctions_semaphore_size: 'Sets the size of the
      semaphore used to prevent SkyFunctions with large peak memory requirement from
      OOM-ing blaze. A value of 0 indicates that no semaphore should be used. Example
      value: "HOST_CPUS*0.5".'
    --experimental_build_event_upload_retry_minimum_delay: 'Initial, minimum delay
      for exponential backoff retries when BEP upload fails. (exponent: 1.6)'
    --noanalyze: Execute the loading/analysis phase; this is the usual behaviour.
      Specifying --noanalyzecauses the build to stop before starting the loading/analysis
      phase, just doing target pattern parsing and returning zero iff that completed
      successfully; this mode is useful for testing.
    --experimental_skyframe_memory_dump: 'Dump the memory use of individual nodes
      in the Skyframe graph after the build. This option takes a number of flags separated
      by commas: ''json'' (no-op, that''s the only format), ''notransient'' (don''t
      traverse transient fields), ''noconfig'' (ignore objects related to configurations),
      ''noprecomputed'' (ignore precomputed values) and ''noworkspacestatus'' (ignore
      objects related to the workspace status machinery)'
    --experimental_run_bep_event_include_residue: Whether to include the command-line
      residue in run build events which could contain the residue. By default, the
      residue is not included in run command build events that could contain the residue.
    --verbose_explanations: Increases the verbosity of the explanations issued if
      --explain is enabled. Has no effect if --explain is not enabled.
    --experimental_max_directories_to_eagerly_visit_in_globbing: If non-negative,
      the first time a glob is evaluated in a package, the subdirectories of the package
      will be traversed in order to warm filesystem caches and compensate for lack
      of parallelism in globbing. At most this many directories will be visited.
    --materialize_param_files: Writes intermediate parameter files to output tree
      even when using remote action execution. Useful when debugging actions. This
      is implied by --subcommands and --verbose_failures.
    -j, --jobs: The number of concurrent jobs to run. Takes an integer, or a keyword
      ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed by an operation ([-|*]<float>)
      eg. "auto", "HOST_CPUS*.5". Values must be between 1 and 5000. Values above
      2500 may cause memory issues. "auto" calculates a reasonable default based on
      host resources.
    --experimental_extra_action_filter: Deprecated in favor of aspects. Filters set
      of targets to schedule extra_actions for.
    --experimental_split_xml_generation: If this flag is set, and a test action does
      not generate a test.xml file, then Bazel uses a separate action to generate
      a dummy test.xml file containing the test log. Otherwise, Bazel generates a
      test.xml as part of the test action.
    --experimental_process_wrapper_graceful_sigterm: When true, make the process-wrapper
      propagate SIGTERMs (used by the dynamic scheduler to stop process trees) to
      the subprocesses themselves, giving them the grace period in --local_termination_grace_seconds
      before forcibly sending a SIGKILL.
    --symlink_prefix: 'The prefix that is prepended to any of the convenience symlinks
      that are created after a build. If omitted, the default value is the name of
      the build tool followed by a hyphen. If ''/'' is passed, then no symlinks are
      created and no warning is emitted. Warning: the special functionality for ''/''
      will be deprecated soon; use --experimental_convenience_symlinks=ignore instead.'
    --test_tag_filters: Specifies a comma-separated list of test tags. Each tag can
      be optionally preceded with '-' to specify excluded tags. Only those test targets
      will be found that contain at least one included tag and do not contain any
      excluded tags. This option affects --build_tests_only behavior and the test
      command.
    --output_groups: A list of comma-separated output group names, each of which optionally
      prefixed by a + or a -. A group prefixed by + is added to the default set of
      output groups, while a group prefixed by - is removed from the default set.
      If at least one group is not prefixed, the default set of output groups is omitted.
      For example, --output_groups=+foo,+bar builds the union of the default set,
      foo, and bar, while --output_groups=foo,bar overrides the default set such that
      only foo and bar are built.
    --max_config_changes_to_show: When discarding the analysis cache due to a change
      in the build options, displays up to the given number of changed option names.
      If the number given is -1, all changed options will be displayed.
    --experimental_cpu_load_scheduling_window_size: The size of window during experimental
      scheduling of action based on CPU load. Make sense to define only when flag
      --experimental_cpu_load_scheduling is enabled.
    --experimental_enable_critical_path_profiling: If set (the default), critical
      path profiling is enabled for the execution phase. This has a slight overhead
      in RAM and CPU, and may prevent Bazel from making certain aggressive RAM optimizations
      in some cases.
    --incompatible_skip_genfiles_symlink: If set to true, the genfiles symlink will
      not be created. For more information, see https://github.com/bazelbuild/bazel/issues/8651
    --experimental_local_lockfree_output: When true, the local spawn runner doesn't
      lock the output tree during dynamic execution. Instead, spawns are allowed to
      execute until they are explicitly interrupted by a faster remote action.
    --show_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --noincompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --nobuild_manual_tests: Forces test targets tagged 'manual' to be built. 'manual'
      tests are excluded from processing. This option forces them to be built (but
      not executed).
    --test_output: Specifies desired output mode. Valid values are 'summary' to output
      only test status summary, 'errors' to also print test logs for failed tests,
      'all' to print logs for all tests and 'streamed' to output logs for all tests
      in real time (this will force tests to be executed locally one at a time regardless
      of --test_strategy value).
    --experimental_cpu_load_scheduling: Enables the experimental local execution scheduling
      based on CPU load, not estimation of actions one by one.  Experimental scheduling
      have showed the large benefit on a large local builds on a powerful machines
      with the large number of cores. Reccommended to use with --local_resources=cpu=HOST_CPUS
    --test_lang_filters: Specifies a comma-separated list of test languages. Each
      language can be optionally preceded with '-' to specify excluded languages.
      Only those test targets will be found that are written in the specified languages.
      The name used for each language should be the same as the language prefix in
      the *_test rule, e.g. one of 'cc', 'java', 'py', etc. This option affects --build_tests_only
      behavior and the test command.
    --experimental_async_execution: If set to true, Bazel is allowed to run action
      in a virtual thread. The number of actions in flight is still capped with --jobs.
    --run_validations: Whether to run validation actions as part of the build. See
      https://bazel.build/extending/rules#validation_actions
    --nocheck_up_to_date: Don't perform the build, just check if it is up-to-date.  If
      all targets are up-to-date, the build completes successfully.  If any step needs
      to be executed an error is reported and the build fails.
    --execution_log_binary_file: 'Log the executed spawns into this file as length-delimited
      SpawnExec protos, according to src/main/protobuf/spawn.proto. Prefer --execution_log_compact_file,
      which is significantly smaller and cheaper to produce. Related flags: --execution_log_compact_file
      (compact format; mutually exclusive), --execution_log_json_file (text JSON format;
      mutually exclusive), --execution_log_sort (whether to sort the execution log),
      --subcommands (for displaying subcommands in terminal output).'
    --legacy_important_outputs: Use this to suppress generation of the legacy important_outputs
      field in the TargetComplete event. important_outputs are required for Bazel
      to ResultStore/BTX integration.
    --cache_computed_file_digests: If greater than 0, configures Bazel to cache file
      digests in memory based on their metadata instead of recomputing the digests
      from disk every time they are needed. Setting this to 0 ensures correctness
      because not all file changes can be noted from file metadata. When not 0, the
      number indicates the size of the cache as the number of file digests to be cached.
    --strategy: Specify how to distribute compilation of other spawn actions. Accepts
      a comma-separated list of strategies from highest to lowest priority. For each
      action Bazel picks the strategy with the highest priority that can execute the
      action. The default value is "remote,worker,sandboxed,local". This flag overrides
      the values set by --spawn_strategy (and --genrule_strategy if used with mnemonic
      Genrule). See https://blog.bazel.build/2019/06/19/list-strategy.html for details.
    --experimental_working_set: The working set for Skyfocus. Specify as comma-separated
      workspace root-relative paths. This is a stateful flag. Defining a working set
      persists it for subsequent invocations, until it is redefined with a new set.
    --experimental_bep_target_summary: Whether to publish TargetSummary events.
    --build_tests_only: If specified, only *_test and test_suite rules will be built
      and other targets specified on the command line will be ignored. By default
      everything that was requested will be built.
    --allow_analysis_cache_discard: If discarding the analysis cache due to a change
      in the build system, setting this option to false will cause bazel to exit,
      rather than continuing with the build. This option has no effect when 'discard_analysis_cache'
      is also set.
    --local_cpu_resources: Explicitly set the total number of local CPU cores available
      to Bazel to spend on build actions executed locally. Takes an integer, or "HOST_CPUS",
      optionally followed by [-|*]<float> (eg. HOST_CPUS*.5 to use half the available
      CPU cores). By default, ("HOST_CPUS"), Bazel will query system configuration
      to estimate the number of CPU cores available.
    --noshow_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --noexperimental_cpu_load_scheduling: Enables the experimental local execution
      scheduling based on CPU load, not estimation of actions one by one.  Experimental
      scheduling have showed the large benefit on a large local builds on a powerful
      machines with the large number of cores. Reccommended to use with --local_resources=cpu=HOST_CPUS
    --noexperimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --noexperimental_stream_log_file_uploads: Stream log file uploads directly to
      the remote storage rather than writing them to disk.
    --experimental_fsvc_threads: The number of threads that are used by the FileSystemValueChecker.
    --allowed_local_actions_regex: A regex whitelist for action types which may be
      run locally. If unset, all actions are allowed to execute locally
    --serialized_frontier_profile: Dump a profile of serialized frontier bytes. Specifies
      the output path.
    --genrule_strategy: Specify how to execute genrules. This flag will be phased
      out. Instead, use --spawn_strategy=<value> to control all actions or --strategy=Genrule=<value>
      to control genrules only.
    --noexperimental_build_event_fully_resolve_fileset_symlinks: If true, fully resolve
      relative Fileset symlinks in the BEP when presenting output files. Requires
      --experimental_build_event_expand_filesets.
    --aspects_parameters: Specifies the values of the command-line aspects parameters.
      Each parameter value is specified via <param_name>=<param_value>, for example
      'my_param=my_val' where 'my_param' is a parameter of some aspect in --aspects
      list or required by an aspect in the list. This option can be used multiple
      times. However, it is not allowed to assign values to the same parameter more
      than once.
    --experimental_skymeld_analysis_overlap_percentage: The value represents the %
      of the analysis phase which will be overlapped with the execution phase. A value
      of x means Skyframe will queue up execution tasks and wait until there's x%
      of the top level target left to be analyzed before allowing them to launch.
      When the value is 0%, we'd wait for all analysis to finish before executing
      (no overlap). When it's 100%, the phases are free to overlap as much as they
      can.
    --progress_report_interval: The number of seconds to wait between reports on still
      running jobs. The default value 0 means the first report will be printed after
      10 seconds, then 30 seconds and after that progress is reported once every minute.
      When --curses is enabled, progress is reported every second.
    --noexperimental_convenience_symlinks_bep_event: This flag controls whether or
      not we will post the build eventConvenienceSymlinksIdentified to the BuildEventProtocol.
      If the value is true, the BuildEventProtocol will have an entry for convenienceSymlinksIdentified,
      listing all of the convenience symlinks created in your workspace. If false,
      then the convenienceSymlinksIdentified entry in the BuildEventProtocol will
      be empty.
    --test_size_filters: Specifies a comma-separated list of test sizes. Each size
      can be optionally preceded with '-' to specify excluded sizes. Only those test
      targets will be found that contain at least one included size and do not contain
      any excluded sizes. This option affects --build_tests_only behavior and the
      test command.
    --flaky_test_attempts: 'Each test will be retried up to the specified number of
      times in case of any test failure. Tests that required more than one attempt
      to pass are marked as ''FLAKY'' in the test summary. Normally the value specified
      is just an integer or the string ''default''. If an integer, then all tests
      will be run up to N times. If ''default'', then only a single test attempt will
      be made for regular tests and three for tests marked explicitly as flaky by
      their rule (flaky=1 attribute). Alternate syntax: regex_filter@flaky_test_attempts.
      Where flaky_test_attempts is as above and regex_filter stands for a list of
      include and exclude regular expression patterns (Also see --runs_per_test).
      Example: --flaky_test_attempts=//foo/.*,-//foo/bar/.*@3 deflakes all tests in
      //foo/ except those under foo/bar three times. This option can be passed multiple
      times. The most recently passed argument that matches takes precedence. If nothing
      matches, behavior is as if ''default'' above.'
    --noexperimental_skyfocus_dump_post_gc_stats: For debugging Skyfocus. If enabled,
      trigger manual GC before/after focusing to report heap sizes reductions. This
      will increase the Skyfocus latency.
    --experimental_remote_analysis_cache: The URL for the remote analysis caching
      backend.
    --local_ram_resources: Explicitly set the total amount of local host RAM (in MB)
      available to Bazel to spend on build actions executed locally. Takes an integer,
      or "HOST_RAM", optionally followed by [-|*]<float> (eg. HOST_RAM*.5 to use half
      the available RAM). By default, ("HOST_RAM*.67"), Bazel will query system configuration
      to estimate the amount of RAM available and will use 67% of it.
    --experimental_local_retries_on_crash: Number of times to retry a local action
      when we detect that it crashed. This exists to workaround a bug in OSXFUSE which
      is tickled by the use of the dynamic scheduler and --experimental_local_lockfree_output
      due to constant process churn. The bug can be triggered by a cancelled process
      that ran *before* the process we are trying to run, introducing corruption in
      its file reads.
    --experimental_use_validation_aspect: Whether to run validation actions using
      aspect (for parallelism with tests).
    -k, --keep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --noexperimental_run_bep_event_include_residue: Whether to include the command-line
      residue in run build events which could contain the residue. By default, the
      residue is not included in run command build events that could contain the residue.
    --analyze: Execute the loading/analysis phase; this is the usual behaviour. Specifying
      --noanalyzecauses the build to stop before starting the loading/analysis phase,
      just doing target pattern parsing and returning zero iff that completed successfully;
      this mode is useful for testing.
    --execution_log_json_file: 'Log the executed spawns into this file as newline-delimited
      JSON representations of SpawnExec protos, according to src/main/protobuf/spawn.proto.
      Prefer --execution_log_compact_file, which is significantly smaller and cheaper
      to produce. Related flags: --execution_log_compact_file (compact format; mutually
      exclusive), --execution_log_binary_file (binary protobuf format; mutually exclusive),
      --execution_log_sort (whether to sort the execution log), --subcommands (for
      displaying subcommands in terminal output).'
    --explain: Causes the build system to explain each executed step of the build.
      The explanation is written to the specified log file.
    --skip_incompatible_explicit_targets: 'Skip incompatible targets that are explicitly
      listed on the command line. By default, building such targets results in an
      error but they are silently skipped when this option is enabled. See: https://bazel.build/extending/platforms#skipping-incompatible-targets'
    --experimental_convenience_symlinks_bep_event: This flag controls whether or not
      we will post the build eventConvenienceSymlinksIdentified to the BuildEventProtocol.
      If the value is true, the BuildEventProtocol will have an entry for convenienceSymlinksIdentified,
      listing all of the convenience symlinks created in your workspace. If false,
      then the convenienceSymlinksIdentified entry in the BuildEventProtocol will
      be empty.
    --local_termination_grace_seconds: Time to wait between terminating a local process
      due to timeout and forcefully shutting it down.
    --noexpand_test_suites: 'Expand test_suite targets into their constituent tests
      before analysis. When this flag is turned on (the default), negative target
      patterns will apply to the tests belonging to the test suite, otherwise they
      will not. Turning off this flag is useful when top-level aspects are applied
      at command line: then they can analyze test_suite targets.'
    --output_filter: Only shows warnings and action outputs for rules with a name
      matching the provided regular expression.
    --directory_creation_cache: Describes the cache used to store known regular directories
      as they're created. Parent directories of output files are created on-demand
      during action execution.
    --noverbose_explanations: Increases the verbosity of the explanations issued if
      --explain is enabled. Has no effect if --explain is not enabled.
    --experimental_materialize_param_files_directly: If materializing param files,
      do so with direct writes to disk.
    --noexperimental_extra_action_top_level_only: Deprecated in favor of aspects.
      Only schedules extra_actions for top level targets.
    --nolegacy_important_outputs: Use this to suppress generation of the legacy important_outputs
      field in the TargetComplete event. important_outputs are required for Bazel
      to ResultStore/BTX integration.
    --experimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --use_action_cache: Whether to use the action cache
    --noexperimental_skyframe_target_pattern_evaluator: Use the Skyframe-based target
      pattern evaluator; implies --experimental_interleave_loading_and_analysis.
    --local_extra_resources: Set the number of extra resources available to Bazel.
      Takes in a string-float pair. Can be used multiple times to specify multiple
      types of extra resources. Bazel will limit concurrently running actions based
      on the available extra resources and the extra resources required. Tests can
      declare the amount of extra resources they need by using a tag of the "resources:<resoucename>:<amount>"
      format. Available CPU, RAM and resources cannot be set with this flag.
    --experimental_build_event_upload_strategy: Selects how to upload artifacts referenced
      in the build event protocol.
    --experimental_remote_cache_eviction_retries: The maximum number of attempts to
      retry if the build encountered a transient remote cache error that would otherwise
      fail the build. Applies for example when artifacts are evicted from the remote
      cache, or in certain cache failure conditions. A non-zero value will implicitly
      set --incompatible_remote_use_new_exit_code_for_lost_inputs to true. A new invocation
      id will be generated for each attempt. If you generate invocation id and provide
      it to Bazel with --invocation_id, you should not use this flag. Instead, set
      flag --incompatible_remote_use_new_exit_code_for_lost_inputs and check for the
      exit code 39.
    --loading_phase_threads: Number of parallel threads to use for the loading/analysis
      phase.Takes an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally
      followed by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" sets
      a reasonable default based on host resources. Must be at least 1.
    --experimental_remote_analysis_cache_mode: The transport direction for the remote
      analysis cache.
    --experimental_merged_skyframe_analysis_execution: If this flag is set, the analysis
      and execution phases of Skyframe are merged.
    --max_test_output_bytes: Specifies maximum per-test-log size that can be emitted
      when --test_output is 'errors' or 'all'. Useful for avoiding overwhelming the
      output with excessively noisy test output. The test header is included in the
      log size. Negative values imply no limit. Output is all or nothing.
    --experimental_skyframe_cpu_heavy_skykeys_thread_pool_size: 'If set to a positive
      value (e.g. "HOST_CPUS*1.5"), Skyframe will run the loading/analysis phase with
      2 separate thread pools: 1 with <value> threads (ideally close to HOST_CPUS)
      reserved for CPU-heavy SkyKeys, and 1 "standard" thread pool (whose size is
      controlled by --loading_phase_threads) for the rest.'
    --expand_test_suites: 'Expand test_suite targets into their constituent tests
      before analysis. When this flag is turned on (the default), negative target
      patterns will apply to the tests belonging to the test suite, otherwise they
      will not. Turning off this flag is useful when top-level aspects are applied
      at command line: then they can analyze test_suite targets.'
    --target_pattern_file: If set, build will read patterns from the file named here,
      rather than on the command line. It is an error to specify a file here as well
      as command-line patterns.
    --noexperimental_process_wrapper_graceful_sigterm: When true, make the process-wrapper
      propagate SIGTERMs (used by the dynamic scheduler to stop process trees) to
      the subprocesses themselves, giving them the grace period in --local_termination_grace_seconds
      before forcibly sending a SIGKILL.
    --experimental_skyfocus_handling_strategy: Strategies for Skyfocus to handle changes
      outside of the working set.
    --incompatible_remote_use_new_exit_code_for_lost_inputs: If set to true, Bazel
      will use new exit code 39 instead of 34 if remote cacheerrors, including cache
      evictions, cause the build to fail.
    --experimental_skyframe_target_pattern_evaluator: Use the Skyframe-based target
      pattern evaluator; implies --experimental_interleave_loading_and_analysis.
    --noincompatible_skip_genfiles_symlink: If set to true, the genfiles symlink will
      not be created. For more information, see https://github.com/bazelbuild/bazel/issues/8651
    --experimental_enable_skyfocus: If true, enable the use of --experimental_working_set
      to reduce Bazel's memory footprint for incremental builds. This feature is known
      as Skyfocus.
    --experimental_aquery_dump_after_build_format: 'Writes the state of Skyframe (which
      includes previous invocations on this blaze instance as well) after a build.
      Output is streamed remotely unless local output is requested with --experimental_aquery_dump_after_build_output_file.  Does
      not honor aquery flags for --include_*, but uses the same defaults, except for
      --include_commandline=false. Possible output formats: proto|streamed_proto|textproto|jsonproto.
      Using this will disable Skymeld.'
    --build_manual_tests: Forces test targets tagged 'manual' to be built. 'manual'
      tests are excluded from processing. This option forces them to be built (but
      not executed).
    --build_tag_filters: Specifies a comma-separated list of tags. Each tag can be
      optionally preceded with '-' to specify excluded tags. Only those targets will
      be built that contain at least one included tag and do not contain any excluded
      tags. This option does not affect the set of tests executed with the 'test'
      command; those are be governed by the test filtering options, for example '--test_tag_filters'
    --noexperimental_use_semaphore_for_jobs: If set to true, additionally use semaphore
      to limit number of concurrent jobs.
    --experimental_aquery_dump_after_build_output_file: Specify the output file for
      the aquery dump after a build. Use in conjunction with --experimental_aquery_dump_after_build_format.
      The path provided is relative to Bazel's output base, unless it's an absolute
      path. Using this will disable Skymeld.
    --local_test_jobs: The max number of local test jobs to run concurrently. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". 0 means local resources
      will limit the number of local test jobs to run concurrently instead. Setting
      this greater than the value for --jobs is ineffectual.
    --norewind_lost_inputs: Whether to use action rewinding to recover from lost inputs.
    --test_tmpdir: Specifies the base temporary directory for 'bazel test' to use.
    --hide_aspect_results: Comma-separated list of aspect names to not display in
      results (see --show_result). Useful for keeping aspects added by wrappers which
      are typically not interesting to end users out of console output.
    --execution_log_compact_file: 'Log the executed spawns into this file as length-delimited
      ExecLogEntry protos, according to src/main/protobuf/spawn.proto. The entire
      file is zstd compressed. Related flags: --execution_log_binary_file (binary
      protobuf format; mutually exclusive), --execution_log_json_file (text JSON format;
      mutually exclusive), --subcommands (for displaying subcommands in terminal output).'
    --noincompatible_remote_use_new_exit_code_for_lost_inputs: If set to true, Bazel
      will use new exit code 39 instead of 34 if remote cacheerrors, including cache
      evictions, cause the build to fail.
    --experimental_build_event_fully_resolve_fileset_symlinks: If true, fully resolve
      relative Fileset symlinks in the BEP when presenting output files. Requires
      --experimental_build_event_expand_filesets.
  description: Builds the specified targets.
- name: canonicalize-flags
  flags:
    --noexecution_log_sort: Whether to sort the execution log, making it easier to
      compare logs across invocations. Set to false to avoid potentially significant
      CPU and memory usage at the end of the invocation, at the cost of producing
      the log in nondeterministic execution order. Only applies to the binary and
      JSON formats; the compact format is never sorted.
    --incompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --noexperimental_stats_summary: Enable a modernized summary of the build stats.
    --check_tests_up_to_date: Don't run tests, just check if they are up-to-date.  If
      all tests results are up-to-date, the testing completes successfully.  If any
      test needs to be built or executed, an error is reported and the testing fails.  This
      option implies --check_up_to_date behavior.
    --noexperimental_merged_skyframe_analysis_execution: If this flag is set, the
      analysis and execution phases of Skyframe are merged.
    --test_keep_going: When disabled, any non-passing test will cause the entire build
      to stop. By default all tests are run, even if some do not pass.
    --experimental_skyfocus_dump_keys: For debugging Skyfocus. Dump the focused SkyKeys
      (roots, leafs, focused deps, focused rdeps).
    --check_up_to_date: Don't perform the build, just check if it is up-to-date.  If
      all targets are up-to-date, the build completes successfully.  If any step needs
      to be executed an error is reported and the build fails.
    --nomaterialize_param_files: Writes intermediate parameter files to output tree
      even when using remote action execution. Useful when debugging actions. This
      is implied by --subcommands and --verbose_failures.
    --version_window_for_dirty_node_gc: Nodes that have been dirty for more than this
      many versions will be deleted from the graph upon the next update. Values must
      be non-negative long integers, or -1 indicating the maximum possible window.
    --test_summary: Specifies the desired format of the test summary. Valid values
      are 'short' to print information only about tests executed, 'terse', to print
      information only about unsuccessful tests that were run, 'detailed' to print
      detailed information about failed test cases, 'testcase' to print summary in
      test case resolution, do not print detailed information about failed test cases
      and 'none' to omit the summary.
    --local_resources: Set the number of resources available to Bazel. Takes in an
      assignment to a float or HOST_RAM/HOST_CPUS, optionally followed by [-|*]<float>
      (eg. memory=HOST_RAM*.5 to use half the available RAM). Can be used multiple
      times to specify multiple types of resources. Bazel will limit concurrently
      running actions based on the available resources and the resources required.
      Tests can declare the amount of resources they need by using a tag of the "resources:<resource
      name>:<amount>" format. Overrides resources specified by --local_{cpu|ram|extra}_resources.
    --rewind_lost_inputs: Whether to use action rewinding to recover from lost inputs.
    --noexperimental_local_lockfree_output: When true, the local spawn runner doesn't
      lock the output tree during dynamic execution. Instead, spawns are allowed to
      execute until they are explicitly interrupted by a faster remote action.
    --build: Execute the build; this is the usual behaviour. Specifying --nobuild
      causes the build to stop before executing the build actions, returning zero
      iff the package loading and analysis phases completed successfully; this mode
      is useful for testing those phases.
    --noincompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --enforce_project_configs: If true, interactive builds may only pass the --scl_config
      build flag; they may not use any other build flags. --scl_config must be set
      to an officially suported project configuration. Supported configurations are
      defined in the target's PROJECT.scl, which can be found by walking up the target's
      packagge path. See b/324126745.
    --aspects: Comma-separated list of aspects to be applied to top-level targets.
      In the list, if aspect some_aspect specifies required aspect providers via required_aspect_providers,
      some_aspect will run after every aspect that was mentioned before it in the
      aspects list whose advertised providers satisfy some_aspect required aspect
      providers. Moreover, some_aspect will run after all its required aspects specified
      by requires attribute. some_aspect will then have access to the values of those
      aspects' providers. <bzl-file-label>%<aspect_name>, for example '//tools:my_def.bzl%my_aspect',
      where 'my_aspect' is a top-level value from a file tools/my_def.bzl
    --nobuild_tests_only: If specified, only *_test and test_suite rules will be built
      and other targets specified on the command line will be ignored. By default
      everything that was requested will be built.
    --fetch: Allows the command to fetch external dependencies. If set to false, the
      command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --noexperimental_materialize_param_files_directly: If materializing param files,
      do so with direct writes to disk.
    --show_result: |-
      Show the results of the build.  For each target, state whether or not it was brought up-to-date, and if so, a list of output files that were built.  The printed files are convenient strings for copy+pasting to the shell, to execute them.
      This option requires an integer argument, which is the threshold number of targets above which result information is not printed. Thus zero causes suppression of the message and MAX_INT causes printing of the result to occur always. The default is one.
      If nothing was built for a target its results may be omitted to keep the output under the threshold.
    --noenforce_project_configs: If true, interactive builds may only pass the --scl_config
      build flag; they may not use any other build flags. --scl_config must be set
      to an officially suported project configuration. Supported configurations are
      defined in the target's PROJECT.scl, which can be found by walking up the target's
      packagge path. See b/324126745.
    --execution_log_sort: Whether to sort the execution log, making it easier to compare
      logs across invocations. Set to false to avoid potentially significant CPU and
      memory usage at the end of the invocation, at the cost of producing the log
      in nondeterministic execution order. Only applies to the binary and JSON formats;
      the compact format is never sorted.
    --output_tree_tracking: If set, tell the output service (if any) to track when
      files in the output tree have been modified externally (not by the build system).
      This should improve incremental build speed when an appropriate output service
      is enabled.
    --noexperimental_enable_skyfocus: If true, enable the use of --experimental_working_set
      to reduce Bazel's memory footprint for incremental builds. This feature is known
      as Skyfocus.
    --test_strategy: Specifies which strategy to use when running tests.
    --spawn_strategy: Specify how spawn actions are executed by default. Accepts a
      comma-separated list of strategies from highest to lowest priority. For each
      action Bazel picks the strategy with the highest priority that can execute the
      action. The default value is "remote,worker,sandboxed,local". See https://blog.bazel.build/2019/06/19/list-strategy.html
      for details.
    --nodiscard_analysis_cache: Discard the analysis cache immediately after the analysis
      phase completes. Reduces memory usage by ~10%, but makes further incremental
      builds slower.
    --experimental_skyfocus_dump_post_gc_stats: For debugging Skyfocus. If enabled,
      trigger manual GC before/after focusing to report heap sizes reductions. This
      will increase the Skyfocus latency.
    --noexperimental_build_event_expand_filesets: If true, expand Filesets in the
      BEP when presenting output files.
    --nokeep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --noexperimental_use_validation_aspect: Whether to run validation actions using
      aspect (for parallelism with tests).
    --nocheck_tests_up_to_date: Don't run tests, just check if they are up-to-date.  If
      all tests results are up-to-date, the testing completes successfully.  If any
      test needs to be built or executed, an error is reported and the testing fails.  This
      option implies --check_up_to_date behavior.
    --nobuild: Execute the build; this is the usual behaviour. Specifying --nobuild
      causes the build to stop before executing the build actions, returning zero
      iff the package loading and analysis phases completed successfully; this mode
      is useful for testing those phases.
    --experimental_extra_action_top_level_only: Deprecated in favor of aspects. Only
      schedules extra_actions for top level targets.
    --build_event_upload_max_retries: The maximum number of times Bazel should retry
      uploading a build event.
    --test_timeout_filters: Specifies a comma-separated list of test timeouts. Each
      timeout can be optionally preceded with '-' to specify excluded timeouts. Only
      those test targets will be found that contain at least one included timeout
      and do not contain any excluded timeouts. This option affects --build_tests_only
      behavior and the test command.
    --experimental_remote_analysis_cache_deadline: Deadline to use for remote analysis
      cache operations.
    -s, --subcommands: 'Display the subcommands executed during a build. Related flags:
      --execution_log_json_file, --execution_log_binary_file (for logging subcommands
      to a file in a tool-friendly format).'
    --deleted_packages: |-
      A comma-separated list of names of packages which the build system will consider non-existent, even if they are visible somewhere on the package path.
      Use this option when deleting a subpackage 'x/y' of an existing package 'x'.  For example, after deleting x/y/BUILD in your client, the build system may complain if it encounters a label '//x:y/z' if that is still provided by another package_path entry.  Specifying --deleted_packages x/y avoids this problem.
    --default_visibility: Default visibility for packages that don't set it explicitly
      ('public' or 'private').
    --nouse_action_cache: Whether to use the action cache
    --canonicalize_policy: Output the canonical policy, after expansion and filtering.
      To keep the output clean, the canonicalized command arguments will NOT be shown
      when this option is set to true. Note that the command specified by --for_command
      affects the filtered policy, and if none is specified, the default command is
      'build'.
    --experimental_stream_log_file_uploads: Stream log file uploads directly to the
      remote storage rather than writing them to disk.
    --noexperimental_async_execution: If set to true, Bazel is allowed to run action
      in a virtual thread. The number of actions in flight is still capped with --jobs.
    --nooutput_tree_tracking: If set, tell the output service (if any) to track when
      files in the output tree have been modified externally (not by the build system).
      This should improve incremental build speed when an appropriate output service
      is enabled.
    --notest_keep_going: When disabled, any non-passing test will cause the entire
      build to stop. By default all tests are run, even if some do not pass.
    --noallow_analysis_cache_discard: If discarding the analysis cache due to a change
      in the build system, setting this option to false will cause bazel to exit,
      rather than continuing with the build. This option has no effect when 'discard_analysis_cache'
      is also set.
    --strategy_regexp: 'Override which spawn strategy should be used to execute spawn
      actions that have descriptions matching a certain regex_filter. See --per_file_copt
      for details onregex_filter matching. The last regex_filter that matches the
      description is used. This option overrides other flags for specifying strategy.
      Example: --strategy_regexp=//foo.*\\.cc,-//foo/bar=local means to run actions
      using local strategy if their descriptions match //foo.*.cc but not //foo/bar.
      Example: --strategy_regexp=''Compiling.*/bar=local  --strategy_regexp=Compiling=sandboxed
      will run ''Compiling //foo/bar/baz'' with the ''local'' strategy, but reversing
      the order would run it with ''sandboxed''. '
    --experimental_remote_analysis_cache_concurrency: Target concurrency for remote
      analysis caching RPCs.
    --nofetch: Allows the command to fetch external dependencies. If set to false,
      the command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --experimental_stats_summary: Enable a modernized summary of the build stats.
    --discard_analysis_cache: Discard the analysis cache immediately after the analysis
      phase completes. Reduces memory usage by ~10%, but makes further incremental
      builds slower.
    --package_path: A colon-separated list of where to look for packages. Elements
      beginning with '%workspace%' are relative to the enclosing workspace. If omitted
      or empty, the default is the output of 'bazel info default-package-path'.
    --compile_one_dependency: Compile a single dependency of the argument files. This
      is useful for syntax checking source files in IDEs, for example, by rebuilding
      a single target that depends on the source file to detect errors as early as
      possible in the edit/build/test cycle. This argument affects the way all non-flag
      arguments are interpreted; instead of being targets to build they are source
      filenames.  For each source filename an arbitrary target that depends on it
      will be built.
    --experimental_use_semaphore_for_jobs: If set to true, additionally use semaphore
      to limit number of concurrent jobs.
    --experimental_build_event_output_group_mode: 'Specify how an output group''s
      files will be represented in TargetComplete/AspectComplete BEP events. Values
      are an assignment of an output group name to one of ''NAMED_SET_OF_FILES_ONLY'',
      ''INLINE_ONLY'', or ''BOTH''. The default value is ''NAMED_SET_OF_FILES_ONLY''.
      If an output group is repeated, the final value to appear is used. The default
      value sets the mode for coverage artifacts to BOTH: --experimental_build_event_output_group_mode=baseline.lcov=both'
    --noexperimental_split_xml_generation: If this flag is set, and a test action
      does not generate a test.xml file, then Bazel uses a separate action to generate
      a dummy test.xml file containing the test log. Otherwise, Bazel generates a
      test.xml as part of the test action.
    --verbose_failures: If a command fails, print out the full command line.
    --experimental_include_default_values: Whether Starlark options set to their default
      values are included in the output.
    --legacy_globbing_threads: Number of threads to use for glob evaluation. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" means to use
      a reasonable value derived from the machine's hardware profile (e.g. the number
      of processors).
    --norun_validations: Whether to run validation actions as part of the build. See
      https://bazel.build/extending/rules#validation_actions
    --noverbose_failures: If a command fails, print out the full command line.
    --experimental_build_event_expand_filesets: If true, expand Filesets in the BEP
      when presenting output files.
    --incompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --noskip_incompatible_explicit_targets: 'Skip incompatible targets that are explicitly
      listed on the command line. By default, building such targets results in an
      error but they are silently skipped when this option is enabled. See: https://bazel.build/extending/platforms#skipping-incompatible-targets'
    --noexperimental_bep_target_summary: Whether to publish TargetSummary events.
    --nocompile_one_dependency: Compile a single dependency of the argument files.
      This is useful for syntax checking source files in IDEs, for example, by rebuilding
      a single target that depends on the source file to detect errors as early as
      possible in the edit/build/test cycle. This argument affects the way all non-flag
      arguments are interpreted; instead of being targets to build they are source
      filenames.  For each source filename an arbitrary target that depends on it
      will be built.
    --noexperimental_enable_critical_path_profiling: If set (the default), critical
      path profiling is enabled for the execution phase. This has a slight overhead
      in RAM and CPU, and may prevent Bazel from making certain aggressive RAM optimizations
      in some cases.
    --experimental_oom_sensitive_skyfunctions_semaphore_size: 'Sets the size of the
      semaphore used to prevent SkyFunctions with large peak memory requirement from
      OOM-ing blaze. A value of 0 indicates that no semaphore should be used. Example
      value: "HOST_CPUS*0.5".'
    --experimental_convenience_symlinks: |-
      This flag controls how the convenience symlinks (the symlinks that appear in the workspace after the build) will be managed. Possible values:
        normal (default): Each kind of convenience symlink will be created or deleted, as determined by the build.
        clean: All symlinks will be unconditionally deleted.
        ignore: Symlinks will not be created or cleaned up.
        log_only: Generate log messages as if 'normal' were passed, but don't actually perform any filesystem operations (useful for tools).
      Note that only symlinks whose names are generated by the current value of --symlink_prefix can be affected; if the prefix changes, any pre-existing symlinks will be left alone.
    --invocation_policy: Applies an invocation policy to the options to be canonicalized.
    --experimental_build_event_upload_retry_minimum_delay: 'Initial, minimum delay
      for exponential backoff retries when BEP upload fails. (exponent: 1.6)'
    --noanalyze: Execute the loading/analysis phase; this is the usual behaviour.
      Specifying --noanalyzecauses the build to stop before starting the loading/analysis
      phase, just doing target pattern parsing and returning zero iff that completed
      successfully; this mode is useful for testing.
    --experimental_skyframe_memory_dump: 'Dump the memory use of individual nodes
      in the Skyframe graph after the build. This option takes a number of flags separated
      by commas: ''json'' (no-op, that''s the only format), ''notransient'' (don''t
      traverse transient fields), ''noconfig'' (ignore objects related to configurations),
      ''noprecomputed'' (ignore precomputed values) and ''noworkspacestatus'' (ignore
      objects related to the workspace status machinery)'
    --experimental_run_bep_event_include_residue: Whether to include the command-line
      residue in run build events which could contain the residue. By default, the
      residue is not included in run command build events that could contain the residue.
    --experimental_max_directories_to_eagerly_visit_in_globbing: If non-negative,
      the first time a glob is evaluated in a package, the subdirectories of the package
      will be traversed in order to warm filesystem caches and compensate for lack
      of parallelism in globbing. At most this many directories will be visited.
    --verbose_explanations: Increases the verbosity of the explanations issued if
      --explain is enabled. Has no effect if --explain is not enabled.
    --materialize_param_files: Writes intermediate parameter files to output tree
      even when using remote action execution. Useful when debugging actions. This
      is implied by --subcommands and --verbose_failures.
    -j, --jobs: The number of concurrent jobs to run. Takes an integer, or a keyword
      ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed by an operation ([-|*]<float>)
      eg. "auto", "HOST_CPUS*.5". Values must be between 1 and 5000. Values above
      2500 may cause memory issues. "auto" calculates a reasonable default based on
      host resources.
    --experimental_extra_action_filter: Deprecated in favor of aspects. Filters set
      of targets to schedule extra_actions for.
    --experimental_split_xml_generation: If this flag is set, and a test action does
      not generate a test.xml file, then Bazel uses a separate action to generate
      a dummy test.xml file containing the test log. Otherwise, Bazel generates a
      test.xml as part of the test action.
    --experimental_process_wrapper_graceful_sigterm: When true, make the process-wrapper
      propagate SIGTERMs (used by the dynamic scheduler to stop process trees) to
      the subprocesses themselves, giving them the grace period in --local_termination_grace_seconds
      before forcibly sending a SIGKILL.
    --test_tag_filters: Specifies a comma-separated list of test tags. Each tag can
      be optionally preceded with '-' to specify excluded tags. Only those test targets
      will be found that contain at least one included tag and do not contain any
      excluded tags. This option affects --build_tests_only behavior and the test
      command.
    --symlink_prefix: 'The prefix that is prepended to any of the convenience symlinks
      that are created after a build. If omitted, the default value is the name of
      the build tool followed by a hyphen. If ''/'' is passed, then no symlinks are
      created and no warning is emitted. Warning: the special functionality for ''/''
      will be deprecated soon; use --experimental_convenience_symlinks=ignore instead.'
    --output_groups: A list of comma-separated output group names, each of which optionally
      prefixed by a + or a -. A group prefixed by + is added to the default set of
      output groups, while a group prefixed by - is removed from the default set.
      If at least one group is not prefixed, the default set of output groups is omitted.
      For example, --output_groups=+foo,+bar builds the union of the default set,
      foo, and bar, while --output_groups=foo,bar overrides the default set such that
      only foo and bar are built.
    --max_config_changes_to_show: When discarding the analysis cache due to a change
      in the build options, displays up to the given number of changed option names.
      If the number given is -1, all changed options will be displayed.
    --experimental_enable_critical_path_profiling: If set (the default), critical
      path profiling is enabled for the execution phase. This has a slight overhead
      in RAM and CPU, and may prevent Bazel from making certain aggressive RAM optimizations
      in some cases.
    --experimental_cpu_load_scheduling_window_size: The size of window during experimental
      scheduling of action based on CPU load. Make sense to define only when flag
      --experimental_cpu_load_scheduling is enabled.
    --incompatible_skip_genfiles_symlink: If set to true, the genfiles symlink will
      not be created. For more information, see https://github.com/bazelbuild/bazel/issues/8651
    --experimental_local_lockfree_output: When true, the local spawn runner doesn't
      lock the output tree during dynamic execution. Instead, spawns are allowed to
      execute until they are explicitly interrupted by a faster remote action.
    --noincompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --show_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --nobuild_manual_tests: Forces test targets tagged 'manual' to be built. 'manual'
      tests are excluded from processing. This option forces them to be built (but
      not executed).
    --test_lang_filters: Specifies a comma-separated list of test languages. Each
      language can be optionally preceded with '-' to specify excluded languages.
      Only those test targets will be found that are written in the specified languages.
      The name used for each language should be the same as the language prefix in
      the *_test rule, e.g. one of 'cc', 'java', 'py', etc. This option affects --build_tests_only
      behavior and the test command.
    --experimental_cpu_load_scheduling: Enables the experimental local execution scheduling
      based on CPU load, not estimation of actions one by one.  Experimental scheduling
      have showed the large benefit on a large local builds on a powerful machines
      with the large number of cores. Reccommended to use with --local_resources=cpu=HOST_CPUS
    --test_output: Specifies desired output mode. Valid values are 'summary' to output
      only test status summary, 'errors' to also print test logs for failed tests,
      'all' to print logs for all tests and 'streamed' to output logs for all tests
      in real time (this will force tests to be executed locally one at a time regardless
      of --test_strategy value).
    --run_validations: Whether to run validation actions as part of the build. See
      https://bazel.build/extending/rules#validation_actions
    --experimental_async_execution: If set to true, Bazel is allowed to run action
      in a virtual thread. The number of actions in flight is still capped with --jobs.
    --execution_log_binary_file: 'Log the executed spawns into this file as length-delimited
      SpawnExec protos, according to src/main/protobuf/spawn.proto. Prefer --execution_log_compact_file,
      which is significantly smaller and cheaper to produce. Related flags: --execution_log_compact_file
      (compact format; mutually exclusive), --execution_log_json_file (text JSON format;
      mutually exclusive), --execution_log_sort (whether to sort the execution log),
      --subcommands (for displaying subcommands in terminal output).'
    --nocheck_up_to_date: Don't perform the build, just check if it is up-to-date.  If
      all targets are up-to-date, the build completes successfully.  If any step needs
      to be executed an error is reported and the build fails.
    --legacy_important_outputs: Use this to suppress generation of the legacy important_outputs
      field in the TargetComplete event. important_outputs are required for Bazel
      to ResultStore/BTX integration.
    --cache_computed_file_digests: If greater than 0, configures Bazel to cache file
      digests in memory based on their metadata instead of recomputing the digests
      from disk every time they are needed. Setting this to 0 ensures correctness
      because not all file changes can be noted from file metadata. When not 0, the
      number indicates the size of the cache as the number of file digests to be cached.
    --experimental_working_set: The working set for Skyfocus. Specify as comma-separated
      workspace root-relative paths. This is a stateful flag. Defining a working set
      persists it for subsequent invocations, until it is redefined with a new set.
    --strategy: Specify how to distribute compilation of other spawn actions. Accepts
      a comma-separated list of strategies from highest to lowest priority. For each
      action Bazel picks the strategy with the highest priority that can execute the
      action. The default value is "remote,worker,sandboxed,local". This flag overrides
      the values set by --spawn_strategy (and --genrule_strategy if used with mnemonic
      Genrule). See https://blog.bazel.build/2019/06/19/list-strategy.html for details.
    --experimental_bep_target_summary: Whether to publish TargetSummary events.
    --build_tests_only: If specified, only *_test and test_suite rules will be built
      and other targets specified on the command line will be ignored. By default
      everything that was requested will be built.
    --allow_analysis_cache_discard: If discarding the analysis cache due to a change
      in the build system, setting this option to false will cause bazel to exit,
      rather than continuing with the build. This option has no effect when 'discard_analysis_cache'
      is also set.
    --local_cpu_resources: Explicitly set the total number of local CPU cores available
      to Bazel to spend on build actions executed locally. Takes an integer, or "HOST_CPUS",
      optionally followed by [-|*]<float> (eg. HOST_CPUS*.5 to use half the available
      CPU cores). By default, ("HOST_CPUS"), Bazel will query system configuration
      to estimate the number of CPU cores available.
    --noshow_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --noexperimental_cpu_load_scheduling: Enables the experimental local execution
      scheduling based on CPU load, not estimation of actions one by one.  Experimental
      scheduling have showed the large benefit on a large local builds on a powerful
      machines with the large number of cores. Reccommended to use with --local_resources=cpu=HOST_CPUS
    --noexperimental_stream_log_file_uploads: Stream log file uploads directly to
      the remote storage rather than writing them to disk.
    --noexperimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --allowed_local_actions_regex: A regex whitelist for action types which may be
      run locally. If unset, all actions are allowed to execute locally
    --experimental_fsvc_threads: The number of threads that are used by the FileSystemValueChecker.
    --serialized_frontier_profile: Dump a profile of serialized frontier bytes. Specifies
      the output path.
    --noexperimental_build_event_fully_resolve_fileset_symlinks: If true, fully resolve
      relative Fileset symlinks in the BEP when presenting output files. Requires
      --experimental_build_event_expand_filesets.
    --genrule_strategy: Specify how to execute genrules. This flag will be phased
      out. Instead, use --spawn_strategy=<value> to control all actions or --strategy=Genrule=<value>
      to control genrules only.
    --experimental_skymeld_analysis_overlap_percentage: The value represents the %
      of the analysis phase which will be overlapped with the execution phase. A value
      of x means Skyframe will queue up execution tasks and wait until there's x%
      of the top level target left to be analyzed before allowing them to launch.
      When the value is 0%, we'd wait for all analysis to finish before executing
      (no overlap). When it's 100%, the phases are free to overlap as much as they
      can.
    --aspects_parameters: Specifies the values of the command-line aspects parameters.
      Each parameter value is specified via <param_name>=<param_value>, for example
      'my_param=my_val' where 'my_param' is a parameter of some aspect in --aspects
      list or required by an aspect in the list. This option can be used multiple
      times. However, it is not allowed to assign values to the same parameter more
      than once.
    --progress_report_interval: The number of seconds to wait between reports on still
      running jobs. The default value 0 means the first report will be printed after
      10 seconds, then 30 seconds and after that progress is reported once every minute.
      When --curses is enabled, progress is reported every second.
    --test_size_filters: Specifies a comma-separated list of test sizes. Each size
      can be optionally preceded with '-' to specify excluded sizes. Only those test
      targets will be found that contain at least one included size and do not contain
      any excluded sizes. This option affects --build_tests_only behavior and the
      test command.
    --noexperimental_convenience_symlinks_bep_event: This flag controls whether or
      not we will post the build eventConvenienceSymlinksIdentified to the BuildEventProtocol.
      If the value is true, the BuildEventProtocol will have an entry for convenienceSymlinksIdentified,
      listing all of the convenience symlinks created in your workspace. If false,
      then the convenienceSymlinksIdentified entry in the BuildEventProtocol will
      be empty.
    --experimental_remote_analysis_cache: The URL for the remote analysis caching
      backend.
    --noexperimental_skyfocus_dump_post_gc_stats: For debugging Skyfocus. If enabled,
      trigger manual GC before/after focusing to report heap sizes reductions. This
      will increase the Skyfocus latency.
    --flaky_test_attempts: 'Each test will be retried up to the specified number of
      times in case of any test failure. Tests that required more than one attempt
      to pass are marked as ''FLAKY'' in the test summary. Normally the value specified
      is just an integer or the string ''default''. If an integer, then all tests
      will be run up to N times. If ''default'', then only a single test attempt will
      be made for regular tests and three for tests marked explicitly as flaky by
      their rule (flaky=1 attribute). Alternate syntax: regex_filter@flaky_test_attempts.
      Where flaky_test_attempts is as above and regex_filter stands for a list of
      include and exclude regular expression patterns (Also see --runs_per_test).
      Example: --flaky_test_attempts=//foo/.*,-//foo/bar/.*@3 deflakes all tests in
      //foo/ except those under foo/bar three times. This option can be passed multiple
      times. The most recently passed argument that matches takes precedence. If nothing
      matches, behavior is as if ''default'' above.'
    --experimental_local_retries_on_crash: Number of times to retry a local action
      when we detect that it crashed. This exists to workaround a bug in OSXFUSE which
      is tickled by the use of the dynamic scheduler and --experimental_local_lockfree_output
      due to constant process churn. The bug can be triggered by a cancelled process
      that ran *before* the process we are trying to run, introducing corruption in
      its file reads.
    --local_ram_resources: Explicitly set the total amount of local host RAM (in MB)
      available to Bazel to spend on build actions executed locally. Takes an integer,
      or "HOST_RAM", optionally followed by [-|*]<float> (eg. HOST_RAM*.5 to use half
      the available RAM). By default, ("HOST_RAM*.67"), Bazel will query system configuration
      to estimate the amount of RAM available and will use 67% of it.
    --experimental_use_validation_aspect: Whether to run validation actions using
      aspect (for parallelism with tests).
    -k, --keep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --noexperimental_run_bep_event_include_residue: Whether to include the command-line
      residue in run build events which could contain the residue. By default, the
      residue is not included in run command build events that could contain the residue.
    --analyze: Execute the loading/analysis phase; this is the usual behaviour. Specifying
      --noanalyzecauses the build to stop before starting the loading/analysis phase,
      just doing target pattern parsing and returning zero iff that completed successfully;
      this mode is useful for testing.
    --execution_log_json_file: 'Log the executed spawns into this file as newline-delimited
      JSON representations of SpawnExec protos, according to src/main/protobuf/spawn.proto.
      Prefer --execution_log_compact_file, which is significantly smaller and cheaper
      to produce. Related flags: --execution_log_compact_file (compact format; mutually
      exclusive), --execution_log_binary_file (binary protobuf format; mutually exclusive),
      --execution_log_sort (whether to sort the execution log), --subcommands (for
      displaying subcommands in terminal output).'
    --explain: Causes the build system to explain each executed step of the build.
      The explanation is written to the specified log file.
    --noexperimental_include_default_values: Whether Starlark options set to their
      default values are included in the output.
    --skip_incompatible_explicit_targets: 'Skip incompatible targets that are explicitly
      listed on the command line. By default, building such targets results in an
      error but they are silently skipped when this option is enabled. See: https://bazel.build/extending/platforms#skipping-incompatible-targets'
    --experimental_convenience_symlinks_bep_event: This flag controls whether or not
      we will post the build eventConvenienceSymlinksIdentified to the BuildEventProtocol.
      If the value is true, the BuildEventProtocol will have an entry for convenienceSymlinksIdentified,
      listing all of the convenience symlinks created in your workspace. If false,
      then the convenienceSymlinksIdentified entry in the BuildEventProtocol will
      be empty.
    --local_termination_grace_seconds: Time to wait between terminating a local process
      due to timeout and forcefully shutting it down.
    --noexpand_test_suites: 'Expand test_suite targets into their constituent tests
      before analysis. When this flag is turned on (the default), negative target
      patterns will apply to the tests belonging to the test suite, otherwise they
      will not. Turning off this flag is useful when top-level aspects are applied
      at command line: then they can analyze test_suite targets.'
    --directory_creation_cache: Describes the cache used to store known regular directories
      as they're created. Parent directories of output files are created on-demand
      during action execution.
    --output_filter: Only shows warnings and action outputs for rules with a name
      matching the provided regular expression.
    --nolegacy_important_outputs: Use this to suppress generation of the legacy important_outputs
      field in the TargetComplete event. important_outputs are required for Bazel
      to ResultStore/BTX integration.
    --noexperimental_extra_action_top_level_only: Deprecated in favor of aspects.
      Only schedules extra_actions for top level targets.
    --experimental_materialize_param_files_directly: If materializing param files,
      do so with direct writes to disk.
    --noverbose_explanations: Increases the verbosity of the explanations issued if
      --explain is enabled. Has no effect if --explain is not enabled.
    --experimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --use_action_cache: Whether to use the action cache
    --noexperimental_skyframe_target_pattern_evaluator: Use the Skyframe-based target
      pattern evaluator; implies --experimental_interleave_loading_and_analysis.
    --experimental_build_event_upload_strategy: Selects how to upload artifacts referenced
      in the build event protocol.
    --local_extra_resources: Set the number of extra resources available to Bazel.
      Takes in a string-float pair. Can be used multiple times to specify multiple
      types of extra resources. Bazel will limit concurrently running actions based
      on the available extra resources and the extra resources required. Tests can
      declare the amount of extra resources they need by using a tag of the "resources:<resoucename>:<amount>"
      format. Available CPU, RAM and resources cannot be set with this flag.
    --loading_phase_threads: Number of parallel threads to use for the loading/analysis
      phase.Takes an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally
      followed by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" sets
      a reasonable default based on host resources. Must be at least 1.
    --experimental_remote_cache_eviction_retries: The maximum number of attempts to
      retry if the build encountered a transient remote cache error that would otherwise
      fail the build. Applies for example when artifacts are evicted from the remote
      cache, or in certain cache failure conditions. A non-zero value will implicitly
      set --incompatible_remote_use_new_exit_code_for_lost_inputs to true. A new invocation
      id will be generated for each attempt. If you generate invocation id and provide
      it to Bazel with --invocation_id, you should not use this flag. Instead, set
      flag --incompatible_remote_use_new_exit_code_for_lost_inputs and check for the
      exit code 39.
    --nocanonicalize_policy: Output the canonical policy, after expansion and filtering.
      To keep the output clean, the canonicalized command arguments will NOT be shown
      when this option is set to true. Note that the command specified by --for_command
      affects the filtered policy, and if none is specified, the default command is
      'build'.
    --for_command: The command for which the options should be canonicalized.
    --experimental_remote_analysis_cache_mode: The transport direction for the remote
      analysis cache.
    --expand_test_suites: 'Expand test_suite targets into their constituent tests
      before analysis. When this flag is turned on (the default), negative target
      patterns will apply to the tests belonging to the test suite, otherwise they
      will not. Turning off this flag is useful when top-level aspects are applied
      at command line: then they can analyze test_suite targets.'
    --experimental_skyframe_cpu_heavy_skykeys_thread_pool_size: 'If set to a positive
      value (e.g. "HOST_CPUS*1.5"), Skyframe will run the loading/analysis phase with
      2 separate thread pools: 1 with <value> threads (ideally close to HOST_CPUS)
      reserved for CPU-heavy SkyKeys, and 1 "standard" thread pool (whose size is
      controlled by --loading_phase_threads) for the rest.'
    --max_test_output_bytes: Specifies maximum per-test-log size that can be emitted
      when --test_output is 'errors' or 'all'. Useful for avoiding overwhelming the
      output with excessively noisy test output. The test header is included in the
      log size. Negative values imply no limit. Output is all or nothing.
    --experimental_merged_skyframe_analysis_execution: If this flag is set, the analysis
      and execution phases of Skyframe are merged.
    --target_pattern_file: If set, build will read patterns from the file named here,
      rather than on the command line. It is an error to specify a file here as well
      as command-line patterns.
    --noexperimental_process_wrapper_graceful_sigterm: When true, make the process-wrapper
      propagate SIGTERMs (used by the dynamic scheduler to stop process trees) to
      the subprocesses themselves, giving them the grace period in --local_termination_grace_seconds
      before forcibly sending a SIGKILL.
    --experimental_skyfocus_handling_strategy: Strategies for Skyfocus to handle changes
      outside of the working set.
    --incompatible_remote_use_new_exit_code_for_lost_inputs: If set to true, Bazel
      will use new exit code 39 instead of 34 if remote cacheerrors, including cache
      evictions, cause the build to fail.
    --experimental_skyframe_target_pattern_evaluator: Use the Skyframe-based target
      pattern evaluator; implies --experimental_interleave_loading_and_analysis.
    --noincompatible_skip_genfiles_symlink: If set to true, the genfiles symlink will
      not be created. For more information, see https://github.com/bazelbuild/bazel/issues/8651
    --experimental_enable_skyfocus: If true, enable the use of --experimental_working_set
      to reduce Bazel's memory footprint for incremental builds. This feature is known
      as Skyfocus.
    --build_manual_tests: Forces test targets tagged 'manual' to be built. 'manual'
      tests are excluded from processing. This option forces them to be built (but
      not executed).
    --experimental_aquery_dump_after_build_format: 'Writes the state of Skyframe (which
      includes previous invocations on this blaze instance as well) after a build.
      Output is streamed remotely unless local output is requested with --experimental_aquery_dump_after_build_output_file.  Does
      not honor aquery flags for --include_*, but uses the same defaults, except for
      --include_commandline=false. Possible output formats: proto|streamed_proto|textproto|jsonproto.
      Using this will disable Skymeld.'
    --build_tag_filters: Specifies a comma-separated list of tags. Each tag can be
      optionally preceded with '-' to specify excluded tags. Only those targets will
      be built that contain at least one included tag and do not contain any excluded
      tags. This option does not affect the set of tests executed with the 'test'
      command; those are be governed by the test filtering options, for example '--test_tag_filters'
    --noexperimental_use_semaphore_for_jobs: If set to true, additionally use semaphore
      to limit number of concurrent jobs.
    --experimental_aquery_dump_after_build_output_file: Specify the output file for
      the aquery dump after a build. Use in conjunction with --experimental_aquery_dump_after_build_format.
      The path provided is relative to Bazel's output base, unless it's an absolute
      path. Using this will disable Skymeld.
    --local_test_jobs: The max number of local test jobs to run concurrently. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". 0 means local resources
      will limit the number of local test jobs to run concurrently instead. Setting
      this greater than the value for --jobs is ineffectual.
    --norewind_lost_inputs: Whether to use action rewinding to recover from lost inputs.
    --test_tmpdir: Specifies the base temporary directory for 'bazel test' to use.
    --experimental_build_event_fully_resolve_fileset_symlinks: If true, fully resolve
      relative Fileset symlinks in the BEP when presenting output files. Requires
      --experimental_build_event_expand_filesets.
    --noincompatible_remote_use_new_exit_code_for_lost_inputs: If set to true, Bazel
      will use new exit code 39 instead of 34 if remote cacheerrors, including cache
      evictions, cause the build to fail.
    --execution_log_compact_file: 'Log the executed spawns into this file as length-delimited
      ExecLogEntry protos, according to src/main/protobuf/spawn.proto. The entire
      file is zstd compressed. Related flags: --execution_log_binary_file (binary
      protobuf format; mutually exclusive), --execution_log_json_file (text JSON format;
      mutually exclusive), --subcommands (for displaying subcommands in terminal output).'
    --hide_aspect_results: Comma-separated list of aspect names to not display in
      results (see --show_result). Useful for keeping aspects added by wrappers which
      are typically not interesting to end users out of console output.
  description: Canonicalizes a list of %{product} options.
- name: clean
  flags:
    --noexecution_log_sort: Whether to sort the execution log, making it easier to
      compare logs across invocations. Set to false to avoid potentially significant
      CPU and memory usage at the end of the invocation, at the cost of producing
      the log in nondeterministic execution order. Only applies to the binary and
      JSON formats; the compact format is never sorted.
    --incompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --noexperimental_stats_summary: Enable a modernized summary of the build stats.
    --check_tests_up_to_date: Don't run tests, just check if they are up-to-date.  If
      all tests results are up-to-date, the testing completes successfully.  If any
      test needs to be built or executed, an error is reported and the testing fails.  This
      option implies --check_up_to_date behavior.
    --noexperimental_merged_skyframe_analysis_execution: If this flag is set, the
      analysis and execution phases of Skyframe are merged.
    --test_keep_going: When disabled, any non-passing test will cause the entire build
      to stop. By default all tests are run, even if some do not pass.
    --experimental_skyfocus_dump_keys: For debugging Skyfocus. Dump the focused SkyKeys
      (roots, leafs, focused deps, focused rdeps).
    --check_up_to_date: Don't perform the build, just check if it is up-to-date.  If
      all targets are up-to-date, the build completes successfully.  If any step needs
      to be executed an error is reported and the build fails.
    --nomaterialize_param_files: Writes intermediate parameter files to output tree
      even when using remote action execution. Useful when debugging actions. This
      is implied by --subcommands and --verbose_failures.
    --version_window_for_dirty_node_gc: Nodes that have been dirty for more than this
      many versions will be deleted from the graph upon the next update. Values must
      be non-negative long integers, or -1 indicating the maximum possible window.
    --test_summary: Specifies the desired format of the test summary. Valid values
      are 'short' to print information only about tests executed, 'terse', to print
      information only about unsuccessful tests that were run, 'detailed' to print
      detailed information about failed test cases, 'testcase' to print summary in
      test case resolution, do not print detailed information about failed test cases
      and 'none' to omit the summary.
    --local_resources: Set the number of resources available to Bazel. Takes in an
      assignment to a float or HOST_RAM/HOST_CPUS, optionally followed by [-|*]<float>
      (eg. memory=HOST_RAM*.5 to use half the available RAM). Can be used multiple
      times to specify multiple types of resources. Bazel will limit concurrently
      running actions based on the available resources and the resources required.
      Tests can declare the amount of resources they need by using a tag of the "resources:<resource
      name>:<amount>" format. Overrides resources specified by --local_{cpu|ram|extra}_resources.
    --rewind_lost_inputs: Whether to use action rewinding to recover from lost inputs.
    --noexperimental_local_lockfree_output: When true, the local spawn runner doesn't
      lock the output tree during dynamic execution. Instead, spawns are allowed to
      execute until they are explicitly interrupted by a faster remote action.
    --build: Execute the build; this is the usual behaviour. Specifying --nobuild
      causes the build to stop before executing the build actions, returning zero
      iff the package loading and analysis phases completed successfully; this mode
      is useful for testing those phases.
    --noincompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --expunge_async: If specified, clean asynchronously removes the entire working
      tree for this %{product} instance, which includes all %{product}-created temporary
      and build output files, and stops the %{product} server if it is running. When
      this command completes, it will be safe to execute new commands in the same
      client, even though the deletion may continue in the background.
    --async: If true, output cleaning is asynchronous. When this command completes,
      it will be safe to execute new commands in the same client, even though the
      deletion may continue in the background.
    --enforce_project_configs: If true, interactive builds may only pass the --scl_config
      build flag; they may not use any other build flags. --scl_config must be set
      to an officially suported project configuration. Supported configurations are
      defined in the target's PROJECT.scl, which can be found by walking up the target's
      packagge path. See b/324126745.
    --aspects: Comma-separated list of aspects to be applied to top-level targets.
      In the list, if aspect some_aspect specifies required aspect providers via required_aspect_providers,
      some_aspect will run after every aspect that was mentioned before it in the
      aspects list whose advertised providers satisfy some_aspect required aspect
      providers. Moreover, some_aspect will run after all its required aspects specified
      by requires attribute. some_aspect will then have access to the values of those
      aspects' providers. <bzl-file-label>%<aspect_name>, for example '//tools:my_def.bzl%my_aspect',
      where 'my_aspect' is a top-level value from a file tools/my_def.bzl
    --nobuild_tests_only: If specified, only *_test and test_suite rules will be built
      and other targets specified on the command line will be ignored. By default
      everything that was requested will be built.
    --fetch: Allows the command to fetch external dependencies. If set to false, the
      command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --noexperimental_materialize_param_files_directly: If materializing param files,
      do so with direct writes to disk.
    --show_result: |-
      Show the results of the build.  For each target, state whether or not it was brought up-to-date, and if so, a list of output files that were built.  The printed files are convenient strings for copy+pasting to the shell, to execute them.
      This option requires an integer argument, which is the threshold number of targets above which result information is not printed. Thus zero causes suppression of the message and MAX_INT causes printing of the result to occur always. The default is one.
      If nothing was built for a target its results may be omitted to keep the output under the threshold.
    --noenforce_project_configs: If true, interactive builds may only pass the --scl_config
      build flag; they may not use any other build flags. --scl_config must be set
      to an officially suported project configuration. Supported configurations are
      defined in the target's PROJECT.scl, which can be found by walking up the target's
      packagge path. See b/324126745.
    --execution_log_sort: Whether to sort the execution log, making it easier to compare
      logs across invocations. Set to false to avoid potentially significant CPU and
      memory usage at the end of the invocation, at the cost of producing the log
      in nondeterministic execution order. Only applies to the binary and JSON formats;
      the compact format is never sorted.
    --output_tree_tracking: If set, tell the output service (if any) to track when
      files in the output tree have been modified externally (not by the build system).
      This should improve incremental build speed when an appropriate output service
      is enabled.
    --noexperimental_enable_skyfocus: If true, enable the use of --experimental_working_set
      to reduce Bazel's memory footprint for incremental builds. This feature is known
      as Skyfocus.
    --test_strategy: Specifies which strategy to use when running tests.
    --spawn_strategy: Specify how spawn actions are executed by default. Accepts a
      comma-separated list of strategies from highest to lowest priority. For each
      action Bazel picks the strategy with the highest priority that can execute the
      action. The default value is "remote,worker,sandboxed,local". See https://blog.bazel.build/2019/06/19/list-strategy.html
      for details.
    --nodiscard_analysis_cache: Discard the analysis cache immediately after the analysis
      phase completes. Reduces memory usage by ~10%, but makes further incremental
      builds slower.
    --experimental_skyfocus_dump_post_gc_stats: For debugging Skyfocus. If enabled,
      trigger manual GC before/after focusing to report heap sizes reductions. This
      will increase the Skyfocus latency.
    --noexperimental_build_event_expand_filesets: If true, expand Filesets in the
      BEP when presenting output files.
    --nokeep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --noexperimental_use_validation_aspect: Whether to run validation actions using
      aspect (for parallelism with tests).
    --nocheck_tests_up_to_date: Don't run tests, just check if they are up-to-date.  If
      all tests results are up-to-date, the testing completes successfully.  If any
      test needs to be built or executed, an error is reported and the testing fails.  This
      option implies --check_up_to_date behavior.
    --nobuild: Execute the build; this is the usual behaviour. Specifying --nobuild
      causes the build to stop before executing the build actions, returning zero
      iff the package loading and analysis phases completed successfully; this mode
      is useful for testing those phases.
    --experimental_extra_action_top_level_only: Deprecated in favor of aspects. Only
      schedules extra_actions for top level targets.
    --build_event_upload_max_retries: The maximum number of times Bazel should retry
      uploading a build event.
    --test_timeout_filters: Specifies a comma-separated list of test timeouts. Each
      timeout can be optionally preceded with '-' to specify excluded timeouts. Only
      those test targets will be found that contain at least one included timeout
      and do not contain any excluded timeouts. This option affects --build_tests_only
      behavior and the test command.
    --experimental_remote_analysis_cache_deadline: Deadline to use for remote analysis
      cache operations.
    -s, --subcommands: 'Display the subcommands executed during a build. Related flags:
      --execution_log_json_file, --execution_log_binary_file (for logging subcommands
      to a file in a tool-friendly format).'
    --deleted_packages: |-
      A comma-separated list of names of packages which the build system will consider non-existent, even if they are visible somewhere on the package path.
      Use this option when deleting a subpackage 'x/y' of an existing package 'x'.  For example, after deleting x/y/BUILD in your client, the build system may complain if it encounters a label '//x:y/z' if that is still provided by another package_path entry.  Specifying --deleted_packages x/y avoids this problem.
    --default_visibility: Default visibility for packages that don't set it explicitly
      ('public' or 'private').
    --nouse_action_cache: Whether to use the action cache
    --experimental_stream_log_file_uploads: Stream log file uploads directly to the
      remote storage rather than writing them to disk.
    --noexperimental_async_execution: If set to true, Bazel is allowed to run action
      in a virtual thread. The number of actions in flight is still capped with --jobs.
    --nooutput_tree_tracking: If set, tell the output service (if any) to track when
      files in the output tree have been modified externally (not by the build system).
      This should improve incremental build speed when an appropriate output service
      is enabled.
    --notest_keep_going: When disabled, any non-passing test will cause the entire
      build to stop. By default all tests are run, even if some do not pass.
    --noallow_analysis_cache_discard: If discarding the analysis cache due to a change
      in the build system, setting this option to false will cause bazel to exit,
      rather than continuing with the build. This option has no effect when 'discard_analysis_cache'
      is also set.
    --strategy_regexp: 'Override which spawn strategy should be used to execute spawn
      actions that have descriptions matching a certain regex_filter. See --per_file_copt
      for details onregex_filter matching. The last regex_filter that matches the
      description is used. This option overrides other flags for specifying strategy.
      Example: --strategy_regexp=//foo.*\\.cc,-//foo/bar=local means to run actions
      using local strategy if their descriptions match //foo.*.cc but not //foo/bar.
      Example: --strategy_regexp=''Compiling.*/bar=local  --strategy_regexp=Compiling=sandboxed
      will run ''Compiling //foo/bar/baz'' with the ''local'' strategy, but reversing
      the order would run it with ''sandboxed''. '
    --experimental_remote_analysis_cache_concurrency: Target concurrency for remote
      analysis caching RPCs.
    --nofetch: Allows the command to fetch external dependencies. If set to false,
      the command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --noasync: If true, output cleaning is asynchronous. When this command completes,
      it will be safe to execute new commands in the same client, even though the
      deletion may continue in the background.
    --experimental_stats_summary: Enable a modernized summary of the build stats.
    --discard_analysis_cache: Discard the analysis cache immediately after the analysis
      phase completes. Reduces memory usage by ~10%, but makes further incremental
      builds slower.
    --package_path: A colon-separated list of where to look for packages. Elements
      beginning with '%workspace%' are relative to the enclosing workspace. If omitted
      or empty, the default is the output of 'bazel info default-package-path'.
    --compile_one_dependency: Compile a single dependency of the argument files. This
      is useful for syntax checking source files in IDEs, for example, by rebuilding
      a single target that depends on the source file to detect errors as early as
      possible in the edit/build/test cycle. This argument affects the way all non-flag
      arguments are interpreted; instead of being targets to build they are source
      filenames.  For each source filename an arbitrary target that depends on it
      will be built.
    --experimental_use_semaphore_for_jobs: If set to true, additionally use semaphore
      to limit number of concurrent jobs.
    --experimental_build_event_output_group_mode: 'Specify how an output group''s
      files will be represented in TargetComplete/AspectComplete BEP events. Values
      are an assignment of an output group name to one of ''NAMED_SET_OF_FILES_ONLY'',
      ''INLINE_ONLY'', or ''BOTH''. The default value is ''NAMED_SET_OF_FILES_ONLY''.
      If an output group is repeated, the final value to appear is used. The default
      value sets the mode for coverage artifacts to BOTH: --experimental_build_event_output_group_mode=baseline.lcov=both'
    --noexperimental_split_xml_generation: If this flag is set, and a test action
      does not generate a test.xml file, then Bazel uses a separate action to generate
      a dummy test.xml file containing the test log. Otherwise, Bazel generates a
      test.xml as part of the test action.
    --verbose_failures: If a command fails, print out the full command line.
    --legacy_globbing_threads: Number of threads to use for glob evaluation. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" means to use
      a reasonable value derived from the machine's hardware profile (e.g. the number
      of processors).
    --norun_validations: Whether to run validation actions as part of the build. See
      https://bazel.build/extending/rules#validation_actions
    --noverbose_failures: If a command fails, print out the full command line.
    --experimental_build_event_expand_filesets: If true, expand Filesets in the BEP
      when presenting output files.
    --incompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --noskip_incompatible_explicit_targets: 'Skip incompatible targets that are explicitly
      listed on the command line. By default, building such targets results in an
      error but they are silently skipped when this option is enabled. See: https://bazel.build/extending/platforms#skipping-incompatible-targets'
    --noexperimental_bep_target_summary: Whether to publish TargetSummary events.
    --nocompile_one_dependency: Compile a single dependency of the argument files.
      This is useful for syntax checking source files in IDEs, for example, by rebuilding
      a single target that depends on the source file to detect errors as early as
      possible in the edit/build/test cycle. This argument affects the way all non-flag
      arguments are interpreted; instead of being targets to build they are source
      filenames.  For each source filename an arbitrary target that depends on it
      will be built.
    --noexperimental_enable_critical_path_profiling: If set (the default), critical
      path profiling is enabled for the execution phase. This has a slight overhead
      in RAM and CPU, and may prevent Bazel from making certain aggressive RAM optimizations
      in some cases.
    --experimental_oom_sensitive_skyfunctions_semaphore_size: 'Sets the size of the
      semaphore used to prevent SkyFunctions with large peak memory requirement from
      OOM-ing blaze. A value of 0 indicates that no semaphore should be used. Example
      value: "HOST_CPUS*0.5".'
    --experimental_convenience_symlinks: |-
      This flag controls how the convenience symlinks (the symlinks that appear in the workspace after the build) will be managed. Possible values:
        normal (default): Each kind of convenience symlink will be created or deleted, as determined by the build.
        clean: All symlinks will be unconditionally deleted.
        ignore: Symlinks will not be created or cleaned up.
        log_only: Generate log messages as if 'normal' were passed, but don't actually perform any filesystem operations (useful for tools).
      Note that only symlinks whose names are generated by the current value of --symlink_prefix can be affected; if the prefix changes, any pre-existing symlinks will be left alone.
    --experimental_build_event_upload_retry_minimum_delay: 'Initial, minimum delay
      for exponential backoff retries when BEP upload fails. (exponent: 1.6)'
    --noanalyze: Execute the loading/analysis phase; this is the usual behaviour.
      Specifying --noanalyzecauses the build to stop before starting the loading/analysis
      phase, just doing target pattern parsing and returning zero iff that completed
      successfully; this mode is useful for testing.
    --experimental_skyframe_memory_dump: 'Dump the memory use of individual nodes
      in the Skyframe graph after the build. This option takes a number of flags separated
      by commas: ''json'' (no-op, that''s the only format), ''notransient'' (don''t
      traverse transient fields), ''noconfig'' (ignore objects related to configurations),
      ''noprecomputed'' (ignore precomputed values) and ''noworkspacestatus'' (ignore
      objects related to the workspace status machinery)'
    --experimental_run_bep_event_include_residue: Whether to include the command-line
      residue in run build events which could contain the residue. By default, the
      residue is not included in run command build events that could contain the residue.
    --experimental_max_directories_to_eagerly_visit_in_globbing: If non-negative,
      the first time a glob is evaluated in a package, the subdirectories of the package
      will be traversed in order to warm filesystem caches and compensate for lack
      of parallelism in globbing. At most this many directories will be visited.
    --verbose_explanations: Increases the verbosity of the explanations issued if
      --explain is enabled. Has no effect if --explain is not enabled.
    --noexpunge: If true, clean removes the entire working tree for this %{product}
      instance, which includes all %{product}-created temporary and build output files,
      and stops the %{product} server if it is running.
    --materialize_param_files: Writes intermediate parameter files to output tree
      even when using remote action execution. Useful when debugging actions. This
      is implied by --subcommands and --verbose_failures.
    -j, --jobs: The number of concurrent jobs to run. Takes an integer, or a keyword
      ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed by an operation ([-|*]<float>)
      eg. "auto", "HOST_CPUS*.5". Values must be between 1 and 5000. Values above
      2500 may cause memory issues. "auto" calculates a reasonable default based on
      host resources.
    --experimental_extra_action_filter: Deprecated in favor of aspects. Filters set
      of targets to schedule extra_actions for.
    --experimental_split_xml_generation: If this flag is set, and a test action does
      not generate a test.xml file, then Bazel uses a separate action to generate
      a dummy test.xml file containing the test log. Otherwise, Bazel generates a
      test.xml as part of the test action.
    --experimental_process_wrapper_graceful_sigterm: When true, make the process-wrapper
      propagate SIGTERMs (used by the dynamic scheduler to stop process trees) to
      the subprocesses themselves, giving them the grace period in --local_termination_grace_seconds
      before forcibly sending a SIGKILL.
    --test_tag_filters: Specifies a comma-separated list of test tags. Each tag can
      be optionally preceded with '-' to specify excluded tags. Only those test targets
      will be found that contain at least one included tag and do not contain any
      excluded tags. This option affects --build_tests_only behavior and the test
      command.
    --symlink_prefix: 'The prefix that is prepended to any of the convenience symlinks
      that are created after a build. If omitted, the default value is the name of
      the build tool followed by a hyphen. If ''/'' is passed, then no symlinks are
      created and no warning is emitted. Warning: the special functionality for ''/''
      will be deprecated soon; use --experimental_convenience_symlinks=ignore instead.'
    --output_groups: A list of comma-separated output group names, each of which optionally
      prefixed by a + or a -. A group prefixed by + is added to the default set of
      output groups, while a group prefixed by - is removed from the default set.
      If at least one group is not prefixed, the default set of output groups is omitted.
      For example, --output_groups=+foo,+bar builds the union of the default set,
      foo, and bar, while --output_groups=foo,bar overrides the default set such that
      only foo and bar are built.
    --max_config_changes_to_show: When discarding the analysis cache due to a change
      in the build options, displays up to the given number of changed option names.
      If the number given is -1, all changed options will be displayed.
    --experimental_enable_critical_path_profiling: If set (the default), critical
      path profiling is enabled for the execution phase. This has a slight overhead
      in RAM and CPU, and may prevent Bazel from making certain aggressive RAM optimizations
      in some cases.
    --experimental_cpu_load_scheduling_window_size: The size of window during experimental
      scheduling of action based on CPU load. Make sense to define only when flag
      --experimental_cpu_load_scheduling is enabled.
    --incompatible_skip_genfiles_symlink: If set to true, the genfiles symlink will
      not be created. For more information, see https://github.com/bazelbuild/bazel/issues/8651
    --experimental_local_lockfree_output: When true, the local spawn runner doesn't
      lock the output tree during dynamic execution. Instead, spawns are allowed to
      execute until they are explicitly interrupted by a faster remote action.
    --noincompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --show_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --nobuild_manual_tests: Forces test targets tagged 'manual' to be built. 'manual'
      tests are excluded from processing. This option forces them to be built (but
      not executed).
    --test_lang_filters: Specifies a comma-separated list of test languages. Each
      language can be optionally preceded with '-' to specify excluded languages.
      Only those test targets will be found that are written in the specified languages.
      The name used for each language should be the same as the language prefix in
      the *_test rule, e.g. one of 'cc', 'java', 'py', etc. This option affects --build_tests_only
      behavior and the test command.
    --experimental_cpu_load_scheduling: Enables the experimental local execution scheduling
      based on CPU load, not estimation of actions one by one.  Experimental scheduling
      have showed the large benefit on a large local builds on a powerful machines
      with the large number of cores. Reccommended to use with --local_resources=cpu=HOST_CPUS
    --test_output: Specifies desired output mode. Valid values are 'summary' to output
      only test status summary, 'errors' to also print test logs for failed tests,
      'all' to print logs for all tests and 'streamed' to output logs for all tests
      in real time (this will force tests to be executed locally one at a time regardless
      of --test_strategy value).
    --run_validations: Whether to run validation actions as part of the build. See
      https://bazel.build/extending/rules#validation_actions
    --experimental_async_execution: If set to true, Bazel is allowed to run action
      in a virtual thread. The number of actions in flight is still capped with --jobs.
    --execution_log_binary_file: 'Log the executed spawns into this file as length-delimited
      SpawnExec protos, according to src/main/protobuf/spawn.proto. Prefer --execution_log_compact_file,
      which is significantly smaller and cheaper to produce. Related flags: --execution_log_compact_file
      (compact format; mutually exclusive), --execution_log_json_file (text JSON format;
      mutually exclusive), --execution_log_sort (whether to sort the execution log),
      --subcommands (for displaying subcommands in terminal output).'
    --nocheck_up_to_date: Don't perform the build, just check if it is up-to-date.  If
      all targets are up-to-date, the build completes successfully.  If any step needs
      to be executed an error is reported and the build fails.
    --legacy_important_outputs: Use this to suppress generation of the legacy important_outputs
      field in the TargetComplete event. important_outputs are required for Bazel
      to ResultStore/BTX integration.
    --cache_computed_file_digests: If greater than 0, configures Bazel to cache file
      digests in memory based on their metadata instead of recomputing the digests
      from disk every time they are needed. Setting this to 0 ensures correctness
      because not all file changes can be noted from file metadata. When not 0, the
      number indicates the size of the cache as the number of file digests to be cached.
    --experimental_working_set: The working set for Skyfocus. Specify as comma-separated
      workspace root-relative paths. This is a stateful flag. Defining a working set
      persists it for subsequent invocations, until it is redefined with a new set.
    --strategy: Specify how to distribute compilation of other spawn actions. Accepts
      a comma-separated list of strategies from highest to lowest priority. For each
      action Bazel picks the strategy with the highest priority that can execute the
      action. The default value is "remote,worker,sandboxed,local". This flag overrides
      the values set by --spawn_strategy (and --genrule_strategy if used with mnemonic
      Genrule). See https://blog.bazel.build/2019/06/19/list-strategy.html for details.
    --experimental_bep_target_summary: Whether to publish TargetSummary events.
    --build_tests_only: If specified, only *_test and test_suite rules will be built
      and other targets specified on the command line will be ignored. By default
      everything that was requested will be built.
    --allow_analysis_cache_discard: If discarding the analysis cache due to a change
      in the build system, setting this option to false will cause bazel to exit,
      rather than continuing with the build. This option has no effect when 'discard_analysis_cache'
      is also set.
    --local_cpu_resources: Explicitly set the total number of local CPU cores available
      to Bazel to spend on build actions executed locally. Takes an integer, or "HOST_CPUS",
      optionally followed by [-|*]<float> (eg. HOST_CPUS*.5 to use half the available
      CPU cores). By default, ("HOST_CPUS"), Bazel will query system configuration
      to estimate the number of CPU cores available.
    --noshow_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --noexperimental_cpu_load_scheduling: Enables the experimental local execution
      scheduling based on CPU load, not estimation of actions one by one.  Experimental
      scheduling have showed the large benefit on a large local builds on a powerful
      machines with the large number of cores. Reccommended to use with --local_resources=cpu=HOST_CPUS
    --noexperimental_stream_log_file_uploads: Stream log file uploads directly to
      the remote storage rather than writing them to disk.
    --noexperimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --allowed_local_actions_regex: A regex whitelist for action types which may be
      run locally. If unset, all actions are allowed to execute locally
    --experimental_fsvc_threads: The number of threads that are used by the FileSystemValueChecker.
    --serialized_frontier_profile: Dump a profile of serialized frontier bytes. Specifies
      the output path.
    --noexperimental_build_event_fully_resolve_fileset_symlinks: If true, fully resolve
      relative Fileset symlinks in the BEP when presenting output files. Requires
      --experimental_build_event_expand_filesets.
    --genrule_strategy: Specify how to execute genrules. This flag will be phased
      out. Instead, use --spawn_strategy=<value> to control all actions or --strategy=Genrule=<value>
      to control genrules only.
    --experimental_skymeld_analysis_overlap_percentage: The value represents the %
      of the analysis phase which will be overlapped with the execution phase. A value
      of x means Skyframe will queue up execution tasks and wait until there's x%
      of the top level target left to be analyzed before allowing them to launch.
      When the value is 0%, we'd wait for all analysis to finish before executing
      (no overlap). When it's 100%, the phases are free to overlap as much as they
      can.
    --aspects_parameters: Specifies the values of the command-line aspects parameters.
      Each parameter value is specified via <param_name>=<param_value>, for example
      'my_param=my_val' where 'my_param' is a parameter of some aspect in --aspects
      list or required by an aspect in the list. This option can be used multiple
      times. However, it is not allowed to assign values to the same parameter more
      than once.
    --expunge: If true, clean removes the entire working tree for this %{product}
      instance, which includes all %{product}-created temporary and build output files,
      and stops the %{product} server if it is running.
    --progress_report_interval: The number of seconds to wait between reports on still
      running jobs. The default value 0 means the first report will be printed after
      10 seconds, then 30 seconds and after that progress is reported once every minute.
      When --curses is enabled, progress is reported every second.
    --test_size_filters: Specifies a comma-separated list of test sizes. Each size
      can be optionally preceded with '-' to specify excluded sizes. Only those test
      targets will be found that contain at least one included size and do not contain
      any excluded sizes. This option affects --build_tests_only behavior and the
      test command.
    --noexperimental_convenience_symlinks_bep_event: This flag controls whether or
      not we will post the build eventConvenienceSymlinksIdentified to the BuildEventProtocol.
      If the value is true, the BuildEventProtocol will have an entry for convenienceSymlinksIdentified,
      listing all of the convenience symlinks created in your workspace. If false,
      then the convenienceSymlinksIdentified entry in the BuildEventProtocol will
      be empty.
    --experimental_remote_analysis_cache: The URL for the remote analysis caching
      backend.
    --noexperimental_skyfocus_dump_post_gc_stats: For debugging Skyfocus. If enabled,
      trigger manual GC before/after focusing to report heap sizes reductions. This
      will increase the Skyfocus latency.
    --flaky_test_attempts: 'Each test will be retried up to the specified number of
      times in case of any test failure. Tests that required more than one attempt
      to pass are marked as ''FLAKY'' in the test summary. Normally the value specified
      is just an integer or the string ''default''. If an integer, then all tests
      will be run up to N times. If ''default'', then only a single test attempt will
      be made for regular tests and three for tests marked explicitly as flaky by
      their rule (flaky=1 attribute). Alternate syntax: regex_filter@flaky_test_attempts.
      Where flaky_test_attempts is as above and regex_filter stands for a list of
      include and exclude regular expression patterns (Also see --runs_per_test).
      Example: --flaky_test_attempts=//foo/.*,-//foo/bar/.*@3 deflakes all tests in
      //foo/ except those under foo/bar three times. This option can be passed multiple
      times. The most recently passed argument that matches takes precedence. If nothing
      matches, behavior is as if ''default'' above.'
    --experimental_local_retries_on_crash: Number of times to retry a local action
      when we detect that it crashed. This exists to workaround a bug in OSXFUSE which
      is tickled by the use of the dynamic scheduler and --experimental_local_lockfree_output
      due to constant process churn. The bug can be triggered by a cancelled process
      that ran *before* the process we are trying to run, introducing corruption in
      its file reads.
    --local_ram_resources: Explicitly set the total amount of local host RAM (in MB)
      available to Bazel to spend on build actions executed locally. Takes an integer,
      or "HOST_RAM", optionally followed by [-|*]<float> (eg. HOST_RAM*.5 to use half
      the available RAM). By default, ("HOST_RAM*.67"), Bazel will query system configuration
      to estimate the amount of RAM available and will use 67% of it.
    --experimental_use_validation_aspect: Whether to run validation actions using
      aspect (for parallelism with tests).
    -k, --keep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --noexperimental_run_bep_event_include_residue: Whether to include the command-line
      residue in run build events which could contain the residue. By default, the
      residue is not included in run command build events that could contain the residue.
    --analyze: Execute the loading/analysis phase; this is the usual behaviour. Specifying
      --noanalyzecauses the build to stop before starting the loading/analysis phase,
      just doing target pattern parsing and returning zero iff that completed successfully;
      this mode is useful for testing.
    --execution_log_json_file: 'Log the executed spawns into this file as newline-delimited
      JSON representations of SpawnExec protos, according to src/main/protobuf/spawn.proto.
      Prefer --execution_log_compact_file, which is significantly smaller and cheaper
      to produce. Related flags: --execution_log_compact_file (compact format; mutually
      exclusive), --execution_log_binary_file (binary protobuf format; mutually exclusive),
      --execution_log_sort (whether to sort the execution log), --subcommands (for
      displaying subcommands in terminal output).'
    --explain: Causes the build system to explain each executed step of the build.
      The explanation is written to the specified log file.
    --skip_incompatible_explicit_targets: 'Skip incompatible targets that are explicitly
      listed on the command line. By default, building such targets results in an
      error but they are silently skipped when this option is enabled. See: https://bazel.build/extending/platforms#skipping-incompatible-targets'
    --experimental_convenience_symlinks_bep_event: This flag controls whether or not
      we will post the build eventConvenienceSymlinksIdentified to the BuildEventProtocol.
      If the value is true, the BuildEventProtocol will have an entry for convenienceSymlinksIdentified,
      listing all of the convenience symlinks created in your workspace. If false,
      then the convenienceSymlinksIdentified entry in the BuildEventProtocol will
      be empty.
    --local_termination_grace_seconds: Time to wait between terminating a local process
      due to timeout and forcefully shutting it down.
    --noexpand_test_suites: 'Expand test_suite targets into their constituent tests
      before analysis. When this flag is turned on (the default), negative target
      patterns will apply to the tests belonging to the test suite, otherwise they
      will not. Turning off this flag is useful when top-level aspects are applied
      at command line: then they can analyze test_suite targets.'
    --directory_creation_cache: Describes the cache used to store known regular directories
      as they're created. Parent directories of output files are created on-demand
      during action execution.
    --output_filter: Only shows warnings and action outputs for rules with a name
      matching the provided regular expression.
    --nolegacy_important_outputs: Use this to suppress generation of the legacy important_outputs
      field in the TargetComplete event. important_outputs are required for Bazel
      to ResultStore/BTX integration.
    --noexperimental_extra_action_top_level_only: Deprecated in favor of aspects.
      Only schedules extra_actions for top level targets.
    --experimental_materialize_param_files_directly: If materializing param files,
      do so with direct writes to disk.
    --noverbose_explanations: Increases the verbosity of the explanations issued if
      --explain is enabled. Has no effect if --explain is not enabled.
    --experimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --use_action_cache: Whether to use the action cache
    --noexperimental_skyframe_target_pattern_evaluator: Use the Skyframe-based target
      pattern evaluator; implies --experimental_interleave_loading_and_analysis.
    --experimental_build_event_upload_strategy: Selects how to upload artifacts referenced
      in the build event protocol.
    --local_extra_resources: Set the number of extra resources available to Bazel.
      Takes in a string-float pair. Can be used multiple times to specify multiple
      types of extra resources. Bazel will limit concurrently running actions based
      on the available extra resources and the extra resources required. Tests can
      declare the amount of extra resources they need by using a tag of the "resources:<resoucename>:<amount>"
      format. Available CPU, RAM and resources cannot be set with this flag.
    --loading_phase_threads: Number of parallel threads to use for the loading/analysis
      phase.Takes an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally
      followed by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" sets
      a reasonable default based on host resources. Must be at least 1.
    --experimental_remote_cache_eviction_retries: The maximum number of attempts to
      retry if the build encountered a transient remote cache error that would otherwise
      fail the build. Applies for example when artifacts are evicted from the remote
      cache, or in certain cache failure conditions. A non-zero value will implicitly
      set --incompatible_remote_use_new_exit_code_for_lost_inputs to true. A new invocation
      id will be generated for each attempt. If you generate invocation id and provide
      it to Bazel with --invocation_id, you should not use this flag. Instead, set
      flag --incompatible_remote_use_new_exit_code_for_lost_inputs and check for the
      exit code 39.
    --experimental_remote_analysis_cache_mode: The transport direction for the remote
      analysis cache.
    --expand_test_suites: 'Expand test_suite targets into their constituent tests
      before analysis. When this flag is turned on (the default), negative target
      patterns will apply to the tests belonging to the test suite, otherwise they
      will not. Turning off this flag is useful when top-level aspects are applied
      at command line: then they can analyze test_suite targets.'
    --experimental_skyframe_cpu_heavy_skykeys_thread_pool_size: 'If set to a positive
      value (e.g. "HOST_CPUS*1.5"), Skyframe will run the loading/analysis phase with
      2 separate thread pools: 1 with <value> threads (ideally close to HOST_CPUS)
      reserved for CPU-heavy SkyKeys, and 1 "standard" thread pool (whose size is
      controlled by --loading_phase_threads) for the rest.'
    --max_test_output_bytes: Specifies maximum per-test-log size that can be emitted
      when --test_output is 'errors' or 'all'. Useful for avoiding overwhelming the
      output with excessively noisy test output. The test header is included in the
      log size. Negative values imply no limit. Output is all or nothing.
    --experimental_merged_skyframe_analysis_execution: If this flag is set, the analysis
      and execution phases of Skyframe are merged.
    --target_pattern_file: If set, build will read patterns from the file named here,
      rather than on the command line. It is an error to specify a file here as well
      as command-line patterns.
    --noexperimental_process_wrapper_graceful_sigterm: When true, make the process-wrapper
      propagate SIGTERMs (used by the dynamic scheduler to stop process trees) to
      the subprocesses themselves, giving them the grace period in --local_termination_grace_seconds
      before forcibly sending a SIGKILL.
    --experimental_skyfocus_handling_strategy: Strategies for Skyfocus to handle changes
      outside of the working set.
    --incompatible_remote_use_new_exit_code_for_lost_inputs: If set to true, Bazel
      will use new exit code 39 instead of 34 if remote cacheerrors, including cache
      evictions, cause the build to fail.
    --experimental_skyframe_target_pattern_evaluator: Use the Skyframe-based target
      pattern evaluator; implies --experimental_interleave_loading_and_analysis.
    --noincompatible_skip_genfiles_symlink: If set to true, the genfiles symlink will
      not be created. For more information, see https://github.com/bazelbuild/bazel/issues/8651
    --experimental_enable_skyfocus: If true, enable the use of --experimental_working_set
      to reduce Bazel's memory footprint for incremental builds. This feature is known
      as Skyfocus.
    --build_manual_tests: Forces test targets tagged 'manual' to be built. 'manual'
      tests are excluded from processing. This option forces them to be built (but
      not executed).
    --experimental_aquery_dump_after_build_format: 'Writes the state of Skyframe (which
      includes previous invocations on this blaze instance as well) after a build.
      Output is streamed remotely unless local output is requested with --experimental_aquery_dump_after_build_output_file.  Does
      not honor aquery flags for --include_*, but uses the same defaults, except for
      --include_commandline=false. Possible output formats: proto|streamed_proto|textproto|jsonproto.
      Using this will disable Skymeld.'
    --build_tag_filters: Specifies a comma-separated list of tags. Each tag can be
      optionally preceded with '-' to specify excluded tags. Only those targets will
      be built that contain at least one included tag and do not contain any excluded
      tags. This option does not affect the set of tests executed with the 'test'
      command; those are be governed by the test filtering options, for example '--test_tag_filters'
    --noexperimental_use_semaphore_for_jobs: If set to true, additionally use semaphore
      to limit number of concurrent jobs.
    --experimental_aquery_dump_after_build_output_file: Specify the output file for
      the aquery dump after a build. Use in conjunction with --experimental_aquery_dump_after_build_format.
      The path provided is relative to Bazel's output base, unless it's an absolute
      path. Using this will disable Skymeld.
    --local_test_jobs: The max number of local test jobs to run concurrently. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". 0 means local resources
      will limit the number of local test jobs to run concurrently instead. Setting
      this greater than the value for --jobs is ineffectual.
    --norewind_lost_inputs: Whether to use action rewinding to recover from lost inputs.
    --test_tmpdir: Specifies the base temporary directory for 'bazel test' to use.
    --experimental_build_event_fully_resolve_fileset_symlinks: If true, fully resolve
      relative Fileset symlinks in the BEP when presenting output files. Requires
      --experimental_build_event_expand_filesets.
    --noincompatible_remote_use_new_exit_code_for_lost_inputs: If set to true, Bazel
      will use new exit code 39 instead of 34 if remote cacheerrors, including cache
      evictions, cause the build to fail.
    --execution_log_compact_file: 'Log the executed spawns into this file as length-delimited
      ExecLogEntry protos, according to src/main/protobuf/spawn.proto. The entire
      file is zstd compressed. Related flags: --execution_log_binary_file (binary
      protobuf format; mutually exclusive), --execution_log_json_file (text JSON format;
      mutually exclusive), --subcommands (for displaying subcommands in terminal output).'
    --hide_aspect_results: Comma-separated list of aspect names to not display in
      results (see --show_result). Useful for keeping aspects added by wrappers which
      are typically not interesting to end users out of console output.
  description: Removes output files and optionally stops the server.
- name: coverage
  flags:
    --noexecution_log_sort: Whether to sort the execution log, making it easier to
      compare logs across invocations. Set to false to avoid potentially significant
      CPU and memory usage at the end of the invocation, at the cost of producing
      the log in nondeterministic execution order. Only applies to the binary and
      JSON formats; the compact format is never sorted.
    --incompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --noexperimental_stats_summary: Enable a modernized summary of the build stats.
    --check_tests_up_to_date: Don't run tests, just check if they are up-to-date.  If
      all tests results are up-to-date, the testing completes successfully.  If any
      test needs to be built or executed, an error is reported and the testing fails.  This
      option implies --check_up_to_date behavior.
    --noexperimental_merged_skyframe_analysis_execution: If this flag is set, the
      analysis and execution phases of Skyframe are merged.
    --test_keep_going: When disabled, any non-passing test will cause the entire build
      to stop. By default all tests are run, even if some do not pass.
    --check_up_to_date: Don't perform the build, just check if it is up-to-date.  If
      all targets are up-to-date, the build completes successfully.  If any step needs
      to be executed an error is reported and the build fails.
    --experimental_skyfocus_dump_keys: For debugging Skyfocus. Dump the focused SkyKeys
      (roots, leafs, focused deps, focused rdeps).
    --nomaterialize_param_files: Writes intermediate parameter files to output tree
      even when using remote action execution. Useful when debugging actions. This
      is implied by --subcommands and --verbose_failures.
    --test_summary: Specifies the desired format of the test summary. Valid values
      are 'short' to print information only about tests executed, 'terse', to print
      information only about unsuccessful tests that were run, 'detailed' to print
      detailed information about failed test cases, 'testcase' to print summary in
      test case resolution, do not print detailed information about failed test cases
      and 'none' to omit the summary.
    --version_window_for_dirty_node_gc: Nodes that have been dirty for more than this
      many versions will be deleted from the graph upon the next update. Values must
      be non-negative long integers, or -1 indicating the maximum possible window.
    --rewind_lost_inputs: Whether to use action rewinding to recover from lost inputs.
    --local_resources: Set the number of resources available to Bazel. Takes in an
      assignment to a float or HOST_RAM/HOST_CPUS, optionally followed by [-|*]<float>
      (eg. memory=HOST_RAM*.5 to use half the available RAM). Can be used multiple
      times to specify multiple types of resources. Bazel will limit concurrently
      running actions based on the available resources and the resources required.
      Tests can declare the amount of resources they need by using a tag of the "resources:<resource
      name>:<amount>" format. Overrides resources specified by --local_{cpu|ram|extra}_resources.
    --build: Execute the build; this is the usual behaviour. Specifying --nobuild
      causes the build to stop before executing the build actions, returning zero
      iff the package loading and analysis phases completed successfully; this mode
      is useful for testing those phases.
    --noexperimental_local_lockfree_output: When true, the local spawn runner doesn't
      lock the output tree during dynamic execution. Instead, spawns are allowed to
      execute until they are explicitly interrupted by a faster remote action.
    --noincompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --enforce_project_configs: If true, interactive builds may only pass the --scl_config
      build flag; they may not use any other build flags. --scl_config must be set
      to an officially suported project configuration. Supported configurations are
      defined in the target's PROJECT.scl, which can be found by walking up the target's
      packagge path. See b/324126745.
    --aspects: Comma-separated list of aspects to be applied to top-level targets.
      In the list, if aspect some_aspect specifies required aspect providers via required_aspect_providers,
      some_aspect will run after every aspect that was mentioned before it in the
      aspects list whose advertised providers satisfy some_aspect required aspect
      providers. Moreover, some_aspect will run after all its required aspects specified
      by requires attribute. some_aspect will then have access to the values of those
      aspects' providers. <bzl-file-label>%<aspect_name>, for example '//tools:my_def.bzl%my_aspect',
      where 'my_aspect' is a top-level value from a file tools/my_def.bzl
    --show_result: |-
      Show the results of the build.  For each target, state whether or not it was brought up-to-date, and if so, a list of output files that were built.  The printed files are convenient strings for copy+pasting to the shell, to execute them.
      This option requires an integer argument, which is the threshold number of targets above which result information is not printed. Thus zero causes suppression of the message and MAX_INT causes printing of the result to occur always. The default is one.
      If nothing was built for a target its results may be omitted to keep the output under the threshold.
    --noexperimental_materialize_param_files_directly: If materializing param files,
      do so with direct writes to disk.
    --fetch: Allows the command to fetch external dependencies. If set to false, the
      command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --nobuild_tests_only: If specified, only *_test and test_suite rules will be built
      and other targets specified on the command line will be ignored. By default
      everything that was requested will be built.
    --noenforce_project_configs: If true, interactive builds may only pass the --scl_config
      build flag; they may not use any other build flags. --scl_config must be set
      to an officially suported project configuration. Supported configurations are
      defined in the target's PROJECT.scl, which can be found by walking up the target's
      packagge path. See b/324126745.
    --output_tree_tracking: If set, tell the output service (if any) to track when
      files in the output tree have been modified externally (not by the build system).
      This should improve incremental build speed when an appropriate output service
      is enabled.
    --execution_log_sort: Whether to sort the execution log, making it easier to compare
      logs across invocations. Set to false to avoid potentially significant CPU and
      memory usage at the end of the invocation, at the cost of producing the log
      in nondeterministic execution order. Only applies to the binary and JSON formats;
      the compact format is never sorted.
    --noexperimental_enable_skyfocus: If true, enable the use of --experimental_working_set
      to reduce Bazel's memory footprint for incremental builds. This feature is known
      as Skyfocus.
    --spawn_strategy: Specify how spawn actions are executed by default. Accepts a
      comma-separated list of strategies from highest to lowest priority. For each
      action Bazel picks the strategy with the highest priority that can execute the
      action. The default value is "remote,worker,sandboxed,local". See https://blog.bazel.build/2019/06/19/list-strategy.html
      for details.
    --test_strategy: Specifies which strategy to use when running tests.
    --nodiscard_analysis_cache: Discard the analysis cache immediately after the analysis
      phase completes. Reduces memory usage by ~10%, but makes further incremental
      builds slower.
    --experimental_skyfocus_dump_post_gc_stats: For debugging Skyfocus. If enabled,
      trigger manual GC before/after focusing to report heap sizes reductions. This
      will increase the Skyfocus latency.
    --noexperimental_build_event_expand_filesets: If true, expand Filesets in the
      BEP when presenting output files.
    --noexperimental_use_validation_aspect: Whether to run validation actions using
      aspect (for parallelism with tests).
    --nokeep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --nobuild: Execute the build; this is the usual behaviour. Specifying --nobuild
      causes the build to stop before executing the build actions, returning zero
      iff the package loading and analysis phases completed successfully; this mode
      is useful for testing those phases.
    --nocheck_tests_up_to_date: Don't run tests, just check if they are up-to-date.  If
      all tests results are up-to-date, the testing completes successfully.  If any
      test needs to be built or executed, an error is reported and the testing fails.  This
      option implies --check_up_to_date behavior.
    --experimental_extra_action_top_level_only: Deprecated in favor of aspects. Only
      schedules extra_actions for top level targets.
    --build_event_upload_max_retries: The maximum number of times Bazel should retry
      uploading a build event.
    --test_timeout_filters: Specifies a comma-separated list of test timeouts. Each
      timeout can be optionally preceded with '-' to specify excluded timeouts. Only
      those test targets will be found that contain at least one included timeout
      and do not contain any excluded timeouts. This option affects --build_tests_only
      behavior and the test command.
    --experimental_remote_analysis_cache_deadline: Deadline to use for remote analysis
      cache operations.
    -s, --subcommands: 'Display the subcommands executed during a build. Related flags:
      --execution_log_json_file, --execution_log_binary_file (for logging subcommands
      to a file in a tool-friendly format).'
    --deleted_packages: |-
      A comma-separated list of names of packages which the build system will consider non-existent, even if they are visible somewhere on the package path.
      Use this option when deleting a subpackage 'x/y' of an existing package 'x'.  For example, after deleting x/y/BUILD in your client, the build system may complain if it encounters a label '//x:y/z' if that is still provided by another package_path entry.  Specifying --deleted_packages x/y avoids this problem.
    --nouse_action_cache: Whether to use the action cache
    --default_visibility: Default visibility for packages that don't set it explicitly
      ('public' or 'private').
    --noexperimental_async_execution: If set to true, Bazel is allowed to run action
      in a virtual thread. The number of actions in flight is still capped with --jobs.
    --experimental_stream_log_file_uploads: Stream log file uploads directly to the
      remote storage rather than writing them to disk.
    --nooutput_tree_tracking: If set, tell the output service (if any) to track when
      files in the output tree have been modified externally (not by the build system).
      This should improve incremental build speed when an appropriate output service
      is enabled.
    --notest_keep_going: When disabled, any non-passing test will cause the entire
      build to stop. By default all tests are run, even if some do not pass.
    --noallow_analysis_cache_discard: If discarding the analysis cache due to a change
      in the build system, setting this option to false will cause bazel to exit,
      rather than continuing with the build. This option has no effect when 'discard_analysis_cache'
      is also set.
    --strategy_regexp: 'Override which spawn strategy should be used to execute spawn
      actions that have descriptions matching a certain regex_filter. See --per_file_copt
      for details onregex_filter matching. The last regex_filter that matches the
      description is used. This option overrides other flags for specifying strategy.
      Example: --strategy_regexp=//foo.*\\.cc,-//foo/bar=local means to run actions
      using local strategy if their descriptions match //foo.*.cc but not //foo/bar.
      Example: --strategy_regexp=''Compiling.*/bar=local  --strategy_regexp=Compiling=sandboxed
      will run ''Compiling //foo/bar/baz'' with the ''local'' strategy, but reversing
      the order would run it with ''sandboxed''. '
    --experimental_remote_analysis_cache_concurrency: Target concurrency for remote
      analysis caching RPCs.
    --nofetch: Allows the command to fetch external dependencies. If set to false,
      the command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --experimental_stats_summary: Enable a modernized summary of the build stats.
    --package_path: A colon-separated list of where to look for packages. Elements
      beginning with '%workspace%' are relative to the enclosing workspace. If omitted
      or empty, the default is the output of 'bazel info default-package-path'.
    --discard_analysis_cache: Discard the analysis cache immediately after the analysis
      phase completes. Reduces memory usage by ~10%, but makes further incremental
      builds slower.
    --compile_one_dependency: Compile a single dependency of the argument files. This
      is useful for syntax checking source files in IDEs, for example, by rebuilding
      a single target that depends on the source file to detect errors as early as
      possible in the edit/build/test cycle. This argument affects the way all non-flag
      arguments are interpreted; instead of being targets to build they are source
      filenames.  For each source filename an arbitrary target that depends on it
      will be built.
    --experimental_use_semaphore_for_jobs: If set to true, additionally use semaphore
      to limit number of concurrent jobs.
    --verbose_failures: If a command fails, print out the full command line.
    --noexperimental_split_xml_generation: If this flag is set, and a test action
      does not generate a test.xml file, then Bazel uses a separate action to generate
      a dummy test.xml file containing the test log. Otherwise, Bazel generates a
      test.xml as part of the test action.
    --experimental_build_event_output_group_mode: 'Specify how an output group''s
      files will be represented in TargetComplete/AspectComplete BEP events. Values
      are an assignment of an output group name to one of ''NAMED_SET_OF_FILES_ONLY'',
      ''INLINE_ONLY'', or ''BOTH''. The default value is ''NAMED_SET_OF_FILES_ONLY''.
      If an output group is repeated, the final value to appear is used. The default
      value sets the mode for coverage artifacts to BOTH: --experimental_build_event_output_group_mode=baseline.lcov=both'
    --legacy_globbing_threads: Number of threads to use for glob evaluation. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" means to use
      a reasonable value derived from the machine's hardware profile (e.g. the number
      of processors).
    --norun_validations: Whether to run validation actions as part of the build. See
      https://bazel.build/extending/rules#validation_actions
    --notest_verbose_timeout_warnings: If true, print additional warnings when the
      actual test execution time does not match the timeout defined by the test (whether
      implied or explicit).
    --noverbose_failures: If a command fails, print out the full command line.
    --experimental_build_event_expand_filesets: If true, expand Filesets in the BEP
      when presenting output files.
    --incompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --noskip_incompatible_explicit_targets: 'Skip incompatible targets that are explicitly
      listed on the command line. By default, building such targets results in an
      error but they are silently skipped when this option is enabled. See: https://bazel.build/extending/platforms#skipping-incompatible-targets'
    --noexperimental_bep_target_summary: Whether to publish TargetSummary events.
    --nocompile_one_dependency: Compile a single dependency of the argument files.
      This is useful for syntax checking source files in IDEs, for example, by rebuilding
      a single target that depends on the source file to detect errors as early as
      possible in the edit/build/test cycle. This argument affects the way all non-flag
      arguments are interpreted; instead of being targets to build they are source
      filenames.  For each source filename an arbitrary target that depends on it
      will be built.
    --noexperimental_enable_critical_path_profiling: If set (the default), critical
      path profiling is enabled for the execution phase. This has a slight overhead
      in RAM and CPU, and may prevent Bazel from making certain aggressive RAM optimizations
      in some cases.
    --noverbose_test_summary: If true, print additional information (timing, number
      of failed runs, etc) in the test summary.
    --experimental_convenience_symlinks: |-
      This flag controls how the convenience symlinks (the symlinks that appear in the workspace after the build) will be managed. Possible values:
        normal (default): Each kind of convenience symlink will be created or deleted, as determined by the build.
        clean: All symlinks will be unconditionally deleted.
        ignore: Symlinks will not be created or cleaned up.
        log_only: Generate log messages as if 'normal' were passed, but don't actually perform any filesystem operations (useful for tools).
      Note that only symlinks whose names are generated by the current value of --symlink_prefix can be affected; if the prefix changes, any pre-existing symlinks will be left alone.
    --experimental_oom_sensitive_skyfunctions_semaphore_size: 'Sets the size of the
      semaphore used to prevent SkyFunctions with large peak memory requirement from
      OOM-ing blaze. A value of 0 indicates that no semaphore should be used. Example
      value: "HOST_CPUS*0.5".'
    --experimental_build_event_upload_retry_minimum_delay: 'Initial, minimum delay
      for exponential backoff retries when BEP upload fails. (exponent: 1.6)'
    --noanalyze: Execute the loading/analysis phase; this is the usual behaviour.
      Specifying --noanalyzecauses the build to stop before starting the loading/analysis
      phase, just doing target pattern parsing and returning zero iff that completed
      successfully; this mode is useful for testing.
    --experimental_skyframe_memory_dump: 'Dump the memory use of individual nodes
      in the Skyframe graph after the build. This option takes a number of flags separated
      by commas: ''json'' (no-op, that''s the only format), ''notransient'' (don''t
      traverse transient fields), ''noconfig'' (ignore objects related to configurations),
      ''noprecomputed'' (ignore precomputed values) and ''noworkspacestatus'' (ignore
      objects related to the workspace status machinery)'
    --test_verbose_timeout_warnings: If true, print additional warnings when the actual
      test execution time does not match the timeout defined by the test (whether
      implied or explicit).
    --experimental_run_bep_event_include_residue: Whether to include the command-line
      residue in run build events which could contain the residue. By default, the
      residue is not included in run command build events that could contain the residue.
    --verbose_explanations: Increases the verbosity of the explanations issued if
      --explain is enabled. Has no effect if --explain is not enabled.
    --experimental_max_directories_to_eagerly_visit_in_globbing: If non-negative,
      the first time a glob is evaluated in a package, the subdirectories of the package
      will be traversed in order to warm filesystem caches and compensate for lack
      of parallelism in globbing. At most this many directories will be visited.
    --materialize_param_files: Writes intermediate parameter files to output tree
      even when using remote action execution. Useful when debugging actions. This
      is implied by --subcommands and --verbose_failures.
    -j, --jobs: The number of concurrent jobs to run. Takes an integer, or a keyword
      ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed by an operation ([-|*]<float>)
      eg. "auto", "HOST_CPUS*.5". Values must be between 1 and 5000. Values above
      2500 may cause memory issues. "auto" calculates a reasonable default based on
      host resources.
    --experimental_extra_action_filter: Deprecated in favor of aspects. Filters set
      of targets to schedule extra_actions for.
    --experimental_split_xml_generation: If this flag is set, and a test action does
      not generate a test.xml file, then Bazel uses a separate action to generate
      a dummy test.xml file containing the test log. Otherwise, Bazel generates a
      test.xml as part of the test action.
    --experimental_process_wrapper_graceful_sigterm: When true, make the process-wrapper
      propagate SIGTERMs (used by the dynamic scheduler to stop process trees) to
      the subprocesses themselves, giving them the grace period in --local_termination_grace_seconds
      before forcibly sending a SIGKILL.
    --symlink_prefix: 'The prefix that is prepended to any of the convenience symlinks
      that are created after a build. If omitted, the default value is the name of
      the build tool followed by a hyphen. If ''/'' is passed, then no symlinks are
      created and no warning is emitted. Warning: the special functionality for ''/''
      will be deprecated soon; use --experimental_convenience_symlinks=ignore instead.'
    --test_tag_filters: Specifies a comma-separated list of test tags. Each tag can
      be optionally preceded with '-' to specify excluded tags. Only those test targets
      will be found that contain at least one included tag and do not contain any
      excluded tags. This option affects --build_tests_only behavior and the test
      command.
    --output_groups: A list of comma-separated output group names, each of which optionally
      prefixed by a + or a -. A group prefixed by + is added to the default set of
      output groups, while a group prefixed by - is removed from the default set.
      If at least one group is not prefixed, the default set of output groups is omitted.
      For example, --output_groups=+foo,+bar builds the union of the default set,
      foo, and bar, while --output_groups=foo,bar overrides the default set such that
      only foo and bar are built.
    --max_config_changes_to_show: When discarding the analysis cache due to a change
      in the build options, displays up to the given number of changed option names.
      If the number given is -1, all changed options will be displayed.
    --experimental_cpu_load_scheduling_window_size: The size of window during experimental
      scheduling of action based on CPU load. Make sense to define only when flag
      --experimental_cpu_load_scheduling is enabled.
    --experimental_enable_critical_path_profiling: If set (the default), critical
      path profiling is enabled for the execution phase. This has a slight overhead
      in RAM and CPU, and may prevent Bazel from making certain aggressive RAM optimizations
      in some cases.
    --incompatible_skip_genfiles_symlink: If set to true, the genfiles symlink will
      not be created. For more information, see https://github.com/bazelbuild/bazel/issues/8651
    --experimental_local_lockfree_output: When true, the local spawn runner doesn't
      lock the output tree during dynamic execution. Instead, spawns are allowed to
      execute until they are explicitly interrupted by a faster remote action.
    --verbose_test_summary: If true, print additional information (timing, number
      of failed runs, etc) in the test summary.
    --show_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --noincompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --print_relative_test_log_paths: If true, when printing the path to a test log,
      use relative path that makes use of the 'testlogs' convenience symlink. N.B.
      - A subsequent 'build'/'test'/etc invocation with a different configuration
      can cause the target of this symlink to change, making the path printed previously
      no longer useful.
    --nobuild_manual_tests: Forces test targets tagged 'manual' to be built. 'manual'
      tests are excluded from processing. This option forces them to be built (but
      not executed).
    --test_output: Specifies desired output mode. Valid values are 'summary' to output
      only test status summary, 'errors' to also print test logs for failed tests,
      'all' to print logs for all tests and 'streamed' to output logs for all tests
      in real time (this will force tests to be executed locally one at a time regardless
      of --test_strategy value).
    --experimental_cpu_load_scheduling: Enables the experimental local execution scheduling
      based on CPU load, not estimation of actions one by one.  Experimental scheduling
      have showed the large benefit on a large local builds on a powerful machines
      with the large number of cores. Reccommended to use with --local_resources=cpu=HOST_CPUS
    --test_lang_filters: Specifies a comma-separated list of test languages. Each
      language can be optionally preceded with '-' to specify excluded languages.
      Only those test targets will be found that are written in the specified languages.
      The name used for each language should be the same as the language prefix in
      the *_test rule, e.g. one of 'cc', 'java', 'py', etc. This option affects --build_tests_only
      behavior and the test command.
    --experimental_async_execution: If set to true, Bazel is allowed to run action
      in a virtual thread. The number of actions in flight is still capped with --jobs.
    --run_validations: Whether to run validation actions as part of the build. See
      https://bazel.build/extending/rules#validation_actions
    --nocheck_up_to_date: Don't perform the build, just check if it is up-to-date.  If
      all targets are up-to-date, the build completes successfully.  If any step needs
      to be executed an error is reported and the build fails.
    --execution_log_binary_file: 'Log the executed spawns into this file as length-delimited
      SpawnExec protos, according to src/main/protobuf/spawn.proto. Prefer --execution_log_compact_file,
      which is significantly smaller and cheaper to produce. Related flags: --execution_log_compact_file
      (compact format; mutually exclusive), --execution_log_json_file (text JSON format;
      mutually exclusive), --execution_log_sort (whether to sort the execution log),
      --subcommands (for displaying subcommands in terminal output).'
    --legacy_important_outputs: Use this to suppress generation of the legacy important_outputs
      field in the TargetComplete event. important_outputs are required for Bazel
      to ResultStore/BTX integration.
    --cache_computed_file_digests: If greater than 0, configures Bazel to cache file
      digests in memory based on their metadata instead of recomputing the digests
      from disk every time they are needed. Setting this to 0 ensures correctness
      because not all file changes can be noted from file metadata. When not 0, the
      number indicates the size of the cache as the number of file digests to be cached.
    --strategy: Specify how to distribute compilation of other spawn actions. Accepts
      a comma-separated list of strategies from highest to lowest priority. For each
      action Bazel picks the strategy with the highest priority that can execute the
      action. The default value is "remote,worker,sandboxed,local". This flag overrides
      the values set by --spawn_strategy (and --genrule_strategy if used with mnemonic
      Genrule). See https://blog.bazel.build/2019/06/19/list-strategy.html for details.
    --experimental_working_set: The working set for Skyfocus. Specify as comma-separated
      workspace root-relative paths. This is a stateful flag. Defining a working set
      persists it for subsequent invocations, until it is redefined with a new set.
    --experimental_bep_target_summary: Whether to publish TargetSummary events.
    --build_tests_only: If specified, only *_test and test_suite rules will be built
      and other targets specified on the command line will be ignored. By default
      everything that was requested will be built.
    --allow_analysis_cache_discard: If discarding the analysis cache due to a change
      in the build system, setting this option to false will cause bazel to exit,
      rather than continuing with the build. This option has no effect when 'discard_analysis_cache'
      is also set.
    --local_cpu_resources: Explicitly set the total number of local CPU cores available
      to Bazel to spend on build actions executed locally. Takes an integer, or "HOST_CPUS",
      optionally followed by [-|*]<float> (eg. HOST_CPUS*.5 to use half the available
      CPU cores). By default, ("HOST_CPUS"), Bazel will query system configuration
      to estimate the number of CPU cores available.
    --noshow_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --noexperimental_cpu_load_scheduling: Enables the experimental local execution
      scheduling based on CPU load, not estimation of actions one by one.  Experimental
      scheduling have showed the large benefit on a large local builds on a powerful
      machines with the large number of cores. Reccommended to use with --local_resources=cpu=HOST_CPUS
    --noexperimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --noexperimental_stream_log_file_uploads: Stream log file uploads directly to
      the remote storage rather than writing them to disk.
    --noprint_relative_test_log_paths: If true, when printing the path to a test log,
      use relative path that makes use of the 'testlogs' convenience symlink. N.B.
      - A subsequent 'build'/'test'/etc invocation with a different configuration
      can cause the target of this symlink to change, making the path printed previously
      no longer useful.
    --experimental_fsvc_threads: The number of threads that are used by the FileSystemValueChecker.
    --allowed_local_actions_regex: A regex whitelist for action types which may be
      run locally. If unset, all actions are allowed to execute locally
    --serialized_frontier_profile: Dump a profile of serialized frontier bytes. Specifies
      the output path.
    --genrule_strategy: Specify how to execute genrules. This flag will be phased
      out. Instead, use --spawn_strategy=<value> to control all actions or --strategy=Genrule=<value>
      to control genrules only.
    --noexperimental_build_event_fully_resolve_fileset_symlinks: If true, fully resolve
      relative Fileset symlinks in the BEP when presenting output files. Requires
      --experimental_build_event_expand_filesets.
    --aspects_parameters: Specifies the values of the command-line aspects parameters.
      Each parameter value is specified via <param_name>=<param_value>, for example
      'my_param=my_val' where 'my_param' is a parameter of some aspect in --aspects
      list or required by an aspect in the list. This option can be used multiple
      times. However, it is not allowed to assign values to the same parameter more
      than once.
    --experimental_skymeld_analysis_overlap_percentage: The value represents the %
      of the analysis phase which will be overlapped with the execution phase. A value
      of x means Skyframe will queue up execution tasks and wait until there's x%
      of the top level target left to be analyzed before allowing them to launch.
      When the value is 0%, we'd wait for all analysis to finish before executing
      (no overlap). When it's 100%, the phases are free to overlap as much as they
      can.
    --progress_report_interval: The number of seconds to wait between reports on still
      running jobs. The default value 0 means the first report will be printed after
      10 seconds, then 30 seconds and after that progress is reported once every minute.
      When --curses is enabled, progress is reported every second.
    --noexperimental_convenience_symlinks_bep_event: This flag controls whether or
      not we will post the build eventConvenienceSymlinksIdentified to the BuildEventProtocol.
      If the value is true, the BuildEventProtocol will have an entry for convenienceSymlinksIdentified,
      listing all of the convenience symlinks created in your workspace. If false,
      then the convenienceSymlinksIdentified entry in the BuildEventProtocol will
      be empty.
    --test_size_filters: Specifies a comma-separated list of test sizes. Each size
      can be optionally preceded with '-' to specify excluded sizes. Only those test
      targets will be found that contain at least one included size and do not contain
      any excluded sizes. This option affects --build_tests_only behavior and the
      test command.
    --flaky_test_attempts: 'Each test will be retried up to the specified number of
      times in case of any test failure. Tests that required more than one attempt
      to pass are marked as ''FLAKY'' in the test summary. Normally the value specified
      is just an integer or the string ''default''. If an integer, then all tests
      will be run up to N times. If ''default'', then only a single test attempt will
      be made for regular tests and three for tests marked explicitly as flaky by
      their rule (flaky=1 attribute). Alternate syntax: regex_filter@flaky_test_attempts.
      Where flaky_test_attempts is as above and regex_filter stands for a list of
      include and exclude regular expression patterns (Also see --runs_per_test).
      Example: --flaky_test_attempts=//foo/.*,-//foo/bar/.*@3 deflakes all tests in
      //foo/ except those under foo/bar three times. This option can be passed multiple
      times. The most recently passed argument that matches takes precedence. If nothing
      matches, behavior is as if ''default'' above.'
    --noexperimental_skyfocus_dump_post_gc_stats: For debugging Skyfocus. If enabled,
      trigger manual GC before/after focusing to report heap sizes reductions. This
      will increase the Skyfocus latency.
    --experimental_remote_analysis_cache: The URL for the remote analysis caching
      backend.
    --local_ram_resources: Explicitly set the total amount of local host RAM (in MB)
      available to Bazel to spend on build actions executed locally. Takes an integer,
      or "HOST_RAM", optionally followed by [-|*]<float> (eg. HOST_RAM*.5 to use half
      the available RAM). By default, ("HOST_RAM*.67"), Bazel will query system configuration
      to estimate the amount of RAM available and will use 67% of it.
    --experimental_local_retries_on_crash: Number of times to retry a local action
      when we detect that it crashed. This exists to workaround a bug in OSXFUSE which
      is tickled by the use of the dynamic scheduler and --experimental_local_lockfree_output
      due to constant process churn. The bug can be triggered by a cancelled process
      that ran *before* the process we are trying to run, introducing corruption in
      its file reads.
    --experimental_use_validation_aspect: Whether to run validation actions using
      aspect (for parallelism with tests).
    -k, --keep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --noexperimental_run_bep_event_include_residue: Whether to include the command-line
      residue in run build events which could contain the residue. By default, the
      residue is not included in run command build events that could contain the residue.
    --analyze: Execute the loading/analysis phase; this is the usual behaviour. Specifying
      --noanalyzecauses the build to stop before starting the loading/analysis phase,
      just doing target pattern parsing and returning zero iff that completed successfully;
      this mode is useful for testing.
    --execution_log_json_file: 'Log the executed spawns into this file as newline-delimited
      JSON representations of SpawnExec protos, according to src/main/protobuf/spawn.proto.
      Prefer --execution_log_compact_file, which is significantly smaller and cheaper
      to produce. Related flags: --execution_log_compact_file (compact format; mutually
      exclusive), --execution_log_binary_file (binary protobuf format; mutually exclusive),
      --execution_log_sort (whether to sort the execution log), --subcommands (for
      displaying subcommands in terminal output).'
    --explain: Causes the build system to explain each executed step of the build.
      The explanation is written to the specified log file.
    --skip_incompatible_explicit_targets: 'Skip incompatible targets that are explicitly
      listed on the command line. By default, building such targets results in an
      error but they are silently skipped when this option is enabled. See: https://bazel.build/extending/platforms#skipping-incompatible-targets'
    --experimental_convenience_symlinks_bep_event: This flag controls whether or not
      we will post the build eventConvenienceSymlinksIdentified to the BuildEventProtocol.
      If the value is true, the BuildEventProtocol will have an entry for convenienceSymlinksIdentified,
      listing all of the convenience symlinks created in your workspace. If false,
      then the convenienceSymlinksIdentified entry in the BuildEventProtocol will
      be empty.
    --local_termination_grace_seconds: Time to wait between terminating a local process
      due to timeout and forcefully shutting it down.
    --noexpand_test_suites: 'Expand test_suite targets into their constituent tests
      before analysis. When this flag is turned on (the default), negative target
      patterns will apply to the tests belonging to the test suite, otherwise they
      will not. Turning off this flag is useful when top-level aspects are applied
      at command line: then they can analyze test_suite targets.'
    --output_filter: Only shows warnings and action outputs for rules with a name
      matching the provided regular expression.
    --directory_creation_cache: Describes the cache used to store known regular directories
      as they're created. Parent directories of output files are created on-demand
      during action execution.
    --noverbose_explanations: Increases the verbosity of the explanations issued if
      --explain is enabled. Has no effect if --explain is not enabled.
    --experimental_materialize_param_files_directly: If materializing param files,
      do so with direct writes to disk.
    --noexperimental_extra_action_top_level_only: Deprecated in favor of aspects.
      Only schedules extra_actions for top level targets.
    --nolegacy_important_outputs: Use this to suppress generation of the legacy important_outputs
      field in the TargetComplete event. important_outputs are required for Bazel
      to ResultStore/BTX integration.
    --experimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --use_action_cache: Whether to use the action cache
    --noexperimental_skyframe_target_pattern_evaluator: Use the Skyframe-based target
      pattern evaluator; implies --experimental_interleave_loading_and_analysis.
    --local_extra_resources: Set the number of extra resources available to Bazel.
      Takes in a string-float pair. Can be used multiple times to specify multiple
      types of extra resources. Bazel will limit concurrently running actions based
      on the available extra resources and the extra resources required. Tests can
      declare the amount of extra resources they need by using a tag of the "resources:<resoucename>:<amount>"
      format. Available CPU, RAM and resources cannot be set with this flag.
    --experimental_build_event_upload_strategy: Selects how to upload artifacts referenced
      in the build event protocol.
    --experimental_remote_cache_eviction_retries: The maximum number of attempts to
      retry if the build encountered a transient remote cache error that would otherwise
      fail the build. Applies for example when artifacts are evicted from the remote
      cache, or in certain cache failure conditions. A non-zero value will implicitly
      set --incompatible_remote_use_new_exit_code_for_lost_inputs to true. A new invocation
      id will be generated for each attempt. If you generate invocation id and provide
      it to Bazel with --invocation_id, you should not use this flag. Instead, set
      flag --incompatible_remote_use_new_exit_code_for_lost_inputs and check for the
      exit code 39.
    --loading_phase_threads: Number of parallel threads to use for the loading/analysis
      phase.Takes an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally
      followed by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" sets
      a reasonable default based on host resources. Must be at least 1.
    --experimental_remote_analysis_cache_mode: The transport direction for the remote
      analysis cache.
    --experimental_merged_skyframe_analysis_execution: If this flag is set, the analysis
      and execution phases of Skyframe are merged.
    --max_test_output_bytes: Specifies maximum per-test-log size that can be emitted
      when --test_output is 'errors' or 'all'. Useful for avoiding overwhelming the
      output with excessively noisy test output. The test header is included in the
      log size. Negative values imply no limit. Output is all or nothing.
    --experimental_skyframe_cpu_heavy_skykeys_thread_pool_size: 'If set to a positive
      value (e.g. "HOST_CPUS*1.5"), Skyframe will run the loading/analysis phase with
      2 separate thread pools: 1 with <value> threads (ideally close to HOST_CPUS)
      reserved for CPU-heavy SkyKeys, and 1 "standard" thread pool (whose size is
      controlled by --loading_phase_threads) for the rest.'
    --expand_test_suites: 'Expand test_suite targets into their constituent tests
      before analysis. When this flag is turned on (the default), negative target
      patterns will apply to the tests belonging to the test suite, otherwise they
      will not. Turning off this flag is useful when top-level aspects are applied
      at command line: then they can analyze test_suite targets.'
    --target_pattern_file: If set, build will read patterns from the file named here,
      rather than on the command line. It is an error to specify a file here as well
      as command-line patterns.
    --noexperimental_process_wrapper_graceful_sigterm: When true, make the process-wrapper
      propagate SIGTERMs (used by the dynamic scheduler to stop process trees) to
      the subprocesses themselves, giving them the grace period in --local_termination_grace_seconds
      before forcibly sending a SIGKILL.
    --experimental_skyfocus_handling_strategy: Strategies for Skyfocus to handle changes
      outside of the working set.
    --incompatible_remote_use_new_exit_code_for_lost_inputs: If set to true, Bazel
      will use new exit code 39 instead of 34 if remote cacheerrors, including cache
      evictions, cause the build to fail.
    --experimental_skyframe_target_pattern_evaluator: Use the Skyframe-based target
      pattern evaluator; implies --experimental_interleave_loading_and_analysis.
    --noincompatible_skip_genfiles_symlink: If set to true, the genfiles symlink will
      not be created. For more information, see https://github.com/bazelbuild/bazel/issues/8651
    --experimental_enable_skyfocus: If true, enable the use of --experimental_working_set
      to reduce Bazel's memory footprint for incremental builds. This feature is known
      as Skyfocus.
    --experimental_aquery_dump_after_build_format: 'Writes the state of Skyframe (which
      includes previous invocations on this blaze instance as well) after a build.
      Output is streamed remotely unless local output is requested with --experimental_aquery_dump_after_build_output_file.  Does
      not honor aquery flags for --include_*, but uses the same defaults, except for
      --include_commandline=false. Possible output formats: proto|streamed_proto|textproto|jsonproto.
      Using this will disable Skymeld.'
    --build_manual_tests: Forces test targets tagged 'manual' to be built. 'manual'
      tests are excluded from processing. This option forces them to be built (but
      not executed).
    --build_tag_filters: Specifies a comma-separated list of tags. Each tag can be
      optionally preceded with '-' to specify excluded tags. Only those targets will
      be built that contain at least one included tag and do not contain any excluded
      tags. This option does not affect the set of tests executed with the 'test'
      command; those are be governed by the test filtering options, for example '--test_tag_filters'
    --noexperimental_use_semaphore_for_jobs: If set to true, additionally use semaphore
      to limit number of concurrent jobs.
    --experimental_aquery_dump_after_build_output_file: Specify the output file for
      the aquery dump after a build. Use in conjunction with --experimental_aquery_dump_after_build_format.
      The path provided is relative to Bazel's output base, unless it's an absolute
      path. Using this will disable Skymeld.
    --local_test_jobs: The max number of local test jobs to run concurrently. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". 0 means local resources
      will limit the number of local test jobs to run concurrently instead. Setting
      this greater than the value for --jobs is ineffectual.
    --norewind_lost_inputs: Whether to use action rewinding to recover from lost inputs.
    --test_tmpdir: Specifies the base temporary directory for 'bazel test' to use.
    --hide_aspect_results: Comma-separated list of aspect names to not display in
      results (see --show_result). Useful for keeping aspects added by wrappers which
      are typically not interesting to end users out of console output.
    --execution_log_compact_file: 'Log the executed spawns into this file as length-delimited
      ExecLogEntry protos, according to src/main/protobuf/spawn.proto. The entire
      file is zstd compressed. Related flags: --execution_log_binary_file (binary
      protobuf format; mutually exclusive), --execution_log_json_file (text JSON format;
      mutually exclusive), --subcommands (for displaying subcommands in terminal output).'
    --noincompatible_remote_use_new_exit_code_for_lost_inputs: If set to true, Bazel
      will use new exit code 39 instead of 34 if remote cacheerrors, including cache
      evictions, cause the build to fail.
    --experimental_build_event_fully_resolve_fileset_symlinks: If true, fully resolve
      relative Fileset symlinks in the BEP when presenting output files. Requires
      --experimental_build_event_expand_filesets.
  description: Generates code coverage report for specified test targets.
- name: cquery
  flags:
    --noexecution_log_sort: Whether to sort the execution log, making it easier to
      compare logs across invocations. Set to false to avoid potentially significant
      CPU and memory usage at the end of the invocation, at the cost of producing
      the log in nondeterministic execution order. Only applies to the binary and
      JSON formats; the compact format is never sorted.
    --incompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --noexperimental_stats_summary: Enable a modernized summary of the build stats.
    --check_tests_up_to_date: Don't run tests, just check if they are up-to-date.  If
      all tests results are up-to-date, the testing completes successfully.  If any
      test needs to be built or executed, an error is reported and the testing fails.  This
      option implies --check_up_to_date behavior.
    --noexperimental_merged_skyframe_analysis_execution: If this flag is set, the
      analysis and execution phases of Skyframe are merged.
    --test_keep_going: When disabled, any non-passing test will cause the entire build
      to stop. By default all tests are run, even if some do not pass.
    --check_up_to_date: Don't perform the build, just check if it is up-to-date.  If
      all targets are up-to-date, the build completes successfully.  If any step needs
      to be executed an error is reported and the build fails.
    --experimental_skyfocus_dump_keys: For debugging Skyfocus. Dump the focused SkyKeys
      (roots, leafs, focused deps, focused rdeps).
    --nomaterialize_param_files: Writes intermediate parameter files to output tree
      even when using remote action execution. Useful when debugging actions. This
      is implied by --subcommands and --verbose_failures.
    --test_summary: Specifies the desired format of the test summary. Valid values
      are 'short' to print information only about tests executed, 'terse', to print
      information only about unsuccessful tests that were run, 'detailed' to print
      detailed information about failed test cases, 'testcase' to print summary in
      test case resolution, do not print detailed information about failed test cases
      and 'none' to omit the summary.
    --version_window_for_dirty_node_gc: Nodes that have been dirty for more than this
      many versions will be deleted from the graph upon the next update. Values must
      be non-negative long integers, or -1 indicating the maximum possible window.
    --rewind_lost_inputs: Whether to use action rewinding to recover from lost inputs.
    --local_resources: Set the number of resources available to Bazel. Takes in an
      assignment to a float or HOST_RAM/HOST_CPUS, optionally followed by [-|*]<float>
      (eg. memory=HOST_RAM*.5 to use half the available RAM). Can be used multiple
      times to specify multiple types of resources. Bazel will limit concurrently
      running actions based on the available resources and the resources required.
      Tests can declare the amount of resources they need by using a tag of the "resources:<resource
      name>:<amount>" format. Overrides resources specified by --local_{cpu|ram|extra}_resources.
    --build: Execute the build; this is the usual behaviour. Specifying --nobuild
      causes the build to stop before executing the build actions, returning zero
      iff the package loading and analysis phases completed successfully; this mode
      is useful for testing those phases.
    --noexperimental_local_lockfree_output: When true, the local spawn runner doesn't
      lock the output tree during dynamic execution. Instead, spawns are allowed to
      execute until they are explicitly interrupted by a faster remote action.
    --noincompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --enforce_project_configs: If true, interactive builds may only pass the --scl_config
      build flag; they may not use any other build flags. --scl_config must be set
      to an officially suported project configuration. Supported configurations are
      defined in the target's PROJECT.scl, which can be found by walking up the target's
      packagge path. See b/324126745.
    --aspects: Comma-separated list of aspects to be applied to top-level targets.
      In the list, if aspect some_aspect specifies required aspect providers via required_aspect_providers,
      some_aspect will run after every aspect that was mentioned before it in the
      aspects list whose advertised providers satisfy some_aspect required aspect
      providers. Moreover, some_aspect will run after all its required aspects specified
      by requires attribute. some_aspect will then have access to the values of those
      aspects' providers. <bzl-file-label>%<aspect_name>, for example '//tools:my_def.bzl%my_aspect',
      where 'my_aspect' is a top-level value from a file tools/my_def.bzl
    --show_result: |-
      Show the results of the build.  For each target, state whether or not it was brought up-to-date, and if so, a list of output files that were built.  The printed files are convenient strings for copy+pasting to the shell, to execute them.
      This option requires an integer argument, which is the threshold number of targets above which result information is not printed. Thus zero causes suppression of the message and MAX_INT causes printing of the result to occur always. The default is one.
      If nothing was built for a target its results may be omitted to keep the output under the threshold.
    --noexperimental_materialize_param_files_directly: If materializing param files,
      do so with direct writes to disk.
    --fetch: Allows the command to fetch external dependencies. If set to false, the
      command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --nobuild_tests_only: If specified, only *_test and test_suite rules will be built
      and other targets specified on the command line will be ignored. By default
      everything that was requested will be built.
    --noenforce_project_configs: If true, interactive builds may only pass the --scl_config
      build flag; they may not use any other build flags. --scl_config must be set
      to an officially suported project configuration. Supported configurations are
      defined in the target's PROJECT.scl, which can be found by walking up the target's
      packagge path. See b/324126745.
    --output_tree_tracking: If set, tell the output service (if any) to track when
      files in the output tree have been modified externally (not by the build system).
      This should improve incremental build speed when an appropriate output service
      is enabled.
    --execution_log_sort: Whether to sort the execution log, making it easier to compare
      logs across invocations. Set to false to avoid potentially significant CPU and
      memory usage at the end of the invocation, at the cost of producing the log
      in nondeterministic execution order. Only applies to the binary and JSON formats;
      the compact format is never sorted.
    --proto:include_configurations: if enabled, proto output will include information
      about configurations. When disabled,cquery proto output format resembles query
      output format.
    --noexperimental_enable_skyfocus: If true, enable the use of --experimental_working_set
      to reduce Bazel's memory footprint for incremental builds. This feature is known
      as Skyfocus.
    --spawn_strategy: Specify how spawn actions are executed by default. Accepts a
      comma-separated list of strategies from highest to lowest priority. For each
      action Bazel picks the strategy with the highest priority that can execute the
      action. The default value is "remote,worker,sandboxed,local". See https://blog.bazel.build/2019/06/19/list-strategy.html
      for details.
    --test_strategy: Specifies which strategy to use when running tests.
    --nodiscard_analysis_cache: Discard the analysis cache immediately after the analysis
      phase completes. Reduces memory usage by ~10%, but makes further incremental
      builds slower.
    --experimental_skyfocus_dump_post_gc_stats: For debugging Skyfocus. If enabled,
      trigger manual GC before/after focusing to report heap sizes reductions. This
      will increase the Skyfocus latency.
    --noexperimental_build_event_expand_filesets: If true, expand Filesets in the
      BEP when presenting output files.
    --noexperimental_use_validation_aspect: Whether to run validation actions using
      aspect (for parallelism with tests).
    --nokeep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --nobuild: Execute the build; this is the usual behaviour. Specifying --nobuild
      causes the build to stop before executing the build actions, returning zero
      iff the package loading and analysis phases completed successfully; this mode
      is useful for testing those phases.
    --nocheck_tests_up_to_date: Don't run tests, just check if they are up-to-date.  If
      all tests results are up-to-date, the testing completes successfully.  If any
      test needs to be built or executed, an error is reported and the testing fails.  This
      option implies --check_up_to_date behavior.
    --experimental_extra_action_top_level_only: Deprecated in favor of aspects. Only
      schedules extra_actions for top level targets.
    --build_event_upload_max_retries: The maximum number of times Bazel should retry
      uploading a build event.
    --test_timeout_filters: Specifies a comma-separated list of test timeouts. Each
      timeout can be optionally preceded with '-' to specify excluded timeouts. Only
      those test targets will be found that contain at least one included timeout
      and do not contain any excluded timeouts. This option affects --build_tests_only
      behavior and the test command.
    --experimental_remote_analysis_cache_deadline: Deadline to use for remote analysis
      cache operations.
    -s, --subcommands: 'Display the subcommands executed during a build. Related flags:
      --execution_log_json_file, --execution_log_binary_file (for logging subcommands
      to a file in a tool-friendly format).'
    --deleted_packages: |-
      A comma-separated list of names of packages which the build system will consider non-existent, even if they are visible somewhere on the package path.
      Use this option when deleting a subpackage 'x/y' of an existing package 'x'.  For example, after deleting x/y/BUILD in your client, the build system may complain if it encounters a label '//x:y/z' if that is still provided by another package_path entry.  Specifying --deleted_packages x/y avoids this problem.
    --nouse_action_cache: Whether to use the action cache
    --default_visibility: Default visibility for packages that don't set it explicitly
      ('public' or 'private').
    --noexperimental_async_execution: If set to true, Bazel is allowed to run action
      in a virtual thread. The number of actions in flight is still capped with --jobs.
    --experimental_stream_log_file_uploads: Stream log file uploads directly to the
      remote storage rather than writing them to disk.
    --nooutput_tree_tracking: If set, tell the output service (if any) to track when
      files in the output tree have been modified externally (not by the build system).
      This should improve incremental build speed when an appropriate output service
      is enabled.
    --notest_keep_going: When disabled, any non-passing test will cause the entire
      build to stop. By default all tests are run, even if some do not pass.
    --noallow_analysis_cache_discard: If discarding the analysis cache due to a change
      in the build system, setting this option to false will cause bazel to exit,
      rather than continuing with the build. This option has no effect when 'discard_analysis_cache'
      is also set.
    --strategy_regexp: 'Override which spawn strategy should be used to execute spawn
      actions that have descriptions matching a certain regex_filter. See --per_file_copt
      for details onregex_filter matching. The last regex_filter that matches the
      description is used. This option overrides other flags for specifying strategy.
      Example: --strategy_regexp=//foo.*\\.cc,-//foo/bar=local means to run actions
      using local strategy if their descriptions match //foo.*.cc but not //foo/bar.
      Example: --strategy_regexp=''Compiling.*/bar=local  --strategy_regexp=Compiling=sandboxed
      will run ''Compiling //foo/bar/baz'' with the ''local'' strategy, but reversing
      the order would run it with ''sandboxed''. '
    --experimental_remote_analysis_cache_concurrency: Target concurrency for remote
      analysis caching RPCs.
    --nofetch: Allows the command to fetch external dependencies. If set to false,
      the command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --experimental_stats_summary: Enable a modernized summary of the build stats.
    --starlark:expr: A Starlark expression to format each configured target in cquery's
      --output=starlark mode. The configured target is bound to 'target'. If neither
      --starlark:expr nor --starlark:file is specified, this option will default to
      'str(target.label)'. It is an error to specify both --starlark:expr and --starlark:file.
    --package_path: A colon-separated list of where to look for packages. Elements
      beginning with '%workspace%' are relative to the enclosing workspace. If omitted
      or empty, the default is the output of 'bazel info default-package-path'.
    --discard_analysis_cache: Discard the analysis cache immediately after the analysis
      phase completes. Reduces memory usage by ~10%, but makes further incremental
      builds slower.
    --compile_one_dependency: Compile a single dependency of the argument files. This
      is useful for syntax checking source files in IDEs, for example, by rebuilding
      a single target that depends on the source file to detect errors as early as
      possible in the edit/build/test cycle. This argument affects the way all non-flag
      arguments are interpreted; instead of being targets to build they are source
      filenames.  For each source filename an arbitrary target that depends on it
      will be built.
    --experimental_use_semaphore_for_jobs: If set to true, additionally use semaphore
      to limit number of concurrent jobs.
    --verbose_failures: If a command fails, print out the full command line.
    --noexperimental_split_xml_generation: If this flag is set, and a test action
      does not generate a test.xml file, then Bazel uses a separate action to generate
      a dummy test.xml file containing the test log. Otherwise, Bazel generates a
      test.xml as part of the test action.
    --experimental_build_event_output_group_mode: 'Specify how an output group''s
      files will be represented in TargetComplete/AspectComplete BEP events. Values
      are an assignment of an output group name to one of ''NAMED_SET_OF_FILES_ONLY'',
      ''INLINE_ONLY'', or ''BOTH''. The default value is ''NAMED_SET_OF_FILES_ONLY''.
      If an output group is repeated, the final value to appear is used. The default
      value sets the mode for coverage artifacts to BOTH: --experimental_build_event_output_group_mode=baseline.lcov=both'
    --legacy_globbing_threads: Number of threads to use for glob evaluation. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" means to use
      a reasonable value derived from the machine's hardware profile (e.g. the number
      of processors).
    --norun_validations: Whether to run validation actions as part of the build. See
      https://bazel.build/extending/rules#validation_actions
    --notest_verbose_timeout_warnings: If true, print additional warnings when the
      actual test execution time does not match the timeout defined by the test (whether
      implied or explicit).
    --noverbose_failures: If a command fails, print out the full command line.
    --experimental_build_event_expand_filesets: If true, expand Filesets in the BEP
      when presenting output files.
    --incompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --noskip_incompatible_explicit_targets: 'Skip incompatible targets that are explicitly
      listed on the command line. By default, building such targets results in an
      error but they are silently skipped when this option is enabled. See: https://bazel.build/extending/platforms#skipping-incompatible-targets'
    --noexperimental_bep_target_summary: Whether to publish TargetSummary events.
    --nocompile_one_dependency: Compile a single dependency of the argument files.
      This is useful for syntax checking source files in IDEs, for example, by rebuilding
      a single target that depends on the source file to detect errors as early as
      possible in the edit/build/test cycle. This argument affects the way all non-flag
      arguments are interpreted; instead of being targets to build they are source
      filenames.  For each source filename an arbitrary target that depends on it
      will be built.
    --noexperimental_enable_critical_path_profiling: If set (the default), critical
      path profiling is enabled for the execution phase. This has a slight overhead
      in RAM and CPU, and may prevent Bazel from making certain aggressive RAM optimizations
      in some cases.
    --noverbose_test_summary: If true, print additional information (timing, number
      of failed runs, etc) in the test summary.
    --experimental_convenience_symlinks: |-
      This flag controls how the convenience symlinks (the symlinks that appear in the workspace after the build) will be managed. Possible values:
        normal (default): Each kind of convenience symlink will be created or deleted, as determined by the build.
        clean: All symlinks will be unconditionally deleted.
        ignore: Symlinks will not be created or cleaned up.
        log_only: Generate log messages as if 'normal' were passed, but don't actually perform any filesystem operations (useful for tools).
      Note that only symlinks whose names are generated by the current value of --symlink_prefix can be affected; if the prefix changes, any pre-existing symlinks will be left alone.
    --experimental_oom_sensitive_skyfunctions_semaphore_size: 'Sets the size of the
      semaphore used to prevent SkyFunctions with large peak memory requirement from
      OOM-ing blaze. A value of 0 indicates that no semaphore should be used. Example
      value: "HOST_CPUS*0.5".'
    --experimental_build_event_upload_retry_minimum_delay: 'Initial, minimum delay
      for exponential backoff retries when BEP upload fails. (exponent: 1.6)'
    --transitions: The format in which cquery will print transition information.
    --noanalyze: Execute the loading/analysis phase; this is the usual behaviour.
      Specifying --noanalyzecauses the build to stop before starting the loading/analysis
      phase, just doing target pattern parsing and returning zero iff that completed
      successfully; this mode is useful for testing.
    --experimental_skyframe_memory_dump: 'Dump the memory use of individual nodes
      in the Skyframe graph after the build. This option takes a number of flags separated
      by commas: ''json'' (no-op, that''s the only format), ''notransient'' (don''t
      traverse transient fields), ''noconfig'' (ignore objects related to configurations),
      ''noprecomputed'' (ignore precomputed values) and ''noworkspacestatus'' (ignore
      objects related to the workspace status machinery)'
    --test_verbose_timeout_warnings: If true, print additional warnings when the actual
      test execution time does not match the timeout defined by the test (whether
      implied or explicit).
    --experimental_run_bep_event_include_residue: Whether to include the command-line
      residue in run build events which could contain the residue. By default, the
      residue is not included in run command build events that could contain the residue.
    --verbose_explanations: Increases the verbosity of the explanations issued if
      --explain is enabled. Has no effect if --explain is not enabled.
    --experimental_max_directories_to_eagerly_visit_in_globbing: If non-negative,
      the first time a glob is evaluated in a package, the subdirectories of the package
      will be traversed in order to warm filesystem caches and compensate for lack
      of parallelism in globbing. At most this many directories will be visited.
    --noproto:include_configurations: if enabled, proto output will include information
      about configurations. When disabled,cquery proto output format resembles query
      output format.
    --materialize_param_files: Writes intermediate parameter files to output tree
      even when using remote action execution. Useful when debugging actions. This
      is implied by --subcommands and --verbose_failures.
    -j, --jobs: The number of concurrent jobs to run. Takes an integer, or a keyword
      ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed by an operation ([-|*]<float>)
      eg. "auto", "HOST_CPUS*.5". Values must be between 1 and 5000. Values above
      2500 may cause memory issues. "auto" calculates a reasonable default based on
      host resources.
    --experimental_extra_action_filter: Deprecated in favor of aspects. Filters set
      of targets to schedule extra_actions for.
    --experimental_split_xml_generation: If this flag is set, and a test action does
      not generate a test.xml file, then Bazel uses a separate action to generate
      a dummy test.xml file containing the test log. Otherwise, Bazel generates a
      test.xml as part of the test action.
    --experimental_process_wrapper_graceful_sigterm: When true, make the process-wrapper
      propagate SIGTERMs (used by the dynamic scheduler to stop process trees) to
      the subprocesses themselves, giving them the grace period in --local_termination_grace_seconds
      before forcibly sending a SIGKILL.
    --symlink_prefix: 'The prefix that is prepended to any of the convenience symlinks
      that are created after a build. If omitted, the default value is the name of
      the build tool followed by a hyphen. If ''/'' is passed, then no symlinks are
      created and no warning is emitted. Warning: the special functionality for ''/''
      will be deprecated soon; use --experimental_convenience_symlinks=ignore instead.'
    --test_tag_filters: Specifies a comma-separated list of test tags. Each tag can
      be optionally preceded with '-' to specify excluded tags. Only those test targets
      will be found that contain at least one included tag and do not contain any
      excluded tags. This option affects --build_tests_only behavior and the test
      command.
    --output_groups: A list of comma-separated output group names, each of which optionally
      prefixed by a + or a -. A group prefixed by + is added to the default set of
      output groups, while a group prefixed by - is removed from the default set.
      If at least one group is not prefixed, the default set of output groups is omitted.
      For example, --output_groups=+foo,+bar builds the union of the default set,
      foo, and bar, while --output_groups=foo,bar overrides the default set such that
      only foo and bar are built.
    --max_config_changes_to_show: When discarding the analysis cache due to a change
      in the build options, displays up to the given number of changed option names.
      If the number given is -1, all changed options will be displayed.
    --experimental_cpu_load_scheduling_window_size: The size of window during experimental
      scheduling of action based on CPU load. Make sense to define only when flag
      --experimental_cpu_load_scheduling is enabled.
    --experimental_enable_critical_path_profiling: If set (the default), critical
      path profiling is enabled for the execution phase. This has a slight overhead
      in RAM and CPU, and may prevent Bazel from making certain aggressive RAM optimizations
      in some cases.
    --incompatible_skip_genfiles_symlink: If set to true, the genfiles symlink will
      not be created. For more information, see https://github.com/bazelbuild/bazel/issues/8651
    --experimental_local_lockfree_output: When true, the local spawn runner doesn't
      lock the output tree during dynamic execution. Instead, spawns are allowed to
      execute until they are explicitly interrupted by a faster remote action.
    --verbose_test_summary: If true, print additional information (timing, number
      of failed runs, etc) in the test summary.
    --show_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --noincompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --print_relative_test_log_paths: If true, when printing the path to a test log,
      use relative path that makes use of the 'testlogs' convenience symlink. N.B.
      - A subsequent 'build'/'test'/etc invocation with a different configuration
      can cause the target of this symlink to change, making the path printed previously
      no longer useful.
    --nobuild_manual_tests: Forces test targets tagged 'manual' to be built. 'manual'
      tests are excluded from processing. This option forces them to be built (but
      not executed).
    --test_output: Specifies desired output mode. Valid values are 'summary' to output
      only test status summary, 'errors' to also print test logs for failed tests,
      'all' to print logs for all tests and 'streamed' to output logs for all tests
      in real time (this will force tests to be executed locally one at a time regardless
      of --test_strategy value).
    --experimental_cpu_load_scheduling: Enables the experimental local execution scheduling
      based on CPU load, not estimation of actions one by one.  Experimental scheduling
      have showed the large benefit on a large local builds on a powerful machines
      with the large number of cores. Reccommended to use with --local_resources=cpu=HOST_CPUS
    --test_lang_filters: Specifies a comma-separated list of test languages. Each
      language can be optionally preceded with '-' to specify excluded languages.
      Only those test targets will be found that are written in the specified languages.
      The name used for each language should be the same as the language prefix in
      the *_test rule, e.g. one of 'cc', 'java', 'py', etc. This option affects --build_tests_only
      behavior and the test command.
    --experimental_async_execution: If set to true, Bazel is allowed to run action
      in a virtual thread. The number of actions in flight is still capped with --jobs.
    --run_validations: Whether to run validation actions as part of the build. See
      https://bazel.build/extending/rules#validation_actions
    --nocheck_up_to_date: Don't perform the build, just check if it is up-to-date.  If
      all targets are up-to-date, the build completes successfully.  If any step needs
      to be executed an error is reported and the build fails.
    --execution_log_binary_file: 'Log the executed spawns into this file as length-delimited
      SpawnExec protos, according to src/main/protobuf/spawn.proto. Prefer --execution_log_compact_file,
      which is significantly smaller and cheaper to produce. Related flags: --execution_log_compact_file
      (compact format; mutually exclusive), --execution_log_json_file (text JSON format;
      mutually exclusive), --execution_log_sort (whether to sort the execution log),
      --subcommands (for displaying subcommands in terminal output).'
    --legacy_important_outputs: Use this to suppress generation of the legacy important_outputs
      field in the TargetComplete event. important_outputs are required for Bazel
      to ResultStore/BTX integration.
    --cache_computed_file_digests: If greater than 0, configures Bazel to cache file
      digests in memory based on their metadata instead of recomputing the digests
      from disk every time they are needed. Setting this to 0 ensures correctness
      because not all file changes can be noted from file metadata. When not 0, the
      number indicates the size of the cache as the number of file digests to be cached.
    --strategy: Specify how to distribute compilation of other spawn actions. Accepts
      a comma-separated list of strategies from highest to lowest priority. For each
      action Bazel picks the strategy with the highest priority that can execute the
      action. The default value is "remote,worker,sandboxed,local". This flag overrides
      the values set by --spawn_strategy (and --genrule_strategy if used with mnemonic
      Genrule). See https://blog.bazel.build/2019/06/19/list-strategy.html for details.
    --experimental_working_set: The working set for Skyfocus. Specify as comma-separated
      workspace root-relative paths. This is a stateful flag. Defining a working set
      persists it for subsequent invocations, until it is redefined with a new set.
    --experimental_bep_target_summary: Whether to publish TargetSummary events.
    --build_tests_only: If specified, only *_test and test_suite rules will be built
      and other targets specified on the command line will be ignored. By default
      everything that was requested will be built.
    --allow_analysis_cache_discard: If discarding the analysis cache due to a change
      in the build system, setting this option to false will cause bazel to exit,
      rather than continuing with the build. This option has no effect when 'discard_analysis_cache'
      is also set.
    --show_config_fragments: Shows the configuration fragments required by a rule
      and its transitive dependencies. This can be useful for evaluating how much
      a configured target graph can be trimmed.
    --local_cpu_resources: Explicitly set the total number of local CPU cores available
      to Bazel to spend on build actions executed locally. Takes an integer, or "HOST_CPUS",
      optionally followed by [-|*]<float> (eg. HOST_CPUS*.5 to use half the available
      CPU cores). By default, ("HOST_CPUS"), Bazel will query system configuration
      to estimate the number of CPU cores available.
    --noshow_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --noexperimental_cpu_load_scheduling: Enables the experimental local execution
      scheduling based on CPU load, not estimation of actions one by one.  Experimental
      scheduling have showed the large benefit on a large local builds on a powerful
      machines with the large number of cores. Reccommended to use with --local_resources=cpu=HOST_CPUS
    --noexperimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --noexperimental_stream_log_file_uploads: Stream log file uploads directly to
      the remote storage rather than writing them to disk.
    --noprint_relative_test_log_paths: If true, when printing the path to a test log,
      use relative path that makes use of the 'testlogs' convenience symlink. N.B.
      - A subsequent 'build'/'test'/etc invocation with a different configuration
      can cause the target of this symlink to change, making the path printed previously
      no longer useful.
    --starlark:file: The name of a file that defines a Starlark function called 'format',
      of one argument, that is applied to each configured target to format it as a
      string. It is an error to specify both --starlark:expr and --starlark:file.
      See help for --output=starlark for additional detail.
    --experimental_fsvc_threads: The number of threads that are used by the FileSystemValueChecker.
    --allowed_local_actions_regex: A regex whitelist for action types which may be
      run locally. If unset, all actions are allowed to execute locally
    --serialized_frontier_profile: Dump a profile of serialized frontier bytes. Specifies
      the output path.
    --genrule_strategy: Specify how to execute genrules. This flag will be phased
      out. Instead, use --spawn_strategy=<value> to control all actions or --strategy=Genrule=<value>
      to control genrules only.
    --noexperimental_build_event_fully_resolve_fileset_symlinks: If true, fully resolve
      relative Fileset symlinks in the BEP when presenting output files. Requires
      --experimental_build_event_expand_filesets.
    --aspects_parameters: Specifies the values of the command-line aspects parameters.
      Each parameter value is specified via <param_name>=<param_value>, for example
      'my_param=my_val' where 'my_param' is a parameter of some aspect in --aspects
      list or required by an aspect in the list. This option can be used multiple
      times. However, it is not allowed to assign values to the same parameter more
      than once.
    --experimental_skymeld_analysis_overlap_percentage: The value represents the %
      of the analysis phase which will be overlapped with the execution phase. A value
      of x means Skyframe will queue up execution tasks and wait until there's x%
      of the top level target left to be analyzed before allowing them to launch.
      When the value is 0%, we'd wait for all analysis to finish before executing
      (no overlap). When it's 100%, the phases are free to overlap as much as they
      can.
    --progress_report_interval: The number of seconds to wait between reports on still
      running jobs. The default value 0 means the first report will be printed after
      10 seconds, then 30 seconds and after that progress is reported once every minute.
      When --curses is enabled, progress is reported every second.
    --noexperimental_convenience_symlinks_bep_event: This flag controls whether or
      not we will post the build eventConvenienceSymlinksIdentified to the BuildEventProtocol.
      If the value is true, the BuildEventProtocol will have an entry for convenienceSymlinksIdentified,
      listing all of the convenience symlinks created in your workspace. If false,
      then the convenienceSymlinksIdentified entry in the BuildEventProtocol will
      be empty.
    --test_size_filters: Specifies a comma-separated list of test sizes. Each size
      can be optionally preceded with '-' to specify excluded sizes. Only those test
      targets will be found that contain at least one included size and do not contain
      any excluded sizes. This option affects --build_tests_only behavior and the
      test command.
    --flaky_test_attempts: 'Each test will be retried up to the specified number of
      times in case of any test failure. Tests that required more than one attempt
      to pass are marked as ''FLAKY'' in the test summary. Normally the value specified
      is just an integer or the string ''default''. If an integer, then all tests
      will be run up to N times. If ''default'', then only a single test attempt will
      be made for regular tests and three for tests marked explicitly as flaky by
      their rule (flaky=1 attribute). Alternate syntax: regex_filter@flaky_test_attempts.
      Where flaky_test_attempts is as above and regex_filter stands for a list of
      include and exclude regular expression patterns (Also see --runs_per_test).
      Example: --flaky_test_attempts=//foo/.*,-//foo/bar/.*@3 deflakes all tests in
      //foo/ except those under foo/bar three times. This option can be passed multiple
      times. The most recently passed argument that matches takes precedence. If nothing
      matches, behavior is as if ''default'' above.'
    --noexperimental_skyfocus_dump_post_gc_stats: For debugging Skyfocus. If enabled,
      trigger manual GC before/after focusing to report heap sizes reductions. This
      will increase the Skyfocus latency.
    --experimental_remote_analysis_cache: The URL for the remote analysis caching
      backend.
    --local_ram_resources: Explicitly set the total amount of local host RAM (in MB)
      available to Bazel to spend on build actions executed locally. Takes an integer,
      or "HOST_RAM", optionally followed by [-|*]<float> (eg. HOST_RAM*.5 to use half
      the available RAM). By default, ("HOST_RAM*.67"), Bazel will query system configuration
      to estimate the amount of RAM available and will use 67% of it.
    --experimental_local_retries_on_crash: Number of times to retry a local action
      when we detect that it crashed. This exists to workaround a bug in OSXFUSE which
      is tickled by the use of the dynamic scheduler and --experimental_local_lockfree_output
      due to constant process churn. The bug can be triggered by a cancelled process
      that ran *before* the process we are trying to run, introducing corruption in
      its file reads.
    --experimental_use_validation_aspect: Whether to run validation actions using
      aspect (for parallelism with tests).
    -k, --keep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --noexperimental_run_bep_event_include_residue: Whether to include the command-line
      residue in run build events which could contain the residue. By default, the
      residue is not included in run command build events that could contain the residue.
    --analyze: Execute the loading/analysis phase; this is the usual behaviour. Specifying
      --noanalyzecauses the build to stop before starting the loading/analysis phase,
      just doing target pattern parsing and returning zero iff that completed successfully;
      this mode is useful for testing.
    --output: 'The format in which the cquery results should be printed. Allowed values
      for cquery are: label, label_kind, textproto, transitions, proto, streamed_proto,
      jsonproto. If you select ''transitions'', you also have to specify the --transitions=(lite|full)
      option.'
    --execution_log_json_file: 'Log the executed spawns into this file as newline-delimited
      JSON representations of SpawnExec protos, according to src/main/protobuf/spawn.proto.
      Prefer --execution_log_compact_file, which is significantly smaller and cheaper
      to produce. Related flags: --execution_log_compact_file (compact format; mutually
      exclusive), --execution_log_binary_file (binary protobuf format; mutually exclusive),
      --execution_log_sort (whether to sort the execution log), --subcommands (for
      displaying subcommands in terminal output).'
    --explain: Causes the build system to explain each executed step of the build.
      The explanation is written to the specified log file.
    --skip_incompatible_explicit_targets: 'Skip incompatible targets that are explicitly
      listed on the command line. By default, building such targets results in an
      error but they are silently skipped when this option is enabled. See: https://bazel.build/extending/platforms#skipping-incompatible-targets'
    --experimental_convenience_symlinks_bep_event: This flag controls whether or not
      we will post the build eventConvenienceSymlinksIdentified to the BuildEventProtocol.
      If the value is true, the BuildEventProtocol will have an entry for convenienceSymlinksIdentified,
      listing all of the convenience symlinks created in your workspace. If false,
      then the convenienceSymlinksIdentified entry in the BuildEventProtocol will
      be empty.
    --local_termination_grace_seconds: Time to wait between terminating a local process
      due to timeout and forcefully shutting it down.
    --noexpand_test_suites: 'Expand test_suite targets into their constituent tests
      before analysis. When this flag is turned on (the default), negative target
      patterns will apply to the tests belonging to the test suite, otherwise they
      will not. Turning off this flag is useful when top-level aspects are applied
      at command line: then they can analyze test_suite targets.'
    --output_filter: Only shows warnings and action outputs for rules with a name
      matching the provided regular expression.
    --directory_creation_cache: Describes the cache used to store known regular directories
      as they're created. Parent directories of output files are created on-demand
      during action execution.
    --noverbose_explanations: Increases the verbosity of the explanations issued if
      --explain is enabled. Has no effect if --explain is not enabled.
    --experimental_materialize_param_files_directly: If materializing param files,
      do so with direct writes to disk.
    --noexperimental_extra_action_top_level_only: Deprecated in favor of aspects.
      Only schedules extra_actions for top level targets.
    --nolegacy_important_outputs: Use this to suppress generation of the legacy important_outputs
      field in the TargetComplete event. important_outputs are required for Bazel
      to ResultStore/BTX integration.
    --experimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --use_action_cache: Whether to use the action cache
    --noexperimental_skyframe_target_pattern_evaluator: Use the Skyframe-based target
      pattern evaluator; implies --experimental_interleave_loading_and_analysis.
    --local_extra_resources: Set the number of extra resources available to Bazel.
      Takes in a string-float pair. Can be used multiple times to specify multiple
      types of extra resources. Bazel will limit concurrently running actions based
      on the available extra resources and the extra resources required. Tests can
      declare the amount of extra resources they need by using a tag of the "resources:<resoucename>:<amount>"
      format. Available CPU, RAM and resources cannot be set with this flag.
    --experimental_build_event_upload_strategy: Selects how to upload artifacts referenced
      in the build event protocol.
    --experimental_remote_cache_eviction_retries: The maximum number of attempts to
      retry if the build encountered a transient remote cache error that would otherwise
      fail the build. Applies for example when artifacts are evicted from the remote
      cache, or in certain cache failure conditions. A non-zero value will implicitly
      set --incompatible_remote_use_new_exit_code_for_lost_inputs to true. A new invocation
      id will be generated for each attempt. If you generate invocation id and provide
      it to Bazel with --invocation_id, you should not use this flag. Instead, set
      flag --incompatible_remote_use_new_exit_code_for_lost_inputs and check for the
      exit code 39.
    --loading_phase_threads: Number of parallel threads to use for the loading/analysis
      phase.Takes an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally
      followed by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" sets
      a reasonable default based on host resources. Must be at least 1.
    --experimental_remote_analysis_cache_mode: The transport direction for the remote
      analysis cache.
    --experimental_merged_skyframe_analysis_execution: If this flag is set, the analysis
      and execution phases of Skyframe are merged.
    --max_test_output_bytes: Specifies maximum per-test-log size that can be emitted
      when --test_output is 'errors' or 'all'. Useful for avoiding overwhelming the
      output with excessively noisy test output. The test header is included in the
      log size. Negative values imply no limit. Output is all or nothing.
    --experimental_skyframe_cpu_heavy_skykeys_thread_pool_size: 'If set to a positive
      value (e.g. "HOST_CPUS*1.5"), Skyframe will run the loading/analysis phase with
      2 separate thread pools: 1 with <value> threads (ideally close to HOST_CPUS)
      reserved for CPU-heavy SkyKeys, and 1 "standard" thread pool (whose size is
      controlled by --loading_phase_threads) for the rest.'
    --expand_test_suites: 'Expand test_suite targets into their constituent tests
      before analysis. When this flag is turned on (the default), negative target
      patterns will apply to the tests belonging to the test suite, otherwise they
      will not. Turning off this flag is useful when top-level aspects are applied
      at command line: then they can analyze test_suite targets.'
    --target_pattern_file: If set, build will read patterns from the file named here,
      rather than on the command line. It is an error to specify a file here as well
      as command-line patterns.
    --noexperimental_process_wrapper_graceful_sigterm: When true, make the process-wrapper
      propagate SIGTERMs (used by the dynamic scheduler to stop process trees) to
      the subprocesses themselves, giving them the grace period in --local_termination_grace_seconds
      before forcibly sending a SIGKILL.
    --experimental_skyfocus_handling_strategy: Strategies for Skyfocus to handle changes
      outside of the working set.
    --incompatible_remote_use_new_exit_code_for_lost_inputs: If set to true, Bazel
      will use new exit code 39 instead of 34 if remote cacheerrors, including cache
      evictions, cause the build to fail.
    --experimental_skyframe_target_pattern_evaluator: Use the Skyframe-based target
      pattern evaluator; implies --experimental_interleave_loading_and_analysis.
    --noincompatible_skip_genfiles_symlink: If set to true, the genfiles symlink will
      not be created. For more information, see https://github.com/bazelbuild/bazel/issues/8651
    --experimental_enable_skyfocus: If true, enable the use of --experimental_working_set
      to reduce Bazel's memory footprint for incremental builds. This feature is known
      as Skyfocus.
    --experimental_aquery_dump_after_build_format: 'Writes the state of Skyframe (which
      includes previous invocations on this blaze instance as well) after a build.
      Output is streamed remotely unless local output is requested with --experimental_aquery_dump_after_build_output_file.  Does
      not honor aquery flags for --include_*, but uses the same defaults, except for
      --include_commandline=false. Possible output formats: proto|streamed_proto|textproto|jsonproto.
      Using this will disable Skymeld.'
    --build_manual_tests: Forces test targets tagged 'manual' to be built. 'manual'
      tests are excluded from processing. This option forces them to be built (but
      not executed).
    --build_tag_filters: Specifies a comma-separated list of tags. Each tag can be
      optionally preceded with '-' to specify excluded tags. Only those targets will
      be built that contain at least one included tag and do not contain any excluded
      tags. This option does not affect the set of tests executed with the 'test'
      command; those are be governed by the test filtering options, for example '--test_tag_filters'
    --noexperimental_use_semaphore_for_jobs: If set to true, additionally use semaphore
      to limit number of concurrent jobs.
    --experimental_aquery_dump_after_build_output_file: Specify the output file for
      the aquery dump after a build. Use in conjunction with --experimental_aquery_dump_after_build_format.
      The path provided is relative to Bazel's output base, unless it's an absolute
      path. Using this will disable Skymeld.
    --local_test_jobs: The max number of local test jobs to run concurrently. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". 0 means local resources
      will limit the number of local test jobs to run concurrently instead. Setting
      this greater than the value for --jobs is ineffectual.
    --norewind_lost_inputs: Whether to use action rewinding to recover from lost inputs.
    --test_tmpdir: Specifies the base temporary directory for 'bazel test' to use.
    --hide_aspect_results: Comma-separated list of aspect names to not display in
      results (see --show_result). Useful for keeping aspects added by wrappers which
      are typically not interesting to end users out of console output.
    --execution_log_compact_file: 'Log the executed spawns into this file as length-delimited
      ExecLogEntry protos, according to src/main/protobuf/spawn.proto. The entire
      file is zstd compressed. Related flags: --execution_log_binary_file (binary
      protobuf format; mutually exclusive), --execution_log_json_file (text JSON format;
      mutually exclusive), --subcommands (for displaying subcommands in terminal output).'
    --noincompatible_remote_use_new_exit_code_for_lost_inputs: If set to true, Bazel
      will use new exit code 39 instead of 34 if remote cacheerrors, including cache
      evictions, cause the build to fail.
    --experimental_build_event_fully_resolve_fileset_symlinks: If true, fully resolve
      relative Fileset symlinks in the BEP when presenting output files. Requires
      --experimental_build_event_expand_filesets.
  description: Loads, analyzes, and queries the specified targets w/ configurations.
- name: dump
  flags: {--rule_classes: Dump rule classes., --memory: Dump the memory use of the
      given Skyframe node., --action_cache: Dump action cache content., --noaction_cache: Dump
      action cache content., --skykey_filter: 'Regex filter of SkyKey names to output.
      Only used with --skyframe=deps, rdeps, function_graph.', --skyframe: Dump the
      Skyframe graph., --nopackages: Dump package cache content., --norules: 'Dump
      rules, including counts and memory usage (if memory is tracked).', --rules: 'Dump
      rules, including counts and memory usage (if memory is tracked).', --skylark_memory: 'Dumps
      a pprof-compatible memory profile to the specified path. To learn more please
      see https://github.com/google/pprof.', --norule_classes: Dump rule classes.,
    --packages: Dump package cache content.}
  description: Dumps the internal state of the %{product} server process.
- name: fetch
  flags:
    --noexecution_log_sort: Whether to sort the execution log, making it easier to
      compare logs across invocations. Set to false to avoid potentially significant
      CPU and memory usage at the end of the invocation, at the cost of producing
      the log in nondeterministic execution order. Only applies to the binary and
      JSON formats; the compact format is never sorted.
    --incompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --noexperimental_stats_summary: Enable a modernized summary of the build stats.
    --check_tests_up_to_date: Don't run tests, just check if they are up-to-date.  If
      all tests results are up-to-date, the testing completes successfully.  If any
      test needs to be built or executed, an error is reported and the testing fails.  This
      option implies --check_up_to_date behavior.
    --noexperimental_merged_skyframe_analysis_execution: If this flag is set, the
      analysis and execution phases of Skyframe are merged.
    --test_keep_going: When disabled, any non-passing test will cause the entire build
      to stop. By default all tests are run, even if some do not pass.
    --check_up_to_date: Don't perform the build, just check if it is up-to-date.  If
      all targets are up-to-date, the build completes successfully.  If any step needs
      to be executed an error is reported and the build fails.
    --experimental_skyfocus_dump_keys: For debugging Skyfocus. Dump the focused SkyKeys
      (roots, leafs, focused deps, focused rdeps).
    --nomaterialize_param_files: Writes intermediate parameter files to output tree
      even when using remote action execution. Useful when debugging actions. This
      is implied by --subcommands and --verbose_failures.
    --test_summary: Specifies the desired format of the test summary. Valid values
      are 'short' to print information only about tests executed, 'terse', to print
      information only about unsuccessful tests that were run, 'detailed' to print
      detailed information about failed test cases, 'testcase' to print summary in
      test case resolution, do not print detailed information about failed test cases
      and 'none' to omit the summary.
    --version_window_for_dirty_node_gc: Nodes that have been dirty for more than this
      many versions will be deleted from the graph upon the next update. Values must
      be non-negative long integers, or -1 indicating the maximum possible window.
    --rewind_lost_inputs: Whether to use action rewinding to recover from lost inputs.
    --local_resources: Set the number of resources available to Bazel. Takes in an
      assignment to a float or HOST_RAM/HOST_CPUS, optionally followed by [-|*]<float>
      (eg. memory=HOST_RAM*.5 to use half the available RAM). Can be used multiple
      times to specify multiple types of resources. Bazel will limit concurrently
      running actions based on the available resources and the resources required.
      Tests can declare the amount of resources they need by using a tag of the "resources:<resource
      name>:<amount>" format. Overrides resources specified by --local_{cpu|ram|extra}_resources.
    --build: Execute the build; this is the usual behaviour. Specifying --nobuild
      causes the build to stop before executing the build actions, returning zero
      iff the package loading and analysis phases completed successfully; this mode
      is useful for testing those phases.
    --noexperimental_local_lockfree_output: When true, the local spawn runner doesn't
      lock the output tree during dynamic execution. Instead, spawns are allowed to
      execute until they are explicitly interrupted by a faster remote action.
    --noincompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --enforce_project_configs: If true, interactive builds may only pass the --scl_config
      build flag; they may not use any other build flags. --scl_config must be set
      to an officially suported project configuration. Supported configurations are
      defined in the target's PROJECT.scl, which can be found by walking up the target's
      packagge path. See b/324126745.
    --aspects: Comma-separated list of aspects to be applied to top-level targets.
      In the list, if aspect some_aspect specifies required aspect providers via required_aspect_providers,
      some_aspect will run after every aspect that was mentioned before it in the
      aspects list whose advertised providers satisfy some_aspect required aspect
      providers. Moreover, some_aspect will run after all its required aspects specified
      by requires attribute. some_aspect will then have access to the values of those
      aspects' providers. <bzl-file-label>%<aspect_name>, for example '//tools:my_def.bzl%my_aspect',
      where 'my_aspect' is a top-level value from a file tools/my_def.bzl
    --show_result: |-
      Show the results of the build.  For each target, state whether or not it was brought up-to-date, and if so, a list of output files that were built.  The printed files are convenient strings for copy+pasting to the shell, to execute them.
      This option requires an integer argument, which is the threshold number of targets above which result information is not printed. Thus zero causes suppression of the message and MAX_INT causes printing of the result to occur always. The default is one.
      If nothing was built for a target its results may be omitted to keep the output under the threshold.
    --noexperimental_materialize_param_files_directly: If materializing param files,
      do so with direct writes to disk.
    --fetch: Allows the command to fetch external dependencies. If set to false, the
      command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --nobuild_tests_only: If specified, only *_test and test_suite rules will be built
      and other targets specified on the command line will be ignored. By default
      everything that was requested will be built.
    --noenforce_project_configs: If true, interactive builds may only pass the --scl_config
      build flag; they may not use any other build flags. --scl_config must be set
      to an officially suported project configuration. Supported configurations are
      defined in the target's PROJECT.scl, which can be found by walking up the target's
      packagge path. See b/324126745.
    --output_tree_tracking: If set, tell the output service (if any) to track when
      files in the output tree have been modified externally (not by the build system).
      This should improve incremental build speed when an appropriate output service
      is enabled.
    --execution_log_sort: Whether to sort the execution log, making it easier to compare
      logs across invocations. Set to false to avoid potentially significant CPU and
      memory usage at the end of the invocation, at the cost of producing the log
      in nondeterministic execution order. Only applies to the binary and JSON formats;
      the compact format is never sorted.
    --noexperimental_enable_skyfocus: If true, enable the use of --experimental_working_set
      to reduce Bazel's memory footprint for incremental builds. This feature is known
      as Skyfocus.
    --spawn_strategy: Specify how spawn actions are executed by default. Accepts a
      comma-separated list of strategies from highest to lowest priority. For each
      action Bazel picks the strategy with the highest priority that can execute the
      action. The default value is "remote,worker,sandboxed,local". See https://blog.bazel.build/2019/06/19/list-strategy.html
      for details.
    --test_strategy: Specifies which strategy to use when running tests.
    --nodiscard_analysis_cache: Discard the analysis cache immediately after the analysis
      phase completes. Reduces memory usage by ~10%, but makes further incremental
      builds slower.
    --experimental_skyfocus_dump_post_gc_stats: For debugging Skyfocus. If enabled,
      trigger manual GC before/after focusing to report heap sizes reductions. This
      will increase the Skyfocus latency.
    --noexperimental_build_event_expand_filesets: If true, expand Filesets in the
      BEP when presenting output files.
    --noexperimental_use_validation_aspect: Whether to run validation actions using
      aspect (for parallelism with tests).
    --nokeep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --nobuild: Execute the build; this is the usual behaviour. Specifying --nobuild
      causes the build to stop before executing the build actions, returning zero
      iff the package loading and analysis phases completed successfully; this mode
      is useful for testing those phases.
    --nocheck_tests_up_to_date: Don't run tests, just check if they are up-to-date.  If
      all tests results are up-to-date, the testing completes successfully.  If any
      test needs to be built or executed, an error is reported and the testing fails.  This
      option implies --check_up_to_date behavior.
    --experimental_extra_action_top_level_only: Deprecated in favor of aspects. Only
      schedules extra_actions for top level targets.
    --noall: Fetches all external repositories necessary for building any target or
      repository. This is the default if no other flags and arguments are provided.
      Only works when --enable_bzlmod is on.
    --build_event_upload_max_retries: The maximum number of times Bazel should retry
      uploading a build event.
    --test_timeout_filters: Specifies a comma-separated list of test timeouts. Each
      timeout can be optionally preceded with '-' to specify excluded timeouts. Only
      those test targets will be found that contain at least one included timeout
      and do not contain any excluded timeouts. This option affects --build_tests_only
      behavior and the test command.
    --experimental_remote_analysis_cache_deadline: Deadline to use for remote analysis
      cache operations.
    -s, --subcommands: 'Display the subcommands executed during a build. Related flags:
      --execution_log_json_file, --execution_log_binary_file (for logging subcommands
      to a file in a tool-friendly format).'
    --deleted_packages: |-
      A comma-separated list of names of packages which the build system will consider non-existent, even if they are visible somewhere on the package path.
      Use this option when deleting a subpackage 'x/y' of an existing package 'x'.  For example, after deleting x/y/BUILD in your client, the build system may complain if it encounters a label '//x:y/z' if that is still provided by another package_path entry.  Specifying --deleted_packages x/y avoids this problem.
    --nouse_action_cache: Whether to use the action cache
    --default_visibility: Default visibility for packages that don't set it explicitly
      ('public' or 'private').
    --noexperimental_async_execution: If set to true, Bazel is allowed to run action
      in a virtual thread. The number of actions in flight is still capped with --jobs.
    --experimental_stream_log_file_uploads: Stream log file uploads directly to the
      remote storage rather than writing them to disk.
    --nooutput_tree_tracking: If set, tell the output service (if any) to track when
      files in the output tree have been modified externally (not by the build system).
      This should improve incremental build speed when an appropriate output service
      is enabled.
    --notest_keep_going: When disabled, any non-passing test will cause the entire
      build to stop. By default all tests are run, even if some do not pass.
    --noallow_analysis_cache_discard: If discarding the analysis cache due to a change
      in the build system, setting this option to false will cause bazel to exit,
      rather than continuing with the build. This option has no effect when 'discard_analysis_cache'
      is also set.
    --strategy_regexp: 'Override which spawn strategy should be used to execute spawn
      actions that have descriptions matching a certain regex_filter. See --per_file_copt
      for details onregex_filter matching. The last regex_filter that matches the
      description is used. This option overrides other flags for specifying strategy.
      Example: --strategy_regexp=//foo.*\\.cc,-//foo/bar=local means to run actions
      using local strategy if their descriptions match //foo.*.cc but not //foo/bar.
      Example: --strategy_regexp=''Compiling.*/bar=local  --strategy_regexp=Compiling=sandboxed
      will run ''Compiling //foo/bar/baz'' with the ''local'' strategy, but reversing
      the order would run it with ''sandboxed''. '
    --experimental_remote_analysis_cache_concurrency: Target concurrency for remote
      analysis caching RPCs.
    --nofetch: Allows the command to fetch external dependencies. If set to false,
      the command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --experimental_stats_summary: Enable a modernized summary of the build stats.
    --package_path: A colon-separated list of where to look for packages. Elements
      beginning with '%workspace%' are relative to the enclosing workspace. If omitted
      or empty, the default is the output of 'bazel info default-package-path'.
    --discard_analysis_cache: Discard the analysis cache immediately after the analysis
      phase completes. Reduces memory usage by ~10%, but makes further incremental
      builds slower.
    --compile_one_dependency: Compile a single dependency of the argument files. This
      is useful for syntax checking source files in IDEs, for example, by rebuilding
      a single target that depends on the source file to detect errors as early as
      possible in the edit/build/test cycle. This argument affects the way all non-flag
      arguments are interpreted; instead of being targets to build they are source
      filenames.  For each source filename an arbitrary target that depends on it
      will be built.
    --experimental_use_semaphore_for_jobs: If set to true, additionally use semaphore
      to limit number of concurrent jobs.
    --verbose_failures: If a command fails, print out the full command line.
    --noexperimental_split_xml_generation: If this flag is set, and a test action
      does not generate a test.xml file, then Bazel uses a separate action to generate
      a dummy test.xml file containing the test log. Otherwise, Bazel generates a
      test.xml as part of the test action.
    --experimental_build_event_output_group_mode: 'Specify how an output group''s
      files will be represented in TargetComplete/AspectComplete BEP events. Values
      are an assignment of an output group name to one of ''NAMED_SET_OF_FILES_ONLY'',
      ''INLINE_ONLY'', or ''BOTH''. The default value is ''NAMED_SET_OF_FILES_ONLY''.
      If an output group is repeated, the final value to appear is used. The default
      value sets the mode for coverage artifacts to BOTH: --experimental_build_event_output_group_mode=baseline.lcov=both'
    --legacy_globbing_threads: Number of threads to use for glob evaluation. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" means to use
      a reasonable value derived from the machine's hardware profile (e.g. the number
      of processors).
    --norun_validations: Whether to run validation actions as part of the build. See
      https://bazel.build/extending/rules#validation_actions
    --notest_verbose_timeout_warnings: If true, print additional warnings when the
      actual test execution time does not match the timeout defined by the test (whether
      implied or explicit).
    --noverbose_failures: If a command fails, print out the full command line.
    --experimental_build_event_expand_filesets: If true, expand Filesets in the BEP
      when presenting output files.
    --incompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --noskip_incompatible_explicit_targets: 'Skip incompatible targets that are explicitly
      listed on the command line. By default, building such targets results in an
      error but they are silently skipped when this option is enabled. See: https://bazel.build/extending/platforms#skipping-incompatible-targets'
    --noexperimental_bep_target_summary: Whether to publish TargetSummary events.
    --nocompile_one_dependency: Compile a single dependency of the argument files.
      This is useful for syntax checking source files in IDEs, for example, by rebuilding
      a single target that depends on the source file to detect errors as early as
      possible in the edit/build/test cycle. This argument affects the way all non-flag
      arguments are interpreted; instead of being targets to build they are source
      filenames.  For each source filename an arbitrary target that depends on it
      will be built.
    --force: Ignore existing repository if any and force fetch the repository again.
      Only works when --enable_bzlmod is on.
    --noexperimental_enable_critical_path_profiling: If set (the default), critical
      path profiling is enabled for the execution phase. This has a slight overhead
      in RAM and CPU, and may prevent Bazel from making certain aggressive RAM optimizations
      in some cases.
    --noverbose_test_summary: If true, print additional information (timing, number
      of failed runs, etc) in the test summary.
    --experimental_convenience_symlinks: |-
      This flag controls how the convenience symlinks (the symlinks that appear in the workspace after the build) will be managed. Possible values:
        normal (default): Each kind of convenience symlink will be created or deleted, as determined by the build.
        clean: All symlinks will be unconditionally deleted.
        ignore: Symlinks will not be created or cleaned up.
        log_only: Generate log messages as if 'normal' were passed, but don't actually perform any filesystem operations (useful for tools).
      Note that only symlinks whose names are generated by the current value of --symlink_prefix can be affected; if the prefix changes, any pre-existing symlinks will be left alone.
    --experimental_oom_sensitive_skyfunctions_semaphore_size: 'Sets the size of the
      semaphore used to prevent SkyFunctions with large peak memory requirement from
      OOM-ing blaze. A value of 0 indicates that no semaphore should be used. Example
      value: "HOST_CPUS*0.5".'
    --experimental_build_event_upload_retry_minimum_delay: 'Initial, minimum delay
      for exponential backoff retries when BEP upload fails. (exponent: 1.6)'
    --noanalyze: Execute the loading/analysis phase; this is the usual behaviour.
      Specifying --noanalyzecauses the build to stop before starting the loading/analysis
      phase, just doing target pattern parsing and returning zero iff that completed
      successfully; this mode is useful for testing.
    --repo: Only fetches the specified repository, which can be either {@apparent_repo_name}
      or {@@canonical_repo_name}. Only works when --enable_bzlmod is on.
    --experimental_skyframe_memory_dump: 'Dump the memory use of individual nodes
      in the Skyframe graph after the build. This option takes a number of flags separated
      by commas: ''json'' (no-op, that''s the only format), ''notransient'' (don''t
      traverse transient fields), ''noconfig'' (ignore objects related to configurations),
      ''noprecomputed'' (ignore precomputed values) and ''noworkspacestatus'' (ignore
      objects related to the workspace status machinery)'
    --test_verbose_timeout_warnings: If true, print additional warnings when the actual
      test execution time does not match the timeout defined by the test (whether
      implied or explicit).
    --experimental_run_bep_event_include_residue: Whether to include the command-line
      residue in run build events which could contain the residue. By default, the
      residue is not included in run command build events that could contain the residue.
    --configure: Only fetches repositories marked as 'configure' for system-configuration
      purpose. Only works when --enable_bzlmod is on.
    --verbose_explanations: Increases the verbosity of the explanations issued if
      --explain is enabled. Has no effect if --explain is not enabled.
    --experimental_max_directories_to_eagerly_visit_in_globbing: If non-negative,
      the first time a glob is evaluated in a package, the subdirectories of the package
      will be traversed in order to warm filesystem caches and compensate for lack
      of parallelism in globbing. At most this many directories will be visited.
    --materialize_param_files: Writes intermediate parameter files to output tree
      even when using remote action execution. Useful when debugging actions. This
      is implied by --subcommands and --verbose_failures.
    -j, --jobs: The number of concurrent jobs to run. Takes an integer, or a keyword
      ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed by an operation ([-|*]<float>)
      eg. "auto", "HOST_CPUS*.5". Values must be between 1 and 5000. Values above
      2500 may cause memory issues. "auto" calculates a reasonable default based on
      host resources.
    --experimental_extra_action_filter: Deprecated in favor of aspects. Filters set
      of targets to schedule extra_actions for.
    --experimental_split_xml_generation: If this flag is set, and a test action does
      not generate a test.xml file, then Bazel uses a separate action to generate
      a dummy test.xml file containing the test log. Otherwise, Bazel generates a
      test.xml as part of the test action.
    --experimental_process_wrapper_graceful_sigterm: When true, make the process-wrapper
      propagate SIGTERMs (used by the dynamic scheduler to stop process trees) to
      the subprocesses themselves, giving them the grace period in --local_termination_grace_seconds
      before forcibly sending a SIGKILL.
    --symlink_prefix: 'The prefix that is prepended to any of the convenience symlinks
      that are created after a build. If omitted, the default value is the name of
      the build tool followed by a hyphen. If ''/'' is passed, then no symlinks are
      created and no warning is emitted. Warning: the special functionality for ''/''
      will be deprecated soon; use --experimental_convenience_symlinks=ignore instead.'
    --test_tag_filters: Specifies a comma-separated list of test tags. Each tag can
      be optionally preceded with '-' to specify excluded tags. Only those test targets
      will be found that contain at least one included tag and do not contain any
      excluded tags. This option affects --build_tests_only behavior and the test
      command.
    --output_groups: A list of comma-separated output group names, each of which optionally
      prefixed by a + or a -. A group prefixed by + is added to the default set of
      output groups, while a group prefixed by - is removed from the default set.
      If at least one group is not prefixed, the default set of output groups is omitted.
      For example, --output_groups=+foo,+bar builds the union of the default set,
      foo, and bar, while --output_groups=foo,bar overrides the default set such that
      only foo and bar are built.
    --max_config_changes_to_show: When discarding the analysis cache due to a change
      in the build options, displays up to the given number of changed option names.
      If the number given is -1, all changed options will be displayed.
    --experimental_cpu_load_scheduling_window_size: The size of window during experimental
      scheduling of action based on CPU load. Make sense to define only when flag
      --experimental_cpu_load_scheduling is enabled.
    --experimental_enable_critical_path_profiling: If set (the default), critical
      path profiling is enabled for the execution phase. This has a slight overhead
      in RAM and CPU, and may prevent Bazel from making certain aggressive RAM optimizations
      in some cases.
    --incompatible_skip_genfiles_symlink: If set to true, the genfiles symlink will
      not be created. For more information, see https://github.com/bazelbuild/bazel/issues/8651
    --experimental_local_lockfree_output: When true, the local spawn runner doesn't
      lock the output tree during dynamic execution. Instead, spawns are allowed to
      execute until they are explicitly interrupted by a faster remote action.
    --verbose_test_summary: If true, print additional information (timing, number
      of failed runs, etc) in the test summary.
    --show_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --noincompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --print_relative_test_log_paths: If true, when printing the path to a test log,
      use relative path that makes use of the 'testlogs' convenience symlink. N.B.
      - A subsequent 'build'/'test'/etc invocation with a different configuration
      can cause the target of this symlink to change, making the path printed previously
      no longer useful.
    --nobuild_manual_tests: Forces test targets tagged 'manual' to be built. 'manual'
      tests are excluded from processing. This option forces them to be built (but
      not executed).
    --test_output: Specifies desired output mode. Valid values are 'summary' to output
      only test status summary, 'errors' to also print test logs for failed tests,
      'all' to print logs for all tests and 'streamed' to output logs for all tests
      in real time (this will force tests to be executed locally one at a time regardless
      of --test_strategy value).
    --experimental_cpu_load_scheduling: Enables the experimental local execution scheduling
      based on CPU load, not estimation of actions one by one.  Experimental scheduling
      have showed the large benefit on a large local builds on a powerful machines
      with the large number of cores. Reccommended to use with --local_resources=cpu=HOST_CPUS
    --test_lang_filters: Specifies a comma-separated list of test languages. Each
      language can be optionally preceded with '-' to specify excluded languages.
      Only those test targets will be found that are written in the specified languages.
      The name used for each language should be the same as the language prefix in
      the *_test rule, e.g. one of 'cc', 'java', 'py', etc. This option affects --build_tests_only
      behavior and the test command.
    --experimental_async_execution: If set to true, Bazel is allowed to run action
      in a virtual thread. The number of actions in flight is still capped with --jobs.
    --run_validations: Whether to run validation actions as part of the build. See
      https://bazel.build/extending/rules#validation_actions
    --nocheck_up_to_date: Don't perform the build, just check if it is up-to-date.  If
      all targets are up-to-date, the build completes successfully.  If any step needs
      to be executed an error is reported and the build fails.
    --execution_log_binary_file: 'Log the executed spawns into this file as length-delimited
      SpawnExec protos, according to src/main/protobuf/spawn.proto. Prefer --execution_log_compact_file,
      which is significantly smaller and cheaper to produce. Related flags: --execution_log_compact_file
      (compact format; mutually exclusive), --execution_log_json_file (text JSON format;
      mutually exclusive), --execution_log_sort (whether to sort the execution log),
      --subcommands (for displaying subcommands in terminal output).'
    --legacy_important_outputs: Use this to suppress generation of the legacy important_outputs
      field in the TargetComplete event. important_outputs are required for Bazel
      to ResultStore/BTX integration.
    --all: Fetches all external repositories necessary for building any target or
      repository. This is the default if no other flags and arguments are provided.
      Only works when --enable_bzlmod is on.
    --cache_computed_file_digests: If greater than 0, configures Bazel to cache file
      digests in memory based on their metadata instead of recomputing the digests
      from disk every time they are needed. Setting this to 0 ensures correctness
      because not all file changes can be noted from file metadata. When not 0, the
      number indicates the size of the cache as the number of file digests to be cached.
    --strategy: Specify how to distribute compilation of other spawn actions. Accepts
      a comma-separated list of strategies from highest to lowest priority. For each
      action Bazel picks the strategy with the highest priority that can execute the
      action. The default value is "remote,worker,sandboxed,local". This flag overrides
      the values set by --spawn_strategy (and --genrule_strategy if used with mnemonic
      Genrule). See https://blog.bazel.build/2019/06/19/list-strategy.html for details.
    --experimental_working_set: The working set for Skyfocus. Specify as comma-separated
      workspace root-relative paths. This is a stateful flag. Defining a working set
      persists it for subsequent invocations, until it is redefined with a new set.
    --experimental_bep_target_summary: Whether to publish TargetSummary events.
    --build_tests_only: If specified, only *_test and test_suite rules will be built
      and other targets specified on the command line will be ignored. By default
      everything that was requested will be built.
    --allow_analysis_cache_discard: If discarding the analysis cache due to a change
      in the build system, setting this option to false will cause bazel to exit,
      rather than continuing with the build. This option has no effect when 'discard_analysis_cache'
      is also set.
    --local_cpu_resources: Explicitly set the total number of local CPU cores available
      to Bazel to spend on build actions executed locally. Takes an integer, or "HOST_CPUS",
      optionally followed by [-|*]<float> (eg. HOST_CPUS*.5 to use half the available
      CPU cores). By default, ("HOST_CPUS"), Bazel will query system configuration
      to estimate the number of CPU cores available.
    --noshow_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --noexperimental_cpu_load_scheduling: Enables the experimental local execution
      scheduling based on CPU load, not estimation of actions one by one.  Experimental
      scheduling have showed the large benefit on a large local builds on a powerful
      machines with the large number of cores. Reccommended to use with --local_resources=cpu=HOST_CPUS
    --noexperimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --noexperimental_stream_log_file_uploads: Stream log file uploads directly to
      the remote storage rather than writing them to disk.
    --noprint_relative_test_log_paths: If true, when printing the path to a test log,
      use relative path that makes use of the 'testlogs' convenience symlink. N.B.
      - A subsequent 'build'/'test'/etc invocation with a different configuration
      can cause the target of this symlink to change, making the path printed previously
      no longer useful.
    --experimental_fsvc_threads: The number of threads that are used by the FileSystemValueChecker.
    --allowed_local_actions_regex: A regex whitelist for action types which may be
      run locally. If unset, all actions are allowed to execute locally
    --serialized_frontier_profile: Dump a profile of serialized frontier bytes. Specifies
      the output path.
    --genrule_strategy: Specify how to execute genrules. This flag will be phased
      out. Instead, use --spawn_strategy=<value> to control all actions or --strategy=Genrule=<value>
      to control genrules only.
    --noexperimental_build_event_fully_resolve_fileset_symlinks: If true, fully resolve
      relative Fileset symlinks in the BEP when presenting output files. Requires
      --experimental_build_event_expand_filesets.
    --aspects_parameters: Specifies the values of the command-line aspects parameters.
      Each parameter value is specified via <param_name>=<param_value>, for example
      'my_param=my_val' where 'my_param' is a parameter of some aspect in --aspects
      list or required by an aspect in the list. This option can be used multiple
      times. However, it is not allowed to assign values to the same parameter more
      than once.
    --experimental_skymeld_analysis_overlap_percentage: The value represents the %
      of the analysis phase which will be overlapped with the execution phase. A value
      of x means Skyframe will queue up execution tasks and wait until there's x%
      of the top level target left to be analyzed before allowing them to launch.
      When the value is 0%, we'd wait for all analysis to finish before executing
      (no overlap). When it's 100%, the phases are free to overlap as much as they
      can.
    --progress_report_interval: The number of seconds to wait between reports on still
      running jobs. The default value 0 means the first report will be printed after
      10 seconds, then 30 seconds and after that progress is reported once every minute.
      When --curses is enabled, progress is reported every second.
    --noexperimental_convenience_symlinks_bep_event: This flag controls whether or
      not we will post the build eventConvenienceSymlinksIdentified to the BuildEventProtocol.
      If the value is true, the BuildEventProtocol will have an entry for convenienceSymlinksIdentified,
      listing all of the convenience symlinks created in your workspace. If false,
      then the convenienceSymlinksIdentified entry in the BuildEventProtocol will
      be empty.
    --test_size_filters: Specifies a comma-separated list of test sizes. Each size
      can be optionally preceded with '-' to specify excluded sizes. Only those test
      targets will be found that contain at least one included size and do not contain
      any excluded sizes. This option affects --build_tests_only behavior and the
      test command.
    --flaky_test_attempts: 'Each test will be retried up to the specified number of
      times in case of any test failure. Tests that required more than one attempt
      to pass are marked as ''FLAKY'' in the test summary. Normally the value specified
      is just an integer or the string ''default''. If an integer, then all tests
      will be run up to N times. If ''default'', then only a single test attempt will
      be made for regular tests and three for tests marked explicitly as flaky by
      their rule (flaky=1 attribute). Alternate syntax: regex_filter@flaky_test_attempts.
      Where flaky_test_attempts is as above and regex_filter stands for a list of
      include and exclude regular expression patterns (Also see --runs_per_test).
      Example: --flaky_test_attempts=//foo/.*,-//foo/bar/.*@3 deflakes all tests in
      //foo/ except those under foo/bar three times. This option can be passed multiple
      times. The most recently passed argument that matches takes precedence. If nothing
      matches, behavior is as if ''default'' above.'
    --noexperimental_skyfocus_dump_post_gc_stats: For debugging Skyfocus. If enabled,
      trigger manual GC before/after focusing to report heap sizes reductions. This
      will increase the Skyfocus latency.
    --experimental_remote_analysis_cache: The URL for the remote analysis caching
      backend.
    --local_ram_resources: Explicitly set the total amount of local host RAM (in MB)
      available to Bazel to spend on build actions executed locally. Takes an integer,
      or "HOST_RAM", optionally followed by [-|*]<float> (eg. HOST_RAM*.5 to use half
      the available RAM). By default, ("HOST_RAM*.67"), Bazel will query system configuration
      to estimate the amount of RAM available and will use 67% of it.
    --experimental_local_retries_on_crash: Number of times to retry a local action
      when we detect that it crashed. This exists to workaround a bug in OSXFUSE which
      is tickled by the use of the dynamic scheduler and --experimental_local_lockfree_output
      due to constant process churn. The bug can be triggered by a cancelled process
      that ran *before* the process we are trying to run, introducing corruption in
      its file reads.
    --experimental_use_validation_aspect: Whether to run validation actions using
      aspect (for parallelism with tests).
    -k, --keep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --noexperimental_run_bep_event_include_residue: Whether to include the command-line
      residue in run build events which could contain the residue. By default, the
      residue is not included in run command build events that could contain the residue.
    --analyze: Execute the loading/analysis phase; this is the usual behaviour. Specifying
      --noanalyzecauses the build to stop before starting the loading/analysis phase,
      just doing target pattern parsing and returning zero iff that completed successfully;
      this mode is useful for testing.
    --execution_log_json_file: 'Log the executed spawns into this file as newline-delimited
      JSON representations of SpawnExec protos, according to src/main/protobuf/spawn.proto.
      Prefer --execution_log_compact_file, which is significantly smaller and cheaper
      to produce. Related flags: --execution_log_compact_file (compact format; mutually
      exclusive), --execution_log_binary_file (binary protobuf format; mutually exclusive),
      --execution_log_sort (whether to sort the execution log), --subcommands (for
      displaying subcommands in terminal output).'
    --explain: Causes the build system to explain each executed step of the build.
      The explanation is written to the specified log file.
    --skip_incompatible_explicit_targets: 'Skip incompatible targets that are explicitly
      listed on the command line. By default, building such targets results in an
      error but they are silently skipped when this option is enabled. See: https://bazel.build/extending/platforms#skipping-incompatible-targets'
    --noconfigure: Only fetches repositories marked as 'configure' for system-configuration
      purpose. Only works when --enable_bzlmod is on.
    --experimental_convenience_symlinks_bep_event: This flag controls whether or not
      we will post the build eventConvenienceSymlinksIdentified to the BuildEventProtocol.
      If the value is true, the BuildEventProtocol will have an entry for convenienceSymlinksIdentified,
      listing all of the convenience symlinks created in your workspace. If false,
      then the convenienceSymlinksIdentified entry in the BuildEventProtocol will
      be empty.
    --local_termination_grace_seconds: Time to wait between terminating a local process
      due to timeout and forcefully shutting it down.
    --noexpand_test_suites: 'Expand test_suite targets into their constituent tests
      before analysis. When this flag is turned on (the default), negative target
      patterns will apply to the tests belonging to the test suite, otherwise they
      will not. Turning off this flag is useful when top-level aspects are applied
      at command line: then they can analyze test_suite targets.'
    --output_filter: Only shows warnings and action outputs for rules with a name
      matching the provided regular expression.
    --directory_creation_cache: Describes the cache used to store known regular directories
      as they're created. Parent directories of output files are created on-demand
      during action execution.
    --noverbose_explanations: Increases the verbosity of the explanations issued if
      --explain is enabled. Has no effect if --explain is not enabled.
    --experimental_materialize_param_files_directly: If materializing param files,
      do so with direct writes to disk.
    --noexperimental_extra_action_top_level_only: Deprecated in favor of aspects.
      Only schedules extra_actions for top level targets.
    --nolegacy_important_outputs: Use this to suppress generation of the legacy important_outputs
      field in the TargetComplete event. important_outputs are required for Bazel
      to ResultStore/BTX integration.
    --experimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --use_action_cache: Whether to use the action cache
    --noexperimental_skyframe_target_pattern_evaluator: Use the Skyframe-based target
      pattern evaluator; implies --experimental_interleave_loading_and_analysis.
    --local_extra_resources: Set the number of extra resources available to Bazel.
      Takes in a string-float pair. Can be used multiple times to specify multiple
      types of extra resources. Bazel will limit concurrently running actions based
      on the available extra resources and the extra resources required. Tests can
      declare the amount of extra resources they need by using a tag of the "resources:<resoucename>:<amount>"
      format. Available CPU, RAM and resources cannot be set with this flag.
    --experimental_build_event_upload_strategy: Selects how to upload artifacts referenced
      in the build event protocol.
    --experimental_remote_cache_eviction_retries: The maximum number of attempts to
      retry if the build encountered a transient remote cache error that would otherwise
      fail the build. Applies for example when artifacts are evicted from the remote
      cache, or in certain cache failure conditions. A non-zero value will implicitly
      set --incompatible_remote_use_new_exit_code_for_lost_inputs to true. A new invocation
      id will be generated for each attempt. If you generate invocation id and provide
      it to Bazel with --invocation_id, you should not use this flag. Instead, set
      flag --incompatible_remote_use_new_exit_code_for_lost_inputs and check for the
      exit code 39.
    --loading_phase_threads: Number of parallel threads to use for the loading/analysis
      phase.Takes an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally
      followed by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" sets
      a reasonable default based on host resources. Must be at least 1.
    --experimental_remote_analysis_cache_mode: The transport direction for the remote
      analysis cache.
    --experimental_merged_skyframe_analysis_execution: If this flag is set, the analysis
      and execution phases of Skyframe are merged.
    --max_test_output_bytes: Specifies maximum per-test-log size that can be emitted
      when --test_output is 'errors' or 'all'. Useful for avoiding overwhelming the
      output with excessively noisy test output. The test header is included in the
      log size. Negative values imply no limit. Output is all or nothing.
    --experimental_skyframe_cpu_heavy_skykeys_thread_pool_size: 'If set to a positive
      value (e.g. "HOST_CPUS*1.5"), Skyframe will run the loading/analysis phase with
      2 separate thread pools: 1 with <value> threads (ideally close to HOST_CPUS)
      reserved for CPU-heavy SkyKeys, and 1 "standard" thread pool (whose size is
      controlled by --loading_phase_threads) for the rest.'
    --expand_test_suites: 'Expand test_suite targets into their constituent tests
      before analysis. When this flag is turned on (the default), negative target
      patterns will apply to the tests belonging to the test suite, otherwise they
      will not. Turning off this flag is useful when top-level aspects are applied
      at command line: then they can analyze test_suite targets.'
    --target_pattern_file: If set, build will read patterns from the file named here,
      rather than on the command line. It is an error to specify a file here as well
      as command-line patterns.
    --noexperimental_process_wrapper_graceful_sigterm: When true, make the process-wrapper
      propagate SIGTERMs (used by the dynamic scheduler to stop process trees) to
      the subprocesses themselves, giving them the grace period in --local_termination_grace_seconds
      before forcibly sending a SIGKILL.
    --experimental_skyfocus_handling_strategy: Strategies for Skyfocus to handle changes
      outside of the working set.
    --incompatible_remote_use_new_exit_code_for_lost_inputs: If set to true, Bazel
      will use new exit code 39 instead of 34 if remote cacheerrors, including cache
      evictions, cause the build to fail.
    --experimental_skyframe_target_pattern_evaluator: Use the Skyframe-based target
      pattern evaluator; implies --experimental_interleave_loading_and_analysis.
    --noforce: Ignore existing repository if any and force fetch the repository again.
      Only works when --enable_bzlmod is on.
    --noincompatible_skip_genfiles_symlink: If set to true, the genfiles symlink will
      not be created. For more information, see https://github.com/bazelbuild/bazel/issues/8651
    --experimental_enable_skyfocus: If true, enable the use of --experimental_working_set
      to reduce Bazel's memory footprint for incremental builds. This feature is known
      as Skyfocus.
    --experimental_aquery_dump_after_build_format: 'Writes the state of Skyframe (which
      includes previous invocations on this blaze instance as well) after a build.
      Output is streamed remotely unless local output is requested with --experimental_aquery_dump_after_build_output_file.  Does
      not honor aquery flags for --include_*, but uses the same defaults, except for
      --include_commandline=false. Possible output formats: proto|streamed_proto|textproto|jsonproto.
      Using this will disable Skymeld.'
    --build_manual_tests: Forces test targets tagged 'manual' to be built. 'manual'
      tests are excluded from processing. This option forces them to be built (but
      not executed).
    --build_tag_filters: Specifies a comma-separated list of tags. Each tag can be
      optionally preceded with '-' to specify excluded tags. Only those targets will
      be built that contain at least one included tag and do not contain any excluded
      tags. This option does not affect the set of tests executed with the 'test'
      command; those are be governed by the test filtering options, for example '--test_tag_filters'
    --noexperimental_use_semaphore_for_jobs: If set to true, additionally use semaphore
      to limit number of concurrent jobs.
    --experimental_aquery_dump_after_build_output_file: Specify the output file for
      the aquery dump after a build. Use in conjunction with --experimental_aquery_dump_after_build_format.
      The path provided is relative to Bazel's output base, unless it's an absolute
      path. Using this will disable Skymeld.
    --local_test_jobs: The max number of local test jobs to run concurrently. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". 0 means local resources
      will limit the number of local test jobs to run concurrently instead. Setting
      this greater than the value for --jobs is ineffectual.
    --norewind_lost_inputs: Whether to use action rewinding to recover from lost inputs.
    --test_tmpdir: Specifies the base temporary directory for 'bazel test' to use.
    --hide_aspect_results: Comma-separated list of aspect names to not display in
      results (see --show_result). Useful for keeping aspects added by wrappers which
      are typically not interesting to end users out of console output.
    --execution_log_compact_file: 'Log the executed spawns into this file as length-delimited
      ExecLogEntry protos, according to src/main/protobuf/spawn.proto. The entire
      file is zstd compressed. Related flags: --execution_log_binary_file (binary
      protobuf format; mutually exclusive), --execution_log_json_file (text JSON format;
      mutually exclusive), --subcommands (for displaying subcommands in terminal output).'
    --noincompatible_remote_use_new_exit_code_for_lost_inputs: If set to true, Bazel
      will use new exit code 39 instead of 34 if remote cacheerrors, including cache
      evictions, cause the build to fail.
    --experimental_build_event_fully_resolve_fileset_symlinks: If true, fully resolve
      relative Fileset symlinks in the BEP when presenting output files. Requires
      --experimental_build_event_expand_filesets.
  description: Fetches external repositories that are prerequisites to the targets.
- name: info
  flags:
    --noexecution_log_sort: Whether to sort the execution log, making it easier to
      compare logs across invocations. Set to false to avoid potentially significant
      CPU and memory usage at the end of the invocation, at the cost of producing
      the log in nondeterministic execution order. Only applies to the binary and
      JSON formats; the compact format is never sorted.
    --incompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --noexperimental_stats_summary: Enable a modernized summary of the build stats.
    --check_tests_up_to_date: Don't run tests, just check if they are up-to-date.  If
      all tests results are up-to-date, the testing completes successfully.  If any
      test needs to be built or executed, an error is reported and the testing fails.  This
      option implies --check_up_to_date behavior.
    --noexperimental_merged_skyframe_analysis_execution: If this flag is set, the
      analysis and execution phases of Skyframe are merged.
    --test_keep_going: When disabled, any non-passing test will cause the entire build
      to stop. By default all tests are run, even if some do not pass.
    --experimental_skyfocus_dump_keys: For debugging Skyfocus. Dump the focused SkyKeys
      (roots, leafs, focused deps, focused rdeps).
    --check_up_to_date: Don't perform the build, just check if it is up-to-date.  If
      all targets are up-to-date, the build completes successfully.  If any step needs
      to be executed an error is reported and the build fails.
    --nomaterialize_param_files: Writes intermediate parameter files to output tree
      even when using remote action execution. Useful when debugging actions. This
      is implied by --subcommands and --verbose_failures.
    --version_window_for_dirty_node_gc: Nodes that have been dirty for more than this
      many versions will be deleted from the graph upon the next update. Values must
      be non-negative long integers, or -1 indicating the maximum possible window.
    --test_summary: Specifies the desired format of the test summary. Valid values
      are 'short' to print information only about tests executed, 'terse', to print
      information only about unsuccessful tests that were run, 'detailed' to print
      detailed information about failed test cases, 'testcase' to print summary in
      test case resolution, do not print detailed information about failed test cases
      and 'none' to omit the summary.
    --local_resources: Set the number of resources available to Bazel. Takes in an
      assignment to a float or HOST_RAM/HOST_CPUS, optionally followed by [-|*]<float>
      (eg. memory=HOST_RAM*.5 to use half the available RAM). Can be used multiple
      times to specify multiple types of resources. Bazel will limit concurrently
      running actions based on the available resources and the resources required.
      Tests can declare the amount of resources they need by using a tag of the "resources:<resource
      name>:<amount>" format. Overrides resources specified by --local_{cpu|ram|extra}_resources.
    --rewind_lost_inputs: Whether to use action rewinding to recover from lost inputs.
    --noexperimental_local_lockfree_output: When true, the local spawn runner doesn't
      lock the output tree during dynamic execution. Instead, spawns are allowed to
      execute until they are explicitly interrupted by a faster remote action.
    --build: Execute the build; this is the usual behaviour. Specifying --nobuild
      causes the build to stop before executing the build actions, returning zero
      iff the package loading and analysis phases completed successfully; this mode
      is useful for testing those phases.
    --noincompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --enforce_project_configs: If true, interactive builds may only pass the --scl_config
      build flag; they may not use any other build flags. --scl_config must be set
      to an officially suported project configuration. Supported configurations are
      defined in the target's PROJECT.scl, which can be found by walking up the target's
      packagge path. See b/324126745.
    --aspects: Comma-separated list of aspects to be applied to top-level targets.
      In the list, if aspect some_aspect specifies required aspect providers via required_aspect_providers,
      some_aspect will run after every aspect that was mentioned before it in the
      aspects list whose advertised providers satisfy some_aspect required aspect
      providers. Moreover, some_aspect will run after all its required aspects specified
      by requires attribute. some_aspect will then have access to the values of those
      aspects' providers. <bzl-file-label>%<aspect_name>, for example '//tools:my_def.bzl%my_aspect',
      where 'my_aspect' is a top-level value from a file tools/my_def.bzl
    --nobuild_tests_only: If specified, only *_test and test_suite rules will be built
      and other targets specified on the command line will be ignored. By default
      everything that was requested will be built.
    --fetch: Allows the command to fetch external dependencies. If set to false, the
      command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --noexperimental_materialize_param_files_directly: If materializing param files,
      do so with direct writes to disk.
    --show_result: |-
      Show the results of the build.  For each target, state whether or not it was brought up-to-date, and if so, a list of output files that were built.  The printed files are convenient strings for copy+pasting to the shell, to execute them.
      This option requires an integer argument, which is the threshold number of targets above which result information is not printed. Thus zero causes suppression of the message and MAX_INT causes printing of the result to occur always. The default is one.
      If nothing was built for a target its results may be omitted to keep the output under the threshold.
    --noenforce_project_configs: If true, interactive builds may only pass the --scl_config
      build flag; they may not use any other build flags. --scl_config must be set
      to an officially suported project configuration. Supported configurations are
      defined in the target's PROJECT.scl, which can be found by walking up the target's
      packagge path. See b/324126745.
    --execution_log_sort: Whether to sort the execution log, making it easier to compare
      logs across invocations. Set to false to avoid potentially significant CPU and
      memory usage at the end of the invocation, at the cost of producing the log
      in nondeterministic execution order. Only applies to the binary and JSON formats;
      the compact format is never sorted.
    --output_tree_tracking: If set, tell the output service (if any) to track when
      files in the output tree have been modified externally (not by the build system).
      This should improve incremental build speed when an appropriate output service
      is enabled.
    --noexperimental_enable_skyfocus: If true, enable the use of --experimental_working_set
      to reduce Bazel's memory footprint for incremental builds. This feature is known
      as Skyfocus.
    --test_strategy: Specifies which strategy to use when running tests.
    --spawn_strategy: Specify how spawn actions are executed by default. Accepts a
      comma-separated list of strategies from highest to lowest priority. For each
      action Bazel picks the strategy with the highest priority that can execute the
      action. The default value is "remote,worker,sandboxed,local". See https://blog.bazel.build/2019/06/19/list-strategy.html
      for details.
    --nodiscard_analysis_cache: Discard the analysis cache immediately after the analysis
      phase completes. Reduces memory usage by ~10%, but makes further incremental
      builds slower.
    --experimental_skyfocus_dump_post_gc_stats: For debugging Skyfocus. If enabled,
      trigger manual GC before/after focusing to report heap sizes reductions. This
      will increase the Skyfocus latency.
    --noexperimental_build_event_expand_filesets: If true, expand Filesets in the
      BEP when presenting output files.
    --nokeep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --noexperimental_use_validation_aspect: Whether to run validation actions using
      aspect (for parallelism with tests).
    --nocheck_tests_up_to_date: Don't run tests, just check if they are up-to-date.  If
      all tests results are up-to-date, the testing completes successfully.  If any
      test needs to be built or executed, an error is reported and the testing fails.  This
      option implies --check_up_to_date behavior.
    --nobuild: Execute the build; this is the usual behaviour. Specifying --nobuild
      causes the build to stop before executing the build actions, returning zero
      iff the package loading and analysis phases completed successfully; this mode
      is useful for testing those phases.
    --experimental_extra_action_top_level_only: Deprecated in favor of aspects. Only
      schedules extra_actions for top level targets.
    --build_event_upload_max_retries: The maximum number of times Bazel should retry
      uploading a build event.
    --test_timeout_filters: Specifies a comma-separated list of test timeouts. Each
      timeout can be optionally preceded with '-' to specify excluded timeouts. Only
      those test targets will be found that contain at least one included timeout
      and do not contain any excluded timeouts. This option affects --build_tests_only
      behavior and the test command.
    --experimental_remote_analysis_cache_deadline: Deadline to use for remote analysis
      cache operations.
    -s, --subcommands: 'Display the subcommands executed during a build. Related flags:
      --execution_log_json_file, --execution_log_binary_file (for logging subcommands
      to a file in a tool-friendly format).'
    --deleted_packages: |-
      A comma-separated list of names of packages which the build system will consider non-existent, even if they are visible somewhere on the package path.
      Use this option when deleting a subpackage 'x/y' of an existing package 'x'.  For example, after deleting x/y/BUILD in your client, the build system may complain if it encounters a label '//x:y/z' if that is still provided by another package_path entry.  Specifying --deleted_packages x/y avoids this problem.
    --default_visibility: Default visibility for packages that don't set it explicitly
      ('public' or 'private').
    --nouse_action_cache: Whether to use the action cache
    --experimental_stream_log_file_uploads: Stream log file uploads directly to the
      remote storage rather than writing them to disk.
    --noexperimental_async_execution: If set to true, Bazel is allowed to run action
      in a virtual thread. The number of actions in flight is still capped with --jobs.
    --nooutput_tree_tracking: If set, tell the output service (if any) to track when
      files in the output tree have been modified externally (not by the build system).
      This should improve incremental build speed when an appropriate output service
      is enabled.
    --notest_keep_going: When disabled, any non-passing test will cause the entire
      build to stop. By default all tests are run, even if some do not pass.
    --noallow_analysis_cache_discard: If discarding the analysis cache due to a change
      in the build system, setting this option to false will cause bazel to exit,
      rather than continuing with the build. This option has no effect when 'discard_analysis_cache'
      is also set.
    --strategy_regexp: 'Override which spawn strategy should be used to execute spawn
      actions that have descriptions matching a certain regex_filter. See --per_file_copt
      for details onregex_filter matching. The last regex_filter that matches the
      description is used. This option overrides other flags for specifying strategy.
      Example: --strategy_regexp=//foo.*\\.cc,-//foo/bar=local means to run actions
      using local strategy if their descriptions match //foo.*.cc but not //foo/bar.
      Example: --strategy_regexp=''Compiling.*/bar=local  --strategy_regexp=Compiling=sandboxed
      will run ''Compiling //foo/bar/baz'' with the ''local'' strategy, but reversing
      the order would run it with ''sandboxed''. '
    --experimental_remote_analysis_cache_concurrency: Target concurrency for remote
      analysis caching RPCs.
    --nofetch: Allows the command to fetch external dependencies. If set to false,
      the command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --experimental_stats_summary: Enable a modernized summary of the build stats.
    --discard_analysis_cache: Discard the analysis cache immediately after the analysis
      phase completes. Reduces memory usage by ~10%, but makes further incremental
      builds slower.
    --package_path: A colon-separated list of where to look for packages. Elements
      beginning with '%workspace%' are relative to the enclosing workspace. If omitted
      or empty, the default is the output of 'bazel info default-package-path'.
    --compile_one_dependency: Compile a single dependency of the argument files. This
      is useful for syntax checking source files in IDEs, for example, by rebuilding
      a single target that depends on the source file to detect errors as early as
      possible in the edit/build/test cycle. This argument affects the way all non-flag
      arguments are interpreted; instead of being targets to build they are source
      filenames.  For each source filename an arbitrary target that depends on it
      will be built.
    --experimental_use_semaphore_for_jobs: If set to true, additionally use semaphore
      to limit number of concurrent jobs.
    --experimental_build_event_output_group_mode: 'Specify how an output group''s
      files will be represented in TargetComplete/AspectComplete BEP events. Values
      are an assignment of an output group name to one of ''NAMED_SET_OF_FILES_ONLY'',
      ''INLINE_ONLY'', or ''BOTH''. The default value is ''NAMED_SET_OF_FILES_ONLY''.
      If an output group is repeated, the final value to appear is used. The default
      value sets the mode for coverage artifacts to BOTH: --experimental_build_event_output_group_mode=baseline.lcov=both'
    --noexperimental_split_xml_generation: If this flag is set, and a test action
      does not generate a test.xml file, then Bazel uses a separate action to generate
      a dummy test.xml file containing the test log. Otherwise, Bazel generates a
      test.xml as part of the test action.
    --verbose_failures: If a command fails, print out the full command line.
    --legacy_globbing_threads: Number of threads to use for glob evaluation. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" means to use
      a reasonable value derived from the machine's hardware profile (e.g. the number
      of processors).
    --norun_validations: Whether to run validation actions as part of the build. See
      https://bazel.build/extending/rules#validation_actions
    --noverbose_failures: If a command fails, print out the full command line.
    --noshow_make_env: Include the "Make" environment in the output.
    --experimental_build_event_expand_filesets: If true, expand Filesets in the BEP
      when presenting output files.
    --incompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --noskip_incompatible_explicit_targets: 'Skip incompatible targets that are explicitly
      listed on the command line. By default, building such targets results in an
      error but they are silently skipped when this option is enabled. See: https://bazel.build/extending/platforms#skipping-incompatible-targets'
    --noexperimental_bep_target_summary: Whether to publish TargetSummary events.
    --nocompile_one_dependency: Compile a single dependency of the argument files.
      This is useful for syntax checking source files in IDEs, for example, by rebuilding
      a single target that depends on the source file to detect errors as early as
      possible in the edit/build/test cycle. This argument affects the way all non-flag
      arguments are interpreted; instead of being targets to build they are source
      filenames.  For each source filename an arbitrary target that depends on it
      will be built.
    --noexperimental_enable_critical_path_profiling: If set (the default), critical
      path profiling is enabled for the execution phase. This has a slight overhead
      in RAM and CPU, and may prevent Bazel from making certain aggressive RAM optimizations
      in some cases.
    --experimental_oom_sensitive_skyfunctions_semaphore_size: 'Sets the size of the
      semaphore used to prevent SkyFunctions with large peak memory requirement from
      OOM-ing blaze. A value of 0 indicates that no semaphore should be used. Example
      value: "HOST_CPUS*0.5".'
    --experimental_convenience_symlinks: |-
      This flag controls how the convenience symlinks (the symlinks that appear in the workspace after the build) will be managed. Possible values:
        normal (default): Each kind of convenience symlink will be created or deleted, as determined by the build.
        clean: All symlinks will be unconditionally deleted.
        ignore: Symlinks will not be created or cleaned up.
        log_only: Generate log messages as if 'normal' were passed, but don't actually perform any filesystem operations (useful for tools).
      Note that only symlinks whose names are generated by the current value of --symlink_prefix can be affected; if the prefix changes, any pre-existing symlinks will be left alone.
    --experimental_build_event_upload_retry_minimum_delay: 'Initial, minimum delay
      for exponential backoff retries when BEP upload fails. (exponent: 1.6)'
    --noanalyze: Execute the loading/analysis phase; this is the usual behaviour.
      Specifying --noanalyzecauses the build to stop before starting the loading/analysis
      phase, just doing target pattern parsing and returning zero iff that completed
      successfully; this mode is useful for testing.
    --experimental_skyframe_memory_dump: 'Dump the memory use of individual nodes
      in the Skyframe graph after the build. This option takes a number of flags separated
      by commas: ''json'' (no-op, that''s the only format), ''notransient'' (don''t
      traverse transient fields), ''noconfig'' (ignore objects related to configurations),
      ''noprecomputed'' (ignore precomputed values) and ''noworkspacestatus'' (ignore
      objects related to the workspace status machinery)'
    --experimental_run_bep_event_include_residue: Whether to include the command-line
      residue in run build events which could contain the residue. By default, the
      residue is not included in run command build events that could contain the residue.
    --experimental_max_directories_to_eagerly_visit_in_globbing: If non-negative,
      the first time a glob is evaluated in a package, the subdirectories of the package
      will be traversed in order to warm filesystem caches and compensate for lack
      of parallelism in globbing. At most this many directories will be visited.
    --verbose_explanations: Increases the verbosity of the explanations issued if
      --explain is enabled. Has no effect if --explain is not enabled.
    --materialize_param_files: Writes intermediate parameter files to output tree
      even when using remote action execution. Useful when debugging actions. This
      is implied by --subcommands and --verbose_failures.
    -j, --jobs: The number of concurrent jobs to run. Takes an integer, or a keyword
      ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed by an operation ([-|*]<float>)
      eg. "auto", "HOST_CPUS*.5". Values must be between 1 and 5000. Values above
      2500 may cause memory issues. "auto" calculates a reasonable default based on
      host resources.
    --experimental_extra_action_filter: Deprecated in favor of aspects. Filters set
      of targets to schedule extra_actions for.
    --experimental_split_xml_generation: If this flag is set, and a test action does
      not generate a test.xml file, then Bazel uses a separate action to generate
      a dummy test.xml file containing the test log. Otherwise, Bazel generates a
      test.xml as part of the test action.
    --experimental_process_wrapper_graceful_sigterm: When true, make the process-wrapper
      propagate SIGTERMs (used by the dynamic scheduler to stop process trees) to
      the subprocesses themselves, giving them the grace period in --local_termination_grace_seconds
      before forcibly sending a SIGKILL.
    --test_tag_filters: Specifies a comma-separated list of test tags. Each tag can
      be optionally preceded with '-' to specify excluded tags. Only those test targets
      will be found that contain at least one included tag and do not contain any
      excluded tags. This option affects --build_tests_only behavior and the test
      command.
    --symlink_prefix: 'The prefix that is prepended to any of the convenience symlinks
      that are created after a build. If omitted, the default value is the name of
      the build tool followed by a hyphen. If ''/'' is passed, then no symlinks are
      created and no warning is emitted. Warning: the special functionality for ''/''
      will be deprecated soon; use --experimental_convenience_symlinks=ignore instead.'
    --output_groups: A list of comma-separated output group names, each of which optionally
      prefixed by a + or a -. A group prefixed by + is added to the default set of
      output groups, while a group prefixed by - is removed from the default set.
      If at least one group is not prefixed, the default set of output groups is omitted.
      For example, --output_groups=+foo,+bar builds the union of the default set,
      foo, and bar, while --output_groups=foo,bar overrides the default set such that
      only foo and bar are built.
    --max_config_changes_to_show: When discarding the analysis cache due to a change
      in the build options, displays up to the given number of changed option names.
      If the number given is -1, all changed options will be displayed.
    --experimental_enable_critical_path_profiling: If set (the default), critical
      path profiling is enabled for the execution phase. This has a slight overhead
      in RAM and CPU, and may prevent Bazel from making certain aggressive RAM optimizations
      in some cases.
    --experimental_cpu_load_scheduling_window_size: The size of window during experimental
      scheduling of action based on CPU load. Make sense to define only when flag
      --experimental_cpu_load_scheduling is enabled.
    --incompatible_skip_genfiles_symlink: If set to true, the genfiles symlink will
      not be created. For more information, see https://github.com/bazelbuild/bazel/issues/8651
    --experimental_local_lockfree_output: When true, the local spawn runner doesn't
      lock the output tree during dynamic execution. Instead, spawns are allowed to
      execute until they are explicitly interrupted by a faster remote action.
    --noincompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --show_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --nobuild_manual_tests: Forces test targets tagged 'manual' to be built. 'manual'
      tests are excluded from processing. This option forces them to be built (but
      not executed).
    --test_lang_filters: Specifies a comma-separated list of test languages. Each
      language can be optionally preceded with '-' to specify excluded languages.
      Only those test targets will be found that are written in the specified languages.
      The name used for each language should be the same as the language prefix in
      the *_test rule, e.g. one of 'cc', 'java', 'py', etc. This option affects --build_tests_only
      behavior and the test command.
    --experimental_cpu_load_scheduling: Enables the experimental local execution scheduling
      based on CPU load, not estimation of actions one by one.  Experimental scheduling
      have showed the large benefit on a large local builds on a powerful machines
      with the large number of cores. Reccommended to use with --local_resources=cpu=HOST_CPUS
    --test_output: Specifies desired output mode. Valid values are 'summary' to output
      only test status summary, 'errors' to also print test logs for failed tests,
      'all' to print logs for all tests and 'streamed' to output logs for all tests
      in real time (this will force tests to be executed locally one at a time regardless
      of --test_strategy value).
    --run_validations: Whether to run validation actions as part of the build. See
      https://bazel.build/extending/rules#validation_actions
    --experimental_async_execution: If set to true, Bazel is allowed to run action
      in a virtual thread. The number of actions in flight is still capped with --jobs.
    --execution_log_binary_file: 'Log the executed spawns into this file as length-delimited
      SpawnExec protos, according to src/main/protobuf/spawn.proto. Prefer --execution_log_compact_file,
      which is significantly smaller and cheaper to produce. Related flags: --execution_log_compact_file
      (compact format; mutually exclusive), --execution_log_json_file (text JSON format;
      mutually exclusive), --execution_log_sort (whether to sort the execution log),
      --subcommands (for displaying subcommands in terminal output).'
    --nocheck_up_to_date: Don't perform the build, just check if it is up-to-date.  If
      all targets are up-to-date, the build completes successfully.  If any step needs
      to be executed an error is reported and the build fails.
    --legacy_important_outputs: Use this to suppress generation of the legacy important_outputs
      field in the TargetComplete event. important_outputs are required for Bazel
      to ResultStore/BTX integration.
    --cache_computed_file_digests: If greater than 0, configures Bazel to cache file
      digests in memory based on their metadata instead of recomputing the digests
      from disk every time they are needed. Setting this to 0 ensures correctness
      because not all file changes can be noted from file metadata. When not 0, the
      number indicates the size of the cache as the number of file digests to be cached.
    --experimental_working_set: The working set for Skyfocus. Specify as comma-separated
      workspace root-relative paths. This is a stateful flag. Defining a working set
      persists it for subsequent invocations, until it is redefined with a new set.
    --strategy: Specify how to distribute compilation of other spawn actions. Accepts
      a comma-separated list of strategies from highest to lowest priority. For each
      action Bazel picks the strategy with the highest priority that can execute the
      action. The default value is "remote,worker,sandboxed,local". This flag overrides
      the values set by --spawn_strategy (and --genrule_strategy if used with mnemonic
      Genrule). See https://blog.bazel.build/2019/06/19/list-strategy.html for details.
    --experimental_bep_target_summary: Whether to publish TargetSummary events.
    --build_tests_only: If specified, only *_test and test_suite rules will be built
      and other targets specified on the command line will be ignored. By default
      everything that was requested will be built.
    --allow_analysis_cache_discard: If discarding the analysis cache due to a change
      in the build system, setting this option to false will cause bazel to exit,
      rather than continuing with the build. This option has no effect when 'discard_analysis_cache'
      is also set.
    --local_cpu_resources: Explicitly set the total number of local CPU cores available
      to Bazel to spend on build actions executed locally. Takes an integer, or "HOST_CPUS",
      optionally followed by [-|*]<float> (eg. HOST_CPUS*.5 to use half the available
      CPU cores). By default, ("HOST_CPUS"), Bazel will query system configuration
      to estimate the number of CPU cores available.
    --noshow_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --noexperimental_cpu_load_scheduling: Enables the experimental local execution
      scheduling based on CPU load, not estimation of actions one by one.  Experimental
      scheduling have showed the large benefit on a large local builds on a powerful
      machines with the large number of cores. Reccommended to use with --local_resources=cpu=HOST_CPUS
    --noexperimental_stream_log_file_uploads: Stream log file uploads directly to
      the remote storage rather than writing them to disk.
    --noexperimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --allowed_local_actions_regex: A regex whitelist for action types which may be
      run locally. If unset, all actions are allowed to execute locally
    --experimental_fsvc_threads: The number of threads that are used by the FileSystemValueChecker.
    --serialized_frontier_profile: Dump a profile of serialized frontier bytes. Specifies
      the output path.
    --noexperimental_build_event_fully_resolve_fileset_symlinks: If true, fully resolve
      relative Fileset symlinks in the BEP when presenting output files. Requires
      --experimental_build_event_expand_filesets.
    --genrule_strategy: Specify how to execute genrules. This flag will be phased
      out. Instead, use --spawn_strategy=<value> to control all actions or --strategy=Genrule=<value>
      to control genrules only.
    --experimental_skymeld_analysis_overlap_percentage: The value represents the %
      of the analysis phase which will be overlapped with the execution phase. A value
      of x means Skyframe will queue up execution tasks and wait until there's x%
      of the top level target left to be analyzed before allowing them to launch.
      When the value is 0%, we'd wait for all analysis to finish before executing
      (no overlap). When it's 100%, the phases are free to overlap as much as they
      can.
    --aspects_parameters: Specifies the values of the command-line aspects parameters.
      Each parameter value is specified via <param_name>=<param_value>, for example
      'my_param=my_val' where 'my_param' is a parameter of some aspect in --aspects
      list or required by an aspect in the list. This option can be used multiple
      times. However, it is not allowed to assign values to the same parameter more
      than once.
    --progress_report_interval: The number of seconds to wait between reports on still
      running jobs. The default value 0 means the first report will be printed after
      10 seconds, then 30 seconds and after that progress is reported once every minute.
      When --curses is enabled, progress is reported every second.
    --test_size_filters: Specifies a comma-separated list of test sizes. Each size
      can be optionally preceded with '-' to specify excluded sizes. Only those test
      targets will be found that contain at least one included size and do not contain
      any excluded sizes. This option affects --build_tests_only behavior and the
      test command.
    --noexperimental_convenience_symlinks_bep_event: This flag controls whether or
      not we will post the build eventConvenienceSymlinksIdentified to the BuildEventProtocol.
      If the value is true, the BuildEventProtocol will have an entry for convenienceSymlinksIdentified,
      listing all of the convenience symlinks created in your workspace. If false,
      then the convenienceSymlinksIdentified entry in the BuildEventProtocol will
      be empty.
    --experimental_remote_analysis_cache: The URL for the remote analysis caching
      backend.
    --noexperimental_skyfocus_dump_post_gc_stats: For debugging Skyfocus. If enabled,
      trigger manual GC before/after focusing to report heap sizes reductions. This
      will increase the Skyfocus latency.
    --flaky_test_attempts: 'Each test will be retried up to the specified number of
      times in case of any test failure. Tests that required more than one attempt
      to pass are marked as ''FLAKY'' in the test summary. Normally the value specified
      is just an integer or the string ''default''. If an integer, then all tests
      will be run up to N times. If ''default'', then only a single test attempt will
      be made for regular tests and three for tests marked explicitly as flaky by
      their rule (flaky=1 attribute). Alternate syntax: regex_filter@flaky_test_attempts.
      Where flaky_test_attempts is as above and regex_filter stands for a list of
      include and exclude regular expression patterns (Also see --runs_per_test).
      Example: --flaky_test_attempts=//foo/.*,-//foo/bar/.*@3 deflakes all tests in
      //foo/ except those under foo/bar three times. This option can be passed multiple
      times. The most recently passed argument that matches takes precedence. If nothing
      matches, behavior is as if ''default'' above.'
    --experimental_local_retries_on_crash: Number of times to retry a local action
      when we detect that it crashed. This exists to workaround a bug in OSXFUSE which
      is tickled by the use of the dynamic scheduler and --experimental_local_lockfree_output
      due to constant process churn. The bug can be triggered by a cancelled process
      that ran *before* the process we are trying to run, introducing corruption in
      its file reads.
    --local_ram_resources: Explicitly set the total amount of local host RAM (in MB)
      available to Bazel to spend on build actions executed locally. Takes an integer,
      or "HOST_RAM", optionally followed by [-|*]<float> (eg. HOST_RAM*.5 to use half
      the available RAM). By default, ("HOST_RAM*.67"), Bazel will query system configuration
      to estimate the amount of RAM available and will use 67% of it.
    --experimental_use_validation_aspect: Whether to run validation actions using
      aspect (for parallelism with tests).
    -k, --keep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --noexperimental_run_bep_event_include_residue: Whether to include the command-line
      residue in run build events which could contain the residue. By default, the
      residue is not included in run command build events that could contain the residue.
    --analyze: Execute the loading/analysis phase; this is the usual behaviour. Specifying
      --noanalyzecauses the build to stop before starting the loading/analysis phase,
      just doing target pattern parsing and returning zero iff that completed successfully;
      this mode is useful for testing.
    --execution_log_json_file: 'Log the executed spawns into this file as newline-delimited
      JSON representations of SpawnExec protos, according to src/main/protobuf/spawn.proto.
      Prefer --execution_log_compact_file, which is significantly smaller and cheaper
      to produce. Related flags: --execution_log_compact_file (compact format; mutually
      exclusive), --execution_log_binary_file (binary protobuf format; mutually exclusive),
      --execution_log_sort (whether to sort the execution log), --subcommands (for
      displaying subcommands in terminal output).'
    --explain: Causes the build system to explain each executed step of the build.
      The explanation is written to the specified log file.
    --skip_incompatible_explicit_targets: 'Skip incompatible targets that are explicitly
      listed on the command line. By default, building such targets results in an
      error but they are silently skipped when this option is enabled. See: https://bazel.build/extending/platforms#skipping-incompatible-targets'
    --show_make_env: Include the "Make" environment in the output.
    --experimental_convenience_symlinks_bep_event: This flag controls whether or not
      we will post the build eventConvenienceSymlinksIdentified to the BuildEventProtocol.
      If the value is true, the BuildEventProtocol will have an entry for convenienceSymlinksIdentified,
      listing all of the convenience symlinks created in your workspace. If false,
      then the convenienceSymlinksIdentified entry in the BuildEventProtocol will
      be empty.
    --local_termination_grace_seconds: Time to wait between terminating a local process
      due to timeout and forcefully shutting it down.
    --noexpand_test_suites: 'Expand test_suite targets into their constituent tests
      before analysis. When this flag is turned on (the default), negative target
      patterns will apply to the tests belonging to the test suite, otherwise they
      will not. Turning off this flag is useful when top-level aspects are applied
      at command line: then they can analyze test_suite targets.'
    --directory_creation_cache: Describes the cache used to store known regular directories
      as they're created. Parent directories of output files are created on-demand
      during action execution.
    --output_filter: Only shows warnings and action outputs for rules with a name
      matching the provided regular expression.
    --nolegacy_important_outputs: Use this to suppress generation of the legacy important_outputs
      field in the TargetComplete event. important_outputs are required for Bazel
      to ResultStore/BTX integration.
    --noexperimental_extra_action_top_level_only: Deprecated in favor of aspects.
      Only schedules extra_actions for top level targets.
    --experimental_materialize_param_files_directly: If materializing param files,
      do so with direct writes to disk.
    --noverbose_explanations: Increases the verbosity of the explanations issued if
      --explain is enabled. Has no effect if --explain is not enabled.
    --experimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --use_action_cache: Whether to use the action cache
    --noexperimental_skyframe_target_pattern_evaluator: Use the Skyframe-based target
      pattern evaluator; implies --experimental_interleave_loading_and_analysis.
    --experimental_build_event_upload_strategy: Selects how to upload artifacts referenced
      in the build event protocol.
    --local_extra_resources: Set the number of extra resources available to Bazel.
      Takes in a string-float pair. Can be used multiple times to specify multiple
      types of extra resources. Bazel will limit concurrently running actions based
      on the available extra resources and the extra resources required. Tests can
      declare the amount of extra resources they need by using a tag of the "resources:<resoucename>:<amount>"
      format. Available CPU, RAM and resources cannot be set with this flag.
    --loading_phase_threads: Number of parallel threads to use for the loading/analysis
      phase.Takes an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally
      followed by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" sets
      a reasonable default based on host resources. Must be at least 1.
    --experimental_remote_cache_eviction_retries: The maximum number of attempts to
      retry if the build encountered a transient remote cache error that would otherwise
      fail the build. Applies for example when artifacts are evicted from the remote
      cache, or in certain cache failure conditions. A non-zero value will implicitly
      set --incompatible_remote_use_new_exit_code_for_lost_inputs to true. A new invocation
      id will be generated for each attempt. If you generate invocation id and provide
      it to Bazel with --invocation_id, you should not use this flag. Instead, set
      flag --incompatible_remote_use_new_exit_code_for_lost_inputs and check for the
      exit code 39.
    --experimental_remote_analysis_cache_mode: The transport direction for the remote
      analysis cache.
    --expand_test_suites: 'Expand test_suite targets into their constituent tests
      before analysis. When this flag is turned on (the default), negative target
      patterns will apply to the tests belonging to the test suite, otherwise they
      will not. Turning off this flag is useful when top-level aspects are applied
      at command line: then they can analyze test_suite targets.'
    --experimental_skyframe_cpu_heavy_skykeys_thread_pool_size: 'If set to a positive
      value (e.g. "HOST_CPUS*1.5"), Skyframe will run the loading/analysis phase with
      2 separate thread pools: 1 with <value> threads (ideally close to HOST_CPUS)
      reserved for CPU-heavy SkyKeys, and 1 "standard" thread pool (whose size is
      controlled by --loading_phase_threads) for the rest.'
    --max_test_output_bytes: Specifies maximum per-test-log size that can be emitted
      when --test_output is 'errors' or 'all'. Useful for avoiding overwhelming the
      output with excessively noisy test output. The test header is included in the
      log size. Negative values imply no limit. Output is all or nothing.
    --experimental_merged_skyframe_analysis_execution: If this flag is set, the analysis
      and execution phases of Skyframe are merged.
    --target_pattern_file: If set, build will read patterns from the file named here,
      rather than on the command line. It is an error to specify a file here as well
      as command-line patterns.
    --noexperimental_process_wrapper_graceful_sigterm: When true, make the process-wrapper
      propagate SIGTERMs (used by the dynamic scheduler to stop process trees) to
      the subprocesses themselves, giving them the grace period in --local_termination_grace_seconds
      before forcibly sending a SIGKILL.
    --experimental_skyfocus_handling_strategy: Strategies for Skyfocus to handle changes
      outside of the working set.
    --incompatible_remote_use_new_exit_code_for_lost_inputs: If set to true, Bazel
      will use new exit code 39 instead of 34 if remote cacheerrors, including cache
      evictions, cause the build to fail.
    --experimental_skyframe_target_pattern_evaluator: Use the Skyframe-based target
      pattern evaluator; implies --experimental_interleave_loading_and_analysis.
    --noincompatible_skip_genfiles_symlink: If set to true, the genfiles symlink will
      not be created. For more information, see https://github.com/bazelbuild/bazel/issues/8651
    --experimental_enable_skyfocus: If true, enable the use of --experimental_working_set
      to reduce Bazel's memory footprint for incremental builds. This feature is known
      as Skyfocus.
    --build_manual_tests: Forces test targets tagged 'manual' to be built. 'manual'
      tests are excluded from processing. This option forces them to be built (but
      not executed).
    --experimental_aquery_dump_after_build_format: 'Writes the state of Skyframe (which
      includes previous invocations on this blaze instance as well) after a build.
      Output is streamed remotely unless local output is requested with --experimental_aquery_dump_after_build_output_file.  Does
      not honor aquery flags for --include_*, but uses the same defaults, except for
      --include_commandline=false. Possible output formats: proto|streamed_proto|textproto|jsonproto.
      Using this will disable Skymeld.'
    --build_tag_filters: Specifies a comma-separated list of tags. Each tag can be
      optionally preceded with '-' to specify excluded tags. Only those targets will
      be built that contain at least one included tag and do not contain any excluded
      tags. This option does not affect the set of tests executed with the 'test'
      command; those are be governed by the test filtering options, for example '--test_tag_filters'
    --noexperimental_use_semaphore_for_jobs: If set to true, additionally use semaphore
      to limit number of concurrent jobs.
    --experimental_aquery_dump_after_build_output_file: Specify the output file for
      the aquery dump after a build. Use in conjunction with --experimental_aquery_dump_after_build_format.
      The path provided is relative to Bazel's output base, unless it's an absolute
      path. Using this will disable Skymeld.
    --local_test_jobs: The max number of local test jobs to run concurrently. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". 0 means local resources
      will limit the number of local test jobs to run concurrently instead. Setting
      this greater than the value for --jobs is ineffectual.
    --norewind_lost_inputs: Whether to use action rewinding to recover from lost inputs.
    --test_tmpdir: Specifies the base temporary directory for 'bazel test' to use.
    --experimental_build_event_fully_resolve_fileset_symlinks: If true, fully resolve
      relative Fileset symlinks in the BEP when presenting output files. Requires
      --experimental_build_event_expand_filesets.
    --noincompatible_remote_use_new_exit_code_for_lost_inputs: If set to true, Bazel
      will use new exit code 39 instead of 34 if remote cacheerrors, including cache
      evictions, cause the build to fail.
    --execution_log_compact_file: 'Log the executed spawns into this file as length-delimited
      ExecLogEntry protos, according to src/main/protobuf/spawn.proto. The entire
      file is zstd compressed. Related flags: --execution_log_binary_file (binary
      protobuf format; mutually exclusive), --execution_log_json_file (text JSON format;
      mutually exclusive), --subcommands (for displaying subcommands in terminal output).'
    --hide_aspect_results: Comma-separated list of aspect names to not display in
      results (see --show_result). Useful for keeping aspects added by wrappers which
      are typically not interesting to end users out of console output.
  description: Displays runtime info about the %{product} server.
- name: license
  flags: {}
  description: Prints the license of this software.
- name: mobile-install
  flags:
    --noexecution_log_sort: Whether to sort the execution log, making it easier to
      compare logs across invocations. Set to false to avoid potentially significant
      CPU and memory usage at the end of the invocation, at the cost of producing
      the log in nondeterministic execution order. Only applies to the binary and
      JSON formats; the compact format is never sorted.
    --incompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --mobile_install_aspect: The aspect to use for mobile-install.
    --noexperimental_stats_summary: Enable a modernized summary of the build stats.
    --check_tests_up_to_date: Don't run tests, just check if they are up-to-date.  If
      all tests results are up-to-date, the testing completes successfully.  If any
      test needs to be built or executed, an error is reported and the testing fails.  This
      option implies --check_up_to_date behavior.
    --noexperimental_merged_skyframe_analysis_execution: If this flag is set, the
      analysis and execution phases of Skyframe are merged.
    --test_keep_going: When disabled, any non-passing test will cause the entire build
      to stop. By default all tests are run, even if some do not pass.
    --experimental_skyfocus_dump_keys: For debugging Skyfocus. Dump the focused SkyKeys
      (roots, leafs, focused deps, focused rdeps).
    --check_up_to_date: Don't perform the build, just check if it is up-to-date.  If
      all targets are up-to-date, the build completes successfully.  If any step needs
      to be executed an error is reported and the build fails.
    --nomaterialize_param_files: Writes intermediate parameter files to output tree
      even when using remote action execution. Useful when debugging actions. This
      is implied by --subcommands and --verbose_failures.
    --version_window_for_dirty_node_gc: Nodes that have been dirty for more than this
      many versions will be deleted from the graph upon the next update. Values must
      be non-negative long integers, or -1 indicating the maximum possible window.
    --test_summary: Specifies the desired format of the test summary. Valid values
      are 'short' to print information only about tests executed, 'terse', to print
      information only about unsuccessful tests that were run, 'detailed' to print
      detailed information about failed test cases, 'testcase' to print summary in
      test case resolution, do not print detailed information about failed test cases
      and 'none' to omit the summary.
    --local_resources: Set the number of resources available to Bazel. Takes in an
      assignment to a float or HOST_RAM/HOST_CPUS, optionally followed by [-|*]<float>
      (eg. memory=HOST_RAM*.5 to use half the available RAM). Can be used multiple
      times to specify multiple types of resources. Bazel will limit concurrently
      running actions based on the available resources and the resources required.
      Tests can declare the amount of resources they need by using a tag of the "resources:<resource
      name>:<amount>" format. Overrides resources specified by --local_{cpu|ram|extra}_resources.
    --rewind_lost_inputs: Whether to use action rewinding to recover from lost inputs.
    --start: How the app should be started after installing it. Set to WARM to preserve
      and restore application state on incremental installs.
    --noexperimental_local_lockfree_output: When true, the local spawn runner doesn't
      lock the output tree during dynamic execution. Instead, spawns are allowed to
      execute until they are explicitly interrupted by a faster remote action.
    --build: Execute the build; this is the usual behaviour. Specifying --nobuild
      causes the build to stop before executing the build actions, returning zero
      iff the package loading and analysis phases completed successfully; this mode
      is useful for testing those phases.
    --noincompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --start_app: Whether to start the app after installing it.
    --enforce_project_configs: If true, interactive builds may only pass the --scl_config
      build flag; they may not use any other build flags. --scl_config must be set
      to an officially suported project configuration. Supported configurations are
      defined in the target's PROJECT.scl, which can be found by walking up the target's
      packagge path. See b/324126745.
    --aspects: Comma-separated list of aspects to be applied to top-level targets.
      In the list, if aspect some_aspect specifies required aspect providers via required_aspect_providers,
      some_aspect will run after every aspect that was mentioned before it in the
      aspects list whose advertised providers satisfy some_aspect required aspect
      providers. Moreover, some_aspect will run after all its required aspects specified
      by requires attribute. some_aspect will then have access to the values of those
      aspects' providers. <bzl-file-label>%<aspect_name>, for example '//tools:my_def.bzl%my_aspect',
      where 'my_aspect' is a top-level value from a file tools/my_def.bzl
    --nobuild_tests_only: If specified, only *_test and test_suite rules will be built
      and other targets specified on the command line will be ignored. By default
      everything that was requested will be built.
    --fetch: Allows the command to fetch external dependencies. If set to false, the
      command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --noexperimental_materialize_param_files_directly: If materializing param files,
      do so with direct writes to disk.
    --show_result: |-
      Show the results of the build.  For each target, state whether or not it was brought up-to-date, and if so, a list of output files that were built.  The printed files are convenient strings for copy+pasting to the shell, to execute them.
      This option requires an integer argument, which is the threshold number of targets above which result information is not printed. Thus zero causes suppression of the message and MAX_INT causes printing of the result to occur always. The default is one.
      If nothing was built for a target its results may be omitted to keep the output under the threshold.
    --noenforce_project_configs: If true, interactive builds may only pass the --scl_config
      build flag; they may not use any other build flags. --scl_config must be set
      to an officially suported project configuration. Supported configurations are
      defined in the target's PROJECT.scl, which can be found by walking up the target's
      packagge path. See b/324126745.
    --execution_log_sort: Whether to sort the execution log, making it easier to compare
      logs across invocations. Set to false to avoid potentially significant CPU and
      memory usage at the end of the invocation, at the cost of producing the log
      in nondeterministic execution order. Only applies to the binary and JSON formats;
      the compact format is never sorted.
    --output_tree_tracking: If set, tell the output service (if any) to track when
      files in the output tree have been modified externally (not by the build system).
      This should improve incremental build speed when an appropriate output service
      is enabled.
    --noexperimental_enable_skyfocus: If true, enable the use of --experimental_working_set
      to reduce Bazel's memory footprint for incremental builds. This feature is known
      as Skyfocus.
    --adb_arg: Extra arguments to pass to adb. Usually used to designate a device
      to install to.
    --test_strategy: Specifies which strategy to use when running tests.
    --spawn_strategy: Specify how spawn actions are executed by default. Accepts a
      comma-separated list of strategies from highest to lowest priority. For each
      action Bazel picks the strategy with the highest priority that can execute the
      action. The default value is "remote,worker,sandboxed,local". See https://blog.bazel.build/2019/06/19/list-strategy.html
      for details.
    --nodiscard_analysis_cache: Discard the analysis cache immediately after the analysis
      phase completes. Reduces memory usage by ~10%, but makes further incremental
      builds slower.
    --experimental_skyfocus_dump_post_gc_stats: For debugging Skyfocus. If enabled,
      trigger manual GC before/after focusing to report heap sizes reductions. This
      will increase the Skyfocus latency.
    --noexperimental_build_event_expand_filesets: If true, expand Filesets in the
      BEP when presenting output files.
    --nokeep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --noexperimental_use_validation_aspect: Whether to run validation actions using
      aspect (for parallelism with tests).
    --run_in_client: If true, the mobile-install deployer command will be sent to
      the bazel client for execution. Useful for configurations where the bazel client
      is on a different machine than the bazel server.
    --nocheck_tests_up_to_date: Don't run tests, just check if they are up-to-date.  If
      all tests results are up-to-date, the testing completes successfully.  If any
      test needs to be built or executed, an error is reported and the testing fails.  This
      option implies --check_up_to_date behavior.
    --nobuild: Execute the build; this is the usual behaviour. Specifying --nobuild
      causes the build to stop before executing the build actions, returning zero
      iff the package loading and analysis phases completed successfully; this mode
      is useful for testing those phases.
    --experimental_extra_action_top_level_only: Deprecated in favor of aspects. Only
      schedules extra_actions for top level targets.
    --build_event_upload_max_retries: The maximum number of times Bazel should retry
      uploading a build event.
    --test_timeout_filters: Specifies a comma-separated list of test timeouts. Each
      timeout can be optionally preceded with '-' to specify excluded timeouts. Only
      those test targets will be found that contain at least one included timeout
      and do not contain any excluded timeouts. This option affects --build_tests_only
      behavior and the test command.
    --experimental_remote_analysis_cache_deadline: Deadline to use for remote analysis
      cache operations.
    -s, --subcommands: 'Display the subcommands executed during a build. Related flags:
      --execution_log_json_file, --execution_log_binary_file (for logging subcommands
      to a file in a tool-friendly format).'
    --deleted_packages: |-
      A comma-separated list of names of packages which the build system will consider non-existent, even if they are visible somewhere on the package path.
      Use this option when deleting a subpackage 'x/y' of an existing package 'x'.  For example, after deleting x/y/BUILD in your client, the build system may complain if it encounters a label '//x:y/z' if that is still provided by another package_path entry.  Specifying --deleted_packages x/y avoids this problem.
    --default_visibility: Default visibility for packages that don't set it explicitly
      ('public' or 'private').
    --nouse_action_cache: Whether to use the action cache
    --experimental_stream_log_file_uploads: Stream log file uploads directly to the
      remote storage rather than writing them to disk.
    --noexperimental_async_execution: If set to true, Bazel is allowed to run action
      in a virtual thread. The number of actions in flight is still capped with --jobs.
    --mode: Deprecated no-effect flag. Only skylark mode is still supported.
    --nooutput_tree_tracking: If set, tell the output service (if any) to track when
      files in the output tree have been modified externally (not by the build system).
      This should improve incremental build speed when an appropriate output service
      is enabled.
    --notest_keep_going: When disabled, any non-passing test will cause the entire
      build to stop. By default all tests are run, even if some do not pass.
    --noallow_analysis_cache_discard: If discarding the analysis cache due to a change
      in the build system, setting this option to false will cause bazel to exit,
      rather than continuing with the build. This option has no effect when 'discard_analysis_cache'
      is also set.
    --strategy_regexp: 'Override which spawn strategy should be used to execute spawn
      actions that have descriptions matching a certain regex_filter. See --per_file_copt
      for details onregex_filter matching. The last regex_filter that matches the
      description is used. This option overrides other flags for specifying strategy.
      Example: --strategy_regexp=//foo.*\\.cc,-//foo/bar=local means to run actions
      using local strategy if their descriptions match //foo.*.cc but not //foo/bar.
      Example: --strategy_regexp=''Compiling.*/bar=local  --strategy_regexp=Compiling=sandboxed
      will run ''Compiling //foo/bar/baz'' with the ''local'' strategy, but reversing
      the order would run it with ''sandboxed''. '
    --experimental_remote_analysis_cache_concurrency: Target concurrency for remote
      analysis caching RPCs.
    --nofetch: Allows the command to fetch external dependencies. If set to false,
      the command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --experimental_stats_summary: Enable a modernized summary of the build stats.
    --discard_analysis_cache: Discard the analysis cache immediately after the analysis
      phase completes. Reduces memory usage by ~10%, but makes further incremental
      builds slower.
    --package_path: A colon-separated list of where to look for packages. Elements
      beginning with '%workspace%' are relative to the enclosing workspace. If omitted
      or empty, the default is the output of 'bazel info default-package-path'.
    --compile_one_dependency: Compile a single dependency of the argument files. This
      is useful for syntax checking source files in IDEs, for example, by rebuilding
      a single target that depends on the source file to detect errors as early as
      possible in the edit/build/test cycle. This argument affects the way all non-flag
      arguments are interpreted; instead of being targets to build they are source
      filenames.  For each source filename an arbitrary target that depends on it
      will be built.
    --experimental_use_semaphore_for_jobs: If set to true, additionally use semaphore
      to limit number of concurrent jobs.
    --experimental_build_event_output_group_mode: 'Specify how an output group''s
      files will be represented in TargetComplete/AspectComplete BEP events. Values
      are an assignment of an output group name to one of ''NAMED_SET_OF_FILES_ONLY'',
      ''INLINE_ONLY'', or ''BOTH''. The default value is ''NAMED_SET_OF_FILES_ONLY''.
      If an output group is repeated, the final value to appear is used. The default
      value sets the mode for coverage artifacts to BOTH: --experimental_build_event_output_group_mode=baseline.lcov=both'
    --noexperimental_split_xml_generation: If this flag is set, and a test action
      does not generate a test.xml file, then Bazel uses a separate action to generate
      a dummy test.xml file containing the test log. Otherwise, Bazel generates a
      test.xml as part of the test action.
    --verbose_failures: If a command fails, print out the full command line.
    --legacy_globbing_threads: Number of threads to use for glob evaluation. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" means to use
      a reasonable value derived from the machine's hardware profile (e.g. the number
      of processors).
    --norun_validations: Whether to run validation actions as part of the build. See
      https://bazel.build/extending/rules#validation_actions
    --noverbose_failures: If a command fails, print out the full command line.
    --experimental_build_event_expand_filesets: If true, expand Filesets in the BEP
      when presenting output files.
    --noincremental: Whether to do an incremental install. If true, try to avoid unnecessary
      additional work by reading the state of the device the code is to be installed
      on and using that information to avoid unnecessary work. If false (the default),
      always do a full install.
    --incompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --noskip_incompatible_explicit_targets: 'Skip incompatible targets that are explicitly
      listed on the command line. By default, building such targets results in an
      error but they are silently skipped when this option is enabled. See: https://bazel.build/extending/platforms#skipping-incompatible-targets'
    --noexperimental_bep_target_summary: Whether to publish TargetSummary events.
    --nocompile_one_dependency: Compile a single dependency of the argument files.
      This is useful for syntax checking source files in IDEs, for example, by rebuilding
      a single target that depends on the source file to detect errors as early as
      possible in the edit/build/test cycle. This argument affects the way all non-flag
      arguments are interpreted; instead of being targets to build they are source
      filenames.  For each source filename an arbitrary target that depends on it
      will be built.
    --split_apks: Whether to use split apks to install and update the application
      on the device. Works only with devices with Marshmallow or later
    --noexperimental_enable_critical_path_profiling: If set (the default), critical
      path profiling is enabled for the execution phase. This has a slight overhead
      in RAM and CPU, and may prevent Bazel from making certain aggressive RAM optimizations
      in some cases.
    --experimental_oom_sensitive_skyfunctions_semaphore_size: 'Sets the size of the
      semaphore used to prevent SkyFunctions with large peak memory requirement from
      OOM-ing blaze. A value of 0 indicates that no semaphore should be used. Example
      value: "HOST_CPUS*0.5".'
    --experimental_convenience_symlinks: |-
      This flag controls how the convenience symlinks (the symlinks that appear in the workspace after the build) will be managed. Possible values:
        normal (default): Each kind of convenience symlink will be created or deleted, as determined by the build.
        clean: All symlinks will be unconditionally deleted.
        ignore: Symlinks will not be created or cleaned up.
        log_only: Generate log messages as if 'normal' were passed, but don't actually perform any filesystem operations (useful for tools).
      Note that only symlinks whose names are generated by the current value of --symlink_prefix can be affected; if the prefix changes, any pre-existing symlinks will be left alone.
    --experimental_build_event_upload_retry_minimum_delay: 'Initial, minimum delay
      for exponential backoff retries when BEP upload fails. (exponent: 1.6)'
    --noanalyze: Execute the loading/analysis phase; this is the usual behaviour.
      Specifying --noanalyzecauses the build to stop before starting the loading/analysis
      phase, just doing target pattern parsing and returning zero iff that completed
      successfully; this mode is useful for testing.
    --experimental_skyframe_memory_dump: 'Dump the memory use of individual nodes
      in the Skyframe graph after the build. This option takes a number of flags separated
      by commas: ''json'' (no-op, that''s the only format), ''notransient'' (don''t
      traverse transient fields), ''noconfig'' (ignore objects related to configurations),
      ''noprecomputed'' (ignore precomputed values) and ''noworkspacestatus'' (ignore
      objects related to the workspace status machinery)'
    --experimental_run_bep_event_include_residue: Whether to include the command-line
      residue in run build events which could contain the residue. By default, the
      residue is not included in run command build events that could contain the residue.
    --adb: adb binary to use for the 'mobile-install' command. If unspecified, the
      one in the Android SDK specified by the --android_sdk_channel command line option
      (or  the default SDK if --android_sdk_channel is not specified) is used.
    --experimental_max_directories_to_eagerly_visit_in_globbing: If non-negative,
      the first time a glob is evaluated in a package, the subdirectories of the package
      will be traversed in order to warm filesystem caches and compensate for lack
      of parallelism in globbing. At most this many directories will be visited.
    --verbose_explanations: Increases the verbosity of the explanations issued if
      --explain is enabled. Has no effect if --explain is not enabled.
    --materialize_param_files: Writes intermediate parameter files to output tree
      even when using remote action execution. Useful when debugging actions. This
      is implied by --subcommands and --verbose_failures.
    -j, --jobs: The number of concurrent jobs to run. Takes an integer, or a keyword
      ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed by an operation ([-|*]<float>)
      eg. "auto", "HOST_CPUS*.5". Values must be between 1 and 5000. Values above
      2500 may cause memory issues. "auto" calculates a reasonable default based on
      host resources.
    --experimental_extra_action_filter: Deprecated in favor of aspects. Filters set
      of targets to schedule extra_actions for.
    --experimental_split_xml_generation: If this flag is set, and a test action does
      not generate a test.xml file, then Bazel uses a separate action to generate
      a dummy test.xml file containing the test log. Otherwise, Bazel generates a
      test.xml as part of the test action.
    --experimental_process_wrapper_graceful_sigterm: When true, make the process-wrapper
      propagate SIGTERMs (used by the dynamic scheduler to stop process trees) to
      the subprocesses themselves, giving them the grace period in --local_termination_grace_seconds
      before forcibly sending a SIGKILL.
    --test_tag_filters: Specifies a comma-separated list of test tags. Each tag can
      be optionally preceded with '-' to specify excluded tags. Only those test targets
      will be found that contain at least one included tag and do not contain any
      excluded tags. This option affects --build_tests_only behavior and the test
      command.
    --symlink_prefix: 'The prefix that is prepended to any of the convenience symlinks
      that are created after a build. If omitted, the default value is the name of
      the build tool followed by a hyphen. If ''/'' is passed, then no symlinks are
      created and no warning is emitted. Warning: the special functionality for ''/''
      will be deprecated soon; use --experimental_convenience_symlinks=ignore instead.'
    --output_groups: A list of comma-separated output group names, each of which optionally
      prefixed by a + or a -. A group prefixed by + is added to the default set of
      output groups, while a group prefixed by - is removed from the default set.
      If at least one group is not prefixed, the default set of output groups is omitted.
      For example, --output_groups=+foo,+bar builds the union of the default set,
      foo, and bar, while --output_groups=foo,bar overrides the default set such that
      only foo and bar are built.
    --max_config_changes_to_show: When discarding the analysis cache due to a change
      in the build options, displays up to the given number of changed option names.
      If the number given is -1, all changed options will be displayed.
    --experimental_enable_critical_path_profiling: If set (the default), critical
      path profiling is enabled for the execution phase. This has a slight overhead
      in RAM and CPU, and may prevent Bazel from making certain aggressive RAM optimizations
      in some cases.
    --experimental_cpu_load_scheduling_window_size: The size of window during experimental
      scheduling of action based on CPU load. Make sense to define only when flag
      --experimental_cpu_load_scheduling is enabled.
    --incompatible_skip_genfiles_symlink: If set to true, the genfiles symlink will
      not be created. For more information, see https://github.com/bazelbuild/bazel/issues/8651
    --experimental_local_lockfree_output: When true, the local spawn runner doesn't
      lock the output tree during dynamic execution. Instead, spawns are allowed to
      execute until they are explicitly interrupted by a faster remote action.
    --noincompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --show_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --nobuild_manual_tests: Forces test targets tagged 'manual' to be built. 'manual'
      tests are excluded from processing. This option forces them to be built (but
      not executed).
    --test_lang_filters: Specifies a comma-separated list of test languages. Each
      language can be optionally preceded with '-' to specify excluded languages.
      Only those test targets will be found that are written in the specified languages.
      The name used for each language should be the same as the language prefix in
      the *_test rule, e.g. one of 'cc', 'java', 'py', etc. This option affects --build_tests_only
      behavior and the test command.
    --experimental_cpu_load_scheduling: Enables the experimental local execution scheduling
      based on CPU load, not estimation of actions one by one.  Experimental scheduling
      have showed the large benefit on a large local builds on a powerful machines
      with the large number of cores. Reccommended to use with --local_resources=cpu=HOST_CPUS
    --test_output: Specifies desired output mode. Valid values are 'summary' to output
      only test status summary, 'errors' to also print test logs for failed tests,
      'all' to print logs for all tests and 'streamed' to output logs for all tests
      in real time (this will force tests to be executed locally one at a time regardless
      of --test_strategy value).
    --run_validations: Whether to run validation actions as part of the build. See
      https://bazel.build/extending/rules#validation_actions
    --experimental_async_execution: If set to true, Bazel is allowed to run action
      in a virtual thread. The number of actions in flight is still capped with --jobs.
    --execution_log_binary_file: 'Log the executed spawns into this file as length-delimited
      SpawnExec protos, according to src/main/protobuf/spawn.proto. Prefer --execution_log_compact_file,
      which is significantly smaller and cheaper to produce. Related flags: --execution_log_compact_file
      (compact format; mutually exclusive), --execution_log_json_file (text JSON format;
      mutually exclusive), --execution_log_sort (whether to sort the execution log),
      --subcommands (for displaying subcommands in terminal output).'
    --nocheck_up_to_date: Don't perform the build, just check if it is up-to-date.  If
      all targets are up-to-date, the build completes successfully.  If any step needs
      to be executed an error is reported and the build fails.
    --device: The adb device serial number. If not specified, the first device will
      be used.
    --legacy_important_outputs: Use this to suppress generation of the legacy important_outputs
      field in the TargetComplete event. important_outputs are required for Bazel
      to ResultStore/BTX integration.
    --cache_computed_file_digests: If greater than 0, configures Bazel to cache file
      digests in memory based on their metadata instead of recomputing the digests
      from disk every time they are needed. Setting this to 0 ensures correctness
      because not all file changes can be noted from file metadata. When not 0, the
      number indicates the size of the cache as the number of file digests to be cached.
    --experimental_working_set: The working set for Skyfocus. Specify as comma-separated
      workspace root-relative paths. This is a stateful flag. Defining a working set
      persists it for subsequent invocations, until it is redefined with a new set.
    --strategy: Specify how to distribute compilation of other spawn actions. Accepts
      a comma-separated list of strategies from highest to lowest priority. For each
      action Bazel picks the strategy with the highest priority that can execute the
      action. The default value is "remote,worker,sandboxed,local". This flag overrides
      the values set by --spawn_strategy (and --genrule_strategy if used with mnemonic
      Genrule). See https://blog.bazel.build/2019/06/19/list-strategy.html for details.
    --experimental_bep_target_summary: Whether to publish TargetSummary events.
    --build_tests_only: If specified, only *_test and test_suite rules will be built
      and other targets specified on the command line will be ignored. By default
      everything that was requested will be built.
    --mobile_install_supported_rules: The supported rules for mobile-install.
    --allow_analysis_cache_discard: If discarding the analysis cache due to a change
      in the build system, setting this option to false will cause bazel to exit,
      rather than continuing with the build. This option has no effect when 'discard_analysis_cache'
      is also set.
    --local_cpu_resources: Explicitly set the total number of local CPU cores available
      to Bazel to spend on build actions executed locally. Takes an integer, or "HOST_CPUS",
      optionally followed by [-|*]<float> (eg. HOST_CPUS*.5 to use half the available
      CPU cores). By default, ("HOST_CPUS"), Bazel will query system configuration
      to estimate the number of CPU cores available.
    --noshow_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --noexperimental_cpu_load_scheduling: Enables the experimental local execution
      scheduling based on CPU load, not estimation of actions one by one.  Experimental
      scheduling have showed the large benefit on a large local builds on a powerful
      machines with the large number of cores. Reccommended to use with --local_resources=cpu=HOST_CPUS
    --noexperimental_stream_log_file_uploads: Stream log file uploads directly to
      the remote storage rather than writing them to disk.
    --noexperimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --allowed_local_actions_regex: A regex whitelist for action types which may be
      run locally. If unset, all actions are allowed to execute locally
    --experimental_fsvc_threads: The number of threads that are used by the FileSystemValueChecker.
    --serialized_frontier_profile: Dump a profile of serialized frontier bytes. Specifies
      the output path.
    --noexperimental_build_event_fully_resolve_fileset_symlinks: If true, fully resolve
      relative Fileset symlinks in the BEP when presenting output files. Requires
      --experimental_build_event_expand_filesets.
    --genrule_strategy: Specify how to execute genrules. This flag will be phased
      out. Instead, use --spawn_strategy=<value> to control all actions or --strategy=Genrule=<value>
      to control genrules only.
    --experimental_skymeld_analysis_overlap_percentage: The value represents the %
      of the analysis phase which will be overlapped with the execution phase. A value
      of x means Skyframe will queue up execution tasks and wait until there's x%
      of the top level target left to be analyzed before allowing them to launch.
      When the value is 0%, we'd wait for all analysis to finish before executing
      (no overlap). When it's 100%, the phases are free to overlap as much as they
      can.
    --aspects_parameters: Specifies the values of the command-line aspects parameters.
      Each parameter value is specified via <param_name>=<param_value>, for example
      'my_param=my_val' where 'my_param' is a parameter of some aspect in --aspects
      list or required by an aspect in the list. This option can be used multiple
      times. However, it is not allowed to assign values to the same parameter more
      than once.
    --progress_report_interval: The number of seconds to wait between reports on still
      running jobs. The default value 0 means the first report will be printed after
      10 seconds, then 30 seconds and after that progress is reported once every minute.
      When --curses is enabled, progress is reported every second.
    --test_size_filters: Specifies a comma-separated list of test sizes. Each size
      can be optionally preceded with '-' to specify excluded sizes. Only those test
      targets will be found that contain at least one included size and do not contain
      any excluded sizes. This option affects --build_tests_only behavior and the
      test command.
    --noexperimental_convenience_symlinks_bep_event: This flag controls whether or
      not we will post the build eventConvenienceSymlinksIdentified to the BuildEventProtocol.
      If the value is true, the BuildEventProtocol will have an entry for convenienceSymlinksIdentified,
      listing all of the convenience symlinks created in your workspace. If false,
      then the convenienceSymlinksIdentified entry in the BuildEventProtocol will
      be empty.
    --experimental_remote_analysis_cache: The URL for the remote analysis caching
      backend.
    --noexperimental_skyfocus_dump_post_gc_stats: For debugging Skyfocus. If enabled,
      trigger manual GC before/after focusing to report heap sizes reductions. This
      will increase the Skyfocus latency.
    --flaky_test_attempts: 'Each test will be retried up to the specified number of
      times in case of any test failure. Tests that required more than one attempt
      to pass are marked as ''FLAKY'' in the test summary. Normally the value specified
      is just an integer or the string ''default''. If an integer, then all tests
      will be run up to N times. If ''default'', then only a single test attempt will
      be made for regular tests and three for tests marked explicitly as flaky by
      their rule (flaky=1 attribute). Alternate syntax: regex_filter@flaky_test_attempts.
      Where flaky_test_attempts is as above and regex_filter stands for a list of
      include and exclude regular expression patterns (Also see --runs_per_test).
      Example: --flaky_test_attempts=//foo/.*,-//foo/bar/.*@3 deflakes all tests in
      //foo/ except those under foo/bar three times. This option can be passed multiple
      times. The most recently passed argument that matches takes precedence. If nothing
      matches, behavior is as if ''default'' above.'
    --incremental_install_verbosity: The verbosity for incremental install. Set to
      1 for debug logging.
    --experimental_local_retries_on_crash: Number of times to retry a local action
      when we detect that it crashed. This exists to workaround a bug in OSXFUSE which
      is tickled by the use of the dynamic scheduler and --experimental_local_lockfree_output
      due to constant process churn. The bug can be triggered by a cancelled process
      that ran *before* the process we are trying to run, introducing corruption in
      its file reads.
    --local_ram_resources: Explicitly set the total amount of local host RAM (in MB)
      available to Bazel to spend on build actions executed locally. Takes an integer,
      or "HOST_RAM", optionally followed by [-|*]<float> (eg. HOST_RAM*.5 to use half
      the available RAM). By default, ("HOST_RAM*.67"), Bazel will query system configuration
      to estimate the amount of RAM available and will use 67% of it.
    --experimental_use_validation_aspect: Whether to run validation actions using
      aspect (for parallelism with tests).
    -k, --keep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --noexperimental_run_bep_event_include_residue: Whether to include the command-line
      residue in run build events which could contain the residue. By default, the
      residue is not included in run command build events that could contain the residue.
    --analyze: Execute the loading/analysis phase; this is the usual behaviour. Specifying
      --noanalyzecauses the build to stop before starting the loading/analysis phase,
      just doing target pattern parsing and returning zero iff that completed successfully;
      this mode is useful for testing.
    --execution_log_json_file: 'Log the executed spawns into this file as newline-delimited
      JSON representations of SpawnExec protos, according to src/main/protobuf/spawn.proto.
      Prefer --execution_log_compact_file, which is significantly smaller and cheaper
      to produce. Related flags: --execution_log_compact_file (compact format; mutually
      exclusive), --execution_log_binary_file (binary protobuf format; mutually exclusive),
      --execution_log_sort (whether to sort the execution log), --subcommands (for
      displaying subcommands in terminal output).'
    --explain: Causes the build system to explain each executed step of the build.
      The explanation is written to the specified log file.
    --nosplit_apks: Whether to use split apks to install and update the application
      on the device. Works only with devices with Marshmallow or later
    --debug_app: Whether to wait for the debugger before starting the app.
    --skip_incompatible_explicit_targets: 'Skip incompatible targets that are explicitly
      listed on the command line. By default, building such targets results in an
      error but they are silently skipped when this option is enabled. See: https://bazel.build/extending/platforms#skipping-incompatible-targets'
    --incremental: Whether to do an incremental install. If true, try to avoid unnecessary
      additional work by reading the state of the device the code is to be installed
      on and using that information to avoid unnecessary work. If false (the default),
      always do a full install.
    --experimental_convenience_symlinks_bep_event: This flag controls whether or not
      we will post the build eventConvenienceSymlinksIdentified to the BuildEventProtocol.
      If the value is true, the BuildEventProtocol will have an entry for convenienceSymlinksIdentified,
      listing all of the convenience symlinks created in your workspace. If false,
      then the convenienceSymlinksIdentified entry in the BuildEventProtocol will
      be empty.
    --local_termination_grace_seconds: Time to wait between terminating a local process
      due to timeout and forcefully shutting it down.
    --noexpand_test_suites: 'Expand test_suite targets into their constituent tests
      before analysis. When this flag is turned on (the default), negative target
      patterns will apply to the tests belonging to the test suite, otherwise they
      will not. Turning off this flag is useful when top-level aspects are applied
      at command line: then they can analyze test_suite targets.'
    --directory_creation_cache: Describes the cache used to store known regular directories
      as they're created. Parent directories of output files are created on-demand
      during action execution.
    --output_filter: Only shows warnings and action outputs for rules with a name
      matching the provided regular expression.
    --nolegacy_important_outputs: Use this to suppress generation of the legacy important_outputs
      field in the TargetComplete event. important_outputs are required for Bazel
      to ResultStore/BTX integration.
    --noexperimental_extra_action_top_level_only: Deprecated in favor of aspects.
      Only schedules extra_actions for top level targets.
    --experimental_materialize_param_files_directly: If materializing param files,
      do so with direct writes to disk.
    --noverbose_explanations: Increases the verbosity of the explanations issued if
      --explain is enabled. Has no effect if --explain is not enabled.
    --experimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --use_action_cache: Whether to use the action cache
    --mobile_install_run_deployer: Whether to run the mobile-install deployer after
      building all artifacts.
    --noexperimental_skyframe_target_pattern_evaluator: Use the Skyframe-based target
      pattern evaluator; implies --experimental_interleave_loading_and_analysis.
    --experimental_build_event_upload_strategy: Selects how to upload artifacts referenced
      in the build event protocol.
    --local_extra_resources: Set the number of extra resources available to Bazel.
      Takes in a string-float pair. Can be used multiple times to specify multiple
      types of extra resources. Bazel will limit concurrently running actions based
      on the available extra resources and the extra resources required. Tests can
      declare the amount of extra resources they need by using a tag of the "resources:<resoucename>:<amount>"
      format. Available CPU, RAM and resources cannot be set with this flag.
    --loading_phase_threads: Number of parallel threads to use for the loading/analysis
      phase.Takes an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally
      followed by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" sets
      a reasonable default based on host resources. Must be at least 1.
    --experimental_remote_cache_eviction_retries: The maximum number of attempts to
      retry if the build encountered a transient remote cache error that would otherwise
      fail the build. Applies for example when artifacts are evicted from the remote
      cache, or in certain cache failure conditions. A non-zero value will implicitly
      set --incompatible_remote_use_new_exit_code_for_lost_inputs to true. A new invocation
      id will be generated for each attempt. If you generate invocation id and provide
      it to Bazel with --invocation_id, you should not use this flag. Instead, set
      flag --incompatible_remote_use_new_exit_code_for_lost_inputs and check for the
      exit code 39.
    --experimental_remote_analysis_cache_mode: The transport direction for the remote
      analysis cache.
    --expand_test_suites: 'Expand test_suite targets into their constituent tests
      before analysis. When this flag is turned on (the default), negative target
      patterns will apply to the tests belonging to the test suite, otherwise they
      will not. Turning off this flag is useful when top-level aspects are applied
      at command line: then they can analyze test_suite targets.'
    --experimental_skyframe_cpu_heavy_skykeys_thread_pool_size: 'If set to a positive
      value (e.g. "HOST_CPUS*1.5"), Skyframe will run the loading/analysis phase with
      2 separate thread pools: 1 with <value> threads (ideally close to HOST_CPUS)
      reserved for CPU-heavy SkyKeys, and 1 "standard" thread pool (whose size is
      controlled by --loading_phase_threads) for the rest.'
    --max_test_output_bytes: Specifies maximum per-test-log size that can be emitted
      when --test_output is 'errors' or 'all'. Useful for avoiding overwhelming the
      output with excessively noisy test output. The test header is included in the
      log size. Negative values imply no limit. Output is all or nothing.
    --experimental_merged_skyframe_analysis_execution: If this flag is set, the analysis
      and execution phases of Skyframe are merged.
    --target_pattern_file: If set, build will read patterns from the file named here,
      rather than on the command line. It is an error to specify a file here as well
      as command-line patterns.
    --norun_in_client: If true, the mobile-install deployer command will be sent to
      the bazel client for execution. Useful for configurations where the bazel client
      is on a different machine than the bazel server.
    --noexperimental_process_wrapper_graceful_sigterm: When true, make the process-wrapper
      propagate SIGTERMs (used by the dynamic scheduler to stop process trees) to
      the subprocesses themselves, giving them the grace period in --local_termination_grace_seconds
      before forcibly sending a SIGKILL.
    --experimental_skyfocus_handling_strategy: Strategies for Skyfocus to handle changes
      outside of the working set.
    --incompatible_remote_use_new_exit_code_for_lost_inputs: If set to true, Bazel
      will use new exit code 39 instead of 34 if remote cacheerrors, including cache
      evictions, cause the build to fail.
    --experimental_skyframe_target_pattern_evaluator: Use the Skyframe-based target
      pattern evaluator; implies --experimental_interleave_loading_and_analysis.
    --noincompatible_skip_genfiles_symlink: If set to true, the genfiles symlink will
      not be created. For more information, see https://github.com/bazelbuild/bazel/issues/8651
    --experimental_enable_skyfocus: If true, enable the use of --experimental_working_set
      to reduce Bazel's memory footprint for incremental builds. This feature is known
      as Skyfocus.
    --build_manual_tests: Forces test targets tagged 'manual' to be built. 'manual'
      tests are excluded from processing. This option forces them to be built (but
      not executed).
    --experimental_aquery_dump_after_build_format: 'Writes the state of Skyframe (which
      includes previous invocations on this blaze instance as well) after a build.
      Output is streamed remotely unless local output is requested with --experimental_aquery_dump_after_build_output_file.  Does
      not honor aquery flags for --include_*, but uses the same defaults, except for
      --include_commandline=false. Possible output formats: proto|streamed_proto|textproto|jsonproto.
      Using this will disable Skymeld.'
    --build_tag_filters: Specifies a comma-separated list of tags. Each tag can be
      optionally preceded with '-' to specify excluded tags. Only those targets will
      be built that contain at least one included tag and do not contain any excluded
      tags. This option does not affect the set of tests executed with the 'test'
      command; those are be governed by the test filtering options, for example '--test_tag_filters'
    --noexperimental_use_semaphore_for_jobs: If set to true, additionally use semaphore
      to limit number of concurrent jobs.
    --experimental_aquery_dump_after_build_output_file: Specify the output file for
      the aquery dump after a build. Use in conjunction with --experimental_aquery_dump_after_build_format.
      The path provided is relative to Bazel's output base, unless it's an absolute
      path. Using this will disable Skymeld.
    --local_test_jobs: The max number of local test jobs to run concurrently. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". 0 means local resources
      will limit the number of local test jobs to run concurrently instead. Setting
      this greater than the value for --jobs is ineffectual.
    --nomobile_install_run_deployer: Whether to run the mobile-install deployer after
      building all artifacts.
    --norewind_lost_inputs: Whether to use action rewinding to recover from lost inputs.
    --test_tmpdir: Specifies the base temporary directory for 'bazel test' to use.
    --experimental_build_event_fully_resolve_fileset_symlinks: If true, fully resolve
      relative Fileset symlinks in the BEP when presenting output files. Requires
      --experimental_build_event_expand_filesets.
    --noincompatible_remote_use_new_exit_code_for_lost_inputs: If set to true, Bazel
      will use new exit code 39 instead of 34 if remote cacheerrors, including cache
      evictions, cause the build to fail.
    --execution_log_compact_file: 'Log the executed spawns into this file as length-delimited
      ExecLogEntry protos, according to src/main/protobuf/spawn.proto. The entire
      file is zstd compressed. Related flags: --execution_log_binary_file (binary
      protobuf format; mutually exclusive), --execution_log_json_file (text JSON format;
      mutually exclusive), --subcommands (for displaying subcommands in terminal output).'
    --hide_aspect_results: Comma-separated list of aspect names to not display in
      results (see --show_result). Useful for keeping aspects added by wrappers which
      are typically not interesting to end users out of console output.
  description: Installs targets to mobile devices.
- name: mod
  flags:
    --incompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --legacy_globbing_threads: Number of threads to use for glob evaluation. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" means to use
      a reasonable value derived from the machine's hardware profile (e.g. the number
      of processors).
    --charset: Chooses the character set to use for the tree. Only affects text output.
      Valid values are "utf8" or "ascii". Default is "utf8"
    --show_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --noincompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --base_module: Specify a module relative to which the specified target repos will
      be interpreted.
    --include_unused: The queries will also take into account and display the unused
      modules, which are not present in the module resolution graph after selection
      (due to the Minimal-Version Selection or override rules). This can have different
      effects for each of the query types i.e. include new paths in the all_paths
      command, or extra dependants in the explain command.
    --incompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --noinclude_builtin: Include built-in modules in the dependency graph. Disabled
      by default because it is quite noisy.
    --depth: |
      Maximum display depth of the dependency tree. A depth of 1 displays the direct dependencies, for example. For tree, path and all_paths it defaults to Integer.MAX_VALUE, while for deps and explain it defaults to 1 (only displays direct deps of the root besides the target leaves and their parents).
    --noincompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --noverbose: The queries will also display the reason why modules were resolved
      to their current version (if changed). Defaults to true only for the explain
      query.
    --experimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --fetch: Allows the command to fetch external dependencies. If set to false, the
      command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --loading_phase_threads: Number of parallel threads to use for the loading/analysis
      phase.Takes an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally
      followed by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" sets
      a reasonable default based on host resources. Must be at least 1.
    --noshow_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --extension_usages: Specify modules whose extension usages will be displayed in
      the show_extension query.
    --noexperimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --include_builtin: Include built-in modules in the dependency graph. Disabled
      by default because it is quite noisy.
    --nocycles: Points out dependency cycles inside the displayed tree, which are
      normally ignored by default.
    --verbose: The queries will also display the reason why modules were resolved
      to their current version (if changed). Defaults to true only for the explain
      query.
    --noinclude_unused: The queries will also take into account and display the unused
      modules, which are not present in the module resolution graph after selection
      (due to the Minimal-Version Selection or override rules). This can have different
      effects for each of the query types i.e. include new paths in the all_paths
      command, or extra dependants in the explain command.
    --deleted_packages: |-
      A comma-separated list of names of packages which the build system will consider non-existent, even if they are visible somewhere on the package path.
      Use this option when deleting a subpackage 'x/y' of an existing package 'x'.  For example, after deleting x/y/BUILD in your client, the build system may complain if it encounters a label '//x:y/z' if that is still provided by another package_path entry.  Specifying --deleted_packages x/y avoids this problem.
    --default_visibility: Default visibility for packages that don't set it explicitly
      ('public' or 'private').
    --experimental_max_directories_to_eagerly_visit_in_globbing: If non-negative,
      the first time a glob is evaluated in a package, the subdirectories of the package
      will be traversed in order to warm filesystem caches and compensate for lack
      of parallelism in globbing. At most this many directories will be visited.
    --extension_filter: Only display the usages of these module extensions and the
      repos generated by them if their respective flags are set. If set, the result
      graph will only include paths that contain modules using the specified extensions.
      An empty list disables the filter, effectively specifying all possible extensions.
    --extension_info: |
      Specify how much detail about extension usages to include in the query result. "Usages" will only show the extensions names, "repos" will also include repos imported with use_repo, and "all" will also show the other repositories generated by extensions.
    --cycles: Points out dependency cycles inside the displayed tree, which are normally
      ignored by default.
    --nofetch: Allows the command to fetch external dependencies. If set to false,
      the command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --package_path: A colon-separated list of where to look for packages. Elements
      beginning with '%workspace%' are relative to the enclosing workspace. If omitted
      or empty, the default is the output of 'bazel info default-package-path'.
    --from: |
      The module(s) starting from which the dependency graph query will be displayed. Check each query’s description for the exact semantics. Defaults to <root>.
    --output: 'The format in which the query results should be printed. Allowed values
      for query are: text, json, graph'
  description: Queries the Bzlmod external dependency graph
- name: print_action
  flags:
    --noexecution_log_sort: Whether to sort the execution log, making it easier to
      compare logs across invocations. Set to false to avoid potentially significant
      CPU and memory usage at the end of the invocation, at the cost of producing
      the log in nondeterministic execution order. Only applies to the binary and
      JSON formats; the compact format is never sorted.
    --incompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --noexperimental_stats_summary: Enable a modernized summary of the build stats.
    --check_tests_up_to_date: Don't run tests, just check if they are up-to-date.  If
      all tests results are up-to-date, the testing completes successfully.  If any
      test needs to be built or executed, an error is reported and the testing fails.  This
      option implies --check_up_to_date behavior.
    --noexperimental_merged_skyframe_analysis_execution: If this flag is set, the
      analysis and execution phases of Skyframe are merged.
    --test_keep_going: When disabled, any non-passing test will cause the entire build
      to stop. By default all tests are run, even if some do not pass.
    --experimental_skyfocus_dump_keys: For debugging Skyfocus. Dump the focused SkyKeys
      (roots, leafs, focused deps, focused rdeps).
    --check_up_to_date: Don't perform the build, just check if it is up-to-date.  If
      all targets are up-to-date, the build completes successfully.  If any step needs
      to be executed an error is reported and the build fails.
    --nomaterialize_param_files: Writes intermediate parameter files to output tree
      even when using remote action execution. Useful when debugging actions. This
      is implied by --subcommands and --verbose_failures.
    --version_window_for_dirty_node_gc: Nodes that have been dirty for more than this
      many versions will be deleted from the graph upon the next update. Values must
      be non-negative long integers, or -1 indicating the maximum possible window.
    --test_summary: Specifies the desired format of the test summary. Valid values
      are 'short' to print information only about tests executed, 'terse', to print
      information only about unsuccessful tests that were run, 'detailed' to print
      detailed information about failed test cases, 'testcase' to print summary in
      test case resolution, do not print detailed information about failed test cases
      and 'none' to omit the summary.
    --local_resources: Set the number of resources available to Bazel. Takes in an
      assignment to a float or HOST_RAM/HOST_CPUS, optionally followed by [-|*]<float>
      (eg. memory=HOST_RAM*.5 to use half the available RAM). Can be used multiple
      times to specify multiple types of resources. Bazel will limit concurrently
      running actions based on the available resources and the resources required.
      Tests can declare the amount of resources they need by using a tag of the "resources:<resource
      name>:<amount>" format. Overrides resources specified by --local_{cpu|ram|extra}_resources.
    --rewind_lost_inputs: Whether to use action rewinding to recover from lost inputs.
    --noexperimental_local_lockfree_output: When true, the local spawn runner doesn't
      lock the output tree during dynamic execution. Instead, spawns are allowed to
      execute until they are explicitly interrupted by a faster remote action.
    --build: Execute the build; this is the usual behaviour. Specifying --nobuild
      causes the build to stop before executing the build actions, returning zero
      iff the package loading and analysis phases completed successfully; this mode
      is useful for testing those phases.
    --noincompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --enforce_project_configs: If true, interactive builds may only pass the --scl_config
      build flag; they may not use any other build flags. --scl_config must be set
      to an officially suported project configuration. Supported configurations are
      defined in the target's PROJECT.scl, which can be found by walking up the target's
      packagge path. See b/324126745.
    --aspects: Comma-separated list of aspects to be applied to top-level targets.
      In the list, if aspect some_aspect specifies required aspect providers via required_aspect_providers,
      some_aspect will run after every aspect that was mentioned before it in the
      aspects list whose advertised providers satisfy some_aspect required aspect
      providers. Moreover, some_aspect will run after all its required aspects specified
      by requires attribute. some_aspect will then have access to the values of those
      aspects' providers. <bzl-file-label>%<aspect_name>, for example '//tools:my_def.bzl%my_aspect',
      where 'my_aspect' is a top-level value from a file tools/my_def.bzl
    --nobuild_tests_only: If specified, only *_test and test_suite rules will be built
      and other targets specified on the command line will be ignored. By default
      everything that was requested will be built.
    --fetch: Allows the command to fetch external dependencies. If set to false, the
      command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --noexperimental_materialize_param_files_directly: If materializing param files,
      do so with direct writes to disk.
    --show_result: |-
      Show the results of the build.  For each target, state whether or not it was brought up-to-date, and if so, a list of output files that were built.  The printed files are convenient strings for copy+pasting to the shell, to execute them.
      This option requires an integer argument, which is the threshold number of targets above which result information is not printed. Thus zero causes suppression of the message and MAX_INT causes printing of the result to occur always. The default is one.
      If nothing was built for a target its results may be omitted to keep the output under the threshold.
    --noenforce_project_configs: If true, interactive builds may only pass the --scl_config
      build flag; they may not use any other build flags. --scl_config must be set
      to an officially suported project configuration. Supported configurations are
      defined in the target's PROJECT.scl, which can be found by walking up the target's
      packagge path. See b/324126745.
    --execution_log_sort: Whether to sort the execution log, making it easier to compare
      logs across invocations. Set to false to avoid potentially significant CPU and
      memory usage at the end of the invocation, at the cost of producing the log
      in nondeterministic execution order. Only applies to the binary and JSON formats;
      the compact format is never sorted.
    --output_tree_tracking: If set, tell the output service (if any) to track when
      files in the output tree have been modified externally (not by the build system).
      This should improve incremental build speed when an appropriate output service
      is enabled.
    --noexperimental_enable_skyfocus: If true, enable the use of --experimental_working_set
      to reduce Bazel's memory footprint for incremental builds. This feature is known
      as Skyfocus.
    --test_strategy: Specifies which strategy to use when running tests.
    --spawn_strategy: Specify how spawn actions are executed by default. Accepts a
      comma-separated list of strategies from highest to lowest priority. For each
      action Bazel picks the strategy with the highest priority that can execute the
      action. The default value is "remote,worker,sandboxed,local". See https://blog.bazel.build/2019/06/19/list-strategy.html
      for details.
    --nodiscard_analysis_cache: Discard the analysis cache immediately after the analysis
      phase completes. Reduces memory usage by ~10%, but makes further incremental
      builds slower.
    --experimental_skyfocus_dump_post_gc_stats: For debugging Skyfocus. If enabled,
      trigger manual GC before/after focusing to report heap sizes reductions. This
      will increase the Skyfocus latency.
    --noexperimental_build_event_expand_filesets: If true, expand Filesets in the
      BEP when presenting output files.
    --nokeep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --noexperimental_use_validation_aspect: Whether to run validation actions using
      aspect (for parallelism with tests).
    --nocheck_tests_up_to_date: Don't run tests, just check if they are up-to-date.  If
      all tests results are up-to-date, the testing completes successfully.  If any
      test needs to be built or executed, an error is reported and the testing fails.  This
      option implies --check_up_to_date behavior.
    --nobuild: Execute the build; this is the usual behaviour. Specifying --nobuild
      causes the build to stop before executing the build actions, returning zero
      iff the package loading and analysis phases completed successfully; this mode
      is useful for testing those phases.
    --experimental_extra_action_top_level_only: Deprecated in favor of aspects. Only
      schedules extra_actions for top level targets.
    --build_event_upload_max_retries: The maximum number of times Bazel should retry
      uploading a build event.
    --test_timeout_filters: Specifies a comma-separated list of test timeouts. Each
      timeout can be optionally preceded with '-' to specify excluded timeouts. Only
      those test targets will be found that contain at least one included timeout
      and do not contain any excluded timeouts. This option affects --build_tests_only
      behavior and the test command.
    --experimental_remote_analysis_cache_deadline: Deadline to use for remote analysis
      cache operations.
    -s, --subcommands: 'Display the subcommands executed during a build. Related flags:
      --execution_log_json_file, --execution_log_binary_file (for logging subcommands
      to a file in a tool-friendly format).'
    --deleted_packages: |-
      A comma-separated list of names of packages which the build system will consider non-existent, even if they are visible somewhere on the package path.
      Use this option when deleting a subpackage 'x/y' of an existing package 'x'.  For example, after deleting x/y/BUILD in your client, the build system may complain if it encounters a label '//x:y/z' if that is still provided by another package_path entry.  Specifying --deleted_packages x/y avoids this problem.
    --default_visibility: Default visibility for packages that don't set it explicitly
      ('public' or 'private').
    --nouse_action_cache: Whether to use the action cache
    --experimental_stream_log_file_uploads: Stream log file uploads directly to the
      remote storage rather than writing them to disk.
    --noexperimental_async_execution: If set to true, Bazel is allowed to run action
      in a virtual thread. The number of actions in flight is still capped with --jobs.
    --nooutput_tree_tracking: If set, tell the output service (if any) to track when
      files in the output tree have been modified externally (not by the build system).
      This should improve incremental build speed when an appropriate output service
      is enabled.
    --notest_keep_going: When disabled, any non-passing test will cause the entire
      build to stop. By default all tests are run, even if some do not pass.
    --noallow_analysis_cache_discard: If discarding the analysis cache due to a change
      in the build system, setting this option to false will cause bazel to exit,
      rather than continuing with the build. This option has no effect when 'discard_analysis_cache'
      is also set.
    --strategy_regexp: 'Override which spawn strategy should be used to execute spawn
      actions that have descriptions matching a certain regex_filter. See --per_file_copt
      for details onregex_filter matching. The last regex_filter that matches the
      description is used. This option overrides other flags for specifying strategy.
      Example: --strategy_regexp=//foo.*\\.cc,-//foo/bar=local means to run actions
      using local strategy if their descriptions match //foo.*.cc but not //foo/bar.
      Example: --strategy_regexp=''Compiling.*/bar=local  --strategy_regexp=Compiling=sandboxed
      will run ''Compiling //foo/bar/baz'' with the ''local'' strategy, but reversing
      the order would run it with ''sandboxed''. '
    --experimental_remote_analysis_cache_concurrency: Target concurrency for remote
      analysis caching RPCs.
    --nofetch: Allows the command to fetch external dependencies. If set to false,
      the command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --experimental_stats_summary: Enable a modernized summary of the build stats.
    --discard_analysis_cache: Discard the analysis cache immediately after the analysis
      phase completes. Reduces memory usage by ~10%, but makes further incremental
      builds slower.
    --package_path: A colon-separated list of where to look for packages. Elements
      beginning with '%workspace%' are relative to the enclosing workspace. If omitted
      or empty, the default is the output of 'bazel info default-package-path'.
    --compile_one_dependency: Compile a single dependency of the argument files. This
      is useful for syntax checking source files in IDEs, for example, by rebuilding
      a single target that depends on the source file to detect errors as early as
      possible in the edit/build/test cycle. This argument affects the way all non-flag
      arguments are interpreted; instead of being targets to build they are source
      filenames.  For each source filename an arbitrary target that depends on it
      will be built.
    --experimental_use_semaphore_for_jobs: If set to true, additionally use semaphore
      to limit number of concurrent jobs.
    --experimental_build_event_output_group_mode: 'Specify how an output group''s
      files will be represented in TargetComplete/AspectComplete BEP events. Values
      are an assignment of an output group name to one of ''NAMED_SET_OF_FILES_ONLY'',
      ''INLINE_ONLY'', or ''BOTH''. The default value is ''NAMED_SET_OF_FILES_ONLY''.
      If an output group is repeated, the final value to appear is used. The default
      value sets the mode for coverage artifacts to BOTH: --experimental_build_event_output_group_mode=baseline.lcov=both'
    --noexperimental_split_xml_generation: If this flag is set, and a test action
      does not generate a test.xml file, then Bazel uses a separate action to generate
      a dummy test.xml file containing the test log. Otherwise, Bazel generates a
      test.xml as part of the test action.
    --verbose_failures: If a command fails, print out the full command line.
    --legacy_globbing_threads: Number of threads to use for glob evaluation. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" means to use
      a reasonable value derived from the machine's hardware profile (e.g. the number
      of processors).
    --norun_validations: Whether to run validation actions as part of the build. See
      https://bazel.build/extending/rules#validation_actions
    --noverbose_failures: If a command fails, print out the full command line.
    --experimental_build_event_expand_filesets: If true, expand Filesets in the BEP
      when presenting output files.
    --incompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --print_action_mnemonics: Lists which mnemonics to filter print_action data by,
      no filtering takes place when left empty.
    --noskip_incompatible_explicit_targets: 'Skip incompatible targets that are explicitly
      listed on the command line. By default, building such targets results in an
      error but they are silently skipped when this option is enabled. See: https://bazel.build/extending/platforms#skipping-incompatible-targets'
    --noexperimental_bep_target_summary: Whether to publish TargetSummary events.
    --nocompile_one_dependency: Compile a single dependency of the argument files.
      This is useful for syntax checking source files in IDEs, for example, by rebuilding
      a single target that depends on the source file to detect errors as early as
      possible in the edit/build/test cycle. This argument affects the way all non-flag
      arguments are interpreted; instead of being targets to build they are source
      filenames.  For each source filename an arbitrary target that depends on it
      will be built.
    --noexperimental_enable_critical_path_profiling: If set (the default), critical
      path profiling is enabled for the execution phase. This has a slight overhead
      in RAM and CPU, and may prevent Bazel from making certain aggressive RAM optimizations
      in some cases.
    --experimental_oom_sensitive_skyfunctions_semaphore_size: 'Sets the size of the
      semaphore used to prevent SkyFunctions with large peak memory requirement from
      OOM-ing blaze. A value of 0 indicates that no semaphore should be used. Example
      value: "HOST_CPUS*0.5".'
    --experimental_convenience_symlinks: |-
      This flag controls how the convenience symlinks (the symlinks that appear in the workspace after the build) will be managed. Possible values:
        normal (default): Each kind of convenience symlink will be created or deleted, as determined by the build.
        clean: All symlinks will be unconditionally deleted.
        ignore: Symlinks will not be created or cleaned up.
        log_only: Generate log messages as if 'normal' were passed, but don't actually perform any filesystem operations (useful for tools).
      Note that only symlinks whose names are generated by the current value of --symlink_prefix can be affected; if the prefix changes, any pre-existing symlinks will be left alone.
    --experimental_build_event_upload_retry_minimum_delay: 'Initial, minimum delay
      for exponential backoff retries when BEP upload fails. (exponent: 1.6)'
    --noanalyze: Execute the loading/analysis phase; this is the usual behaviour.
      Specifying --noanalyzecauses the build to stop before starting the loading/analysis
      phase, just doing target pattern parsing and returning zero iff that completed
      successfully; this mode is useful for testing.
    --experimental_skyframe_memory_dump: 'Dump the memory use of individual nodes
      in the Skyframe graph after the build. This option takes a number of flags separated
      by commas: ''json'' (no-op, that''s the only format), ''notransient'' (don''t
      traverse transient fields), ''noconfig'' (ignore objects related to configurations),
      ''noprecomputed'' (ignore precomputed values) and ''noworkspacestatus'' (ignore
      objects related to the workspace status machinery)'
    --experimental_run_bep_event_include_residue: Whether to include the command-line
      residue in run build events which could contain the residue. By default, the
      residue is not included in run command build events that could contain the residue.
    --experimental_max_directories_to_eagerly_visit_in_globbing: If non-negative,
      the first time a glob is evaluated in a package, the subdirectories of the package
      will be traversed in order to warm filesystem caches and compensate for lack
      of parallelism in globbing. At most this many directories will be visited.
    --verbose_explanations: Increases the verbosity of the explanations issued if
      --explain is enabled. Has no effect if --explain is not enabled.
    --materialize_param_files: Writes intermediate parameter files to output tree
      even when using remote action execution. Useful when debugging actions. This
      is implied by --subcommands and --verbose_failures.
    -j, --jobs: The number of concurrent jobs to run. Takes an integer, or a keyword
      ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed by an operation ([-|*]<float>)
      eg. "auto", "HOST_CPUS*.5". Values must be between 1 and 5000. Values above
      2500 may cause memory issues. "auto" calculates a reasonable default based on
      host resources.
    --experimental_extra_action_filter: Deprecated in favor of aspects. Filters set
      of targets to schedule extra_actions for.
    --experimental_split_xml_generation: If this flag is set, and a test action does
      not generate a test.xml file, then Bazel uses a separate action to generate
      a dummy test.xml file containing the test log. Otherwise, Bazel generates a
      test.xml as part of the test action.
    --experimental_process_wrapper_graceful_sigterm: When true, make the process-wrapper
      propagate SIGTERMs (used by the dynamic scheduler to stop process trees) to
      the subprocesses themselves, giving them the grace period in --local_termination_grace_seconds
      before forcibly sending a SIGKILL.
    --test_tag_filters: Specifies a comma-separated list of test tags. Each tag can
      be optionally preceded with '-' to specify excluded tags. Only those test targets
      will be found that contain at least one included tag and do not contain any
      excluded tags. This option affects --build_tests_only behavior and the test
      command.
    --symlink_prefix: 'The prefix that is prepended to any of the convenience symlinks
      that are created after a build. If omitted, the default value is the name of
      the build tool followed by a hyphen. If ''/'' is passed, then no symlinks are
      created and no warning is emitted. Warning: the special functionality for ''/''
      will be deprecated soon; use --experimental_convenience_symlinks=ignore instead.'
    --output_groups: A list of comma-separated output group names, each of which optionally
      prefixed by a + or a -. A group prefixed by + is added to the default set of
      output groups, while a group prefixed by - is removed from the default set.
      If at least one group is not prefixed, the default set of output groups is omitted.
      For example, --output_groups=+foo,+bar builds the union of the default set,
      foo, and bar, while --output_groups=foo,bar overrides the default set such that
      only foo and bar are built.
    --max_config_changes_to_show: When discarding the analysis cache due to a change
      in the build options, displays up to the given number of changed option names.
      If the number given is -1, all changed options will be displayed.
    --experimental_enable_critical_path_profiling: If set (the default), critical
      path profiling is enabled for the execution phase. This has a slight overhead
      in RAM and CPU, and may prevent Bazel from making certain aggressive RAM optimizations
      in some cases.
    --experimental_cpu_load_scheduling_window_size: The size of window during experimental
      scheduling of action based on CPU load. Make sense to define only when flag
      --experimental_cpu_load_scheduling is enabled.
    --incompatible_skip_genfiles_symlink: If set to true, the genfiles symlink will
      not be created. For more information, see https://github.com/bazelbuild/bazel/issues/8651
    --experimental_local_lockfree_output: When true, the local spawn runner doesn't
      lock the output tree during dynamic execution. Instead, spawns are allowed to
      execute until they are explicitly interrupted by a faster remote action.
    --noincompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --show_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --nobuild_manual_tests: Forces test targets tagged 'manual' to be built. 'manual'
      tests are excluded from processing. This option forces them to be built (but
      not executed).
    --test_lang_filters: Specifies a comma-separated list of test languages. Each
      language can be optionally preceded with '-' to specify excluded languages.
      Only those test targets will be found that are written in the specified languages.
      The name used for each language should be the same as the language prefix in
      the *_test rule, e.g. one of 'cc', 'java', 'py', etc. This option affects --build_tests_only
      behavior and the test command.
    --experimental_cpu_load_scheduling: Enables the experimental local execution scheduling
      based on CPU load, not estimation of actions one by one.  Experimental scheduling
      have showed the large benefit on a large local builds on a powerful machines
      with the large number of cores. Reccommended to use with --local_resources=cpu=HOST_CPUS
    --test_output: Specifies desired output mode. Valid values are 'summary' to output
      only test status summary, 'errors' to also print test logs for failed tests,
      'all' to print logs for all tests and 'streamed' to output logs for all tests
      in real time (this will force tests to be executed locally one at a time regardless
      of --test_strategy value).
    --run_validations: Whether to run validation actions as part of the build. See
      https://bazel.build/extending/rules#validation_actions
    --experimental_async_execution: If set to true, Bazel is allowed to run action
      in a virtual thread. The number of actions in flight is still capped with --jobs.
    --execution_log_binary_file: 'Log the executed spawns into this file as length-delimited
      SpawnExec protos, according to src/main/protobuf/spawn.proto. Prefer --execution_log_compact_file,
      which is significantly smaller and cheaper to produce. Related flags: --execution_log_compact_file
      (compact format; mutually exclusive), --execution_log_json_file (text JSON format;
      mutually exclusive), --execution_log_sort (whether to sort the execution log),
      --subcommands (for displaying subcommands in terminal output).'
    --nocheck_up_to_date: Don't perform the build, just check if it is up-to-date.  If
      all targets are up-to-date, the build completes successfully.  If any step needs
      to be executed an error is reported and the build fails.
    --legacy_important_outputs: Use this to suppress generation of the legacy important_outputs
      field in the TargetComplete event. important_outputs are required for Bazel
      to ResultStore/BTX integration.
    --cache_computed_file_digests: If greater than 0, configures Bazel to cache file
      digests in memory based on their metadata instead of recomputing the digests
      from disk every time they are needed. Setting this to 0 ensures correctness
      because not all file changes can be noted from file metadata. When not 0, the
      number indicates the size of the cache as the number of file digests to be cached.
    --experimental_working_set: The working set for Skyfocus. Specify as comma-separated
      workspace root-relative paths. This is a stateful flag. Defining a working set
      persists it for subsequent invocations, until it is redefined with a new set.
    --strategy: Specify how to distribute compilation of other spawn actions. Accepts
      a comma-separated list of strategies from highest to lowest priority. For each
      action Bazel picks the strategy with the highest priority that can execute the
      action. The default value is "remote,worker,sandboxed,local". This flag overrides
      the values set by --spawn_strategy (and --genrule_strategy if used with mnemonic
      Genrule). See https://blog.bazel.build/2019/06/19/list-strategy.html for details.
    --experimental_bep_target_summary: Whether to publish TargetSummary events.
    --build_tests_only: If specified, only *_test and test_suite rules will be built
      and other targets specified on the command line will be ignored. By default
      everything that was requested will be built.
    --allow_analysis_cache_discard: If discarding the analysis cache due to a change
      in the build system, setting this option to false will cause bazel to exit,
      rather than continuing with the build. This option has no effect when 'discard_analysis_cache'
      is also set.
    --local_cpu_resources: Explicitly set the total number of local CPU cores available
      to Bazel to spend on build actions executed locally. Takes an integer, or "HOST_CPUS",
      optionally followed by [-|*]<float> (eg. HOST_CPUS*.5 to use half the available
      CPU cores). By default, ("HOST_CPUS"), Bazel will query system configuration
      to estimate the number of CPU cores available.
    --noshow_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --noexperimental_cpu_load_scheduling: Enables the experimental local execution
      scheduling based on CPU load, not estimation of actions one by one.  Experimental
      scheduling have showed the large benefit on a large local builds on a powerful
      machines with the large number of cores. Reccommended to use with --local_resources=cpu=HOST_CPUS
    --noexperimental_stream_log_file_uploads: Stream log file uploads directly to
      the remote storage rather than writing them to disk.
    --noexperimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --allowed_local_actions_regex: A regex whitelist for action types which may be
      run locally. If unset, all actions are allowed to execute locally
    --experimental_fsvc_threads: The number of threads that are used by the FileSystemValueChecker.
    --serialized_frontier_profile: Dump a profile of serialized frontier bytes. Specifies
      the output path.
    --noexperimental_build_event_fully_resolve_fileset_symlinks: If true, fully resolve
      relative Fileset symlinks in the BEP when presenting output files. Requires
      --experimental_build_event_expand_filesets.
    --genrule_strategy: Specify how to execute genrules. This flag will be phased
      out. Instead, use --spawn_strategy=<value> to control all actions or --strategy=Genrule=<value>
      to control genrules only.
    --experimental_skymeld_analysis_overlap_percentage: The value represents the %
      of the analysis phase which will be overlapped with the execution phase. A value
      of x means Skyframe will queue up execution tasks and wait until there's x%
      of the top level target left to be analyzed before allowing them to launch.
      When the value is 0%, we'd wait for all analysis to finish before executing
      (no overlap). When it's 100%, the phases are free to overlap as much as they
      can.
    --aspects_parameters: Specifies the values of the command-line aspects parameters.
      Each parameter value is specified via <param_name>=<param_value>, for example
      'my_param=my_val' where 'my_param' is a parameter of some aspect in --aspects
      list or required by an aspect in the list. This option can be used multiple
      times. However, it is not allowed to assign values to the same parameter more
      than once.
    --progress_report_interval: The number of seconds to wait between reports on still
      running jobs. The default value 0 means the first report will be printed after
      10 seconds, then 30 seconds and after that progress is reported once every minute.
      When --curses is enabled, progress is reported every second.
    --test_size_filters: Specifies a comma-separated list of test sizes. Each size
      can be optionally preceded with '-' to specify excluded sizes. Only those test
      targets will be found that contain at least one included size and do not contain
      any excluded sizes. This option affects --build_tests_only behavior and the
      test command.
    --noexperimental_convenience_symlinks_bep_event: This flag controls whether or
      not we will post the build eventConvenienceSymlinksIdentified to the BuildEventProtocol.
      If the value is true, the BuildEventProtocol will have an entry for convenienceSymlinksIdentified,
      listing all of the convenience symlinks created in your workspace. If false,
      then the convenienceSymlinksIdentified entry in the BuildEventProtocol will
      be empty.
    --experimental_remote_analysis_cache: The URL for the remote analysis caching
      backend.
    --noexperimental_skyfocus_dump_post_gc_stats: For debugging Skyfocus. If enabled,
      trigger manual GC before/after focusing to report heap sizes reductions. This
      will increase the Skyfocus latency.
    --flaky_test_attempts: 'Each test will be retried up to the specified number of
      times in case of any test failure. Tests that required more than one attempt
      to pass are marked as ''FLAKY'' in the test summary. Normally the value specified
      is just an integer or the string ''default''. If an integer, then all tests
      will be run up to N times. If ''default'', then only a single test attempt will
      be made for regular tests and three for tests marked explicitly as flaky by
      their rule (flaky=1 attribute). Alternate syntax: regex_filter@flaky_test_attempts.
      Where flaky_test_attempts is as above and regex_filter stands for a list of
      include and exclude regular expression patterns (Also see --runs_per_test).
      Example: --flaky_test_attempts=//foo/.*,-//foo/bar/.*@3 deflakes all tests in
      //foo/ except those under foo/bar three times. This option can be passed multiple
      times. The most recently passed argument that matches takes precedence. If nothing
      matches, behavior is as if ''default'' above.'
    --experimental_local_retries_on_crash: Number of times to retry a local action
      when we detect that it crashed. This exists to workaround a bug in OSXFUSE which
      is tickled by the use of the dynamic scheduler and --experimental_local_lockfree_output
      due to constant process churn. The bug can be triggered by a cancelled process
      that ran *before* the process we are trying to run, introducing corruption in
      its file reads.
    --local_ram_resources: Explicitly set the total amount of local host RAM (in MB)
      available to Bazel to spend on build actions executed locally. Takes an integer,
      or "HOST_RAM", optionally followed by [-|*]<float> (eg. HOST_RAM*.5 to use half
      the available RAM). By default, ("HOST_RAM*.67"), Bazel will query system configuration
      to estimate the amount of RAM available and will use 67% of it.
    --experimental_use_validation_aspect: Whether to run validation actions using
      aspect (for parallelism with tests).
    -k, --keep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --noexperimental_run_bep_event_include_residue: Whether to include the command-line
      residue in run build events which could contain the residue. By default, the
      residue is not included in run command build events that could contain the residue.
    --analyze: Execute the loading/analysis phase; this is the usual behaviour. Specifying
      --noanalyzecauses the build to stop before starting the loading/analysis phase,
      just doing target pattern parsing and returning zero iff that completed successfully;
      this mode is useful for testing.
    --execution_log_json_file: 'Log the executed spawns into this file as newline-delimited
      JSON representations of SpawnExec protos, according to src/main/protobuf/spawn.proto.
      Prefer --execution_log_compact_file, which is significantly smaller and cheaper
      to produce. Related flags: --execution_log_compact_file (compact format; mutually
      exclusive), --execution_log_binary_file (binary protobuf format; mutually exclusive),
      --execution_log_sort (whether to sort the execution log), --subcommands (for
      displaying subcommands in terminal output).'
    --explain: Causes the build system to explain each executed step of the build.
      The explanation is written to the specified log file.
    --skip_incompatible_explicit_targets: 'Skip incompatible targets that are explicitly
      listed on the command line. By default, building such targets results in an
      error but they are silently skipped when this option is enabled. See: https://bazel.build/extending/platforms#skipping-incompatible-targets'
    --experimental_convenience_symlinks_bep_event: This flag controls whether or not
      we will post the build eventConvenienceSymlinksIdentified to the BuildEventProtocol.
      If the value is true, the BuildEventProtocol will have an entry for convenienceSymlinksIdentified,
      listing all of the convenience symlinks created in your workspace. If false,
      then the convenienceSymlinksIdentified entry in the BuildEventProtocol will
      be empty.
    --local_termination_grace_seconds: Time to wait between terminating a local process
      due to timeout and forcefully shutting it down.
    --noexpand_test_suites: 'Expand test_suite targets into their constituent tests
      before analysis. When this flag is turned on (the default), negative target
      patterns will apply to the tests belonging to the test suite, otherwise they
      will not. Turning off this flag is useful when top-level aspects are applied
      at command line: then they can analyze test_suite targets.'
    --directory_creation_cache: Describes the cache used to store known regular directories
      as they're created. Parent directories of output files are created on-demand
      during action execution.
    --output_filter: Only shows warnings and action outputs for rules with a name
      matching the provided regular expression.
    --nolegacy_important_outputs: Use this to suppress generation of the legacy important_outputs
      field in the TargetComplete event. important_outputs are required for Bazel
      to ResultStore/BTX integration.
    --noexperimental_extra_action_top_level_only: Deprecated in favor of aspects.
      Only schedules extra_actions for top level targets.
    --experimental_materialize_param_files_directly: If materializing param files,
      do so with direct writes to disk.
    --noverbose_explanations: Increases the verbosity of the explanations issued if
      --explain is enabled. Has no effect if --explain is not enabled.
    --experimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --use_action_cache: Whether to use the action cache
    --noexperimental_skyframe_target_pattern_evaluator: Use the Skyframe-based target
      pattern evaluator; implies --experimental_interleave_loading_and_analysis.
    --experimental_build_event_upload_strategy: Selects how to upload artifacts referenced
      in the build event protocol.
    --local_extra_resources: Set the number of extra resources available to Bazel.
      Takes in a string-float pair. Can be used multiple times to specify multiple
      types of extra resources. Bazel will limit concurrently running actions based
      on the available extra resources and the extra resources required. Tests can
      declare the amount of extra resources they need by using a tag of the "resources:<resoucename>:<amount>"
      format. Available CPU, RAM and resources cannot be set with this flag.
    --loading_phase_threads: Number of parallel threads to use for the loading/analysis
      phase.Takes an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally
      followed by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" sets
      a reasonable default based on host resources. Must be at least 1.
    --experimental_remote_cache_eviction_retries: The maximum number of attempts to
      retry if the build encountered a transient remote cache error that would otherwise
      fail the build. Applies for example when artifacts are evicted from the remote
      cache, or in certain cache failure conditions. A non-zero value will implicitly
      set --incompatible_remote_use_new_exit_code_for_lost_inputs to true. A new invocation
      id will be generated for each attempt. If you generate invocation id and provide
      it to Bazel with --invocation_id, you should not use this flag. Instead, set
      flag --incompatible_remote_use_new_exit_code_for_lost_inputs and check for the
      exit code 39.
    --experimental_remote_analysis_cache_mode: The transport direction for the remote
      analysis cache.
    --expand_test_suites: 'Expand test_suite targets into their constituent tests
      before analysis. When this flag is turned on (the default), negative target
      patterns will apply to the tests belonging to the test suite, otherwise they
      will not. Turning off this flag is useful when top-level aspects are applied
      at command line: then they can analyze test_suite targets.'
    --experimental_skyframe_cpu_heavy_skykeys_thread_pool_size: 'If set to a positive
      value (e.g. "HOST_CPUS*1.5"), Skyframe will run the loading/analysis phase with
      2 separate thread pools: 1 with <value> threads (ideally close to HOST_CPUS)
      reserved for CPU-heavy SkyKeys, and 1 "standard" thread pool (whose size is
      controlled by --loading_phase_threads) for the rest.'
    --max_test_output_bytes: Specifies maximum per-test-log size that can be emitted
      when --test_output is 'errors' or 'all'. Useful for avoiding overwhelming the
      output with excessively noisy test output. The test header is included in the
      log size. Negative values imply no limit. Output is all or nothing.
    --experimental_merged_skyframe_analysis_execution: If this flag is set, the analysis
      and execution phases of Skyframe are merged.
    --target_pattern_file: If set, build will read patterns from the file named here,
      rather than on the command line. It is an error to specify a file here as well
      as command-line patterns.
    --noexperimental_process_wrapper_graceful_sigterm: When true, make the process-wrapper
      propagate SIGTERMs (used by the dynamic scheduler to stop process trees) to
      the subprocesses themselves, giving them the grace period in --local_termination_grace_seconds
      before forcibly sending a SIGKILL.
    --experimental_skyfocus_handling_strategy: Strategies for Skyfocus to handle changes
      outside of the working set.
    --incompatible_remote_use_new_exit_code_for_lost_inputs: If set to true, Bazel
      will use new exit code 39 instead of 34 if remote cacheerrors, including cache
      evictions, cause the build to fail.
    --experimental_skyframe_target_pattern_evaluator: Use the Skyframe-based target
      pattern evaluator; implies --experimental_interleave_loading_and_analysis.
    --noincompatible_skip_genfiles_symlink: If set to true, the genfiles symlink will
      not be created. For more information, see https://github.com/bazelbuild/bazel/issues/8651
    --experimental_enable_skyfocus: If true, enable the use of --experimental_working_set
      to reduce Bazel's memory footprint for incremental builds. This feature is known
      as Skyfocus.
    --build_manual_tests: Forces test targets tagged 'manual' to be built. 'manual'
      tests are excluded from processing. This option forces them to be built (but
      not executed).
    --experimental_aquery_dump_after_build_format: 'Writes the state of Skyframe (which
      includes previous invocations on this blaze instance as well) after a build.
      Output is streamed remotely unless local output is requested with --experimental_aquery_dump_after_build_output_file.  Does
      not honor aquery flags for --include_*, but uses the same defaults, except for
      --include_commandline=false. Possible output formats: proto|streamed_proto|textproto|jsonproto.
      Using this will disable Skymeld.'
    --build_tag_filters: Specifies a comma-separated list of tags. Each tag can be
      optionally preceded with '-' to specify excluded tags. Only those targets will
      be built that contain at least one included tag and do not contain any excluded
      tags. This option does not affect the set of tests executed with the 'test'
      command; those are be governed by the test filtering options, for example '--test_tag_filters'
    --noexperimental_use_semaphore_for_jobs: If set to true, additionally use semaphore
      to limit number of concurrent jobs.
    --experimental_aquery_dump_after_build_output_file: Specify the output file for
      the aquery dump after a build. Use in conjunction with --experimental_aquery_dump_after_build_format.
      The path provided is relative to Bazel's output base, unless it's an absolute
      path. Using this will disable Skymeld.
    --local_test_jobs: The max number of local test jobs to run concurrently. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". 0 means local resources
      will limit the number of local test jobs to run concurrently instead. Setting
      this greater than the value for --jobs is ineffectual.
    --norewind_lost_inputs: Whether to use action rewinding to recover from lost inputs.
    --test_tmpdir: Specifies the base temporary directory for 'bazel test' to use.
    --experimental_build_event_fully_resolve_fileset_symlinks: If true, fully resolve
      relative Fileset symlinks in the BEP when presenting output files. Requires
      --experimental_build_event_expand_filesets.
    --noincompatible_remote_use_new_exit_code_for_lost_inputs: If set to true, Bazel
      will use new exit code 39 instead of 34 if remote cacheerrors, including cache
      evictions, cause the build to fail.
    --execution_log_compact_file: 'Log the executed spawns into this file as length-delimited
      ExecLogEntry protos, according to src/main/protobuf/spawn.proto. The entire
      file is zstd compressed. Related flags: --execution_log_binary_file (binary
      protobuf format; mutually exclusive), --execution_log_json_file (text JSON format;
      mutually exclusive), --subcommands (for displaying subcommands in terminal output).'
    --hide_aspect_results: Comma-separated list of aspect names to not display in
      results (see --show_result). Useful for keeping aspects added by wrappers which
      are typically not interesting to end users out of console output.
  description: Prints the command line args for compiling a file.
- name: analyze-profile
  flags: {'-d, --dump': output full profile data dump either in human-readable 'text'
      format or script-friendly 'raw' format.}
  description: Analyzes build profile data.
- name: query
  flags:
    --incompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --legacy_globbing_threads: Number of threads to use for glob evaluation. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" means to use
      a reasonable value derived from the machine's hardware profile (e.g. the number
      of processors).
    --show_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --noincompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --incompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --incompatible_lexicographical_output: If this option is set, sorts --order_output=auto
      output in lexicographical order.
    --noxml:line_numbers: If true, XML output contains line numbers. Disabling this
      option may make diffs easier to read.  This option is only applicable to --output=xml.
    --graph:conditional_edges_limit: The maximum number of condition labels to show.
      -1 means no truncation and 0 means no annotation. This option is only applicable
      to --output=graph.
    --xml:line_numbers: If true, XML output contains line numbers. Disabling this
      option may make diffs easier to read.  This option is only applicable to --output=xml.
    --null: Whether each format is terminated with \\0 instead of newline.
    --noincompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --experimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --noxml:default_values: If true, rule attributes whose value is not explicitly
      specified in the BUILD file are printed; otherwise they are omitted.
    --nostrict_test_suite: If true, the tests() expression gives an error if it encounters
      a test_suite containing non-test targets.
    --fetch: Allows the command to fetch external dependencies. If set to false, the
      command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --order_results: Output the results in dependency-ordered (default) or unordered
      fashion. The unordered output is faster but only supported when --output is
      not minrank, maxrank, or graph.
    --loading_phase_threads: Number of parallel threads to use for the loading/analysis
      phase.Takes an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally
      followed by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" sets
      a reasonable default based on host resources. Must be at least 1.
    --noshow_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --noexperimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --nokeep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --noorder_results: Output the results in dependency-ordered (default) or unordered
      fashion. The unordered output is faster but only supported when --output is
      not minrank, maxrank, or graph.
    --order_output: Output the results unordered (no), dependency-ordered (deps),
      or fully ordered (full). The default is 'auto', meaning that results are output
      either dependency-ordered or fully ordered, depending on the output formatter
      (dependency-ordered for proto, minrank, maxrank, and graph, fully ordered for
      all others). When output is fully ordered, nodes are printed in a fully deterministic
      (total) order. First, all nodes are sorted alphabetically. Then, each node in
      the list is used as the start of a post-order depth-first search in which outgoing
      edges to unvisited nodes are traversed in alphabetical order of the successor
      nodes. Finally, nodes are printed in the reverse of the order in which they
      were visited.
    --deleted_packages: |-
      A comma-separated list of names of packages which the build system will consider non-existent, even if they are visible somewhere on the package path.
      Use this option when deleting a subpackage 'x/y' of an existing package 'x'.  For example, after deleting x/y/BUILD in your client, the build system may complain if it encounters a label '//x:y/z' if that is still provided by another package_path entry.  Specifying --deleted_packages x/y avoids this problem.
    --default_visibility: Default visibility for packages that don't set it explicitly
      ('public' or 'private').
    --xml:default_values: If true, rule attributes whose value is not explicitly specified
      in the BUILD file are printed; otherwise they are omitted.
    --experimental_max_directories_to_eagerly_visit_in_globbing: If non-negative,
      the first time a glob is evaluated in a package, the subdirectories of the package
      will be traversed in order to warm filesystem caches and compensate for lack
      of parallelism in globbing. At most this many directories will be visited.
    --noincompatible_lexicographical_output: If this option is set, sorts --order_output=auto
      output in lexicographical order.
    --experimental_graphless_query: If true, uses a Query implementation that does
      not make a copy of the graph. The new implementation only supports --order_output=no,
      as well as only a subset of output formatters.
    -k, --keep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --nofetch: Allows the command to fetch external dependencies. If set to false,
      the command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --package_path: A colon-separated list of where to look for packages. Elements
      beginning with '%workspace%' are relative to the enclosing workspace. If omitted
      or empty, the default is the output of 'bazel info default-package-path'.
    --strict_test_suite: If true, the tests() expression gives an error if it encounters
      a test_suite containing non-test targets.
    --output: 'The format in which the query results should be printed. Allowed values
      for query are: build, graph, streamed_jsonproto, label, label_kind, location,
      maxrank, minrank, package, proto, streamed_proto, xml.'
  description: Executes a dependency graph query.
- name: run
  flags:
    --noexecution_log_sort: Whether to sort the execution log, making it easier to
      compare logs across invocations. Set to false to avoid potentially significant
      CPU and memory usage at the end of the invocation, at the cost of producing
      the log in nondeterministic execution order. Only applies to the binary and
      JSON formats; the compact format is never sorted.
    --incompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --noexperimental_stats_summary: Enable a modernized summary of the build stats.
    --check_tests_up_to_date: Don't run tests, just check if they are up-to-date.  If
      all tests results are up-to-date, the testing completes successfully.  If any
      test needs to be built or executed, an error is reported and the testing fails.  This
      option implies --check_up_to_date behavior.
    --noexperimental_merged_skyframe_analysis_execution: If this flag is set, the
      analysis and execution phases of Skyframe are merged.
    --test_keep_going: When disabled, any non-passing test will cause the entire build
      to stop. By default all tests are run, even if some do not pass.
    --experimental_skyfocus_dump_keys: For debugging Skyfocus. Dump the focused SkyKeys
      (roots, leafs, focused deps, focused rdeps).
    --check_up_to_date: Don't perform the build, just check if it is up-to-date.  If
      all targets are up-to-date, the build completes successfully.  If any step needs
      to be executed an error is reported and the build fails.
    --nomaterialize_param_files: Writes intermediate parameter files to output tree
      even when using remote action execution. Useful when debugging actions. This
      is implied by --subcommands and --verbose_failures.
    --version_window_for_dirty_node_gc: Nodes that have been dirty for more than this
      many versions will be deleted from the graph upon the next update. Values must
      be non-negative long integers, or -1 indicating the maximum possible window.
    --test_summary: Specifies the desired format of the test summary. Valid values
      are 'short' to print information only about tests executed, 'terse', to print
      information only about unsuccessful tests that were run, 'detailed' to print
      detailed information about failed test cases, 'testcase' to print summary in
      test case resolution, do not print detailed information about failed test cases
      and 'none' to omit the summary.
    --norun: If false, skip running the command line constructed for the built target.
      Note that this flag is ignored for all --script_path builds.
    --local_resources: Set the number of resources available to Bazel. Takes in an
      assignment to a float or HOST_RAM/HOST_CPUS, optionally followed by [-|*]<float>
      (eg. memory=HOST_RAM*.5 to use half the available RAM). Can be used multiple
      times to specify multiple types of resources. Bazel will limit concurrently
      running actions based on the available resources and the resources required.
      Tests can declare the amount of resources they need by using a tag of the "resources:<resource
      name>:<amount>" format. Overrides resources specified by --local_{cpu|ram|extra}_resources.
    --rewind_lost_inputs: Whether to use action rewinding to recover from lost inputs.
    --noexperimental_local_lockfree_output: When true, the local spawn runner doesn't
      lock the output tree during dynamic execution. Instead, spawns are allowed to
      execute until they are explicitly interrupted by a faster remote action.
    --build: Execute the build; this is the usual behaviour. Specifying --nobuild
      causes the build to stop before executing the build actions, returning zero
      iff the package loading and analysis phases completed successfully; this mode
      is useful for testing those phases.
    --noincompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --enforce_project_configs: If true, interactive builds may only pass the --scl_config
      build flag; they may not use any other build flags. --scl_config must be set
      to an officially suported project configuration. Supported configurations are
      defined in the target's PROJECT.scl, which can be found by walking up the target's
      packagge path. See b/324126745.
    --aspects: Comma-separated list of aspects to be applied to top-level targets.
      In the list, if aspect some_aspect specifies required aspect providers via required_aspect_providers,
      some_aspect will run after every aspect that was mentioned before it in the
      aspects list whose advertised providers satisfy some_aspect required aspect
      providers. Moreover, some_aspect will run after all its required aspects specified
      by requires attribute. some_aspect will then have access to the values of those
      aspects' providers. <bzl-file-label>%<aspect_name>, for example '//tools:my_def.bzl%my_aspect',
      where 'my_aspect' is a top-level value from a file tools/my_def.bzl
    --nobuild_tests_only: If specified, only *_test and test_suite rules will be built
      and other targets specified on the command line will be ignored. By default
      everything that was requested will be built.
    --fetch: Allows the command to fetch external dependencies. If set to false, the
      command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --noexperimental_materialize_param_files_directly: If materializing param files,
      do so with direct writes to disk.
    --show_result: |-
      Show the results of the build.  For each target, state whether or not it was brought up-to-date, and if so, a list of output files that were built.  The printed files are convenient strings for copy+pasting to the shell, to execute them.
      This option requires an integer argument, which is the threshold number of targets above which result information is not printed. Thus zero causes suppression of the message and MAX_INT causes printing of the result to occur always. The default is one.
      If nothing was built for a target its results may be omitted to keep the output under the threshold.
    --noenforce_project_configs: If true, interactive builds may only pass the --scl_config
      build flag; they may not use any other build flags. --scl_config must be set
      to an officially suported project configuration. Supported configurations are
      defined in the target's PROJECT.scl, which can be found by walking up the target's
      packagge path. See b/324126745.
    --execution_log_sort: Whether to sort the execution log, making it easier to compare
      logs across invocations. Set to false to avoid potentially significant CPU and
      memory usage at the end of the invocation, at the cost of producing the log
      in nondeterministic execution order. Only applies to the binary and JSON formats;
      the compact format is never sorted.
    --output_tree_tracking: If set, tell the output service (if any) to track when
      files in the output tree have been modified externally (not by the build system).
      This should improve incremental build speed when an appropriate output service
      is enabled.
    --noexperimental_enable_skyfocus: If true, enable the use of --experimental_working_set
      to reduce Bazel's memory footprint for incremental builds. This feature is known
      as Skyfocus.
    --test_strategy: Specifies which strategy to use when running tests.
    --spawn_strategy: Specify how spawn actions are executed by default. Accepts a
      comma-separated list of strategies from highest to lowest priority. For each
      action Bazel picks the strategy with the highest priority that can execute the
      action. The default value is "remote,worker,sandboxed,local". See https://blog.bazel.build/2019/06/19/list-strategy.html
      for details.
    --nodiscard_analysis_cache: Discard the analysis cache immediately after the analysis
      phase completes. Reduces memory usage by ~10%, but makes further incremental
      builds slower.
    --experimental_skyfocus_dump_post_gc_stats: For debugging Skyfocus. If enabled,
      trigger manual GC before/after focusing to report heap sizes reductions. This
      will increase the Skyfocus latency.
    --noexperimental_build_event_expand_filesets: If true, expand Filesets in the
      BEP when presenting output files.
    --nokeep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --noexperimental_use_validation_aspect: Whether to run validation actions using
      aspect (for parallelism with tests).
    --nocheck_tests_up_to_date: Don't run tests, just check if they are up-to-date.  If
      all tests results are up-to-date, the testing completes successfully.  If any
      test needs to be built or executed, an error is reported and the testing fails.  This
      option implies --check_up_to_date behavior.
    --nobuild: Execute the build; this is the usual behaviour. Specifying --nobuild
      causes the build to stop before executing the build actions, returning zero
      iff the package loading and analysis phases completed successfully; this mode
      is useful for testing those phases.
    --experimental_extra_action_top_level_only: Deprecated in favor of aspects. Only
      schedules extra_actions for top level targets.
    --build_event_upload_max_retries: The maximum number of times Bazel should retry
      uploading a build event.
    --test_timeout_filters: Specifies a comma-separated list of test timeouts. Each
      timeout can be optionally preceded with '-' to specify excluded timeouts. Only
      those test targets will be found that contain at least one included timeout
      and do not contain any excluded timeouts. This option affects --build_tests_only
      behavior and the test command.
    --experimental_remote_analysis_cache_deadline: Deadline to use for remote analysis
      cache operations.
    -s, --subcommands: 'Display the subcommands executed during a build. Related flags:
      --execution_log_json_file, --execution_log_binary_file (for logging subcommands
      to a file in a tool-friendly format).'
    --script_path: If set, write a shell script to the given file which invokes the
      target. If this option is set, the target is not run from %{product}. Use '%{product}
      run --script_path=foo //foo && ./foo' to invoke target '//foo' This differs
      from '%{product} run //foo' in that the %{product} lock is released and the
      executable is connected to the terminal's stdin.
    --deleted_packages: |-
      A comma-separated list of names of packages which the build system will consider non-existent, even if they are visible somewhere on the package path.
      Use this option when deleting a subpackage 'x/y' of an existing package 'x'.  For example, after deleting x/y/BUILD in your client, the build system may complain if it encounters a label '//x:y/z' if that is still provided by another package_path entry.  Specifying --deleted_packages x/y avoids this problem.
    --default_visibility: Default visibility for packages that don't set it explicitly
      ('public' or 'private').
    --nouse_action_cache: Whether to use the action cache
    --experimental_stream_log_file_uploads: Stream log file uploads directly to the
      remote storage rather than writing them to disk.
    --noexperimental_async_execution: If set to true, Bazel is allowed to run action
      in a virtual thread. The number of actions in flight is still capped with --jobs.
    --nooutput_tree_tracking: If set, tell the output service (if any) to track when
      files in the output tree have been modified externally (not by the build system).
      This should improve incremental build speed when an appropriate output service
      is enabled.
    --notest_keep_going: When disabled, any non-passing test will cause the entire
      build to stop. By default all tests are run, even if some do not pass.
    --noallow_analysis_cache_discard: If discarding the analysis cache due to a change
      in the build system, setting this option to false will cause bazel to exit,
      rather than continuing with the build. This option has no effect when 'discard_analysis_cache'
      is also set.
    --strategy_regexp: 'Override which spawn strategy should be used to execute spawn
      actions that have descriptions matching a certain regex_filter. See --per_file_copt
      for details onregex_filter matching. The last regex_filter that matches the
      description is used. This option overrides other flags for specifying strategy.
      Example: --strategy_regexp=//foo.*\\.cc,-//foo/bar=local means to run actions
      using local strategy if their descriptions match //foo.*.cc but not //foo/bar.
      Example: --strategy_regexp=''Compiling.*/bar=local  --strategy_regexp=Compiling=sandboxed
      will run ''Compiling //foo/bar/baz'' with the ''local'' strategy, but reversing
      the order would run it with ''sandboxed''. '
    --experimental_remote_analysis_cache_concurrency: Target concurrency for remote
      analysis caching RPCs.
    --nofetch: Allows the command to fetch external dependencies. If set to false,
      the command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --experimental_stats_summary: Enable a modernized summary of the build stats.
    --discard_analysis_cache: Discard the analysis cache immediately after the analysis
      phase completes. Reduces memory usage by ~10%, but makes further incremental
      builds slower.
    --package_path: A colon-separated list of where to look for packages. Elements
      beginning with '%workspace%' are relative to the enclosing workspace. If omitted
      or empty, the default is the output of 'bazel info default-package-path'.
    --compile_one_dependency: Compile a single dependency of the argument files. This
      is useful for syntax checking source files in IDEs, for example, by rebuilding
      a single target that depends on the source file to detect errors as early as
      possible in the edit/build/test cycle. This argument affects the way all non-flag
      arguments are interpreted; instead of being targets to build they are source
      filenames.  For each source filename an arbitrary target that depends on it
      will be built.
    --experimental_use_semaphore_for_jobs: If set to true, additionally use semaphore
      to limit number of concurrent jobs.
    --experimental_build_event_output_group_mode: 'Specify how an output group''s
      files will be represented in TargetComplete/AspectComplete BEP events. Values
      are an assignment of an output group name to one of ''NAMED_SET_OF_FILES_ONLY'',
      ''INLINE_ONLY'', or ''BOTH''. The default value is ''NAMED_SET_OF_FILES_ONLY''.
      If an output group is repeated, the final value to appear is used. The default
      value sets the mode for coverage artifacts to BOTH: --experimental_build_event_output_group_mode=baseline.lcov=both'
    --noexperimental_split_xml_generation: If this flag is set, and a test action
      does not generate a test.xml file, then Bazel uses a separate action to generate
      a dummy test.xml file containing the test log. Otherwise, Bazel generates a
      test.xml as part of the test action.
    --verbose_failures: If a command fails, print out the full command line.
    --legacy_globbing_threads: Number of threads to use for glob evaluation. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" means to use
      a reasonable value derived from the machine's hardware profile (e.g. the number
      of processors).
    --norun_validations: Whether to run validation actions as part of the build. See
      https://bazel.build/extending/rules#validation_actions
    --noverbose_failures: If a command fails, print out the full command line.
    --experimental_build_event_expand_filesets: If true, expand Filesets in the BEP
      when presenting output files.
    --incompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --noskip_incompatible_explicit_targets: 'Skip incompatible targets that are explicitly
      listed on the command line. By default, building such targets results in an
      error but they are silently skipped when this option is enabled. See: https://bazel.build/extending/platforms#skipping-incompatible-targets'
    --noexperimental_bep_target_summary: Whether to publish TargetSummary events.
    --nocompile_one_dependency: Compile a single dependency of the argument files.
      This is useful for syntax checking source files in IDEs, for example, by rebuilding
      a single target that depends on the source file to detect errors as early as
      possible in the edit/build/test cycle. This argument affects the way all non-flag
      arguments are interpreted; instead of being targets to build they are source
      filenames.  For each source filename an arbitrary target that depends on it
      will be built.
    --noexperimental_enable_critical_path_profiling: If set (the default), critical
      path profiling is enabled for the execution phase. This has a slight overhead
      in RAM and CPU, and may prevent Bazel from making certain aggressive RAM optimizations
      in some cases.
    --experimental_oom_sensitive_skyfunctions_semaphore_size: 'Sets the size of the
      semaphore used to prevent SkyFunctions with large peak memory requirement from
      OOM-ing blaze. A value of 0 indicates that no semaphore should be used. Example
      value: "HOST_CPUS*0.5".'
    --experimental_convenience_symlinks: |-
      This flag controls how the convenience symlinks (the symlinks that appear in the workspace after the build) will be managed. Possible values:
        normal (default): Each kind of convenience symlink will be created or deleted, as determined by the build.
        clean: All symlinks will be unconditionally deleted.
        ignore: Symlinks will not be created or cleaned up.
        log_only: Generate log messages as if 'normal' were passed, but don't actually perform any filesystem operations (useful for tools).
      Note that only symlinks whose names are generated by the current value of --symlink_prefix can be affected; if the prefix changes, any pre-existing symlinks will be left alone.
    --noemit_script_path_in_exec_request: If true, emits the ExecRequest with --script_path
      file value and script contents instead of writing the script.
    --experimental_build_event_upload_retry_minimum_delay: 'Initial, minimum delay
      for exponential backoff retries when BEP upload fails. (exponent: 1.6)'
    --noanalyze: Execute the loading/analysis phase; this is the usual behaviour.
      Specifying --noanalyzecauses the build to stop before starting the loading/analysis
      phase, just doing target pattern parsing and returning zero iff that completed
      successfully; this mode is useful for testing.
    --experimental_skyframe_memory_dump: 'Dump the memory use of individual nodes
      in the Skyframe graph after the build. This option takes a number of flags separated
      by commas: ''json'' (no-op, that''s the only format), ''notransient'' (don''t
      traverse transient fields), ''noconfig'' (ignore objects related to configurations),
      ''noprecomputed'' (ignore precomputed values) and ''noworkspacestatus'' (ignore
      objects related to the workspace status machinery)'
    --experimental_run_bep_event_include_residue: Whether to include the command-line
      residue in run build events which could contain the residue. By default, the
      residue is not included in run command build events that could contain the residue.
    --experimental_max_directories_to_eagerly_visit_in_globbing: If non-negative,
      the first time a glob is evaluated in a package, the subdirectories of the package
      will be traversed in order to warm filesystem caches and compensate for lack
      of parallelism in globbing. At most this many directories will be visited.
    --verbose_explanations: Increases the verbosity of the explanations issued if
      --explain is enabled. Has no effect if --explain is not enabled.
    --materialize_param_files: Writes intermediate parameter files to output tree
      even when using remote action execution. Useful when debugging actions. This
      is implied by --subcommands and --verbose_failures.
    -j, --jobs: The number of concurrent jobs to run. Takes an integer, or a keyword
      ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed by an operation ([-|*]<float>)
      eg. "auto", "HOST_CPUS*.5". Values must be between 1 and 5000. Values above
      2500 may cause memory issues. "auto" calculates a reasonable default based on
      host resources.
    --experimental_extra_action_filter: Deprecated in favor of aspects. Filters set
      of targets to schedule extra_actions for.
    --experimental_split_xml_generation: If this flag is set, and a test action does
      not generate a test.xml file, then Bazel uses a separate action to generate
      a dummy test.xml file containing the test log. Otherwise, Bazel generates a
      test.xml as part of the test action.
    --run: If false, skip running the command line constructed for the built target.
      Note that this flag is ignored for all --script_path builds.
    --experimental_process_wrapper_graceful_sigterm: When true, make the process-wrapper
      propagate SIGTERMs (used by the dynamic scheduler to stop process trees) to
      the subprocesses themselves, giving them the grace period in --local_termination_grace_seconds
      before forcibly sending a SIGKILL.
    --test_tag_filters: Specifies a comma-separated list of test tags. Each tag can
      be optionally preceded with '-' to specify excluded tags. Only those test targets
      will be found that contain at least one included tag and do not contain any
      excluded tags. This option affects --build_tests_only behavior and the test
      command.
    --symlink_prefix: 'The prefix that is prepended to any of the convenience symlinks
      that are created after a build. If omitted, the default value is the name of
      the build tool followed by a hyphen. If ''/'' is passed, then no symlinks are
      created and no warning is emitted. Warning: the special functionality for ''/''
      will be deprecated soon; use --experimental_convenience_symlinks=ignore instead.'
    --output_groups: A list of comma-separated output group names, each of which optionally
      prefixed by a + or a -. A group prefixed by + is added to the default set of
      output groups, while a group prefixed by - is removed from the default set.
      If at least one group is not prefixed, the default set of output groups is omitted.
      For example, --output_groups=+foo,+bar builds the union of the default set,
      foo, and bar, while --output_groups=foo,bar overrides the default set such that
      only foo and bar are built.
    --max_config_changes_to_show: When discarding the analysis cache due to a change
      in the build options, displays up to the given number of changed option names.
      If the number given is -1, all changed options will be displayed.
    --experimental_enable_critical_path_profiling: If set (the default), critical
      path profiling is enabled for the execution phase. This has a slight overhead
      in RAM and CPU, and may prevent Bazel from making certain aggressive RAM optimizations
      in some cases.
    --experimental_cpu_load_scheduling_window_size: The size of window during experimental
      scheduling of action based on CPU load. Make sense to define only when flag
      --experimental_cpu_load_scheduling is enabled.
    --incompatible_skip_genfiles_symlink: If set to true, the genfiles symlink will
      not be created. For more information, see https://github.com/bazelbuild/bazel/issues/8651
    --experimental_local_lockfree_output: When true, the local spawn runner doesn't
      lock the output tree during dynamic execution. Instead, spawns are allowed to
      execute until they are explicitly interrupted by a faster remote action.
    --noincompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --show_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --nobuild_manual_tests: Forces test targets tagged 'manual' to be built. 'manual'
      tests are excluded from processing. This option forces them to be built (but
      not executed).
    --test_lang_filters: Specifies a comma-separated list of test languages. Each
      language can be optionally preceded with '-' to specify excluded languages.
      Only those test targets will be found that are written in the specified languages.
      The name used for each language should be the same as the language prefix in
      the *_test rule, e.g. one of 'cc', 'java', 'py', etc. This option affects --build_tests_only
      behavior and the test command.
    --experimental_cpu_load_scheduling: Enables the experimental local execution scheduling
      based on CPU load, not estimation of actions one by one.  Experimental scheduling
      have showed the large benefit on a large local builds on a powerful machines
      with the large number of cores. Reccommended to use with --local_resources=cpu=HOST_CPUS
    --test_output: Specifies desired output mode. Valid values are 'summary' to output
      only test status summary, 'errors' to also print test logs for failed tests,
      'all' to print logs for all tests and 'streamed' to output logs for all tests
      in real time (this will force tests to be executed locally one at a time regardless
      of --test_strategy value).
    --run_validations: Whether to run validation actions as part of the build. See
      https://bazel.build/extending/rules#validation_actions
    --experimental_async_execution: If set to true, Bazel is allowed to run action
      in a virtual thread. The number of actions in flight is still capped with --jobs.
    --execution_log_binary_file: 'Log the executed spawns into this file as length-delimited
      SpawnExec protos, according to src/main/protobuf/spawn.proto. Prefer --execution_log_compact_file,
      which is significantly smaller and cheaper to produce. Related flags: --execution_log_compact_file
      (compact format; mutually exclusive), --execution_log_json_file (text JSON format;
      mutually exclusive), --execution_log_sort (whether to sort the execution log),
      --subcommands (for displaying subcommands in terminal output).'
    --nocheck_up_to_date: Don't perform the build, just check if it is up-to-date.  If
      all targets are up-to-date, the build completes successfully.  If any step needs
      to be executed an error is reported and the build fails.
    --legacy_important_outputs: Use this to suppress generation of the legacy important_outputs
      field in the TargetComplete event. important_outputs are required for Bazel
      to ResultStore/BTX integration.
    --cache_computed_file_digests: If greater than 0, configures Bazel to cache file
      digests in memory based on their metadata instead of recomputing the digests
      from disk every time they are needed. Setting this to 0 ensures correctness
      because not all file changes can be noted from file metadata. When not 0, the
      number indicates the size of the cache as the number of file digests to be cached.
    --experimental_working_set: The working set for Skyfocus. Specify as comma-separated
      workspace root-relative paths. This is a stateful flag. Defining a working set
      persists it for subsequent invocations, until it is redefined with a new set.
    --strategy: Specify how to distribute compilation of other spawn actions. Accepts
      a comma-separated list of strategies from highest to lowest priority. For each
      action Bazel picks the strategy with the highest priority that can execute the
      action. The default value is "remote,worker,sandboxed,local". This flag overrides
      the values set by --spawn_strategy (and --genrule_strategy if used with mnemonic
      Genrule). See https://blog.bazel.build/2019/06/19/list-strategy.html for details.
    --experimental_bep_target_summary: Whether to publish TargetSummary events.
    --build_tests_only: If specified, only *_test and test_suite rules will be built
      and other targets specified on the command line will be ignored. By default
      everything that was requested will be built.
    --allow_analysis_cache_discard: If discarding the analysis cache due to a change
      in the build system, setting this option to false will cause bazel to exit,
      rather than continuing with the build. This option has no effect when 'discard_analysis_cache'
      is also set.
    --local_cpu_resources: Explicitly set the total number of local CPU cores available
      to Bazel to spend on build actions executed locally. Takes an integer, or "HOST_CPUS",
      optionally followed by [-|*]<float> (eg. HOST_CPUS*.5 to use half the available
      CPU cores). By default, ("HOST_CPUS"), Bazel will query system configuration
      to estimate the number of CPU cores available.
    --noshow_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --noexperimental_cpu_load_scheduling: Enables the experimental local execution
      scheduling based on CPU load, not estimation of actions one by one.  Experimental
      scheduling have showed the large benefit on a large local builds on a powerful
      machines with the large number of cores. Reccommended to use with --local_resources=cpu=HOST_CPUS
    --run_env: Specifies the set of environment variables available to actions with
      target configuration. Variables can be either specified by name, in which case
      the value will be taken from the invocation environment, or by the name=value
      pair which sets the value independent of the invocation environment. This option
      can be used multiple times; for options given for the same variable, the latest
      wins, options for different variables accumulate.
    --noexperimental_stream_log_file_uploads: Stream log file uploads directly to
      the remote storage rather than writing them to disk.
    --noexperimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --noportable_paths: If true, includes paths to replace in ExecRequest to make
      the resulting paths portable.
    --allowed_local_actions_regex: A regex whitelist for action types which may be
      run locally. If unset, all actions are allowed to execute locally
    --experimental_fsvc_threads: The number of threads that are used by the FileSystemValueChecker.
    --serialized_frontier_profile: Dump a profile of serialized frontier bytes. Specifies
      the output path.
    --noexperimental_build_event_fully_resolve_fileset_symlinks: If true, fully resolve
      relative Fileset symlinks in the BEP when presenting output files. Requires
      --experimental_build_event_expand_filesets.
    --genrule_strategy: Specify how to execute genrules. This flag will be phased
      out. Instead, use --spawn_strategy=<value> to control all actions or --strategy=Genrule=<value>
      to control genrules only.
    --experimental_skymeld_analysis_overlap_percentage: The value represents the %
      of the analysis phase which will be overlapped with the execution phase. A value
      of x means Skyframe will queue up execution tasks and wait until there's x%
      of the top level target left to be analyzed before allowing them to launch.
      When the value is 0%, we'd wait for all analysis to finish before executing
      (no overlap). When it's 100%, the phases are free to overlap as much as they
      can.
    --aspects_parameters: Specifies the values of the command-line aspects parameters.
      Each parameter value is specified via <param_name>=<param_value>, for example
      'my_param=my_val' where 'my_param' is a parameter of some aspect in --aspects
      list or required by an aspect in the list. This option can be used multiple
      times. However, it is not allowed to assign values to the same parameter more
      than once.
    --progress_report_interval: The number of seconds to wait between reports on still
      running jobs. The default value 0 means the first report will be printed after
      10 seconds, then 30 seconds and after that progress is reported once every minute.
      When --curses is enabled, progress is reported every second.
    --test_size_filters: Specifies a comma-separated list of test sizes. Each size
      can be optionally preceded with '-' to specify excluded sizes. Only those test
      targets will be found that contain at least one included size and do not contain
      any excluded sizes. This option affects --build_tests_only behavior and the
      test command.
    --noexperimental_convenience_symlinks_bep_event: This flag controls whether or
      not we will post the build eventConvenienceSymlinksIdentified to the BuildEventProtocol.
      If the value is true, the BuildEventProtocol will have an entry for convenienceSymlinksIdentified,
      listing all of the convenience symlinks created in your workspace. If false,
      then the convenienceSymlinksIdentified entry in the BuildEventProtocol will
      be empty.
    --experimental_remote_analysis_cache: The URL for the remote analysis caching
      backend.
    --noexperimental_skyfocus_dump_post_gc_stats: For debugging Skyfocus. If enabled,
      trigger manual GC before/after focusing to report heap sizes reductions. This
      will increase the Skyfocus latency.
    --flaky_test_attempts: 'Each test will be retried up to the specified number of
      times in case of any test failure. Tests that required more than one attempt
      to pass are marked as ''FLAKY'' in the test summary. Normally the value specified
      is just an integer or the string ''default''. If an integer, then all tests
      will be run up to N times. If ''default'', then only a single test attempt will
      be made for regular tests and three for tests marked explicitly as flaky by
      their rule (flaky=1 attribute). Alternate syntax: regex_filter@flaky_test_attempts.
      Where flaky_test_attempts is as above and regex_filter stands for a list of
      include and exclude regular expression patterns (Also see --runs_per_test).
      Example: --flaky_test_attempts=//foo/.*,-//foo/bar/.*@3 deflakes all tests in
      //foo/ except those under foo/bar three times. This option can be passed multiple
      times. The most recently passed argument that matches takes precedence. If nothing
      matches, behavior is as if ''default'' above.'
    --portable_paths: If true, includes paths to replace in ExecRequest to make the
      resulting paths portable.
    --experimental_local_retries_on_crash: Number of times to retry a local action
      when we detect that it crashed. This exists to workaround a bug in OSXFUSE which
      is tickled by the use of the dynamic scheduler and --experimental_local_lockfree_output
      due to constant process churn. The bug can be triggered by a cancelled process
      that ran *before* the process we are trying to run, introducing corruption in
      its file reads.
    --local_ram_resources: Explicitly set the total amount of local host RAM (in MB)
      available to Bazel to spend on build actions executed locally. Takes an integer,
      or "HOST_RAM", optionally followed by [-|*]<float> (eg. HOST_RAM*.5 to use half
      the available RAM). By default, ("HOST_RAM*.67"), Bazel will query system configuration
      to estimate the amount of RAM available and will use 67% of it.
    --experimental_use_validation_aspect: Whether to run validation actions using
      aspect (for parallelism with tests).
    -k, --keep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --noexperimental_run_bep_event_include_residue: Whether to include the command-line
      residue in run build events which could contain the residue. By default, the
      residue is not included in run command build events that could contain the residue.
    --analyze: Execute the loading/analysis phase; this is the usual behaviour. Specifying
      --noanalyzecauses the build to stop before starting the loading/analysis phase,
      just doing target pattern parsing and returning zero iff that completed successfully;
      this mode is useful for testing.
    --emit_script_path_in_exec_request: If true, emits the ExecRequest with --script_path
      file value and script contents instead of writing the script.
    --execution_log_json_file: 'Log the executed spawns into this file as newline-delimited
      JSON representations of SpawnExec protos, according to src/main/protobuf/spawn.proto.
      Prefer --execution_log_compact_file, which is significantly smaller and cheaper
      to produce. Related flags: --execution_log_compact_file (compact format; mutually
      exclusive), --execution_log_binary_file (binary protobuf format; mutually exclusive),
      --execution_log_sort (whether to sort the execution log), --subcommands (for
      displaying subcommands in terminal output).'
    --explain: Causes the build system to explain each executed step of the build.
      The explanation is written to the specified log file.
    --skip_incompatible_explicit_targets: 'Skip incompatible targets that are explicitly
      listed on the command line. By default, building such targets results in an
      error but they are silently skipped when this option is enabled. See: https://bazel.build/extending/platforms#skipping-incompatible-targets'
    --experimental_convenience_symlinks_bep_event: This flag controls whether or not
      we will post the build eventConvenienceSymlinksIdentified to the BuildEventProtocol.
      If the value is true, the BuildEventProtocol will have an entry for convenienceSymlinksIdentified,
      listing all of the convenience symlinks created in your workspace. If false,
      then the convenienceSymlinksIdentified entry in the BuildEventProtocol will
      be empty.
    --local_termination_grace_seconds: Time to wait between terminating a local process
      due to timeout and forcefully shutting it down.
    --noexpand_test_suites: 'Expand test_suite targets into their constituent tests
      before analysis. When this flag is turned on (the default), negative target
      patterns will apply to the tests belonging to the test suite, otherwise they
      will not. Turning off this flag is useful when top-level aspects are applied
      at command line: then they can analyze test_suite targets.'
    --directory_creation_cache: Describes the cache used to store known regular directories
      as they're created. Parent directories of output files are created on-demand
      during action execution.
    --output_filter: Only shows warnings and action outputs for rules with a name
      matching the provided regular expression.
    --nolegacy_important_outputs: Use this to suppress generation of the legacy important_outputs
      field in the TargetComplete event. important_outputs are required for Bazel
      to ResultStore/BTX integration.
    --noexperimental_extra_action_top_level_only: Deprecated in favor of aspects.
      Only schedules extra_actions for top level targets.
    --experimental_materialize_param_files_directly: If materializing param files,
      do so with direct writes to disk.
    --noverbose_explanations: Increases the verbosity of the explanations issued if
      --explain is enabled. Has no effect if --explain is not enabled.
    --experimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --use_action_cache: Whether to use the action cache
    --noexperimental_skyframe_target_pattern_evaluator: Use the Skyframe-based target
      pattern evaluator; implies --experimental_interleave_loading_and_analysis.
    --experimental_build_event_upload_strategy: Selects how to upload artifacts referenced
      in the build event protocol.
    --local_extra_resources: Set the number of extra resources available to Bazel.
      Takes in a string-float pair. Can be used multiple times to specify multiple
      types of extra resources. Bazel will limit concurrently running actions based
      on the available extra resources and the extra resources required. Tests can
      declare the amount of extra resources they need by using a tag of the "resources:<resoucename>:<amount>"
      format. Available CPU, RAM and resources cannot be set with this flag.
    --loading_phase_threads: Number of parallel threads to use for the loading/analysis
      phase.Takes an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally
      followed by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" sets
      a reasonable default based on host resources. Must be at least 1.
    --experimental_remote_cache_eviction_retries: The maximum number of attempts to
      retry if the build encountered a transient remote cache error that would otherwise
      fail the build. Applies for example when artifacts are evicted from the remote
      cache, or in certain cache failure conditions. A non-zero value will implicitly
      set --incompatible_remote_use_new_exit_code_for_lost_inputs to true. A new invocation
      id will be generated for each attempt. If you generate invocation id and provide
      it to Bazel with --invocation_id, you should not use this flag. Instead, set
      flag --incompatible_remote_use_new_exit_code_for_lost_inputs and check for the
      exit code 39.
    --experimental_remote_analysis_cache_mode: The transport direction for the remote
      analysis cache.
    --expand_test_suites: 'Expand test_suite targets into their constituent tests
      before analysis. When this flag is turned on (the default), negative target
      patterns will apply to the tests belonging to the test suite, otherwise they
      will not. Turning off this flag is useful when top-level aspects are applied
      at command line: then they can analyze test_suite targets.'
    --experimental_skyframe_cpu_heavy_skykeys_thread_pool_size: 'If set to a positive
      value (e.g. "HOST_CPUS*1.5"), Skyframe will run the loading/analysis phase with
      2 separate thread pools: 1 with <value> threads (ideally close to HOST_CPUS)
      reserved for CPU-heavy SkyKeys, and 1 "standard" thread pool (whose size is
      controlled by --loading_phase_threads) for the rest.'
    --max_test_output_bytes: Specifies maximum per-test-log size that can be emitted
      when --test_output is 'errors' or 'all'. Useful for avoiding overwhelming the
      output with excessively noisy test output. The test header is included in the
      log size. Negative values imply no limit. Output is all or nothing.
    --experimental_merged_skyframe_analysis_execution: If this flag is set, the analysis
      and execution phases of Skyframe are merged.
    --target_pattern_file: If set, build will read patterns from the file named here,
      rather than on the command line. It is an error to specify a file here as well
      as command-line patterns.
    --noexperimental_process_wrapper_graceful_sigterm: When true, make the process-wrapper
      propagate SIGTERMs (used by the dynamic scheduler to stop process trees) to
      the subprocesses themselves, giving them the grace period in --local_termination_grace_seconds
      before forcibly sending a SIGKILL.
    --experimental_skyfocus_handling_strategy: Strategies for Skyfocus to handle changes
      outside of the working set.
    --incompatible_remote_use_new_exit_code_for_lost_inputs: If set to true, Bazel
      will use new exit code 39 instead of 34 if remote cacheerrors, including cache
      evictions, cause the build to fail.
    --experimental_skyframe_target_pattern_evaluator: Use the Skyframe-based target
      pattern evaluator; implies --experimental_interleave_loading_and_analysis.
    --noincompatible_skip_genfiles_symlink: If set to true, the genfiles symlink will
      not be created. For more information, see https://github.com/bazelbuild/bazel/issues/8651
    --experimental_enable_skyfocus: If true, enable the use of --experimental_working_set
      to reduce Bazel's memory footprint for incremental builds. This feature is known
      as Skyfocus.
    --build_manual_tests: Forces test targets tagged 'manual' to be built. 'manual'
      tests are excluded from processing. This option forces them to be built (but
      not executed).
    --experimental_aquery_dump_after_build_format: 'Writes the state of Skyframe (which
      includes previous invocations on this blaze instance as well) after a build.
      Output is streamed remotely unless local output is requested with --experimental_aquery_dump_after_build_output_file.  Does
      not honor aquery flags for --include_*, but uses the same defaults, except for
      --include_commandline=false. Possible output formats: proto|streamed_proto|textproto|jsonproto.
      Using this will disable Skymeld.'
    --build_tag_filters: Specifies a comma-separated list of tags. Each tag can be
      optionally preceded with '-' to specify excluded tags. Only those targets will
      be built that contain at least one included tag and do not contain any excluded
      tags. This option does not affect the set of tests executed with the 'test'
      command; those are be governed by the test filtering options, for example '--test_tag_filters'
    --noexperimental_use_semaphore_for_jobs: If set to true, additionally use semaphore
      to limit number of concurrent jobs.
    --experimental_aquery_dump_after_build_output_file: Specify the output file for
      the aquery dump after a build. Use in conjunction with --experimental_aquery_dump_after_build_format.
      The path provided is relative to Bazel's output base, unless it's an absolute
      path. Using this will disable Skymeld.
    --local_test_jobs: The max number of local test jobs to run concurrently. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". 0 means local resources
      will limit the number of local test jobs to run concurrently instead. Setting
      this greater than the value for --jobs is ineffectual.
    --norewind_lost_inputs: Whether to use action rewinding to recover from lost inputs.
    --test_tmpdir: Specifies the base temporary directory for 'bazel test' to use.
    --experimental_build_event_fully_resolve_fileset_symlinks: If true, fully resolve
      relative Fileset symlinks in the BEP when presenting output files. Requires
      --experimental_build_event_expand_filesets.
    --noincompatible_remote_use_new_exit_code_for_lost_inputs: If set to true, Bazel
      will use new exit code 39 instead of 34 if remote cacheerrors, including cache
      evictions, cause the build to fail.
    --execution_log_compact_file: 'Log the executed spawns into this file as length-delimited
      ExecLogEntry protos, according to src/main/protobuf/spawn.proto. The entire
      file is zstd compressed. Related flags: --execution_log_binary_file (binary
      protobuf format; mutually exclusive), --execution_log_json_file (text JSON format;
      mutually exclusive), --subcommands (for displaying subcommands in terminal output).'
    --hide_aspect_results: Comma-separated list of aspect names to not display in
      results (see --show_result). Useful for keeping aspects added by wrappers which
      are typically not interesting to end users out of console output.
  description: Runs the specified target.
- name: shutdown
  flags: {--iff_heap_size_greater_than: 'Iff non-zero, then shutdown will only shut
      down the server if the total memory (in MB) consumed by the JVM exceeds this
      value.'}
  description: Stops the %{product} server.
- name: test
  flags:
    --noexecution_log_sort: Whether to sort the execution log, making it easier to
      compare logs across invocations. Set to false to avoid potentially significant
      CPU and memory usage at the end of the invocation, at the cost of producing
      the log in nondeterministic execution order. Only applies to the binary and
      JSON formats; the compact format is never sorted.
    --incompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --noexperimental_stats_summary: Enable a modernized summary of the build stats.
    --check_tests_up_to_date: Don't run tests, just check if they are up-to-date.  If
      all tests results are up-to-date, the testing completes successfully.  If any
      test needs to be built or executed, an error is reported and the testing fails.  This
      option implies --check_up_to_date behavior.
    --noexperimental_merged_skyframe_analysis_execution: If this flag is set, the
      analysis and execution phases of Skyframe are merged.
    --test_keep_going: When disabled, any non-passing test will cause the entire build
      to stop. By default all tests are run, even if some do not pass.
    --experimental_skyfocus_dump_keys: For debugging Skyfocus. Dump the focused SkyKeys
      (roots, leafs, focused deps, focused rdeps).
    --check_up_to_date: Don't perform the build, just check if it is up-to-date.  If
      all targets are up-to-date, the build completes successfully.  If any step needs
      to be executed an error is reported and the build fails.
    --nomaterialize_param_files: Writes intermediate parameter files to output tree
      even when using remote action execution. Useful when debugging actions. This
      is implied by --subcommands and --verbose_failures.
    --version_window_for_dirty_node_gc: Nodes that have been dirty for more than this
      many versions will be deleted from the graph upon the next update. Values must
      be non-negative long integers, or -1 indicating the maximum possible window.
    --test_summary: Specifies the desired format of the test summary. Valid values
      are 'short' to print information only about tests executed, 'terse', to print
      information only about unsuccessful tests that were run, 'detailed' to print
      detailed information about failed test cases, 'testcase' to print summary in
      test case resolution, do not print detailed information about failed test cases
      and 'none' to omit the summary.
    --local_resources: Set the number of resources available to Bazel. Takes in an
      assignment to a float or HOST_RAM/HOST_CPUS, optionally followed by [-|*]<float>
      (eg. memory=HOST_RAM*.5 to use half the available RAM). Can be used multiple
      times to specify multiple types of resources. Bazel will limit concurrently
      running actions based on the available resources and the resources required.
      Tests can declare the amount of resources they need by using a tag of the "resources:<resource
      name>:<amount>" format. Overrides resources specified by --local_{cpu|ram|extra}_resources.
    --rewind_lost_inputs: Whether to use action rewinding to recover from lost inputs.
    --noexperimental_local_lockfree_output: When true, the local spawn runner doesn't
      lock the output tree during dynamic execution. Instead, spawns are allowed to
      execute until they are explicitly interrupted by a faster remote action.
    --build: Execute the build; this is the usual behaviour. Specifying --nobuild
      causes the build to stop before executing the build actions, returning zero
      iff the package loading and analysis phases completed successfully; this mode
      is useful for testing those phases.
    --noincompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --enforce_project_configs: If true, interactive builds may only pass the --scl_config
      build flag; they may not use any other build flags. --scl_config must be set
      to an officially suported project configuration. Supported configurations are
      defined in the target's PROJECT.scl, which can be found by walking up the target's
      packagge path. See b/324126745.
    --aspects: Comma-separated list of aspects to be applied to top-level targets.
      In the list, if aspect some_aspect specifies required aspect providers via required_aspect_providers,
      some_aspect will run after every aspect that was mentioned before it in the
      aspects list whose advertised providers satisfy some_aspect required aspect
      providers. Moreover, some_aspect will run after all its required aspects specified
      by requires attribute. some_aspect will then have access to the values of those
      aspects' providers. <bzl-file-label>%<aspect_name>, for example '//tools:my_def.bzl%my_aspect',
      where 'my_aspect' is a top-level value from a file tools/my_def.bzl
    --nobuild_tests_only: If specified, only *_test and test_suite rules will be built
      and other targets specified on the command line will be ignored. By default
      everything that was requested will be built.
    --fetch: Allows the command to fetch external dependencies. If set to false, the
      command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --noexperimental_materialize_param_files_directly: If materializing param files,
      do so with direct writes to disk.
    --show_result: |-
      Show the results of the build.  For each target, state whether or not it was brought up-to-date, and if so, a list of output files that were built.  The printed files are convenient strings for copy+pasting to the shell, to execute them.
      This option requires an integer argument, which is the threshold number of targets above which result information is not printed. Thus zero causes suppression of the message and MAX_INT causes printing of the result to occur always. The default is one.
      If nothing was built for a target its results may be omitted to keep the output under the threshold.
    --noenforce_project_configs: If true, interactive builds may only pass the --scl_config
      build flag; they may not use any other build flags. --scl_config must be set
      to an officially suported project configuration. Supported configurations are
      defined in the target's PROJECT.scl, which can be found by walking up the target's
      packagge path. See b/324126745.
    --execution_log_sort: Whether to sort the execution log, making it easier to compare
      logs across invocations. Set to false to avoid potentially significant CPU and
      memory usage at the end of the invocation, at the cost of producing the log
      in nondeterministic execution order. Only applies to the binary and JSON formats;
      the compact format is never sorted.
    --output_tree_tracking: If set, tell the output service (if any) to track when
      files in the output tree have been modified externally (not by the build system).
      This should improve incremental build speed when an appropriate output service
      is enabled.
    --noexperimental_enable_skyfocus: If true, enable the use of --experimental_working_set
      to reduce Bazel's memory footprint for incremental builds. This feature is known
      as Skyfocus.
    --test_strategy: Specifies which strategy to use when running tests.
    --spawn_strategy: Specify how spawn actions are executed by default. Accepts a
      comma-separated list of strategies from highest to lowest priority. For each
      action Bazel picks the strategy with the highest priority that can execute the
      action. The default value is "remote,worker,sandboxed,local". See https://blog.bazel.build/2019/06/19/list-strategy.html
      for details.
    --nodiscard_analysis_cache: Discard the analysis cache immediately after the analysis
      phase completes. Reduces memory usage by ~10%, but makes further incremental
      builds slower.
    --experimental_skyfocus_dump_post_gc_stats: For debugging Skyfocus. If enabled,
      trigger manual GC before/after focusing to report heap sizes reductions. This
      will increase the Skyfocus latency.
    --noexperimental_build_event_expand_filesets: If true, expand Filesets in the
      BEP when presenting output files.
    --nokeep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --noexperimental_use_validation_aspect: Whether to run validation actions using
      aspect (for parallelism with tests).
    --nocheck_tests_up_to_date: Don't run tests, just check if they are up-to-date.  If
      all tests results are up-to-date, the testing completes successfully.  If any
      test needs to be built or executed, an error is reported and the testing fails.  This
      option implies --check_up_to_date behavior.
    --nobuild: Execute the build; this is the usual behaviour. Specifying --nobuild
      causes the build to stop before executing the build actions, returning zero
      iff the package loading and analysis phases completed successfully; this mode
      is useful for testing those phases.
    --experimental_extra_action_top_level_only: Deprecated in favor of aspects. Only
      schedules extra_actions for top level targets.
    --build_event_upload_max_retries: The maximum number of times Bazel should retry
      uploading a build event.
    --test_timeout_filters: Specifies a comma-separated list of test timeouts. Each
      timeout can be optionally preceded with '-' to specify excluded timeouts. Only
      those test targets will be found that contain at least one included timeout
      and do not contain any excluded timeouts. This option affects --build_tests_only
      behavior and the test command.
    --experimental_remote_analysis_cache_deadline: Deadline to use for remote analysis
      cache operations.
    -s, --subcommands: 'Display the subcommands executed during a build. Related flags:
      --execution_log_json_file, --execution_log_binary_file (for logging subcommands
      to a file in a tool-friendly format).'
    --deleted_packages: |-
      A comma-separated list of names of packages which the build system will consider non-existent, even if they are visible somewhere on the package path.
      Use this option when deleting a subpackage 'x/y' of an existing package 'x'.  For example, after deleting x/y/BUILD in your client, the build system may complain if it encounters a label '//x:y/z' if that is still provided by another package_path entry.  Specifying --deleted_packages x/y avoids this problem.
    --default_visibility: Default visibility for packages that don't set it explicitly
      ('public' or 'private').
    --nouse_action_cache: Whether to use the action cache
    --experimental_stream_log_file_uploads: Stream log file uploads directly to the
      remote storage rather than writing them to disk.
    --noexperimental_async_execution: If set to true, Bazel is allowed to run action
      in a virtual thread. The number of actions in flight is still capped with --jobs.
    --nooutput_tree_tracking: If set, tell the output service (if any) to track when
      files in the output tree have been modified externally (not by the build system).
      This should improve incremental build speed when an appropriate output service
      is enabled.
    --notest_keep_going: When disabled, any non-passing test will cause the entire
      build to stop. By default all tests are run, even if some do not pass.
    --noallow_analysis_cache_discard: If discarding the analysis cache due to a change
      in the build system, setting this option to false will cause bazel to exit,
      rather than continuing with the build. This option has no effect when 'discard_analysis_cache'
      is also set.
    --strategy_regexp: 'Override which spawn strategy should be used to execute spawn
      actions that have descriptions matching a certain regex_filter. See --per_file_copt
      for details onregex_filter matching. The last regex_filter that matches the
      description is used. This option overrides other flags for specifying strategy.
      Example: --strategy_regexp=//foo.*\\.cc,-//foo/bar=local means to run actions
      using local strategy if their descriptions match //foo.*.cc but not //foo/bar.
      Example: --strategy_regexp=''Compiling.*/bar=local  --strategy_regexp=Compiling=sandboxed
      will run ''Compiling //foo/bar/baz'' with the ''local'' strategy, but reversing
      the order would run it with ''sandboxed''. '
    --experimental_remote_analysis_cache_concurrency: Target concurrency for remote
      analysis caching RPCs.
    --nofetch: Allows the command to fetch external dependencies. If set to false,
      the command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --experimental_stats_summary: Enable a modernized summary of the build stats.
    --discard_analysis_cache: Discard the analysis cache immediately after the analysis
      phase completes. Reduces memory usage by ~10%, but makes further incremental
      builds slower.
    --package_path: A colon-separated list of where to look for packages. Elements
      beginning with '%workspace%' are relative to the enclosing workspace. If omitted
      or empty, the default is the output of 'bazel info default-package-path'.
    --compile_one_dependency: Compile a single dependency of the argument files. This
      is useful for syntax checking source files in IDEs, for example, by rebuilding
      a single target that depends on the source file to detect errors as early as
      possible in the edit/build/test cycle. This argument affects the way all non-flag
      arguments are interpreted; instead of being targets to build they are source
      filenames.  For each source filename an arbitrary target that depends on it
      will be built.
    --experimental_use_semaphore_for_jobs: If set to true, additionally use semaphore
      to limit number of concurrent jobs.
    --experimental_build_event_output_group_mode: 'Specify how an output group''s
      files will be represented in TargetComplete/AspectComplete BEP events. Values
      are an assignment of an output group name to one of ''NAMED_SET_OF_FILES_ONLY'',
      ''INLINE_ONLY'', or ''BOTH''. The default value is ''NAMED_SET_OF_FILES_ONLY''.
      If an output group is repeated, the final value to appear is used. The default
      value sets the mode for coverage artifacts to BOTH: --experimental_build_event_output_group_mode=baseline.lcov=both'
    --noexperimental_split_xml_generation: If this flag is set, and a test action
      does not generate a test.xml file, then Bazel uses a separate action to generate
      a dummy test.xml file containing the test log. Otherwise, Bazel generates a
      test.xml as part of the test action.
    --verbose_failures: If a command fails, print out the full command line.
    --legacy_globbing_threads: Number of threads to use for glob evaluation. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" means to use
      a reasonable value derived from the machine's hardware profile (e.g. the number
      of processors).
    --notest_verbose_timeout_warnings: If true, print additional warnings when the
      actual test execution time does not match the timeout defined by the test (whether
      implied or explicit).
    --norun_validations: Whether to run validation actions as part of the build. See
      https://bazel.build/extending/rules#validation_actions
    --noverbose_failures: If a command fails, print out the full command line.
    --experimental_build_event_expand_filesets: If true, expand Filesets in the BEP
      when presenting output files.
    --incompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --noskip_incompatible_explicit_targets: 'Skip incompatible targets that are explicitly
      listed on the command line. By default, building such targets results in an
      error but they are silently skipped when this option is enabled. See: https://bazel.build/extending/platforms#skipping-incompatible-targets'
    --noexperimental_bep_target_summary: Whether to publish TargetSummary events.
    --nocompile_one_dependency: Compile a single dependency of the argument files.
      This is useful for syntax checking source files in IDEs, for example, by rebuilding
      a single target that depends on the source file to detect errors as early as
      possible in the edit/build/test cycle. This argument affects the way all non-flag
      arguments are interpreted; instead of being targets to build they are source
      filenames.  For each source filename an arbitrary target that depends on it
      will be built.
    --noexperimental_enable_critical_path_profiling: If set (the default), critical
      path profiling is enabled for the execution phase. This has a slight overhead
      in RAM and CPU, and may prevent Bazel from making certain aggressive RAM optimizations
      in some cases.
    --noverbose_test_summary: If true, print additional information (timing, number
      of failed runs, etc) in the test summary.
    --experimental_oom_sensitive_skyfunctions_semaphore_size: 'Sets the size of the
      semaphore used to prevent SkyFunctions with large peak memory requirement from
      OOM-ing blaze. A value of 0 indicates that no semaphore should be used. Example
      value: "HOST_CPUS*0.5".'
    --experimental_convenience_symlinks: |-
      This flag controls how the convenience symlinks (the symlinks that appear in the workspace after the build) will be managed. Possible values:
        normal (default): Each kind of convenience symlink will be created or deleted, as determined by the build.
        clean: All symlinks will be unconditionally deleted.
        ignore: Symlinks will not be created or cleaned up.
        log_only: Generate log messages as if 'normal' were passed, but don't actually perform any filesystem operations (useful for tools).
      Note that only symlinks whose names are generated by the current value of --symlink_prefix can be affected; if the prefix changes, any pre-existing symlinks will be left alone.
    --experimental_build_event_upload_retry_minimum_delay: 'Initial, minimum delay
      for exponential backoff retries when BEP upload fails. (exponent: 1.6)'
    --noanalyze: Execute the loading/analysis phase; this is the usual behaviour.
      Specifying --noanalyzecauses the build to stop before starting the loading/analysis
      phase, just doing target pattern parsing and returning zero iff that completed
      successfully; this mode is useful for testing.
    --test_verbose_timeout_warnings: If true, print additional warnings when the actual
      test execution time does not match the timeout defined by the test (whether
      implied or explicit).
    --experimental_skyframe_memory_dump: 'Dump the memory use of individual nodes
      in the Skyframe graph after the build. This option takes a number of flags separated
      by commas: ''json'' (no-op, that''s the only format), ''notransient'' (don''t
      traverse transient fields), ''noconfig'' (ignore objects related to configurations),
      ''noprecomputed'' (ignore precomputed values) and ''noworkspacestatus'' (ignore
      objects related to the workspace status machinery)'
    --experimental_run_bep_event_include_residue: Whether to include the command-line
      residue in run build events which could contain the residue. By default, the
      residue is not included in run command build events that could contain the residue.
    --experimental_max_directories_to_eagerly_visit_in_globbing: If non-negative,
      the first time a glob is evaluated in a package, the subdirectories of the package
      will be traversed in order to warm filesystem caches and compensate for lack
      of parallelism in globbing. At most this many directories will be visited.
    --verbose_explanations: Increases the verbosity of the explanations issued if
      --explain is enabled. Has no effect if --explain is not enabled.
    --materialize_param_files: Writes intermediate parameter files to output tree
      even when using remote action execution. Useful when debugging actions. This
      is implied by --subcommands and --verbose_failures.
    -j, --jobs: The number of concurrent jobs to run. Takes an integer, or a keyword
      ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed by an operation ([-|*]<float>)
      eg. "auto", "HOST_CPUS*.5". Values must be between 1 and 5000. Values above
      2500 may cause memory issues. "auto" calculates a reasonable default based on
      host resources.
    --experimental_extra_action_filter: Deprecated in favor of aspects. Filters set
      of targets to schedule extra_actions for.
    --experimental_split_xml_generation: If this flag is set, and a test action does
      not generate a test.xml file, then Bazel uses a separate action to generate
      a dummy test.xml file containing the test log. Otherwise, Bazel generates a
      test.xml as part of the test action.
    --experimental_process_wrapper_graceful_sigterm: When true, make the process-wrapper
      propagate SIGTERMs (used by the dynamic scheduler to stop process trees) to
      the subprocesses themselves, giving them the grace period in --local_termination_grace_seconds
      before forcibly sending a SIGKILL.
    --test_tag_filters: Specifies a comma-separated list of test tags. Each tag can
      be optionally preceded with '-' to specify excluded tags. Only those test targets
      will be found that contain at least one included tag and do not contain any
      excluded tags. This option affects --build_tests_only behavior and the test
      command.
    --symlink_prefix: 'The prefix that is prepended to any of the convenience symlinks
      that are created after a build. If omitted, the default value is the name of
      the build tool followed by a hyphen. If ''/'' is passed, then no symlinks are
      created and no warning is emitted. Warning: the special functionality for ''/''
      will be deprecated soon; use --experimental_convenience_symlinks=ignore instead.'
    --output_groups: A list of comma-separated output group names, each of which optionally
      prefixed by a + or a -. A group prefixed by + is added to the default set of
      output groups, while a group prefixed by - is removed from the default set.
      If at least one group is not prefixed, the default set of output groups is omitted.
      For example, --output_groups=+foo,+bar builds the union of the default set,
      foo, and bar, while --output_groups=foo,bar overrides the default set such that
      only foo and bar are built.
    --max_config_changes_to_show: When discarding the analysis cache due to a change
      in the build options, displays up to the given number of changed option names.
      If the number given is -1, all changed options will be displayed.
    --experimental_enable_critical_path_profiling: If set (the default), critical
      path profiling is enabled for the execution phase. This has a slight overhead
      in RAM and CPU, and may prevent Bazel from making certain aggressive RAM optimizations
      in some cases.
    --experimental_cpu_load_scheduling_window_size: The size of window during experimental
      scheduling of action based on CPU load. Make sense to define only when flag
      --experimental_cpu_load_scheduling is enabled.
    --incompatible_skip_genfiles_symlink: If set to true, the genfiles symlink will
      not be created. For more information, see https://github.com/bazelbuild/bazel/issues/8651
    --experimental_local_lockfree_output: When true, the local spawn runner doesn't
      lock the output tree during dynamic execution. Instead, spawns are allowed to
      execute until they are explicitly interrupted by a faster remote action.
    --verbose_test_summary: If true, print additional information (timing, number
      of failed runs, etc) in the test summary.
    --print_relative_test_log_paths: If true, when printing the path to a test log,
      use relative path that makes use of the 'testlogs' convenience symlink. N.B.
      - A subsequent 'build'/'test'/etc invocation with a different configuration
      can cause the target of this symlink to change, making the path printed previously
      no longer useful.
    --noincompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --show_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --nobuild_manual_tests: Forces test targets tagged 'manual' to be built. 'manual'
      tests are excluded from processing. This option forces them to be built (but
      not executed).
    --test_lang_filters: Specifies a comma-separated list of test languages. Each
      language can be optionally preceded with '-' to specify excluded languages.
      Only those test targets will be found that are written in the specified languages.
      The name used for each language should be the same as the language prefix in
      the *_test rule, e.g. one of 'cc', 'java', 'py', etc. This option affects --build_tests_only
      behavior and the test command.
    --experimental_cpu_load_scheduling: Enables the experimental local execution scheduling
      based on CPU load, not estimation of actions one by one.  Experimental scheduling
      have showed the large benefit on a large local builds on a powerful machines
      with the large number of cores. Reccommended to use with --local_resources=cpu=HOST_CPUS
    --test_output: Specifies desired output mode. Valid values are 'summary' to output
      only test status summary, 'errors' to also print test logs for failed tests,
      'all' to print logs for all tests and 'streamed' to output logs for all tests
      in real time (this will force tests to be executed locally one at a time regardless
      of --test_strategy value).
    --run_validations: Whether to run validation actions as part of the build. See
      https://bazel.build/extending/rules#validation_actions
    --experimental_async_execution: If set to true, Bazel is allowed to run action
      in a virtual thread. The number of actions in flight is still capped with --jobs.
    --execution_log_binary_file: 'Log the executed spawns into this file as length-delimited
      SpawnExec protos, according to src/main/protobuf/spawn.proto. Prefer --execution_log_compact_file,
      which is significantly smaller and cheaper to produce. Related flags: --execution_log_compact_file
      (compact format; mutually exclusive), --execution_log_json_file (text JSON format;
      mutually exclusive), --execution_log_sort (whether to sort the execution log),
      --subcommands (for displaying subcommands in terminal output).'
    --nocheck_up_to_date: Don't perform the build, just check if it is up-to-date.  If
      all targets are up-to-date, the build completes successfully.  If any step needs
      to be executed an error is reported and the build fails.
    --legacy_important_outputs: Use this to suppress generation of the legacy important_outputs
      field in the TargetComplete event. important_outputs are required for Bazel
      to ResultStore/BTX integration.
    --cache_computed_file_digests: If greater than 0, configures Bazel to cache file
      digests in memory based on their metadata instead of recomputing the digests
      from disk every time they are needed. Setting this to 0 ensures correctness
      because not all file changes can be noted from file metadata. When not 0, the
      number indicates the size of the cache as the number of file digests to be cached.
    --experimental_working_set: The working set for Skyfocus. Specify as comma-separated
      workspace root-relative paths. This is a stateful flag. Defining a working set
      persists it for subsequent invocations, until it is redefined with a new set.
    --strategy: Specify how to distribute compilation of other spawn actions. Accepts
      a comma-separated list of strategies from highest to lowest priority. For each
      action Bazel picks the strategy with the highest priority that can execute the
      action. The default value is "remote,worker,sandboxed,local". This flag overrides
      the values set by --spawn_strategy (and --genrule_strategy if used with mnemonic
      Genrule). See https://blog.bazel.build/2019/06/19/list-strategy.html for details.
    --experimental_bep_target_summary: Whether to publish TargetSummary events.
    --build_tests_only: If specified, only *_test and test_suite rules will be built
      and other targets specified on the command line will be ignored. By default
      everything that was requested will be built.
    --allow_analysis_cache_discard: If discarding the analysis cache due to a change
      in the build system, setting this option to false will cause bazel to exit,
      rather than continuing with the build. This option has no effect when 'discard_analysis_cache'
      is also set.
    --local_cpu_resources: Explicitly set the total number of local CPU cores available
      to Bazel to spend on build actions executed locally. Takes an integer, or "HOST_CPUS",
      optionally followed by [-|*]<float> (eg. HOST_CPUS*.5 to use half the available
      CPU cores). By default, ("HOST_CPUS"), Bazel will query system configuration
      to estimate the number of CPU cores available.
    --noshow_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --noexperimental_cpu_load_scheduling: Enables the experimental local execution
      scheduling based on CPU load, not estimation of actions one by one.  Experimental
      scheduling have showed the large benefit on a large local builds on a powerful
      machines with the large number of cores. Reccommended to use with --local_resources=cpu=HOST_CPUS
    --noexperimental_stream_log_file_uploads: Stream log file uploads directly to
      the remote storage rather than writing them to disk.
    --noexperimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --noprint_relative_test_log_paths: If true, when printing the path to a test log,
      use relative path that makes use of the 'testlogs' convenience symlink. N.B.
      - A subsequent 'build'/'test'/etc invocation with a different configuration
      can cause the target of this symlink to change, making the path printed previously
      no longer useful.
    --allowed_local_actions_regex: A regex whitelist for action types which may be
      run locally. If unset, all actions are allowed to execute locally
    --experimental_fsvc_threads: The number of threads that are used by the FileSystemValueChecker.
    --serialized_frontier_profile: Dump a profile of serialized frontier bytes. Specifies
      the output path.
    --noexperimental_build_event_fully_resolve_fileset_symlinks: If true, fully resolve
      relative Fileset symlinks in the BEP when presenting output files. Requires
      --experimental_build_event_expand_filesets.
    --genrule_strategy: Specify how to execute genrules. This flag will be phased
      out. Instead, use --spawn_strategy=<value> to control all actions or --strategy=Genrule=<value>
      to control genrules only.
    --experimental_skymeld_analysis_overlap_percentage: The value represents the %
      of the analysis phase which will be overlapped with the execution phase. A value
      of x means Skyframe will queue up execution tasks and wait until there's x%
      of the top level target left to be analyzed before allowing them to launch.
      When the value is 0%, we'd wait for all analysis to finish before executing
      (no overlap). When it's 100%, the phases are free to overlap as much as they
      can.
    --aspects_parameters: Specifies the values of the command-line aspects parameters.
      Each parameter value is specified via <param_name>=<param_value>, for example
      'my_param=my_val' where 'my_param' is a parameter of some aspect in --aspects
      list or required by an aspect in the list. This option can be used multiple
      times. However, it is not allowed to assign values to the same parameter more
      than once.
    --progress_report_interval: The number of seconds to wait between reports on still
      running jobs. The default value 0 means the first report will be printed after
      10 seconds, then 30 seconds and after that progress is reported once every minute.
      When --curses is enabled, progress is reported every second.
    --test_size_filters: Specifies a comma-separated list of test sizes. Each size
      can be optionally preceded with '-' to specify excluded sizes. Only those test
      targets will be found that contain at least one included size and do not contain
      any excluded sizes. This option affects --build_tests_only behavior and the
      test command.
    --noexperimental_convenience_symlinks_bep_event: This flag controls whether or
      not we will post the build eventConvenienceSymlinksIdentified to the BuildEventProtocol.
      If the value is true, the BuildEventProtocol will have an entry for convenienceSymlinksIdentified,
      listing all of the convenience symlinks created in your workspace. If false,
      then the convenienceSymlinksIdentified entry in the BuildEventProtocol will
      be empty.
    --experimental_remote_analysis_cache: The URL for the remote analysis caching
      backend.
    --noexperimental_skyfocus_dump_post_gc_stats: For debugging Skyfocus. If enabled,
      trigger manual GC before/after focusing to report heap sizes reductions. This
      will increase the Skyfocus latency.
    --flaky_test_attempts: 'Each test will be retried up to the specified number of
      times in case of any test failure. Tests that required more than one attempt
      to pass are marked as ''FLAKY'' in the test summary. Normally the value specified
      is just an integer or the string ''default''. If an integer, then all tests
      will be run up to N times. If ''default'', then only a single test attempt will
      be made for regular tests and three for tests marked explicitly as flaky by
      their rule (flaky=1 attribute). Alternate syntax: regex_filter@flaky_test_attempts.
      Where flaky_test_attempts is as above and regex_filter stands for a list of
      include and exclude regular expression patterns (Also see --runs_per_test).
      Example: --flaky_test_attempts=//foo/.*,-//foo/bar/.*@3 deflakes all tests in
      //foo/ except those under foo/bar three times. This option can be passed multiple
      times. The most recently passed argument that matches takes precedence. If nothing
      matches, behavior is as if ''default'' above.'
    --experimental_local_retries_on_crash: Number of times to retry a local action
      when we detect that it crashed. This exists to workaround a bug in OSXFUSE which
      is tickled by the use of the dynamic scheduler and --experimental_local_lockfree_output
      due to constant process churn. The bug can be triggered by a cancelled process
      that ran *before* the process we are trying to run, introducing corruption in
      its file reads.
    --local_ram_resources: Explicitly set the total amount of local host RAM (in MB)
      available to Bazel to spend on build actions executed locally. Takes an integer,
      or "HOST_RAM", optionally followed by [-|*]<float> (eg. HOST_RAM*.5 to use half
      the available RAM). By default, ("HOST_RAM*.67"), Bazel will query system configuration
      to estimate the amount of RAM available and will use 67% of it.
    --experimental_use_validation_aspect: Whether to run validation actions using
      aspect (for parallelism with tests).
    -k, --keep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --noexperimental_run_bep_event_include_residue: Whether to include the command-line
      residue in run build events which could contain the residue. By default, the
      residue is not included in run command build events that could contain the residue.
    --analyze: Execute the loading/analysis phase; this is the usual behaviour. Specifying
      --noanalyzecauses the build to stop before starting the loading/analysis phase,
      just doing target pattern parsing and returning zero iff that completed successfully;
      this mode is useful for testing.
    --execution_log_json_file: 'Log the executed spawns into this file as newline-delimited
      JSON representations of SpawnExec protos, according to src/main/protobuf/spawn.proto.
      Prefer --execution_log_compact_file, which is significantly smaller and cheaper
      to produce. Related flags: --execution_log_compact_file (compact format; mutually
      exclusive), --execution_log_binary_file (binary protobuf format; mutually exclusive),
      --execution_log_sort (whether to sort the execution log), --subcommands (for
      displaying subcommands in terminal output).'
    --explain: Causes the build system to explain each executed step of the build.
      The explanation is written to the specified log file.
    --skip_incompatible_explicit_targets: 'Skip incompatible targets that are explicitly
      listed on the command line. By default, building such targets results in an
      error but they are silently skipped when this option is enabled. See: https://bazel.build/extending/platforms#skipping-incompatible-targets'
    --experimental_convenience_symlinks_bep_event: This flag controls whether or not
      we will post the build eventConvenienceSymlinksIdentified to the BuildEventProtocol.
      If the value is true, the BuildEventProtocol will have an entry for convenienceSymlinksIdentified,
      listing all of the convenience symlinks created in your workspace. If false,
      then the convenienceSymlinksIdentified entry in the BuildEventProtocol will
      be empty.
    --local_termination_grace_seconds: Time to wait between terminating a local process
      due to timeout and forcefully shutting it down.
    --noexpand_test_suites: 'Expand test_suite targets into their constituent tests
      before analysis. When this flag is turned on (the default), negative target
      patterns will apply to the tests belonging to the test suite, otherwise they
      will not. Turning off this flag is useful when top-level aspects are applied
      at command line: then they can analyze test_suite targets.'
    --directory_creation_cache: Describes the cache used to store known regular directories
      as they're created. Parent directories of output files are created on-demand
      during action execution.
    --output_filter: Only shows warnings and action outputs for rules with a name
      matching the provided regular expression.
    --nolegacy_important_outputs: Use this to suppress generation of the legacy important_outputs
      field in the TargetComplete event. important_outputs are required for Bazel
      to ResultStore/BTX integration.
    --noexperimental_extra_action_top_level_only: Deprecated in favor of aspects.
      Only schedules extra_actions for top level targets.
    --experimental_materialize_param_files_directly: If materializing param files,
      do so with direct writes to disk.
    --noverbose_explanations: Increases the verbosity of the explanations issued if
      --explain is enabled. Has no effect if --explain is not enabled.
    --experimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --use_action_cache: Whether to use the action cache
    --noexperimental_skyframe_target_pattern_evaluator: Use the Skyframe-based target
      pattern evaluator; implies --experimental_interleave_loading_and_analysis.
    --experimental_build_event_upload_strategy: Selects how to upload artifacts referenced
      in the build event protocol.
    --local_extra_resources: Set the number of extra resources available to Bazel.
      Takes in a string-float pair. Can be used multiple times to specify multiple
      types of extra resources. Bazel will limit concurrently running actions based
      on the available extra resources and the extra resources required. Tests can
      declare the amount of extra resources they need by using a tag of the "resources:<resoucename>:<amount>"
      format. Available CPU, RAM and resources cannot be set with this flag.
    --loading_phase_threads: Number of parallel threads to use for the loading/analysis
      phase.Takes an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally
      followed by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" sets
      a reasonable default based on host resources. Must be at least 1.
    --experimental_remote_cache_eviction_retries: The maximum number of attempts to
      retry if the build encountered a transient remote cache error that would otherwise
      fail the build. Applies for example when artifacts are evicted from the remote
      cache, or in certain cache failure conditions. A non-zero value will implicitly
      set --incompatible_remote_use_new_exit_code_for_lost_inputs to true. A new invocation
      id will be generated for each attempt. If you generate invocation id and provide
      it to Bazel with --invocation_id, you should not use this flag. Instead, set
      flag --incompatible_remote_use_new_exit_code_for_lost_inputs and check for the
      exit code 39.
    --experimental_remote_analysis_cache_mode: The transport direction for the remote
      analysis cache.
    --expand_test_suites: 'Expand test_suite targets into their constituent tests
      before analysis. When this flag is turned on (the default), negative target
      patterns will apply to the tests belonging to the test suite, otherwise they
      will not. Turning off this flag is useful when top-level aspects are applied
      at command line: then they can analyze test_suite targets.'
    --experimental_skyframe_cpu_heavy_skykeys_thread_pool_size: 'If set to a positive
      value (e.g. "HOST_CPUS*1.5"), Skyframe will run the loading/analysis phase with
      2 separate thread pools: 1 with <value> threads (ideally close to HOST_CPUS)
      reserved for CPU-heavy SkyKeys, and 1 "standard" thread pool (whose size is
      controlled by --loading_phase_threads) for the rest.'
    --max_test_output_bytes: Specifies maximum per-test-log size that can be emitted
      when --test_output is 'errors' or 'all'. Useful for avoiding overwhelming the
      output with excessively noisy test output. The test header is included in the
      log size. Negative values imply no limit. Output is all or nothing.
    --experimental_merged_skyframe_analysis_execution: If this flag is set, the analysis
      and execution phases of Skyframe are merged.
    --target_pattern_file: If set, build will read patterns from the file named here,
      rather than on the command line. It is an error to specify a file here as well
      as command-line patterns.
    --noexperimental_process_wrapper_graceful_sigterm: When true, make the process-wrapper
      propagate SIGTERMs (used by the dynamic scheduler to stop process trees) to
      the subprocesses themselves, giving them the grace period in --local_termination_grace_seconds
      before forcibly sending a SIGKILL.
    --experimental_skyfocus_handling_strategy: Strategies for Skyfocus to handle changes
      outside of the working set.
    --incompatible_remote_use_new_exit_code_for_lost_inputs: If set to true, Bazel
      will use new exit code 39 instead of 34 if remote cacheerrors, including cache
      evictions, cause the build to fail.
    --experimental_skyframe_target_pattern_evaluator: Use the Skyframe-based target
      pattern evaluator; implies --experimental_interleave_loading_and_analysis.
    --noincompatible_skip_genfiles_symlink: If set to true, the genfiles symlink will
      not be created. For more information, see https://github.com/bazelbuild/bazel/issues/8651
    --experimental_enable_skyfocus: If true, enable the use of --experimental_working_set
      to reduce Bazel's memory footprint for incremental builds. This feature is known
      as Skyfocus.
    --build_manual_tests: Forces test targets tagged 'manual' to be built. 'manual'
      tests are excluded from processing. This option forces them to be built (but
      not executed).
    --experimental_aquery_dump_after_build_format: 'Writes the state of Skyframe (which
      includes previous invocations on this blaze instance as well) after a build.
      Output is streamed remotely unless local output is requested with --experimental_aquery_dump_after_build_output_file.  Does
      not honor aquery flags for --include_*, but uses the same defaults, except for
      --include_commandline=false. Possible output formats: proto|streamed_proto|textproto|jsonproto.
      Using this will disable Skymeld.'
    --build_tag_filters: Specifies a comma-separated list of tags. Each tag can be
      optionally preceded with '-' to specify excluded tags. Only those targets will
      be built that contain at least one included tag and do not contain any excluded
      tags. This option does not affect the set of tests executed with the 'test'
      command; those are be governed by the test filtering options, for example '--test_tag_filters'
    --noexperimental_use_semaphore_for_jobs: If set to true, additionally use semaphore
      to limit number of concurrent jobs.
    --experimental_aquery_dump_after_build_output_file: Specify the output file for
      the aquery dump after a build. Use in conjunction with --experimental_aquery_dump_after_build_format.
      The path provided is relative to Bazel's output base, unless it's an absolute
      path. Using this will disable Skymeld.
    --local_test_jobs: The max number of local test jobs to run concurrently. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". 0 means local resources
      will limit the number of local test jobs to run concurrently instead. Setting
      this greater than the value for --jobs is ineffectual.
    --norewind_lost_inputs: Whether to use action rewinding to recover from lost inputs.
    --test_tmpdir: Specifies the base temporary directory for 'bazel test' to use.
    --experimental_build_event_fully_resolve_fileset_symlinks: If true, fully resolve
      relative Fileset symlinks in the BEP when presenting output files. Requires
      --experimental_build_event_expand_filesets.
    --noincompatible_remote_use_new_exit_code_for_lost_inputs: If set to true, Bazel
      will use new exit code 39 instead of 34 if remote cacheerrors, including cache
      evictions, cause the build to fail.
    --execution_log_compact_file: 'Log the executed spawns into this file as length-delimited
      ExecLogEntry protos, according to src/main/protobuf/spawn.proto. The entire
      file is zstd compressed. Related flags: --execution_log_binary_file (binary
      protobuf format; mutually exclusive), --execution_log_json_file (text JSON format;
      mutually exclusive), --subcommands (for displaying subcommands in terminal output).'
    --hide_aspect_results: Comma-separated list of aspect names to not display in
      results (see --show_result). Useful for keeping aspects added by wrappers which
      are typically not interesting to end users out of console output.
  description: Builds and runs the specified test targets.
- name: sync
  flags:
    --nokeep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --incompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --legacy_globbing_threads: Number of threads to use for glob evaluation. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" means to use
      a reasonable value derived from the machine's hardware profile (e.g. the number
      of processors).
    --show_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --noincompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --noconfigure: Only sync repositories marked as 'configure' for system-configuration
      purpose.
    --incompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --deleted_packages: |-
      A comma-separated list of names of packages which the build system will consider non-existent, even if they are visible somewhere on the package path.
      Use this option when deleting a subpackage 'x/y' of an existing package 'x'.  For example, after deleting x/y/BUILD in your client, the build system may complain if it encounters a label '//x:y/z' if that is still provided by another package_path entry.  Specifying --deleted_packages x/y avoids this problem.
    --default_visibility: Default visibility for packages that don't set it explicitly
      ('public' or 'private').
    --configure: Only sync repositories marked as 'configure' for system-configuration
      purpose.
    --experimental_max_directories_to_eagerly_visit_in_globbing: If non-negative,
      the first time a glob is evaluated in a package, the subdirectories of the package
      will be traversed in order to warm filesystem caches and compensate for lack
      of parallelism in globbing. At most this many directories will be visited.
    --noincompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --experimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --only: If this option is given, only sync the repositories specified with this
      option. Still consider all (or all configure-like, of --configure is given)
      outdated.
    --fetch: Allows the command to fetch external dependencies. If set to false, the
      command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    -k, --keep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --nofetch: Allows the command to fetch external dependencies. If set to false,
      the command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --loading_phase_threads: Number of parallel threads to use for the loading/analysis
      phase.Takes an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally
      followed by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" sets
      a reasonable default based on host resources. Must be at least 1.
    --noshow_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --package_path: A colon-separated list of where to look for packages. Elements
      beginning with '%workspace%' are relative to the enclosing workspace. If omitted
      or empty, the default is the output of 'bazel info default-package-path'.
    --noexperimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
  description: Syncs all repositories specified in the workspace file
- name: vendor
  flags:
    --noexecution_log_sort: Whether to sort the execution log, making it easier to
      compare logs across invocations. Set to false to avoid potentially significant
      CPU and memory usage at the end of the invocation, at the cost of producing
      the log in nondeterministic execution order. Only applies to the binary and
      JSON formats; the compact format is never sorted.
    --incompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --noexperimental_stats_summary: Enable a modernized summary of the build stats.
    --check_tests_up_to_date: Don't run tests, just check if they are up-to-date.  If
      all tests results are up-to-date, the testing completes successfully.  If any
      test needs to be built or executed, an error is reported and the testing fails.  This
      option implies --check_up_to_date behavior.
    --noexperimental_merged_skyframe_analysis_execution: If this flag is set, the
      analysis and execution phases of Skyframe are merged.
    --test_keep_going: When disabled, any non-passing test will cause the entire build
      to stop. By default all tests are run, even if some do not pass.
    --check_up_to_date: Don't perform the build, just check if it is up-to-date.  If
      all targets are up-to-date, the build completes successfully.  If any step needs
      to be executed an error is reported and the build fails.
    --experimental_skyfocus_dump_keys: For debugging Skyfocus. Dump the focused SkyKeys
      (roots, leafs, focused deps, focused rdeps).
    --nomaterialize_param_files: Writes intermediate parameter files to output tree
      even when using remote action execution. Useful when debugging actions. This
      is implied by --subcommands and --verbose_failures.
    --test_summary: Specifies the desired format of the test summary. Valid values
      are 'short' to print information only about tests executed, 'terse', to print
      information only about unsuccessful tests that were run, 'detailed' to print
      detailed information about failed test cases, 'testcase' to print summary in
      test case resolution, do not print detailed information about failed test cases
      and 'none' to omit the summary.
    --version_window_for_dirty_node_gc: Nodes that have been dirty for more than this
      many versions will be deleted from the graph upon the next update. Values must
      be non-negative long integers, or -1 indicating the maximum possible window.
    --rewind_lost_inputs: Whether to use action rewinding to recover from lost inputs.
    --local_resources: Set the number of resources available to Bazel. Takes in an
      assignment to a float or HOST_RAM/HOST_CPUS, optionally followed by [-|*]<float>
      (eg. memory=HOST_RAM*.5 to use half the available RAM). Can be used multiple
      times to specify multiple types of resources. Bazel will limit concurrently
      running actions based on the available resources and the resources required.
      Tests can declare the amount of resources they need by using a tag of the "resources:<resource
      name>:<amount>" format. Overrides resources specified by --local_{cpu|ram|extra}_resources.
    --build: Execute the build; this is the usual behaviour. Specifying --nobuild
      causes the build to stop before executing the build actions, returning zero
      iff the package loading and analysis phases completed successfully; this mode
      is useful for testing those phases.
    --noexperimental_local_lockfree_output: When true, the local spawn runner doesn't
      lock the output tree during dynamic execution. Instead, spawns are allowed to
      execute until they are explicitly interrupted by a faster remote action.
    --noincompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --enforce_project_configs: If true, interactive builds may only pass the --scl_config
      build flag; they may not use any other build flags. --scl_config must be set
      to an officially suported project configuration. Supported configurations are
      defined in the target's PROJECT.scl, which can be found by walking up the target's
      packagge path. See b/324126745.
    --aspects: Comma-separated list of aspects to be applied to top-level targets.
      In the list, if aspect some_aspect specifies required aspect providers via required_aspect_providers,
      some_aspect will run after every aspect that was mentioned before it in the
      aspects list whose advertised providers satisfy some_aspect required aspect
      providers. Moreover, some_aspect will run after all its required aspects specified
      by requires attribute. some_aspect will then have access to the values of those
      aspects' providers. <bzl-file-label>%<aspect_name>, for example '//tools:my_def.bzl%my_aspect',
      where 'my_aspect' is a top-level value from a file tools/my_def.bzl
    --show_result: |-
      Show the results of the build.  For each target, state whether or not it was brought up-to-date, and if so, a list of output files that were built.  The printed files are convenient strings for copy+pasting to the shell, to execute them.
      This option requires an integer argument, which is the threshold number of targets above which result information is not printed. Thus zero causes suppression of the message and MAX_INT causes printing of the result to occur always. The default is one.
      If nothing was built for a target its results may be omitted to keep the output under the threshold.
    --noexperimental_materialize_param_files_directly: If materializing param files,
      do so with direct writes to disk.
    --fetch: Allows the command to fetch external dependencies. If set to false, the
      command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --nobuild_tests_only: If specified, only *_test and test_suite rules will be built
      and other targets specified on the command line will be ignored. By default
      everything that was requested will be built.
    --noenforce_project_configs: If true, interactive builds may only pass the --scl_config
      build flag; they may not use any other build flags. --scl_config must be set
      to an officially suported project configuration. Supported configurations are
      defined in the target's PROJECT.scl, which can be found by walking up the target's
      packagge path. See b/324126745.
    --output_tree_tracking: If set, tell the output service (if any) to track when
      files in the output tree have been modified externally (not by the build system).
      This should improve incremental build speed when an appropriate output service
      is enabled.
    --execution_log_sort: Whether to sort the execution log, making it easier to compare
      logs across invocations. Set to false to avoid potentially significant CPU and
      memory usage at the end of the invocation, at the cost of producing the log
      in nondeterministic execution order. Only applies to the binary and JSON formats;
      the compact format is never sorted.
    --noexperimental_enable_skyfocus: If true, enable the use of --experimental_working_set
      to reduce Bazel's memory footprint for incremental builds. This feature is known
      as Skyfocus.
    --spawn_strategy: Specify how spawn actions are executed by default. Accepts a
      comma-separated list of strategies from highest to lowest priority. For each
      action Bazel picks the strategy with the highest priority that can execute the
      action. The default value is "remote,worker,sandboxed,local". See https://blog.bazel.build/2019/06/19/list-strategy.html
      for details.
    --test_strategy: Specifies which strategy to use when running tests.
    --nodiscard_analysis_cache: Discard the analysis cache immediately after the analysis
      phase completes. Reduces memory usage by ~10%, but makes further incremental
      builds slower.
    --experimental_skyfocus_dump_post_gc_stats: For debugging Skyfocus. If enabled,
      trigger manual GC before/after focusing to report heap sizes reductions. This
      will increase the Skyfocus latency.
    --noexperimental_build_event_expand_filesets: If true, expand Filesets in the
      BEP when presenting output files.
    --noexperimental_use_validation_aspect: Whether to run validation actions using
      aspect (for parallelism with tests).
    --nokeep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --nobuild: Execute the build; this is the usual behaviour. Specifying --nobuild
      causes the build to stop before executing the build actions, returning zero
      iff the package loading and analysis phases completed successfully; this mode
      is useful for testing those phases.
    --nocheck_tests_up_to_date: Don't run tests, just check if they are up-to-date.  If
      all tests results are up-to-date, the testing completes successfully.  If any
      test needs to be built or executed, an error is reported and the testing fails.  This
      option implies --check_up_to_date behavior.
    --experimental_extra_action_top_level_only: Deprecated in favor of aspects. Only
      schedules extra_actions for top level targets.
    --build_event_upload_max_retries: The maximum number of times Bazel should retry
      uploading a build event.
    --test_timeout_filters: Specifies a comma-separated list of test timeouts. Each
      timeout can be optionally preceded with '-' to specify excluded timeouts. Only
      those test targets will be found that contain at least one included timeout
      and do not contain any excluded timeouts. This option affects --build_tests_only
      behavior and the test command.
    --experimental_remote_analysis_cache_deadline: Deadline to use for remote analysis
      cache operations.
    -s, --subcommands: 'Display the subcommands executed during a build. Related flags:
      --execution_log_json_file, --execution_log_binary_file (for logging subcommands
      to a file in a tool-friendly format).'
    --deleted_packages: |-
      A comma-separated list of names of packages which the build system will consider non-existent, even if they are visible somewhere on the package path.
      Use this option when deleting a subpackage 'x/y' of an existing package 'x'.  For example, after deleting x/y/BUILD in your client, the build system may complain if it encounters a label '//x:y/z' if that is still provided by another package_path entry.  Specifying --deleted_packages x/y avoids this problem.
    --nouse_action_cache: Whether to use the action cache
    --default_visibility: Default visibility for packages that don't set it explicitly
      ('public' or 'private').
    --noexperimental_async_execution: If set to true, Bazel is allowed to run action
      in a virtual thread. The number of actions in flight is still capped with --jobs.
    --experimental_stream_log_file_uploads: Stream log file uploads directly to the
      remote storage rather than writing them to disk.
    --nooutput_tree_tracking: If set, tell the output service (if any) to track when
      files in the output tree have been modified externally (not by the build system).
      This should improve incremental build speed when an appropriate output service
      is enabled.
    --notest_keep_going: When disabled, any non-passing test will cause the entire
      build to stop. By default all tests are run, even if some do not pass.
    --noallow_analysis_cache_discard: If discarding the analysis cache due to a change
      in the build system, setting this option to false will cause bazel to exit,
      rather than continuing with the build. This option has no effect when 'discard_analysis_cache'
      is also set.
    --strategy_regexp: 'Override which spawn strategy should be used to execute spawn
      actions that have descriptions matching a certain regex_filter. See --per_file_copt
      for details onregex_filter matching. The last regex_filter that matches the
      description is used. This option overrides other flags for specifying strategy.
      Example: --strategy_regexp=//foo.*\\.cc,-//foo/bar=local means to run actions
      using local strategy if their descriptions match //foo.*.cc but not //foo/bar.
      Example: --strategy_regexp=''Compiling.*/bar=local  --strategy_regexp=Compiling=sandboxed
      will run ''Compiling //foo/bar/baz'' with the ''local'' strategy, but reversing
      the order would run it with ''sandboxed''. '
    --experimental_remote_analysis_cache_concurrency: Target concurrency for remote
      analysis caching RPCs.
    --nofetch: Allows the command to fetch external dependencies. If set to false,
      the command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --experimental_stats_summary: Enable a modernized summary of the build stats.
    --package_path: A colon-separated list of where to look for packages. Elements
      beginning with '%workspace%' are relative to the enclosing workspace. If omitted
      or empty, the default is the output of 'bazel info default-package-path'.
    --discard_analysis_cache: Discard the analysis cache immediately after the analysis
      phase completes. Reduces memory usage by ~10%, but makes further incremental
      builds slower.
    --compile_one_dependency: Compile a single dependency of the argument files. This
      is useful for syntax checking source files in IDEs, for example, by rebuilding
      a single target that depends on the source file to detect errors as early as
      possible in the edit/build/test cycle. This argument affects the way all non-flag
      arguments are interpreted; instead of being targets to build they are source
      filenames.  For each source filename an arbitrary target that depends on it
      will be built.
    --experimental_use_semaphore_for_jobs: If set to true, additionally use semaphore
      to limit number of concurrent jobs.
    --verbose_failures: If a command fails, print out the full command line.
    --noexperimental_split_xml_generation: If this flag is set, and a test action
      does not generate a test.xml file, then Bazel uses a separate action to generate
      a dummy test.xml file containing the test log. Otherwise, Bazel generates a
      test.xml as part of the test action.
    --experimental_build_event_output_group_mode: 'Specify how an output group''s
      files will be represented in TargetComplete/AspectComplete BEP events. Values
      are an assignment of an output group name to one of ''NAMED_SET_OF_FILES_ONLY'',
      ''INLINE_ONLY'', or ''BOTH''. The default value is ''NAMED_SET_OF_FILES_ONLY''.
      If an output group is repeated, the final value to appear is used. The default
      value sets the mode for coverage artifacts to BOTH: --experimental_build_event_output_group_mode=baseline.lcov=both'
    --legacy_globbing_threads: Number of threads to use for glob evaluation. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" means to use
      a reasonable value derived from the machine's hardware profile (e.g. the number
      of processors).
    --norun_validations: Whether to run validation actions as part of the build. See
      https://bazel.build/extending/rules#validation_actions
    --notest_verbose_timeout_warnings: If true, print additional warnings when the
      actual test execution time does not match the timeout defined by the test (whether
      implied or explicit).
    --noverbose_failures: If a command fails, print out the full command line.
    --experimental_build_event_expand_filesets: If true, expand Filesets in the BEP
      when presenting output files.
    --incompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --noskip_incompatible_explicit_targets: 'Skip incompatible targets that are explicitly
      listed on the command line. By default, building such targets results in an
      error but they are silently skipped when this option is enabled. See: https://bazel.build/extending/platforms#skipping-incompatible-targets'
    --noexperimental_bep_target_summary: Whether to publish TargetSummary events.
    --nocompile_one_dependency: Compile a single dependency of the argument files.
      This is useful for syntax checking source files in IDEs, for example, by rebuilding
      a single target that depends on the source file to detect errors as early as
      possible in the edit/build/test cycle. This argument affects the way all non-flag
      arguments are interpreted; instead of being targets to build they are source
      filenames.  For each source filename an arbitrary target that depends on it
      will be built.
    --noexperimental_enable_critical_path_profiling: If set (the default), critical
      path profiling is enabled for the execution phase. This has a slight overhead
      in RAM and CPU, and may prevent Bazel from making certain aggressive RAM optimizations
      in some cases.
    --noverbose_test_summary: If true, print additional information (timing, number
      of failed runs, etc) in the test summary.
    --experimental_convenience_symlinks: |-
      This flag controls how the convenience symlinks (the symlinks that appear in the workspace after the build) will be managed. Possible values:
        normal (default): Each kind of convenience symlink will be created or deleted, as determined by the build.
        clean: All symlinks will be unconditionally deleted.
        ignore: Symlinks will not be created or cleaned up.
        log_only: Generate log messages as if 'normal' were passed, but don't actually perform any filesystem operations (useful for tools).
      Note that only symlinks whose names are generated by the current value of --symlink_prefix can be affected; if the prefix changes, any pre-existing symlinks will be left alone.
    --experimental_oom_sensitive_skyfunctions_semaphore_size: 'Sets the size of the
      semaphore used to prevent SkyFunctions with large peak memory requirement from
      OOM-ing blaze. A value of 0 indicates that no semaphore should be used. Example
      value: "HOST_CPUS*0.5".'
    --experimental_build_event_upload_retry_minimum_delay: 'Initial, minimum delay
      for exponential backoff retries when BEP upload fails. (exponent: 1.6)'
    --noanalyze: Execute the loading/analysis phase; this is the usual behaviour.
      Specifying --noanalyzecauses the build to stop before starting the loading/analysis
      phase, just doing target pattern parsing and returning zero iff that completed
      successfully; this mode is useful for testing.
    --repo: Only vendors the specified repository, which can be either `@apparent_repo_name`
      or `@@canonical_repo_name`. This option can be set multiple times
    --experimental_skyframe_memory_dump: 'Dump the memory use of individual nodes
      in the Skyframe graph after the build. This option takes a number of flags separated
      by commas: ''json'' (no-op, that''s the only format), ''notransient'' (don''t
      traverse transient fields), ''noconfig'' (ignore objects related to configurations),
      ''noprecomputed'' (ignore precomputed values) and ''noworkspacestatus'' (ignore
      objects related to the workspace status machinery)'
    --test_verbose_timeout_warnings: If true, print additional warnings when the actual
      test execution time does not match the timeout defined by the test (whether
      implied or explicit).
    --experimental_run_bep_event_include_residue: Whether to include the command-line
      residue in run build events which could contain the residue. By default, the
      residue is not included in run command build events that could contain the residue.
    --verbose_explanations: Increases the verbosity of the explanations issued if
      --explain is enabled. Has no effect if --explain is not enabled.
    --experimental_max_directories_to_eagerly_visit_in_globbing: If non-negative,
      the first time a glob is evaluated in a package, the subdirectories of the package
      will be traversed in order to warm filesystem caches and compensate for lack
      of parallelism in globbing. At most this many directories will be visited.
    --materialize_param_files: Writes intermediate parameter files to output tree
      even when using remote action execution. Useful when debugging actions. This
      is implied by --subcommands and --verbose_failures.
    -j, --jobs: The number of concurrent jobs to run. Takes an integer, or a keyword
      ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed by an operation ([-|*]<float>)
      eg. "auto", "HOST_CPUS*.5". Values must be between 1 and 5000. Values above
      2500 may cause memory issues. "auto" calculates a reasonable default based on
      host resources.
    --experimental_extra_action_filter: Deprecated in favor of aspects. Filters set
      of targets to schedule extra_actions for.
    --experimental_split_xml_generation: If this flag is set, and a test action does
      not generate a test.xml file, then Bazel uses a separate action to generate
      a dummy test.xml file containing the test log. Otherwise, Bazel generates a
      test.xml as part of the test action.
    --experimental_process_wrapper_graceful_sigterm: When true, make the process-wrapper
      propagate SIGTERMs (used by the dynamic scheduler to stop process trees) to
      the subprocesses themselves, giving them the grace period in --local_termination_grace_seconds
      before forcibly sending a SIGKILL.
    --symlink_prefix: 'The prefix that is prepended to any of the convenience symlinks
      that are created after a build. If omitted, the default value is the name of
      the build tool followed by a hyphen. If ''/'' is passed, then no symlinks are
      created and no warning is emitted. Warning: the special functionality for ''/''
      will be deprecated soon; use --experimental_convenience_symlinks=ignore instead.'
    --test_tag_filters: Specifies a comma-separated list of test tags. Each tag can
      be optionally preceded with '-' to specify excluded tags. Only those test targets
      will be found that contain at least one included tag and do not contain any
      excluded tags. This option affects --build_tests_only behavior and the test
      command.
    --output_groups: A list of comma-separated output group names, each of which optionally
      prefixed by a + or a -. A group prefixed by + is added to the default set of
      output groups, while a group prefixed by - is removed from the default set.
      If at least one group is not prefixed, the default set of output groups is omitted.
      For example, --output_groups=+foo,+bar builds the union of the default set,
      foo, and bar, while --output_groups=foo,bar overrides the default set such that
      only foo and bar are built.
    --max_config_changes_to_show: When discarding the analysis cache due to a change
      in the build options, displays up to the given number of changed option names.
      If the number given is -1, all changed options will be displayed.
    --experimental_cpu_load_scheduling_window_size: The size of window during experimental
      scheduling of action based on CPU load. Make sense to define only when flag
      --experimental_cpu_load_scheduling is enabled.
    --experimental_enable_critical_path_profiling: If set (the default), critical
      path profiling is enabled for the execution phase. This has a slight overhead
      in RAM and CPU, and may prevent Bazel from making certain aggressive RAM optimizations
      in some cases.
    --incompatible_skip_genfiles_symlink: If set to true, the genfiles symlink will
      not be created. For more information, see https://github.com/bazelbuild/bazel/issues/8651
    --experimental_local_lockfree_output: When true, the local spawn runner doesn't
      lock the output tree during dynamic execution. Instead, spawns are allowed to
      execute until they are explicitly interrupted by a faster remote action.
    --verbose_test_summary: If true, print additional information (timing, number
      of failed runs, etc) in the test summary.
    --show_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --noincompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --print_relative_test_log_paths: If true, when printing the path to a test log,
      use relative path that makes use of the 'testlogs' convenience symlink. N.B.
      - A subsequent 'build'/'test'/etc invocation with a different configuration
      can cause the target of this symlink to change, making the path printed previously
      no longer useful.
    --nobuild_manual_tests: Forces test targets tagged 'manual' to be built. 'manual'
      tests are excluded from processing. This option forces them to be built (but
      not executed).
    --test_output: Specifies desired output mode. Valid values are 'summary' to output
      only test status summary, 'errors' to also print test logs for failed tests,
      'all' to print logs for all tests and 'streamed' to output logs for all tests
      in real time (this will force tests to be executed locally one at a time regardless
      of --test_strategy value).
    --experimental_cpu_load_scheduling: Enables the experimental local execution scheduling
      based on CPU load, not estimation of actions one by one.  Experimental scheduling
      have showed the large benefit on a large local builds on a powerful machines
      with the large number of cores. Reccommended to use with --local_resources=cpu=HOST_CPUS
    --test_lang_filters: Specifies a comma-separated list of test languages. Each
      language can be optionally preceded with '-' to specify excluded languages.
      Only those test targets will be found that are written in the specified languages.
      The name used for each language should be the same as the language prefix in
      the *_test rule, e.g. one of 'cc', 'java', 'py', etc. This option affects --build_tests_only
      behavior and the test command.
    --experimental_async_execution: If set to true, Bazel is allowed to run action
      in a virtual thread. The number of actions in flight is still capped with --jobs.
    --run_validations: Whether to run validation actions as part of the build. See
      https://bazel.build/extending/rules#validation_actions
    --nocheck_up_to_date: Don't perform the build, just check if it is up-to-date.  If
      all targets are up-to-date, the build completes successfully.  If any step needs
      to be executed an error is reported and the build fails.
    --execution_log_binary_file: 'Log the executed spawns into this file as length-delimited
      SpawnExec protos, according to src/main/protobuf/spawn.proto. Prefer --execution_log_compact_file,
      which is significantly smaller and cheaper to produce. Related flags: --execution_log_compact_file
      (compact format; mutually exclusive), --execution_log_json_file (text JSON format;
      mutually exclusive), --execution_log_sort (whether to sort the execution log),
      --subcommands (for displaying subcommands in terminal output).'
    --legacy_important_outputs: Use this to suppress generation of the legacy important_outputs
      field in the TargetComplete event. important_outputs are required for Bazel
      to ResultStore/BTX integration.
    --cache_computed_file_digests: If greater than 0, configures Bazel to cache file
      digests in memory based on their metadata instead of recomputing the digests
      from disk every time they are needed. Setting this to 0 ensures correctness
      because not all file changes can be noted from file metadata. When not 0, the
      number indicates the size of the cache as the number of file digests to be cached.
    --strategy: Specify how to distribute compilation of other spawn actions. Accepts
      a comma-separated list of strategies from highest to lowest priority. For each
      action Bazel picks the strategy with the highest priority that can execute the
      action. The default value is "remote,worker,sandboxed,local". This flag overrides
      the values set by --spawn_strategy (and --genrule_strategy if used with mnemonic
      Genrule). See https://blog.bazel.build/2019/06/19/list-strategy.html for details.
    --experimental_working_set: The working set for Skyfocus. Specify as comma-separated
      workspace root-relative paths. This is a stateful flag. Defining a working set
      persists it for subsequent invocations, until it is redefined with a new set.
    --experimental_bep_target_summary: Whether to publish TargetSummary events.
    --build_tests_only: If specified, only *_test and test_suite rules will be built
      and other targets specified on the command line will be ignored. By default
      everything that was requested will be built.
    --allow_analysis_cache_discard: If discarding the analysis cache due to a change
      in the build system, setting this option to false will cause bazel to exit,
      rather than continuing with the build. This option has no effect when 'discard_analysis_cache'
      is also set.
    --local_cpu_resources: Explicitly set the total number of local CPU cores available
      to Bazel to spend on build actions executed locally. Takes an integer, or "HOST_CPUS",
      optionally followed by [-|*]<float> (eg. HOST_CPUS*.5 to use half the available
      CPU cores). By default, ("HOST_CPUS"), Bazel will query system configuration
      to estimate the number of CPU cores available.
    --noshow_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --noexperimental_cpu_load_scheduling: Enables the experimental local execution
      scheduling based on CPU load, not estimation of actions one by one.  Experimental
      scheduling have showed the large benefit on a large local builds on a powerful
      machines with the large number of cores. Reccommended to use with --local_resources=cpu=HOST_CPUS
    --noexperimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --noexperimental_stream_log_file_uploads: Stream log file uploads directly to
      the remote storage rather than writing them to disk.
    --noprint_relative_test_log_paths: If true, when printing the path to a test log,
      use relative path that makes use of the 'testlogs' convenience symlink. N.B.
      - A subsequent 'build'/'test'/etc invocation with a different configuration
      can cause the target of this symlink to change, making the path printed previously
      no longer useful.
    --experimental_fsvc_threads: The number of threads that are used by the FileSystemValueChecker.
    --allowed_local_actions_regex: A regex whitelist for action types which may be
      run locally. If unset, all actions are allowed to execute locally
    --serialized_frontier_profile: Dump a profile of serialized frontier bytes. Specifies
      the output path.
    --genrule_strategy: Specify how to execute genrules. This flag will be phased
      out. Instead, use --spawn_strategy=<value> to control all actions or --strategy=Genrule=<value>
      to control genrules only.
    --noexperimental_build_event_fully_resolve_fileset_symlinks: If true, fully resolve
      relative Fileset symlinks in the BEP when presenting output files. Requires
      --experimental_build_event_expand_filesets.
    --aspects_parameters: Specifies the values of the command-line aspects parameters.
      Each parameter value is specified via <param_name>=<param_value>, for example
      'my_param=my_val' where 'my_param' is a parameter of some aspect in --aspects
      list or required by an aspect in the list. This option can be used multiple
      times. However, it is not allowed to assign values to the same parameter more
      than once.
    --experimental_skymeld_analysis_overlap_percentage: The value represents the %
      of the analysis phase which will be overlapped with the execution phase. A value
      of x means Skyframe will queue up execution tasks and wait until there's x%
      of the top level target left to be analyzed before allowing them to launch.
      When the value is 0%, we'd wait for all analysis to finish before executing
      (no overlap). When it's 100%, the phases are free to overlap as much as they
      can.
    --progress_report_interval: The number of seconds to wait between reports on still
      running jobs. The default value 0 means the first report will be printed after
      10 seconds, then 30 seconds and after that progress is reported once every minute.
      When --curses is enabled, progress is reported every second.
    --noexperimental_convenience_symlinks_bep_event: This flag controls whether or
      not we will post the build eventConvenienceSymlinksIdentified to the BuildEventProtocol.
      If the value is true, the BuildEventProtocol will have an entry for convenienceSymlinksIdentified,
      listing all of the convenience symlinks created in your workspace. If false,
      then the convenienceSymlinksIdentified entry in the BuildEventProtocol will
      be empty.
    --test_size_filters: Specifies a comma-separated list of test sizes. Each size
      can be optionally preceded with '-' to specify excluded sizes. Only those test
      targets will be found that contain at least one included size and do not contain
      any excluded sizes. This option affects --build_tests_only behavior and the
      test command.
    --flaky_test_attempts: 'Each test will be retried up to the specified number of
      times in case of any test failure. Tests that required more than one attempt
      to pass are marked as ''FLAKY'' in the test summary. Normally the value specified
      is just an integer or the string ''default''. If an integer, then all tests
      will be run up to N times. If ''default'', then only a single test attempt will
      be made for regular tests and three for tests marked explicitly as flaky by
      their rule (flaky=1 attribute). Alternate syntax: regex_filter@flaky_test_attempts.
      Where flaky_test_attempts is as above and regex_filter stands for a list of
      include and exclude regular expression patterns (Also see --runs_per_test).
      Example: --flaky_test_attempts=//foo/.*,-//foo/bar/.*@3 deflakes all tests in
      //foo/ except those under foo/bar three times. This option can be passed multiple
      times. The most recently passed argument that matches takes precedence. If nothing
      matches, behavior is as if ''default'' above.'
    --noexperimental_skyfocus_dump_post_gc_stats: For debugging Skyfocus. If enabled,
      trigger manual GC before/after focusing to report heap sizes reductions. This
      will increase the Skyfocus latency.
    --experimental_remote_analysis_cache: The URL for the remote analysis caching
      backend.
    --local_ram_resources: Explicitly set the total amount of local host RAM (in MB)
      available to Bazel to spend on build actions executed locally. Takes an integer,
      or "HOST_RAM", optionally followed by [-|*]<float> (eg. HOST_RAM*.5 to use half
      the available RAM). By default, ("HOST_RAM*.67"), Bazel will query system configuration
      to estimate the amount of RAM available and will use 67% of it.
    --experimental_local_retries_on_crash: Number of times to retry a local action
      when we detect that it crashed. This exists to workaround a bug in OSXFUSE which
      is tickled by the use of the dynamic scheduler and --experimental_local_lockfree_output
      due to constant process churn. The bug can be triggered by a cancelled process
      that ran *before* the process we are trying to run, introducing corruption in
      its file reads.
    --experimental_use_validation_aspect: Whether to run validation actions using
      aspect (for parallelism with tests).
    -k, --keep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --noexperimental_run_bep_event_include_residue: Whether to include the command-line
      residue in run build events which could contain the residue. By default, the
      residue is not included in run command build events that could contain the residue.
    --analyze: Execute the loading/analysis phase; this is the usual behaviour. Specifying
      --noanalyzecauses the build to stop before starting the loading/analysis phase,
      just doing target pattern parsing and returning zero iff that completed successfully;
      this mode is useful for testing.
    --execution_log_json_file: 'Log the executed spawns into this file as newline-delimited
      JSON representations of SpawnExec protos, according to src/main/protobuf/spawn.proto.
      Prefer --execution_log_compact_file, which is significantly smaller and cheaper
      to produce. Related flags: --execution_log_compact_file (compact format; mutually
      exclusive), --execution_log_binary_file (binary protobuf format; mutually exclusive),
      --execution_log_sort (whether to sort the execution log), --subcommands (for
      displaying subcommands in terminal output).'
    --explain: Causes the build system to explain each executed step of the build.
      The explanation is written to the specified log file.
    --skip_incompatible_explicit_targets: 'Skip incompatible targets that are explicitly
      listed on the command line. By default, building such targets results in an
      error but they are silently skipped when this option is enabled. See: https://bazel.build/extending/platforms#skipping-incompatible-targets'
    --experimental_convenience_symlinks_bep_event: This flag controls whether or not
      we will post the build eventConvenienceSymlinksIdentified to the BuildEventProtocol.
      If the value is true, the BuildEventProtocol will have an entry for convenienceSymlinksIdentified,
      listing all of the convenience symlinks created in your workspace. If false,
      then the convenienceSymlinksIdentified entry in the BuildEventProtocol will
      be empty.
    --local_termination_grace_seconds: Time to wait between terminating a local process
      due to timeout and forcefully shutting it down.
    --noexpand_test_suites: 'Expand test_suite targets into their constituent tests
      before analysis. When this flag is turned on (the default), negative target
      patterns will apply to the tests belonging to the test suite, otherwise they
      will not. Turning off this flag is useful when top-level aspects are applied
      at command line: then they can analyze test_suite targets.'
    --output_filter: Only shows warnings and action outputs for rules with a name
      matching the provided regular expression.
    --directory_creation_cache: Describes the cache used to store known regular directories
      as they're created. Parent directories of output files are created on-demand
      during action execution.
    --noverbose_explanations: Increases the verbosity of the explanations issued if
      --explain is enabled. Has no effect if --explain is not enabled.
    --experimental_materialize_param_files_directly: If materializing param files,
      do so with direct writes to disk.
    --noexperimental_extra_action_top_level_only: Deprecated in favor of aspects.
      Only schedules extra_actions for top level targets.
    --nolegacy_important_outputs: Use this to suppress generation of the legacy important_outputs
      field in the TargetComplete event. important_outputs are required for Bazel
      to ResultStore/BTX integration.
    --experimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --use_action_cache: Whether to use the action cache
    --noexperimental_skyframe_target_pattern_evaluator: Use the Skyframe-based target
      pattern evaluator; implies --experimental_interleave_loading_and_analysis.
    --local_extra_resources: Set the number of extra resources available to Bazel.
      Takes in a string-float pair. Can be used multiple times to specify multiple
      types of extra resources. Bazel will limit concurrently running actions based
      on the available extra resources and the extra resources required. Tests can
      declare the amount of extra resources they need by using a tag of the "resources:<resoucename>:<amount>"
      format. Available CPU, RAM and resources cannot be set with this flag.
    --experimental_build_event_upload_strategy: Selects how to upload artifacts referenced
      in the build event protocol.
    --experimental_remote_cache_eviction_retries: The maximum number of attempts to
      retry if the build encountered a transient remote cache error that would otherwise
      fail the build. Applies for example when artifacts are evicted from the remote
      cache, or in certain cache failure conditions. A non-zero value will implicitly
      set --incompatible_remote_use_new_exit_code_for_lost_inputs to true. A new invocation
      id will be generated for each attempt. If you generate invocation id and provide
      it to Bazel with --invocation_id, you should not use this flag. Instead, set
      flag --incompatible_remote_use_new_exit_code_for_lost_inputs and check for the
      exit code 39.
    --loading_phase_threads: Number of parallel threads to use for the loading/analysis
      phase.Takes an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally
      followed by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" sets
      a reasonable default based on host resources. Must be at least 1.
    --experimental_remote_analysis_cache_mode: The transport direction for the remote
      analysis cache.
    --experimental_merged_skyframe_analysis_execution: If this flag is set, the analysis
      and execution phases of Skyframe are merged.
    --max_test_output_bytes: Specifies maximum per-test-log size that can be emitted
      when --test_output is 'errors' or 'all'. Useful for avoiding overwhelming the
      output with excessively noisy test output. The test header is included in the
      log size. Negative values imply no limit. Output is all or nothing.
    --experimental_skyframe_cpu_heavy_skykeys_thread_pool_size: 'If set to a positive
      value (e.g. "HOST_CPUS*1.5"), Skyframe will run the loading/analysis phase with
      2 separate thread pools: 1 with <value> threads (ideally close to HOST_CPUS)
      reserved for CPU-heavy SkyKeys, and 1 "standard" thread pool (whose size is
      controlled by --loading_phase_threads) for the rest.'
    --expand_test_suites: 'Expand test_suite targets into their constituent tests
      before analysis. When this flag is turned on (the default), negative target
      patterns will apply to the tests belonging to the test suite, otherwise they
      will not. Turning off this flag is useful when top-level aspects are applied
      at command line: then they can analyze test_suite targets.'
    --target_pattern_file: If set, build will read patterns from the file named here,
      rather than on the command line. It is an error to specify a file here as well
      as command-line patterns.
    --noexperimental_process_wrapper_graceful_sigterm: When true, make the process-wrapper
      propagate SIGTERMs (used by the dynamic scheduler to stop process trees) to
      the subprocesses themselves, giving them the grace period in --local_termination_grace_seconds
      before forcibly sending a SIGKILL.
    --experimental_skyfocus_handling_strategy: Strategies for Skyfocus to handle changes
      outside of the working set.
    --incompatible_remote_use_new_exit_code_for_lost_inputs: If set to true, Bazel
      will use new exit code 39 instead of 34 if remote cacheerrors, including cache
      evictions, cause the build to fail.
    --experimental_skyframe_target_pattern_evaluator: Use the Skyframe-based target
      pattern evaluator; implies --experimental_interleave_loading_and_analysis.
    --noincompatible_skip_genfiles_symlink: If set to true, the genfiles symlink will
      not be created. For more information, see https://github.com/bazelbuild/bazel/issues/8651
    --experimental_enable_skyfocus: If true, enable the use of --experimental_working_set
      to reduce Bazel's memory footprint for incremental builds. This feature is known
      as Skyfocus.
    --experimental_aquery_dump_after_build_format: 'Writes the state of Skyframe (which
      includes previous invocations on this blaze instance as well) after a build.
      Output is streamed remotely unless local output is requested with --experimental_aquery_dump_after_build_output_file.  Does
      not honor aquery flags for --include_*, but uses the same defaults, except for
      --include_commandline=false. Possible output formats: proto|streamed_proto|textproto|jsonproto.
      Using this will disable Skymeld.'
    --build_manual_tests: Forces test targets tagged 'manual' to be built. 'manual'
      tests are excluded from processing. This option forces them to be built (but
      not executed).
    --build_tag_filters: Specifies a comma-separated list of tags. Each tag can be
      optionally preceded with '-' to specify excluded tags. Only those targets will
      be built that contain at least one included tag and do not contain any excluded
      tags. This option does not affect the set of tests executed with the 'test'
      command; those are be governed by the test filtering options, for example '--test_tag_filters'
    --noexperimental_use_semaphore_for_jobs: If set to true, additionally use semaphore
      to limit number of concurrent jobs.
    --experimental_aquery_dump_after_build_output_file: Specify the output file for
      the aquery dump after a build. Use in conjunction with --experimental_aquery_dump_after_build_format.
      The path provided is relative to Bazel's output base, unless it's an absolute
      path. Using this will disable Skymeld.
    --local_test_jobs: The max number of local test jobs to run concurrently. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". 0 means local resources
      will limit the number of local test jobs to run concurrently instead. Setting
      this greater than the value for --jobs is ineffectual.
    --norewind_lost_inputs: Whether to use action rewinding to recover from lost inputs.
    --test_tmpdir: Specifies the base temporary directory for 'bazel test' to use.
    --hide_aspect_results: Comma-separated list of aspect names to not display in
      results (see --show_result). Useful for keeping aspects added by wrappers which
      are typically not interesting to end users out of console output.
    --execution_log_compact_file: 'Log the executed spawns into this file as length-delimited
      ExecLogEntry protos, according to src/main/protobuf/spawn.proto. The entire
      file is zstd compressed. Related flags: --execution_log_binary_file (binary
      protobuf format; mutually exclusive), --execution_log_json_file (text JSON format;
      mutually exclusive), --subcommands (for displaying subcommands in terminal output).'
    --noincompatible_remote_use_new_exit_code_for_lost_inputs: If set to true, Bazel
      will use new exit code 39 instead of 34 if remote cacheerrors, including cache
      evictions, cause the build to fail.
    --experimental_build_event_fully_resolve_fileset_symlinks: If true, fully resolve
      relative Fileset symlinks in the BEP when presenting output files. Requires
      --experimental_build_event_expand_filesets.
  description: Fetches external repositories into a folder specified by the flag --vendor_dir.
- name: version
  flags: {--gnu_format: 'If set, write the version to stdout using the conventions
      described in the GNU standards.', --nognu_format: 'If set, write the version
      to stdout using the conventions described in the GNU standards.'}
  description: Prints version information for %{product}.
- name: query
  flags:
    --incompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --legacy_globbing_threads: Number of threads to use for glob evaluation. Takes
      an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally followed
      by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" means to use
      a reasonable value derived from the machine's hardware profile (e.g. the number
      of processors).
    --show_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --noincompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --incompatible_config_setting_private_default_visibility: If incompatible_enforce_config_setting_visibility=false,
      this is a noop. Else, if this flag is false, any config_setting without an explicit
      visibility attribute is //visibility:public. If this flag is true, config_setting
      follows the same visibility logic as all other rules. See https://github.com/bazelbuild/bazel/issues/12933.
    --incompatible_lexicographical_output: If this option is set, sorts --order_output=auto
      output in lexicographical order.
    --noxml:line_numbers: If true, XML output contains line numbers. Disabling this
      option may make diffs easier to read.  This option is only applicable to --output=xml.
    --graph:conditional_edges_limit: The maximum number of condition labels to show.
      -1 means no truncation and 0 means no annotation. This option is only applicable
      to --output=graph.
    --xml:line_numbers: If true, XML output contains line numbers. Disabling this
      option may make diffs easier to read.  This option is only applicable to --output=xml.
    --null: Whether each format is terminated with \\0 instead of newline.
    --noincompatible_enforce_config_setting_visibility: If true, enforce config_setting
      visibility restrictions. If false, every config_setting is visible to every
      target. See https://github.com/bazelbuild/bazel/issues/12932.
    --experimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --noxml:default_values: If true, rule attributes whose value is not explicitly
      specified in the BUILD file are printed; otherwise they are omitted.
    --nostrict_test_suite: If true, the tests() expression gives an error if it encounters
      a test_suite containing non-test targets.
    --fetch: Allows the command to fetch external dependencies. If set to false, the
      command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --order_results: Output the results in dependency-ordered (default) or unordered
      fashion. The unordered output is faster but only supported when --output is
      not minrank, maxrank, or graph.
    --loading_phase_threads: Number of parallel threads to use for the loading/analysis
      phase.Takes an integer, or a keyword ("auto", "HOST_CPUS", "HOST_RAM"), optionally
      followed by an operation ([-|*]<float>) eg. "auto", "HOST_CPUS*.5". "auto" sets
      a reasonable default based on host resources. Must be at least 1.
    --noshow_loading_progress: If enabled, causes Bazel to print "Loading package:"
      messages.
    --noexperimental_check_output_files: Check for modifications made to the output
      files of a build. Consider setting this flag to false if you don't expect these
      files to change outside of bazel since it will speed up subsequent runs as they
      won't have to check a previous run's cache.
    --nokeep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --noorder_results: Output the results in dependency-ordered (default) or unordered
      fashion. The unordered output is faster but only supported when --output is
      not minrank, maxrank, or graph.
    --order_output: Output the results unordered (no), dependency-ordered (deps),
      or fully ordered (full). The default is 'auto', meaning that results are output
      either dependency-ordered or fully ordered, depending on the output formatter
      (dependency-ordered for proto, minrank, maxrank, and graph, fully ordered for
      all others). When output is fully ordered, nodes are printed in a fully deterministic
      (total) order. First, all nodes are sorted alphabetically. Then, each node in
      the list is used as the start of a post-order depth-first search in which outgoing
      edges to unvisited nodes are traversed in alphabetical order of the successor
      nodes. Finally, nodes are printed in the reverse of the order in which they
      were visited.
    --deleted_packages: |-
      A comma-separated list of names of packages which the build system will consider non-existent, even if they are visible somewhere on the package path.
      Use this option when deleting a subpackage 'x/y' of an existing package 'x'.  For example, after deleting x/y/BUILD in your client, the build system may complain if it encounters a label '//x:y/z' if that is still provided by another package_path entry.  Specifying --deleted_packages x/y avoids this problem.
    --default_visibility: Default visibility for packages that don't set it explicitly
      ('public' or 'private').
    --xml:default_values: If true, rule attributes whose value is not explicitly specified
      in the BUILD file are printed; otherwise they are omitted.
    --experimental_max_directories_to_eagerly_visit_in_globbing: If non-negative,
      the first time a glob is evaluated in a package, the subdirectories of the package
      will be traversed in order to warm filesystem caches and compensate for lack
      of parallelism in globbing. At most this many directories will be visited.
    --noincompatible_lexicographical_output: If this option is set, sorts --order_output=auto
      output in lexicographical order.
    --experimental_graphless_query: If true, uses a Query implementation that does
      not make a copy of the graph. The new implementation only supports --order_output=no,
      as well as only a subset of output formatters.
    -k, --keep_going: Continue as much as possible after an error.  While the target
      that failed and those that depend on it cannot be analyzed, other prerequisites
      of these targets can be.
    --nofetch: Allows the command to fetch external dependencies. If set to false,
      the command will utilize any cached version of the dependency, and if none exists,
      the command will result in failure.
    --package_path: A colon-separated list of where to look for packages. Elements
      beginning with '%workspace%' are relative to the enclosing workspace. If omitted
      or empty, the default is the output of 'bazel info default-package-path'.
    --strict_test_suite: If true, the tests() expression gives an error if it encounters
      a test_suite containing non-test targets.
    --output: 'The format in which the query results should be printed. Allowed values
      for query are: build, graph, streamed_jsonproto, label, label_kind, location,
      maxrank, minrank, package, proto, streamed_proto, xml.'
  description: Executes a dependency graph query.
